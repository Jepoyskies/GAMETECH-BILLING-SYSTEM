{% extends "billing/base.html" %}
{% load static %}

{% block title %}Add Mikrotik Device{% endblock %}

{% block extra_css %}
</style>
{% endblock %}

{% block content %}
<div class="container-fluid py-3 px-3 px-md-4">
    <div class="form-card">
        <div class="form-page-title">
            <div class="title-icon"><i class="fas fa-plus"></i></div>
            Add Mikrotik Device
        </div>

        {% if error %}
        <div class="error-alert"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
        {% endif %}

        <form method="post" autocomplete="off">
            {% csrf_token %}

            <div class="form-section-label"><i class="fas fa-server me-1"></i> Device Info</div>

            <div class="mb-3">
                <label class="plan-form-label">Device Name <span class="req">*</span></label>
                <div class="input-icon-wrapper">
                    <i class="fas fa-tag i-icon"></i>
                    <input type="text" name="device_name" class="plan-form-control" required placeholder="e.g. Core Router">
                </div>
            </div>

            <div class="mb-3">
                <label class="plan-form-label">IP Address <span class="req">*</span></label>
                <div class="input-icon-wrapper">
                    <i class="fas fa-network-wired i-icon"></i>
                    <input type="text" name="ip_address" class="plan-form-control" required placeholder="e.g. 192.168.1.1">
                </div>
            </div>

            <div class="form-section-label mt-4"><i class="fas fa-key me-1"></i> API Credentials</div>

            <div class="row g-3 mb-3">
                <div class="col-6">
                    <label class="plan-form-label">API Username <span class="req">*</span></label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-user i-icon"></i>
                        <input type="text" name="api_username" class="plan-form-control" required placeholder="API User">
                    </div>
                </div>
                <div class="col-6">
                    <label class="plan-form-label">API Password <span class="req">*</span></label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-lock i-icon"></i>
                        <input type="password" name="api_password" class="plan-form-control" required placeholder="API Password">
                    </div>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-6">
                    <label class="plan-form-label">API Port <span class="req">*</span></label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-plug i-icon"></i>
                        <input type="number" name="api_port" class="plan-form-control" required value="8728">
                    </div>
                </div>
                <div class="col-6">
                    <label class="plan-form-label">API Port (8700) <span class="req">*</span></label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-plug-circle-bolt i-icon"></i>
                        <input type="number" name="api_port_8700" class="plan-form-control" required value="8700">
                    </div>
                </div>
            </div>

            <div class="d-flex align-items-center justify-content-between gap-2">
                <a href="{% url 'device_list' %}" class="btn-cancel">Cancel</a>
                <button type="submit" class="btn-submit"><i class="fas fa-save me-2"></i>Add Device</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
