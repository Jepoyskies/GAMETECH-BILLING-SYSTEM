<script>
    // Core Data Config
    let nextNodeId = 1;
    let currentModalParent = null;
    let splitterModal = null;

    const splitterConfig = {
        plc: {
            '1:2': { ports: 2, loss: 3.3, desc: 'Low loss, 2 outputs' },
            '1:4': { ports: 4, loss: 6.8, desc: 'Medium density' },
            '1:8': { ports: 8, loss: 10.5, desc: 'Standard deployment' },
            '1:16': { ports: 16, loss: 13.7, desc: 'High density' },
            '1:32': { ports: 32, loss: 17.0, desc: 'Very high density' },
            '1:64': { ports: 64, loss: 20.5, desc: 'Maximum split' }
        },
        fbt: {
            '90/10': { through: 90, tap: 10, throughLoss: 0.8, tapLoss: 10.5, desc: '10% tap, 90% through' },
            '80/20': { through: 80, tap: 20, throughLoss: 1.3, tapLoss: 7.5, desc: '20% tap, 80% through' },
            '70/30': { through: 70, tap: 30, throughLoss: 2.0, tapLoss: 5.5, desc: '30% tap, 70% through' },
            '50/50': { through: 50, tap: 50, throughLoss: 3.5, tapLoss: 3.5, desc: '50/50 equal split' },
            '30/70': { through: 30, tap: 70, throughLoss: 5.5, tapLoss: 2.0, desc: '70% tap, 30% through' },
            '20/80': { through: 20, tap: 80, throughLoss: 7.5, tapLoss: 1.3, desc: '80% tap, 20% through' },
            '10/90': { through: 10, tap: 90, throughLoss: 10.5, tapLoss: 0.8, desc: '90% tap, 10% through' }
        }
    };

    function initializeModalOptions() {
        const plcContainer = document.getElementById('plc-options');
        if (plcContainer) {
            plcContainer.innerHTML = '';
            Object.keys(splitterConfig.plc).forEach(ratio => {
                const c = splitterConfig.plc[ratio];
                plcContainer.innerHTML += `
            <div class="splitter-option" onclick="addSplitter('plc', '${ratio}')">
              <div class="splitter-option-ratio">${ratio}</div>
              <small class="text-danger">-${c.loss} dB</small><br>
              <small class="text-muted">${c.desc}</small>
            </div>`;
            });
        }

        const fbtContainer = document.getElementById('fbt-options');
        if (fbtContainer) {
            fbtContainer.innerHTML = '';
            Object.keys(splitterConfig.fbt).forEach(ratio => {
                const c = splitterConfig.fbt[ratio];
                fbtContainer.innerHTML += `
            <div class="splitter-option" onclick="addSplitter('fbt', '${ratio}')">
              <div class="splitter-option-ratio">${ratio}</div>
              <small class="text-muted">T: -${c.throughLoss}dB | Tap: -${c.tapLoss}dB</small>
            </div>`;
            });
        }
    }

    function switchSplitterTab(type, el) {
        document.querySelectorAll('.type-tab').forEach(t => t.classList.remove('active'));
        if (el) {
            el.classList.add('active');
        } else {
            if (type === 'plc') {
                const target = document.querySelector('.type-tab:not(.fbt-tab)');
                if (target) target.classList.add('active');
            } else {
                const target = document.querySelector('.type-tab.fbt-tab');
                if (target) target.classList.add('active');
            }
        }
        const plcOpts = document.getElementById('plc-options');
        const fbtOpts = document.getElementById('fbt-options');
        if (plcOpts) plcOpts.style.display = type === 'plc' ? 'grid' : 'none';
        if (fbtOpts) fbtOpts.style.display = type === 'fbt' ? 'grid' : 'none';
    }

    function openSplitterModal(parentId) {
        currentModalParent = parentId;
        if (splitterModal) splitterModal.show();
    }

    function addSplitter(type, ratio) {
        if (!currentModalParent) return;
        const nodeId = `node-${nextNodeId++}`;
        const config = splitterConfig[type][ratio];
        const parentEl = document.getElementById(`${currentModalParent}-children`);

        if (parentEl) {
            if (type === 'plc') {
                parentEl.insertAdjacentHTML('beforeend', createPLCNode(nodeId, ratio, config, currentModalParent));
            } else {
                parentEl.insertAdjacentHTML('beforeend', createFBTNode(nodeId, ratio, config, currentModalParent));
            }
        }

        if (splitterModal) splitterModal.hide();
        recalculateAll();
    }

    function createPLCNode(nodeId, ratio, config, parentId) {
        let childrenHTML = '';
        for (let i = 1; i <= config.ports; i++) {
            childrenHTML += `
        <div class="tree-node" id="${nodeId}-port${i}" data-parent="${nodeId}">
          <div class="node-card">
            <div class="node-header">
              <div class="fw-bold">🔌 Port ${i}</div>
              <div class="node-power" id="${nodeId}-port${i}-power">0.0</div>
            </div>
            <button class="btn btn-outline-primary btn-sm mt-2" onclick="openSplitterModal('${nodeId}-port${i}')">➕ Add Node</button>
          </div>
          <div class="child-nodes" id="${nodeId}-port${i}-children"></div>
        </div>`;
        }
        return `
      <div class="tree-node" id="${nodeId}" data-type="plc" data-ratio="${ratio}" data-parent="${parentId}">
        <div class="node-card plc-node">
          <div class="node-header">
            <div class="fw-bold">🔀 PLC ${ratio}</div>
            <div class="node-power" id="${nodeId}-power">0.0</div>
          </div>
          <small class="text-muted d-block mb-2">Loss: ${config.loss} dB | Ports: ${config.ports}</small>
          <button class="btn btn-danger btn-sm" onclick="removeNode('${nodeId}')">🗑️ Remove</button>
        </div>
        <div class="child-nodes" id="${nodeId}-children">${childrenHTML}</div>
      </div>`;
    }

    function createFBTNode(nodeId, ratio, config, parentId) {
        return `
      <div class="tree-node" id="${nodeId}" data-type="fbt" data-ratio="${ratio}" data-parent="${parentId}">
        <div class="node-card fbt-node">
          <div class="node-header">
            <div class="fw-bold">↔️ FBT ${ratio}</div>
            <div class="node-power" id="${nodeId}-power">0.0</div>
          </div>
          <button class="btn btn-danger btn-sm mt-2" onclick="removeNode('${nodeId}')">🗑️ Remove</button>
        </div>
        <div class="child-nodes" id="${nodeId}-children">
          <div class="tree-node" id="${nodeId}-through">
            <div class="node-card">
              <div class="node-header">
                <div class="fw-bold">➡️ Through (${config.through}%)</div>
                <div class="node-power" id="${nodeId}-through-power">0.0</div>
              </div>
              <button class="btn btn-outline-primary btn-sm mt-2" onclick="openSplitterModal('${nodeId}-through')">➕ Add</button>
            </div>
            <div class="child-nodes" id="${nodeId}-through-children"></div>
          </div>
          <div class="tree-node" id="${nodeId}-tap">
            <div class="node-card">
              <div class="node-header">
                <div class="fw-bold">📡 Tap (${config.tap}%)</div>
                <div class="node-power" id="${nodeId}-tap-power">0.0</div>
              </div>
              <button class="btn btn-outline-primary btn-sm mt-2" onclick="openSplitterModal('${nodeId}-tap')">➕ Add</button>
            </div>
            <div class="child-nodes" id="${nodeId}-tap-children"></div>
          </div>
        </div>
      </div>`;
    }

    function removeNode(nodeId) {
        if (confirm('Remove this splitter and all connected nodes?')) {
            const el = document.getElementById(nodeId);
            if (el) el.remove();
            recalculateAll();
        }
    }

    function formatPower(power) { return `${power >= 0 ? '+' : ''}${power.toFixed(1)} dBm`; }

    function updatePowerClass(element, power) {
        element.className = 'node-power';
        if (power >= -8) element.classList.add('text-success');
        else if (power >= -15) element.classList.add('text-warning');
        else element.classList.add('text-danger');
    }

    function recalculateAll() {
        const ponPowerEl = document.getElementById('ponPower');
        const cableLossEl = document.getElementById('defaultCableLoss');
        const ponPower = ponPowerEl ? parseFloat(ponPowerEl.value) || 0 : 0;
        const cableLoss = cableLossEl ? parseFloat(cableLossEl.value) || 0 : 0;

        const ponPwrText = document.getElementById('pon-power');
        const ponPwrDetail = document.getElementById('pon-power-detail');
        if (ponPwrText) ponPwrText.textContent = formatPower(ponPower);
        if (ponPwrDetail) ponPwrDetail.textContent = formatPower(ponPower);

        const rootChildren = document.getElementById('pon-root-children');
        if (rootChildren) calculateNodePower(rootChildren, ponPower, cableLoss);
        updateStatistics(ponPower);
    }

    function calculateNodePower(container, inputPower, cableLoss) {
        for (let child of container.children) {
            const type = child.dataset.type, ratio = child.dataset.ratio, nodeId = child.id;

            if (!type) {
                const el = document.getElementById(`${nodeId}-power`);
                if (el) { el.textContent = formatPower(inputPower); updatePowerClass(el, inputPower); }
                const subChildren = document.getElementById(`${nodeId}-children`);
                if (subChildren) calculateNodePower(subChildren, inputPower, cableLoss);
            } else if (type === 'plc') {
                const out = inputPower - splitterConfig.plc[ratio].loss - cableLoss;
                const el = document.getElementById(`${nodeId}-power`);
                if (el) el.textContent = formatPower(out);
                const subChildren = document.getElementById(`${nodeId}-children`);
                if (subChildren) calculateNodePower(subChildren, out, cableLoss);
            } else if (type === 'fbt') {
                const conf = splitterConfig.fbt[ratio];
                const tPower = inputPower - conf.throughLoss - cableLoss;
                const tapPower = inputPower - conf.tapLoss - cableLoss;

                const thEl = document.getElementById(`${nodeId}-through-power`);
                const tapEl = document.getElementById(`${nodeId}-tap-power`);

                if (thEl) { thEl.textContent = formatPower(tPower); updatePowerClass(thEl, tPower); }
                if (tapEl) { tapEl.textContent = formatPower(tapPower); updatePowerClass(tapEl, tapPower); }

                const throughChildren = document.getElementById(`${nodeId}-through-children`);
                const tapChildren = document.getElementById(`${nodeId}-tap-children`);
                if (throughChildren) calculateNodePower(throughChildren, tPower, cableLoss);
                if (tapChildren) calculateNodePower(tapChildren, tapPower, cableLoss);
            }
        }
    }

    function updateStatistics(basePower) {
        let endpoints = 0, total = 0;
        document.querySelectorAll('[id$="-power"]').forEach(el => {
            const nodeId = el.id.replace('-power', '');
            const children = document.getElementById(`${nodeId}-children`);
            if (children && children.children.length === 0) {
                endpoints++;
                total += parseFloat(el.textContent.replace(/[^-\d.]/g, ''));
            }
        });
        const totalEpEl = document.getElementById('totalEndpoints');
        const avgPwrEl = document.getElementById('avgPower');
        if (totalEpEl) totalEpEl.textContent = endpoints || 1;
        if (avgPwrEl) avgPwrEl.textContent = formatPower(endpoints > 0 ? total / endpoints : basePower);
    }

    document.addEventListener('DOMContentLoaded', () => {
        const modalEl = document.getElementById('splitterModal');
        if (modalEl && typeof bootstrap !== 'undefined') {
            splitterModal = new bootstrap.Modal(modalEl);
        }
        initializeModalOptions();
        recalculateAll();
    });
</script>
