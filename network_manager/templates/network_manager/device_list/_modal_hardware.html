<div class="modal fade" id="hardwareModal" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="hardwareModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content gt-modal-card">
            <div class="modal-header">
                <div class="d-flex align-items-center gap-3">
                    <div class="gt-modal-icon">
                        <i class="fas fa-microchip"></i>
                    </div>
                    <div>
                        <h5 class="modal-title" id="hardwareModalLabel">Hardware Telemetry</h5>
                        <div class="small text-muted" id="hw-device-name">Router Status</div>
                    </div>
                </div>
                <button type="button" class="gt-icon-btn" data-bs-dismiss="modal" aria-label="Close"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body py-3">
                <div id="hw-loading" class="text-center py-4">
                    <i class="fas fa-spinner fa-spin fa-2x text-primary mb-2"></i>
                    <p class="text-muted mb-0">Connecting to router API socket...</p>
                </div>
                <div id="hw-content" style="display: none;">
                    <div class="row g-3 mb-3">
                        <div class="col-6">
                            <div class="p-3 rounded-3 text-center" style="background: var(--surface-subtle); border: 1px solid var(--border-subtle);">
                                <div class="text-muted text-uppercase mb-1" style="font-size: 0.72rem; letter-spacing: 0.05em;">CPU Load</div>
                                <h3 class="mb-0 fw-bold" style="color: var(--gt-primary, #6366f1);" id="hw-cpu">0%</h3>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="p-3 rounded-3 text-center" style="background: var(--surface-subtle); border: 1px solid var(--border-subtle);">
                                <div class="text-muted text-uppercase mb-1" style="font-size: 0.72rem; letter-spacing: 0.05em;">Memory Usage</div>
                                <h3 class="mb-0 fw-bold" style="color: #38bdf8;" id="hw-ram">0%</h3>
                                <div class="text-muted" style="font-size: 0.72rem;" id="hw-ram-details">0 / 0 MB</div>
                            </div>
                        </div>
                    </div>
                    <div class="p-3 rounded-3" style="background: var(--surface-subtle); border: 1px solid var(--border-subtle);">
                        <ul class="list-unstyled mb-0" style="font-size: 0.85rem;">
                            <li class="d-flex justify-content-between border-bottom pb-2 mb-2" style="border-color: var(--border-subtle) !important;">
                                <span class="text-muted">Uptime</span>
                                <span class="fw-bold" style="color: var(--text-primary);" id="hw-uptime">-</span>
                            </li>
                            <li class="d-flex justify-content-between border-bottom pb-2 mb-2" style="border-color: var(--border-subtle) !important;">
                                <span class="text-muted">Board Name</span>
                                <span class="fw-bold" style="color: var(--text-primary);" id="hw-board">-</span>
                            </li>
                            <li class="d-flex justify-content-between border-bottom pb-2 mb-2" style="border-color: var(--border-subtle) !important;">
                                <span class="text-muted">RouterOS Version</span>
                                <span class="fw-bold" style="color: var(--text-primary);" id="hw-version">-</span>
                            </li>
                            <li class="d-flex justify-content-between pb-2 mb-2" id="hw-temp-row" style="display: none !important;">
                                <span class="text-muted">Temperature</span>
                                <span class="fw-bold text-danger" id="hw-temp">-</span>
                            </li>
                            <li class="d-flex justify-content-between border-top pt-2" id="hw-voltage-row" style="display: none !important; border-color: var(--border-subtle) !important;">
                                <span class="text-muted">Voltage</span>
                                <span class="fw-bold text-warning" id="hw-voltage">-</span>
                            </li>
                        </ul>
                    </div>
                </div>
                <div id="hw-error" class="text-center py-3 text-danger" style="display: none;">
                    <i class="fas fa-exclamation-triangle fa-2x mb-2"></i>
                    <p class="mb-0" id="hw-error-msg">Failed to load hardware status.</p>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="gt-btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
