<!-- Add Modal -->
<div class="modal fade" id="addDeviceModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form action="{% url 'add_device' %}" method="POST" autocomplete="off">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-plus"></i> Add MikroTik Device</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Device Name</label>
                        <input type="text" name="device_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">IP Address</label>
                        <input type="text" name="ip_address" class="form-control" required placeholder="192.168.1.1">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">API Username</label>
                        <input type="text" name="api_username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">API Password</label>
                        <input type="password" name="api_password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">API Port</label>
                        <input type="number" name="api_port" class="form-control" value="8728" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Add Device</button>
                </div>
            </form>
        </div>
    </div>
</div>
