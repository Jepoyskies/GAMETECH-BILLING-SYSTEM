<!-- Edit Modal -->
<div class="modal fade" id="editDeviceModal{{ device.id }}" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form action="{% url 'edit_device' device.id %}" method="POST">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-edit"></i> Edit MikroTik Device</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Device Name</label>
                        <input type="text" name="device_name" class="form-control" value="{{ device.device_name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">IP Address</label>
                        <input type="text" name="ip_address" class="form-control" value="{{ device.ip_address }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">API Username</label>
                        <input type="text" name="api_username" class="form-control" value="{{ device.api_username }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">API Password (leave blank to keep current)</label>
                        <input type="password" name="api_password" class="form-control" placeholder="••••••••">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">API Port</label>
                        <input type="number" name="api_port" class="form-control" value="{{ device.api_port }}" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Delete Modal -->
<div class="modal fade" id="deleteDeviceModal{{ device.id }}" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content border-danger">
            <form action="{% url 'delete_device' device.id %}" method="POST">
                {% csrf_token %}
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title"><i class="fas fa-trash"></i> Confirm Delete</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete <strong>{{ device.device_name }}</strong>?</p>
                    <div class="alert alert-danger mb-0 py-2 px-3 small">
                        <i class="fas fa-exclamation-triangle"></i> This action cannot be undone.
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i> Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
