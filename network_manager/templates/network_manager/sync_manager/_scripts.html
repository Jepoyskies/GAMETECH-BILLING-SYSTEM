<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>

<script>
    function showGametechAlert(message) {
        var modal = new bootstrap.Modal(document.getElementById('gametechAlertModal'));
        $('#gametechAlertModalBody').text(message);
        modal.show();
    }

    $(document).ready(function() {
        var table = $('.datatable').DataTable({
            "pageLength": 10,
            "lengthChange": false,
            "info": true,
            "searching": true,
            "destroy": true,
            "autoWidth": false,
            "order": [] // Disable initial sorting
        });

        // ---- Review-queue reason filter -------------------------------
        // The Needs Review card can hold a thousand rows, and they are NOT
        // the same kind of problem. Most are collections work (past due,
        // still connected); a few are emergencies (paid, but cut off).
        //
        // THREE ATTEMPTS AT THIS, KEEP ONLY WHAT WORKS:
        //   1. columns().search() over the row's data-reasons attribute -- wrong,
        //      a column search reads CELL TEXT and the attribute is not in a cell.
        //      Result: "No matching records found" for every chip.
        //   2. $.fn.dataTable.ext.search reading rowData.reasons -- wrong, that
        //      key came back undefined.
        //   3. The keys are now real text in a hidden <td class="sm-reasonkey">,
        //      so an ordinary column search on THAT column finds them. This is
        //      the one mechanism DataTables is documented to honour.
        //
        // Not CSS .hide() on the <tr>: hiding rows behind DataTables' back
        // desynchronises row indexes from the checkbox values in a POST, so a
        // row the operator cannot see could still be submitted.
        // The reason-key column is hidden by CSS, and its controls duplicate
        // the chips above it, so this table's own length/search chrome is off.
        // The global .datatable init further down leaves them on for the other
        // tables, so turn them off explicitly here.
        var reviewDt = $('#reviewTable').DataTable({
            "pageLength": 10,
            "lengthChange": false,
            "searching": false,
            "info": false,
            "order": []
        });
        var reasonCol = reviewDt.columns('.sm-reasonkey').index();

        function applyReasonFilter(reason) {
            if (reason === 'all') {
                reviewDt.column(reasonCol).search('').draw();
                $('#smReviewShowing').text('');
                return;
            }
            // Whole-word match: the cell holds several space-separated keys, so
            // a bare substring search for "drift" would also match
            // "paid_expired_profile" style neighbours and show the wrong rows.
            var re = '(^|\\s)' + $.fn.dataTable.util.escapeRegex(reason) + '(\\s|$)';
            reviewDt.column(reasonCol).search(re, true, false).draw();
            var shown = reviewDt.rows({ search: 'applied' }).count();
            var total = reviewDt.rows().count();
            $('#smReviewShowing').text('Showing ' + shown + ' of ' + total);
        }

        $(document).on('click', '[data-reason-filter]', function() {
            var $btn = $(this);
            $('[data-reason-filter]').removeClass('chip-active');
            $btn.addClass('chip-active');
            applyReasonFilter($btn.data('reason-filter'));
        });

        // A "Show me these N" link on the plain-language cards has to do TWO
        // things: scroll to the queue AND pre-apply the matching filter.
        // Scrolling alone drops the supervisor into the full 1,000-row table,
        // which is the confusion the simple view exists to remove.
        $(document).on('click', '[data-smv-filter]', function(e) {
            var reason = $(this).data('smv-filter');
            var $chip = $('[data-reason-filter="' + reason + '"]');
            if ($chip.length) {
                e.preventDefault();
                $chip.trigger('click');
                var target = $('#queue-needs-review');
                if (target.length) {
                    $('html, body').animate({
                        scrollTop: target.offset().top - 20
                    }, 300);
                }
                // A brief outline so the eye lands on the filtered rows
                // rather than on the top of the card they scrolled to.
                $('#reviewTable tbody').css('outline', '2px solid #fbae1a');
                window.setTimeout(function() {
                    $('#reviewTable tbody').css('outline', '');
                }, 1400);
            }
        });

        

        // Initialize DataTables
        var syncedTable = $('#syncedTable').DataTable({
            "pageLength": 10,
            "searching": true,
            "destroy": true,
            "autoWidth": false,
            "order": []
        });

        // Barangay Filter for Synced Table
        $('#barangayFilter').on('change', function() {
            var val = $.fn.dataTable.util.escapeRegex($(this).val());
            syncedTable.column(3).search(val ? '^' + val + '$' : '', true, false).draw();
        });

        // Select All for Synced Table
        $('#selectAllSynced').change(function() {
            var isChecked = $(this).prop('checked');
            // Only check visible checkboxes in the DataTable
            $('.synced-check:visible').prop('checked', isChecked);
        });

        $('.synced-check').change(function(){
            if(false == $(this).prop("checked")){
                $("#selectAllSynced").prop('checked', false); 
            }
            if ($('.synced-check:visible:checked').length == $('.synced-check:visible').length ){
                $("#selectAllSynced").prop('checked', true);
            }
        });

        // Bulk Transfer Form Validation
        $('#bulkTransferForm').on('submit', function(e) {
            var submitterName = e.originalEvent && e.originalEvent.submitter ? e.originalEvent.submitter.name : '';
            if (submitterName === 'pppoe_username') {
                return true; // Bypass validation for Auto-Fix button
            }

            var checkboxes = $(this).find('input[name="customer_ids"]:checked');
            var target = $(this).find('select[name="target_device_id"]').val();
            
            if (checkboxes.length === 0) {
                e.preventDefault();
                showGametechAlert('Please select at least one customer to move.');
                return false;
            }
            if (!target) {
                e.preventDefault();
                showGametechAlert('Please select a target router.');
                return false;
            }
        });
        
        // Select All for Clean Orphans
        $('#selectAllCleanOrphans').change(function() {
            $('.clean-orphan-check').prop('checked', $(this).prop('checked'));
        });
        
        // Select All for Suspicious Orphans
        $('#selectAllSuspiciousOrphans').change(function() {
            $('.suspicious-orphan-check').prop('checked', $(this).prop('checked'));
        });
        
        // Form Validation for Bulk Actions
        $('form:not(#bulkTransferForm)').on('submit', function(e) {
            var submitBtn = $(document.activeElement);
            if (submitBtn.attr('name') === 'bulk_action') {
                var checkboxes = $(this).find('input[name="selected_users"]:checked');
                if (checkboxes.length === 0) {
                    e.preventDefault();
                    
                    // Show a nice inline alert instead of reloading the page
                    const alertHtml = `
                    <div class="alert alert-warning alert-dismissible fade show mt-2 custom-validation-alert" role="alert">
                        <i class="fas fa-exclamation-triangle me-2"></i> Please select at least one user using the checkboxes first.
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>`;
                    
                    $(this).find('.custom-validation-alert').remove();
                    $(this).find('.card-body').prepend(alertHtml);
                }
            }
        });

        // Select All for Missing
        $('#selectAllMissing').change(function() {
            $('.missing-check').prop('checked', $(this).prop('checked'));
        });
        
        // Uncheck 'Select All' if one is manually unchecked
        $('.clean-orphan-check').change(function(){
            if(false == $(this).prop("checked")){
                $("#selectAllCleanOrphans").prop('checked', false); 
            }
            if ($('.clean-orphan-check:checked').length == $('.clean-orphan-check').length ){
                $("#selectAllCleanOrphans").prop('checked', true);
            }
        });
        
        $('.suspicious-orphan-check').change(function(){
            if(false == $(this).prop("checked")){
                $("#selectAllSuspiciousOrphans").prop('checked', false); 
            }
            if ($('.suspicious-orphan-check:checked').length == $('.suspicious-orphan-check').length ){
                $("#selectAllSuspiciousOrphans").prop('checked', true);
            }
        });

        $('.missing-check').change(function(){
            if(false == $(this).prop("checked")){
                $("#selectAllMissing").prop('checked', false); 
            }
            if ($('.missing-check:checked').length == $('.missing-check').length ){
                $("#selectAllMissing").prop('checked', true);
            }
        });
    });
</script>
