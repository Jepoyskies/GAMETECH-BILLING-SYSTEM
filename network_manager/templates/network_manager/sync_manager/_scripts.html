<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>

<script>
    function showGametechAlert(message) {
        var el = document.getElementById('gametechAlertModal');
        if (el) {
            var modal = new bootstrap.Modal(el);
            $('#gametechAlertModalBody').text(message);
            modal.show();
        } else {
            alert(message);
        }
    }

    $(document).ready(function() {
        // Initialize client-paginated tables
        $('.datatable').DataTable({
            "pageLength": 15,
            "lengthChange": false,
            "info": true,
            "searching": true,
            "destroy": true,
            "autoWidth": false,
            "order": []
        });

        // Review Table: server-paginated, reason filter on hidden sm-reasonkey column
        var reviewDt = $('#reviewTable').DataTable({
            "paging": false,
            "lengthChange": false,
            "searching": false,
            "info": false,
            "destroy": true,
            "autoWidth": false,
            "order": []
        });
        var reasonCol = reviewDt.columns('.sm-reasonkey').index();

        function applyReasonFilter(reason) {
            if (!reason || reason === 'all') {
                reviewDt.column(reasonCol).search('').draw();
                $('#smReviewShowing').text('');
                return;
            }
            var re = '(^|\\s)' + $.fn.dataTable.util.escapeRegex(reason) + '(\\s|$)';
            reviewDt.column(reasonCol).search(re, true, false).draw();
            var shown = reviewDt.rows({ search: 'applied' }).count();
            var total = reviewDt.rows().count();
            $('#smReviewShowing').text('Showing ' + shown + ' of ' + total);
        }

        $(document).on('click', '[data-reason-filter]', function() {
            var $btn = $(this);
            $('[data-reason-filter]').removeClass('chip-active');
            $btn.addClass('chip-active');
            applyReasonFilter($btn.data('reason-filter'));
        });

        // Synced Table: server-paginated
        var syncedTable = $('#syncedTable').DataTable({
            "paging": false,
            "lengthChange": false,
            "searching": false,
            "info": false,
            "destroy": true,
            "autoWidth": false,
            "order": []
        });

        // Barangay Filter for Synced Table
        $(document).on('change', '#barangayFilter', function() {
            var val = $.fn.dataTable.util.escapeRegex($(this).val());
            syncedTable.column(3).search(val ? '^' + val + '$' : '', true, false).draw();
        });

        // Recalculate column widths whenever a tab is switched
        $('button[data-bs-toggle="tab"]').on('shown.bs.tab', function(e) {
            $.fn.dataTable.tables({ visible: true, api: true }).columns.adjust();
        });

        // Tab Switching via Links & Hash
        function activateSyncTab(tabTarget) {
            if (!tabTarget) return;
            var tabBtn = document.querySelector('button[data-bs-target="' + tabTarget + '"]');
            if (tabBtn) {
                var tab = new bootstrap.Tab(tabBtn);
                tab.show();
                $('html, body').animate({
                    scrollTop: $(tabTarget).offset().top - 80
                }, 200);
            }
        }

        $(document).on('click', '[data-tab-target]', function(e) {
            e.preventDefault();
            var target = $(this).data('tab-target');
            activateSyncTab(target);

            var filter = $(this).data('smv-filter');
            if (filter) {
                var $chip = $('[data-reason-filter="' + filter + '"]');
                if ($chip.length) {
                    $chip.trigger('click');
                    $('#reviewTable tbody').css('outline', '2px solid #f9b233');
                    setTimeout(function() {
                        $('#reviewTable tbody').css('outline', '');
                    }, 1200);
                }
            }
        });

        // Read hash on load
        var hash = window.location.hash;
        if (hash) {
            if (hash === '#queue-needs-review') activateSyncTab('#tab-needs-review');
            else if (hash === '#queue-pair') activateSyncTab('#tab-pair');
            else if (hash === '#queue-missing') activateSyncTab('#tab-missing');
            else if (hash.startsWith('#tab-')) activateSyncTab(hash);
        }

        // Select All for Synced Table
        $(document).on('change', '#selectAllSynced', function() {
            var isChecked = $(this).prop('checked');
            $('.synced-check:visible').prop('checked', isChecked);
        });

        $(document).on('change', '.synced-check', function() {
            if (!$(this).prop('checked')) {
                $('#selectAllSynced').prop('checked', false);
            } else if ($('.synced-check:visible:checked').length === $('.synced-check:visible').length) {
                $('#selectAllSynced').prop('checked', true);
            }
        });

        // Select All for Clean Orphans
        $(document).on('change', '#selectAllCleanOrphans', function() {
            $('.clean-orphan-check').prop('checked', $(this).prop('checked'));
        });

        $(document).on('change', '.clean-orphan-check', function() {
            if (!$(this).prop('checked')) {
                $('#selectAllCleanOrphans').prop('checked', false);
            } else if ($('.clean-orphan-check:checked').length === $('.clean-orphan-check').length) {
                $('#selectAllCleanOrphans').prop('checked', true);
            }
        });

        // Select All for Suspicious Orphans
        $(document).on('change', '#selectAllSuspiciousOrphans', function() {
            $('.suspicious-orphan-check').prop('checked', $(this).prop('checked'));
        });

        $(document).on('change', '.suspicious-orphan-check', function() {
            if (!$(this).prop('checked')) {
                $('#selectAllSuspiciousOrphans').prop('checked', false);
            } else if ($('.suspicious-orphan-check:checked').length === $('.suspicious-orphan-check').length) {
                $('#selectAllSuspiciousOrphans').prop('checked', true);
            }
        });

        // Select All for Missing
        $(document).on('change', '#selectAllMissing', function() {
            $('.missing-check:not(:disabled)').prop('checked', $(this).prop('checked'));
        });

        $(document).on('change', '.missing-check', function() {
            if (!$(this).prop('checked')) {
                $('#selectAllMissing').prop('checked', false);
            } else if ($('.missing-check:not(:disabled):checked').length === $('.missing-check:not(:disabled)').length) {
                $('#selectAllMissing').prop('checked', true);
            }
        });

        // Form Validation for Bulk Transfer / Move
        $('#bulkTransferForm').on('submit', function(e) {
            var submitter = e.originalEvent && e.originalEvent.submitter ? e.originalEvent.submitter : null;
            var submitterVal = submitter ? $(submitter).val() : '';
            var submitterName = submitter ? $(submitter).attr('name') : '';

            // If action is pair or autofix, skip move validation
            if (submitterVal === 'bulk_approve' || submitterName === 'pppoe_username') {
                var checkedCount = $(this).find('input[name="customer_ids"]:checked').length;
                if (submitterVal === 'bulk_approve' && checkedCount === 0) {
                    e.preventDefault();
                    showGametechAlert('Please select at least one customer using the checkboxes.');
                    return false;
                }
                return true;
            }

            // Move validation
            var checkboxes = $(this).find('input[name="customer_ids"]:checked');
            var target = $(this).find('select[name="target_device_id"]').val();

            if (checkboxes.length === 0) {
                e.preventDefault();
                showGametechAlert('Please select at least one customer to move.');
                return false;
            }
            if (!target) {
                e.preventDefault();
                showGametechAlert('Please select a target router.');
                return false;
            }
        });

        // Generic Bulk Action Checkbox Validation
        $('form:not(#bulkTransferForm):not(#reviewTableForm)').on('submit', function(e) {
            var submitBtn = $(document.activeElement);
            if (submitBtn.attr('name') === 'bulk_action') {
                var checkboxes = $(this).find('input[name="selected_users"]:checked');
                if (checkboxes.length === 0) {
                    e.preventDefault();
                    showGametechAlert('Please select at least one user using the checkboxes first.');
                    return false;
                }
            }
        });
    });
</script>
