<style>
/* =====================================================================
   SYNC MANAGER — status panels, tabs, queue tables, reason chips & offline.
   Consumes --sm-* variables from _styles.html. Scoped under .sm-page.
   ===================================================================== */

/* ---- Tab Navigation Bar ---------------------------------------------- */
.sm-tabs-nav {
    display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.25rem;
    padding: .4rem; border-radius: 16px; background: var(--sm-subtle);
    border: 1px solid var(--sm-border);
}
.sm-tab {
    position: relative; display: inline-flex; align-items: center; gap: .6rem;
    padding: .65rem 1.15rem; border-radius: 12px; border: 1px solid transparent;
    font-size: .88rem; font-weight: 700; color: var(--sm-muted); text-decoration: none;
    background: transparent; cursor: pointer; transition: all .15s ease;
}
.sm-tab:hover {
    color: var(--sm-text); background: var(--sm-card); border-color: var(--sm-border);
}
.sm-tab.active {
    color: var(--sm-primary); background: var(--sm-card); border-color: var(--sm-border);
    box-shadow: 0 4px 12px rgba(17, 54, 194, .08);
}
.sm-tab__count {
    display: inline-flex; align-items: center; justify-content: center;
    padding: .18rem .55rem; border-radius: 999px; font-size: .75rem; font-weight: 800;
    line-height: 1; background: var(--sm-neutral-bg); color: var(--sm-neutral);
    font-variant-numeric: tabular-nums;
}
.sm-tab.active .sm-tab__count {
    background: var(--sm-primary-bg); color: var(--sm-primary-ink);
}
.sm-tab--warn .sm-tab__count { background: var(--sm-warn-bg); color: var(--sm-warn); }
.sm-tab--danger .sm-tab__count { background: var(--sm-danger-bg); color: var(--sm-danger); }
.sm-tab--ok .sm-tab__count { background: var(--sm-ok-bg); color: var(--sm-ok); }
.sm-tab--info .sm-tab__count { background: var(--sm-info-bg); color: var(--sm-info); }
.sm-tab__sub {
    font-size: .72rem; font-weight: 600; opacity: .8;
}

/* ---- Queue Panel / Card Container ----------------------------------- */
.sm-queue-panel {
    border-radius: 20px; background: var(--sm-card); border: 1px solid var(--sm-border);
    box-shadow: var(--sm-shadow); overflow: hidden; margin-bottom: 1.5rem;
}
.sm-queue-panel__header {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
    padding: 1.1rem 1.4rem; border-bottom: 1px solid var(--sm-divider); background: var(--sm-subtle);
}
.sm-queue-panel__title {
    margin: 0; font-size: 1.05rem; font-weight: 800; color: var(--sm-text);
    display: flex; align-items: center; gap: .6rem;
}
.sm-queue-panel__notice {
    display: flex; align-items: flex-start; gap: .75rem; padding: .85rem 1.25rem;
    border-bottom: 1px solid var(--sm-divider); font-size: .84rem; line-height: 1.45;
}
.sm-queue-panel__notice--warn { background: var(--sm-warn-bg); color: var(--sm-warn); }
.sm-queue-panel__notice--ok { background: var(--sm-ok-bg); color: var(--sm-ok); }
.sm-queue-panel__notice--info { background: var(--sm-info-bg); color: var(--sm-info); }
.sm-queue-panel__notice strong { color: currentColor; }

/* ---- Filter & Toolbar Bar ------------------------------------------- */
.sm-toolbar {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .75rem;
    padding: .9rem 1.25rem; border-bottom: 1px solid var(--sm-divider);
}

/* ---- Reason Filter Chips (Needs Review) ------------------------------ */
.sm-chips {
    display: flex; flex-wrap: wrap; align-items: center; gap: .45rem; padding: .9rem 1.25rem;
    border-bottom: 1px solid var(--sm-divider); background: var(--sm-subtle);
}
.sm-chip {
    display: inline-flex; align-items: center; gap: .4rem; padding: .32rem .75rem; border-radius: 999px;
    font-size: .78rem; font-weight: 600; line-height: 1.2; cursor: pointer; border: 1px solid var(--sm-border);
    background: var(--sm-card); color: var(--sm-muted); transition: all .15s ease;
}
.sm-chip:hover { transform: translateY(-1px); border-color: var(--sm-primary); color: var(--sm-text); }
.sm-chip .chip-n {
    font-variant-numeric: tabular-nums; font-weight: 800; padding: .08rem .45rem; border-radius: 999px;
    background: var(--sm-neutral-bg); color: var(--sm-neutral); font-size: .72rem;
}
.sm-chip.chip-danger { color: var(--sm-danger); border-color: var(--sm-danger-bg); background: var(--sm-danger-bg); }
.sm-chip.chip-danger .chip-n { background: var(--sm-danger); color: #fff; }
.sm-chip.chip-warn { color: var(--sm-warn); border-color: var(--sm-warn-bg); background: var(--sm-warn-bg); }
.sm-chip.chip-warn .chip-n { background: var(--sm-warn); color: #fff; }
.sm-chip.chip-info { color: var(--sm-info); border-color: var(--sm-info-bg); background: var(--sm-info-bg); }
.sm-chip.chip-info .chip-n { background: var(--sm-info); color: #fff; }
.sm-chip.chip-active {
    border-color: #f9b233; color: #1a1408; font-weight: 700;
    background: linear-gradient(135deg, #ffd34d 0%, #f9b233 100%);
    box-shadow: 0 4px 12px rgba(249, 178, 51, .35);
}
.sm-chip.chip-active .chip-n { background: rgba(0, 0, 0, .2); color: #1a1408; }

.sm-reasonkey { visibility: hidden; width: 1px; padding: 0 !important; border: 0 !important; font-size: 0; max-width: 1px; }

/* ---- Table Design & DataTables -------------------------------------- */
.sm-table-wrap { overflow-x: auto; width: 100%; }
.sm-table {
    width: 100%; margin-bottom: 0; border-collapse: separate; border-spacing: 0;
    --bs-table-bg: transparent; --bs-table-accent-bg: transparent; color: var(--sm-text);
}
.sm-table thead th {
    background: var(--sm-subtle); color: var(--sm-muted); font-size: .73rem;
    font-weight: 800; text-transform: uppercase; letter-spacing: .06em;
    padding: .85rem 1rem; border-bottom: 1px solid var(--sm-divider); white-space: nowrap; vertical-align: middle;
}
.sm-table tbody td {
    padding: .9rem 1rem; border-bottom: 1px solid var(--sm-divider);
    font-size: .85rem; vertical-align: middle; background: transparent;
}
.sm-table tbody tr:hover td { background: var(--sm-hover); }
.sm-table tbody tr:last-child td { border-bottom: 0; }

/* Emergency indicator for review table */
#reviewTable tbody tr[data-reasons~="cut_off"] td:first-child,
#reviewTable tbody tr[data-reasons~="paid_expired_profile"] td:first-child {
    box-shadow: inset 4px 0 0 var(--sm-danger);
}
#reviewTable tbody tr[data-reasons~="cut_off"],
#reviewTable tbody tr[data-reasons~="paid_expired_profile"] {
    background: var(--sm-danger-bg);
}

/* DataTables pagination overrides */
.sm-page .dataTables_wrapper { padding: 0; }
.sm-page .dataTables_wrapper .dataTables_filter { padding: .75rem 1.25rem; }
.sm-page .dataTables_wrapper .dataTables_filter input {
    border-radius: 10px; border: 1px solid var(--sm-border); padding: .35rem .75rem;
    background: var(--sm-card); color: var(--sm-text); font-size: .85rem;
}
.sm-page .dataTables_wrapper .dataTables_info {
    padding: .9rem 1.25rem; color: var(--sm-muted); font-size: .8rem;
}
.sm-page .dataTables_wrapper .dataTables_paginate {
    padding: .75rem 1.25rem;
}

/* Plan Health Banner */
.sm-plan-box {
    margin-bottom: 1.25rem; border-radius: 18px; border: 1px solid var(--sm-border);
    background: var(--sm-card); overflow: hidden; box-shadow: var(--sm-shadow);
}
.sm-plan-box summary {
    display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem;
    cursor: pointer; font-weight: 700; color: var(--sm-text); list-style: none; user-select: none;
}
.sm-plan-box summary::-webkit-details-marker { display: none; }
.sm-plan-box summary:hover { background: var(--sm-hover); }
.sm-plan-content { padding: 0 1.25rem 1.25rem; }
.sm-plan-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
.sm-plan-row {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .5rem 1rem;
    padding: .65rem .85rem; border-radius: 12px; background: var(--sm-subtle); border: 1px solid var(--sm-border);
}
.sm-price { font-weight: 800; font-size: .95rem; color: #f9b233; min-width: 4.2rem; }
.sm-plan-row__names { font-size: .82rem; color: var(--sm-text); word-break: break-word; }
.sm-plan-row__tags { display: flex; flex-wrap: wrap; gap: .35rem; justify-content: flex-end; }
.sm-unmapped { display: flex; flex-wrap: wrap; gap: .4rem; max-height: 9rem; overflow-y: auto; }

/* Offline State */
.sm-offline {
    display: flex; gap: 1.5rem; align-items: flex-start; flex-wrap: wrap;
    padding: 1.75rem; margin-bottom: 1.5rem; border-radius: 24px;
    border: 1px solid var(--sm-danger); background: var(--sm-danger-bg);
    color: var(--sm-text); box-shadow: var(--sm-shadow);
}
.sm-offline__icon {
    position: relative; flex: 0 0 auto; width: 64px; height: 64px; border-radius: 18px;
    display: grid; place-items: center; font-size: 1.6rem; color: #fff;
    background: var(--sm-danger); box-shadow: 0 8px 20px -6px rgba(220, 38, 38, .6);
}
.sm-offline__icon::after {
    content: ""; position: absolute; inset: -6px; border-radius: 22px;
    border: 2px solid var(--sm-danger); animation: smRing 2.2s ease-out infinite;
}
@keyframes smRing { 0% { opacity: .9; transform: scale(.92); } 100% { opacity: 0; transform: scale(1.18); } }
.sm-offline__body { flex: 1 1 280px; min-width: 0; }
.sm-offline__title { margin: 0; font-size: 1.25rem; font-weight: 800; color: var(--sm-text); }
.sm-offline__text { margin: .4rem 0 1rem; font-size: .88rem; line-height: 1.55; color: var(--sm-muted); }
.sm-offline__checks { list-style: none; padding: 0; margin: 0 0 1.25rem; display: flex; flex-wrap: wrap; gap: .5rem; }
.sm-offline__checks li {
    display: inline-flex; align-items: center; gap: .45rem; padding: .4rem .75rem; border-radius: 10px;
    font-size: .78rem; background: var(--sm-card); border: 1px solid var(--sm-border); color: var(--sm-text);
}

@media (max-width: 768px) {
    .sm-tabs-nav { flex-direction: column; }
    .sm-tab { width: 100%; justify-content: space-between; }
    .sm-toolbar { flex-direction: column; align-items: stretch; }
}
</style>
