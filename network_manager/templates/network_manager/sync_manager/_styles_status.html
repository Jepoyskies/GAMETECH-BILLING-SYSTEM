<style>
    /* Sync Manager: hero, status panels, offline state.
       Values mirror the Dashboard baseline (navy #0f172a -> #1e3a8a, gold #F9B233, radii 24/12px). */
    .sm-hero {
        position: relative; overflow: hidden;
        display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
        padding: 1.6rem 1.75rem; margin-bottom: 1.5rem;
        border-radius: 24px; border: 1px solid rgba(255,255,255,.08);
        background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 60%, #2563eb 100%);
        box-shadow: 0 18px 40px -18px rgba(15,23,42,.7);
        color: #fff;
    }
    .sm-hero__glow {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(circle at 85% 0%, rgba(249,178,51,.18), transparent 45%),
                    radial-gradient(circle at 0% 100%, rgba(96,165,250,.18), transparent 50%);
    }
    .sm-hero__icon {
        flex: 0 0 auto; width: 56px; height: 56px; border-radius: 16px;
        display: grid; place-items: center; font-size: 1.4rem; color: #F9B233;
        background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14);
        backdrop-filter: blur(10px);
    }
    .sm-hero__eyebrow { font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #F9B233; }
    .sm-hero__title { margin: 0; font-size: clamp(1.35rem, 2.6vw, 1.85rem); font-weight: 800; line-height: 1.15; color: #fff; overflow-wrap: anywhere; }
    .min-w-0 { min-width: 0; }

    /* Chips */
    .sm-chip {
        display: inline-flex; align-items: center; gap: .4rem;
        padding: .28rem .7rem; border-radius: 999px;
        font-size: .74rem; font-weight: 600; line-height: 1.2; white-space: nowrap;
        background: rgba(148,163,184,.14); border: 1px solid rgba(148,163,184,.22); color: inherit;
    }
    .sm-hero .sm-chip { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.18); color: #e2e8f0; }
    .sm-chip--ok     { background: rgba(16,185,129,.14) !important; border-color: rgba(16,185,129,.35) !important; color: #34d399 !important; }
    .sm-chip--danger { background: rgba(239,68,68,.14) !important;  border-color: rgba(239,68,68,.35) !important;  color: #f87171 !important; }
    .sm-chip--info   { background: rgba(59,130,246,.14);  border-color: rgba(59,130,246,.3);  color: #60a5fa; }
    .sm-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 0 currentColor; animation: smPulse 1.8s infinite; }
    @keyframes smPulse { 0% { box-shadow: 0 0 0 0 currentColor; } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

    /* Buttons */
    .sm-btn {
        display: inline-flex; align-items: center; gap: .5rem;
        padding: .55rem 1.1rem; border-radius: 12px;
        font-size: .85rem; font-weight: 700; text-decoration: none; white-space: nowrap;
        border: 1px solid transparent; transition: transform .15s ease, box-shadow .2s ease, background .2s ease;
    }
    .sm-btn:hover { transform: translateY(-1px); }
    .sm-btn--glass { color: #fff; background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.22); backdrop-filter: blur(6px); }
    .sm-btn--glass:hover { color: #fff; background: rgba(255,255,255,.18); }
    .sm-btn--gold { color: #0f172a; background: linear-gradient(135deg, #F9B233, #fbae1a); box-shadow: 0 8px 20px -8px rgba(249,178,51,.7); }
    .sm-btn--gold:hover { color: #0f172a; box-shadow: 0 10px 24px -6px rgba(249,178,51,.85); }
    .sm-btn--ghost { color: var(--gt-text, #e2e8f0); background: transparent; border-color: var(--gt-border, rgba(148,163,184,.25)); }
    .sm-btn--ghost:hover { color: var(--gt-text, #fff); background: var(--gt-surface-2, rgba(148,163,184,.1)); }
    .sm-btn--warn { color: #F9B233; background: rgba(249,178,51,.1); border-color: rgba(249,178,51,.4); }
    .sm-btn--warn:hover { color: #0f172a; background: #F9B233; }

    /* Panels */
    .sm-panel {
        position: relative; padding: 1.25rem 1.4rem; margin-bottom: 1.5rem;
        border-radius: 20px; border: 1px solid var(--gt-border, rgba(148,163,184,.18));
        background: var(--gt-surface, #111827); color: var(--gt-text, #e2e8f0);
        box-shadow: 0 10px 30px -12px rgba(0,0,0,.35);
    }
    .sm-panel::before { content: ""; position: absolute; left: 0; top: 18px; bottom: 18px; width: 4px; border-radius: 0 4px 4px 0; background: var(--sm-accent, #F9B233); }
    .sm-panel--warn { --sm-accent: #F9B233; background: linear-gradient(135deg, rgba(249,178,51,.07), transparent 55%), var(--gt-surface, #111827); }
    .sm-panel--ok   { --sm-accent: #10b981; color: #34d399; }
    .sm-panel--slim { padding: .8rem 1.4rem; font-size: .85rem; }
    .sm-panel__head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .9rem; margin-bottom: 1rem; }
    .sm-panel__icon { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; color: var(--sm-accent); background: rgba(249,178,51,.12); border: 1px solid rgba(249,178,51,.28); }
    .sm-panel__title { margin: 0; font-size: 1rem; font-weight: 800; color: var(--gt-text, #fff); }
    .sm-panel__sub, .sm-muted { font-size: .78rem; color: var(--gt-text-muted, #94a3b8); }
    .sm-panel__label { margin: .25rem 0 .6rem; font-size: .8rem; font-weight: 600; color: var(--gt-text-muted, #94a3b8); }
    .sm-text-danger { color: #f87171; }

    .sm-plan-list { list-style: none; margin: 0 0 .75rem; padding: 0; display: grid; gap: .5rem; }
    .sm-plan-row {
        display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .5rem 1rem;
        padding: .7rem .9rem; border-radius: 12px;
        background: var(--gt-surface-2, rgba(148,163,184,.06)); border: 1px solid var(--gt-border, rgba(148,163,184,.14));
        transition: border-color .2s ease, background .2s ease;
    }
    .sm-plan-row:hover { border-color: rgba(249,178,51,.35); }
    .sm-price { font-weight: 800; font-size: .95rem; color: #F9B233; min-width: 4.2rem; }
    .sm-plan-row__names { font-size: .82rem; color: var(--gt-text, #e2e8f0); overflow-wrap: anywhere; }
    .sm-plan-row__tags { display: flex; flex-wrap: wrap; gap: .35rem; justify-content: flex-end; }
    .sm-unmapped { display: flex; flex-wrap: wrap; gap: .4rem; max-height: 9rem; overflow: auto; }

    /* Router offline */
    .sm-offline {
        display: flex; gap: 1.5rem; align-items: flex-start; flex-wrap: wrap;
        padding: 1.75rem; margin-bottom: 1.5rem; border-radius: 24px;
        border: 1px solid rgba(239,68,68,.28);
        background: radial-gradient(circle at 0% 0%, rgba(239,68,68,.12), transparent 55%), var(--gt-surface, #111827);
        color: var(--gt-text, #e2e8f0);
        box-shadow: 0 14px 36px -16px rgba(239,68,68,.35);
    }
    .sm-offline__icon {
        position: relative; flex: 0 0 auto; width: 68px; height: 68px; border-radius: 20px;
        display: grid; place-items: center; font-size: 1.6rem; color: #f87171;
        background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.35);
    }
    .sm-offline__icon::after { content: ""; position: absolute; inset: -6px; border-radius: 24px; border: 2px solid rgba(239,68,68,.35); animation: smRing 2.2s ease-out infinite; }
    @keyframes smRing { 0% { opacity: .9; transform: scale(.92); } 100% { opacity: 0; transform: scale(1.18); } }
    .sm-offline__body { flex: 1 1 280px; min-width: 0; }
    .sm-offline__title { margin: 0; font-size: 1.2rem; font-weight: 800; color: var(--gt-text, #fff); }
    .sm-offline__text { margin: .4rem 0 1rem; font-size: .88rem; line-height: 1.55; color: var(--gt-text-muted, #94a3b8); max-width: 70ch; }
    .sm-offline__meta { display: flex; flex-wrap: wrap; gap: 1.25rem; margin-bottom: 1rem; font-size: .8rem; font-weight: 600; color: var(--gt-text, #cbd5e1); }
    .sm-offline__meta i { color: #F9B233; margin-right: .35rem; }
    .sm-offline__checks { list-style: none; padding: 0; margin: 0 0 1.25rem; display: flex; flex-wrap: wrap; gap: .5rem; }
    .sm-offline__checks li {
        display: inline-flex; align-items: center; gap: .45rem; padding: .4rem .75rem; border-radius: 10px;
        font-size: .78rem; background: var(--gt-surface-2, rgba(148,163,184,.08)); border: 1px solid var(--gt-border, rgba(148,163,184,.16));
    }
    .sm-offline__checks i { color: var(--gt-text-muted, #94a3b8); }

    @media (max-width: 576px) {
        .sm-hero { padding: 1.25rem; border-radius: 20px; }
        .sm-hero > .sm-btn { width: 100%; justify-content: center; }
        .sm-plan-row { grid-template-columns: auto 1fr; }
        .sm-plan-row__tags { grid-column: 1 / -1; justify-content: flex-start; }
        .sm-offline { padding: 1.25rem; }
        .sm-offline .sm-btn { flex: 1 1 auto; justify-content: center; }
    }
    /* ---- SIMPLE VIEW ------------------------------------------------
       Designed for a supervisor who does not know what a PPPoE profile is.
       Large type, plain sentences, one idea per card, and the safety state
       stated in words at the very top. Colour is used only to rank urgency,
       never as the sole carrier of meaning -- every card also says what it
       is and what to do, so it still reads correctly in greyscale.
    */
    .smv { margin-bottom: 1.5rem; }
    .smv-safe, .smv-warn {
        display: flex; gap: .9rem; align-items: flex-start;
        padding: 1rem 1.15rem; border-radius: 18px; margin-bottom: 1.5rem;
        border: 1px solid; line-height: 1.45;
    }
    .smv-safe {
        background: rgba(34,197,94,.10); border-color: rgba(34,197,94,.35);
    }
    .smv-safe strong { color: #4ade80; font-size: 1.05rem; }
    .smv-safe__sub { color: var(--gt-text-muted, #94a3b8); font-size: .9rem; margin-top: .2rem; }
    .smv-warn {
        background: rgba(239,68,68,.10); border-color: rgba(239,68,68,.4);
    }
    .smv-warn strong { color: #f87171; font-size: 1.05rem; }
    .smv-safe__icon { font-size: 1.5rem; margin-top: .1rem; }
    .smv-safe .smv-safe__icon { color: #4ade80; }
    .smv-warn  .smv-safe__icon { color: #f87171; }

    .smv-head { margin-bottom: 1rem; }
    .smv-head__title { font-size: 1.35rem; font-weight: 700; margin: 0; }
    .smv-head__sub { color: var(--gt-text-muted, #94a3b8); font-size: .95rem; margin: .25rem 0 0; }

    .smv-grid {
        display: grid; gap: 1rem;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    }
    .smv-card {
        display: flex; flex-direction: column;
        padding: 1.15rem 1.25rem; border-radius: 18px;
        background: var(--gt-surface-1, rgba(148,163,184,.06));
        border: 1px solid var(--gt-border, rgba(148,163,184,.16));
        /* a thick left edge, so urgency is legible without reading */
        border-left: 5px solid var(--smv-accent, #64748b);
    }
    .smv-card--urgent { --smv-accent: #f87171; background: rgba(248,113,113,.07); border-color: rgba(248,113,113,.3); border-left-color: #f87171; }
    .smv-card--warn   { --smv-accent: #fbbf24; background: rgba(251,191,36,.06); border-color: rgba(251,191,36,.26); border-left-color: #fbbf24; }
    .smv-card--info   { --smv-accent: #60a5fa; background: rgba(96,165,250,.06); border-color: rgba(96,165,250,.24); border-left-color: #60a5fa; }
    .smv-card--ok     { --smv-accent: #4ade80; background: rgba(34,197,94,.06); border-color: rgba(34,197,94,.24); border-left-color: #4ade80; }

    .smv-card__top { display: flex; align-items: center; gap: .6rem; margin-bottom: .5rem; }
    .smv-card__icon { color: var(--smv-accent); font-size: 1.35rem; line-height: 1; }
    /* Tabular numerals so 1,026 does not render wider than 944 next to it */
    .smv-card__count {
        margin-left: auto; font-size: 2.1rem; font-weight: 800; line-height: 1;
        font-variant-numeric: tabular-nums; color: var(--smv-accent);
    }
    .smv-card__title { font-size: 1.08rem; font-weight: 700; margin: 0 0 .4rem; }
    .smv-card__plain { font-size: .93rem; line-height: 1.5; color: var(--gt-text, #e2e8f0); margin: 0 0 .6rem; }
    .smv-card__action {
        display: flex; gap: .45rem; align-items: flex-start;
        font-size: .88rem; line-height: 1.45; margin: 0 0 .9rem;
        color: var(--gt-text-muted, #94a3b8);
    }
    .smv-card__action i { color: var(--smv-accent); margin-top: .15rem; }
    .smv-card__link {
        margin-top: auto; align-self: flex-start;
        display: inline-flex; align-items: center; gap: .45rem;
        font-size: .9rem; font-weight: 600; color: var(--smv-accent);
        text-decoration: none; padding: .45rem .85rem; border-radius: 999px;
        border: 1px solid var(--smv-accent);
    }
    .smv-card__link:hover { background: var(--smv-accent); color: #0f172a; }
    .smv-card__link:focus-visible { outline: 2px solid #fbae1a; outline-offset: 2px; }

    .smv-allgood {
        display: flex; gap: 1rem; align-items: center;
        padding: 1.5rem; border-radius: 18px;
        background: rgba(34,197,94,.08); border: 1px solid rgba(34,197,94,.3);
    }
    .smv-allgood i { color: #4ade80; font-size: 2rem; }
    .smv-allgood strong { font-size: 1.1rem; color: #4ade80; }

    .smv-foot {
        display: flex; gap: .5rem; align-items: center;
        color: var(--gt-text-muted, #94a3b8); font-size: .88rem; margin: 1rem 0 0;
    }

    @media (max-width: 576px) {
        .smv-card__count { font-size: 1.7rem; }
        .smv-card { padding: 1rem; }
        .smv-card__link { width: 100%; justify-content: center; }
    }

    /* ---- Review-queue reason chips -------------------------------
       Severity by COLOUR, not by position. A 1,000-row queue needs the
       emergencies to be findable without reading, so red (customer has no
       service) outranks amber (technical mismatch) outranks the collections
       slate (business decision, not an outage).
    */
    .sm-chips { border-bottom: 1px solid var(--gt-border, rgba(148,163,184,.16)); }
    .sm-chip {
        display: inline-flex; align-items: center; gap: .4rem;
        padding: .34rem .7rem; border-radius: 999px; cursor: pointer;
        font-size: .78rem; font-weight: 600; line-height: 1.2;
        background: var(--gt-surface-2, rgba(148,163,184,.08));
        border: 1px solid var(--gt-border, rgba(148,163,184,.18));
        color: var(--gt-text-muted, #94a3b8);
        transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    }
    .sm-chip:hover { transform: translateY(-1px); }
    .sm-chip:focus-visible { outline: 2px solid #fbae1a; outline-offset: 2px; }
    .sm-chip .chip-n {
        font-variant-numeric: tabular-nums; font-weight: 700;
        padding: .05rem .4rem; border-radius: 999px;
        background: rgba(148,163,184,.18); color: inherit; font-size: .74rem;
    }
    /* red = the customer has no service right now */
    .sm-chip.chip-danger   { color: #f87171; border-color: rgba(248,113,113,.4); background: rgba(248,113,113,.10); }
    .sm-chip.chip-danger .chip-n { background: rgba(248,113,113,.22); }
    /* amber = the two systems disagree, needs a technical decision */
    .sm-chip.chip-warn     { color: #fbbf24; border-color: rgba(251,191,36,.4);  background: rgba(251,191,36,.10); }
    .sm-chip.chip-warn .chip-n { background: rgba(251,191,36,.22); }
    /* blue = informational */
    .sm-chip.chip-info     { color: #60a5fa; border-color: rgba(96,165,250,.38); background: rgba(96,165,250,.10); }
    .sm-chip.chip-info .chip-n { background: rgba(96,165,250,.20); }
    /* slate = collections decision, the bulk of the queue, deliberately quiet */
    .sm-chip.chip-collect  { color: #94a3b8; border-color: rgba(148,163,184,.3);  background: rgba(148,163,184,.07); }
    /* the selected chip gets the brand gold so it reads instantly */
    .sm-chip.chip-active {
        border-color: #fbae1a; color: #0f172a;
        background: linear-gradient(135deg, #f9b233, #fbae1a);
        box-shadow: 0 4px 14px rgba(249,178,51,.32);
    }
    .sm-chip.chip-active .chip-n { background: rgba(15,23,42,.22); color: #0f172a; }

    /* A row carrying an emergency must be visible in a 1,000-row table
       without hunting: a left edge marker, not a background wash that would
       fight the alternating row colours. */
    #reviewTable tbody tr[data-reasons~="cut_off"] td:first-child,
    #reviewTable tbody tr[data-reasons~="paid_expired_profile"] td:first-child {
        box-shadow: inset 3px 0 0 #f87171;
    }
    #reviewTable tbody tr[data-reasons~="cut_off"],
    #reviewTable tbody tr[data-reasons~="paid_expired_profile"] { background: rgba(248,113,113,.06); }

    @media (prefers-reduced-motion: reduce) {
        .sm-dot, .sm-offline__icon::after { animation: none; }
        .sm-chip { transition: none; }
        .sm-chip:hover { transform: none; }
    }
</style>
