<!-- Sync Manager hero -->
<header class="sm-hero animate-fade-in">
    <div class="sm-hero__glow" aria-hidden="true"></div>

    <div class="d-flex align-items-center gap-3 position-relative">
        <div class="sm-hero__icon" aria-hidden="true"><i class="fas fa-satellite-dish"></i></div>
        <div class="min-w-0">
            <div class="sm-hero__eyebrow">Sync Manager</div>
            <h1 class="sm-hero__title">{{ device.device_name }}</h1>
            <div class="d-flex flex-wrap align-items-center gap-2 mt-2">
                <span class="sm-chip"><i class="fas fa-network-wired"></i> {{ device.ip_address }}</span>
                {% if api_success %}
                <span class="sm-chip sm-chip--ok"><span class="sm-dot"></span> Online</span>
                {% else %}
                <span class="sm-chip sm-chip--danger"><span class="sm-dot"></span> Unreachable</span>
                {% endif %}
            </div>
        </div>
    </div>

    <a id="smHeroBackBtn" href="{% url 'device_list' %}" class="sm-btn sm-btn--glass position-relative">
        <i class="fas fa-arrow-left"></i> Back to Devices
    </a>
</header>
