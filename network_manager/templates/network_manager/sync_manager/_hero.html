<!-- Premium Page Hero -->
<div class="page-hero d-flex align-items-center justify-content-between flex-wrap gap-3 animate-fade-in"
     style="background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #60a5fa 100%); position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 25px; margin-bottom: 25px;">
    <!-- Glowing Overlay -->
    <div style="position: absolute; top: 0; right: 0; width: 100%; height: 100%; background: radial-gradient(circle at top right, rgba(255,255,255,0.15), transparent 70%); pointer-events: none;"></div>
    
    <div class="d-flex align-items-center position-relative z-1">
        <div class="hero-icon" style="background: rgba(0,0,0,0.2); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 0 15px rgba(0,0,0,0.3);">
            <i class="fas fa-satellite-dish text-white"></i>
        </div>
        <div class="ms-3">
            <div class="hero-title text-white" style="text-shadow: 0 2px 4px rgba(0,0,0,0.3); font-weight: 800; font-size: 1.8rem; line-height: 1.2;">
                Sync Manager: <span style="color: #60a5fa;">{{ device.device_name }}</span>
            </div>
            <div class="hero-sub text-white-50" style="font-weight: 500;">
                <i class="fas fa-network-wired me-1"></i> {{ device.ip_address }} &bull; Live router synchronization
            </div>
        </div>
    </div>
    
    <a href="{% url 'device_list' %}" class="btn position-relative z-1 fw-bold px-4" 
       style="background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); backdrop-filter: blur(5px); color: white; border-radius: 30px; transition: all 0.3s ease;">
        <i class="fas fa-arrow-left me-2"></i> Back to Devices
    </a>
</div>
