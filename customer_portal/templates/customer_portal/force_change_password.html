{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Password - Gametech Unli Fiber</title>
    <!-- Bootstrap and FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="{% static 'css/theme.css' %}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        /* Abstract glowing background blobs */
        .blob { position: absolute; border-radius: 50%; filter: blur(100px); z-index: -1; animation: float 20s infinite alternate cubic-bezier(0.4, 0, 0.2, 1); }
        .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: rgba(56, 189, 248, 0.2); }
        .blob-2 { bottom: -20%; right: -10%; width: 60vw; height: 60vw; background: rgba(139, 92, 246, 0.15); animation-delay: -5s; }
        
        @keyframes float { 
            0% { transform: translate(0, 0) scale(1); } 
            50% { transform: translate(5%, 10%) scale(1.1); } 
            100% { transform: translate(-5%, -5%) scale(0.9); } 
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            border-top: 1px solid rgba(255,255,255,0.15);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            z-index: 10;
        }

        .form-control {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255,255,255,0.1);
            color: #f8fafc;
            border-radius: 12px;
            padding: 12px 16px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.1);
            color: #fff;
        }
        .form-control::placeholder {
            color: #64748b;
        }

        .btn-gradient {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            font-size: 1.05rem;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -5px rgba(56, 189, 248, 0.4);
        }
        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(56, 189, 248, 0.5);
            background: linear-gradient(135deg, #2dd4bf, #38bdf8);
        }

        .alert-glass {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="glass-card">
        <div class="text-center mb-4">
            <div style="width: 70px; height: 70px; background: rgba(56, 189, 248, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto; box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.2);">
                <i class="fas fa-lock text-info" style="font-size: 1.8rem;"></i>
            </div>
            <h2 class="fw-bold mb-2">Set Your Password</h2>
            <p class="text-muted" style="font-size: 0.95rem;">Please set a personal password for your account to secure your dashboard.</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-glass mb-4 text-center">
                    <i class="fas fa-exclamation-circle me-1"></i> {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label text-secondary small fw-bold">New Password</label>
                <div class="input-group">
                    <span class="input-group-text border-0" style="background: rgba(15, 23, 42, 0.6); border-right: none;"><i class="fas fa-key text-muted"></i></span>
                    <input type="password" name="new_password" class="form-control border-start-0 ps-0" placeholder="Minimum 6 characters" required>
                </div>
            </div>
            
            <div class="mb-4">
                <label class="form-label text-secondary small fw-bold">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text border-0" style="background: rgba(15, 23, 42, 0.6); border-right: none;"><i class="fas fa-check-circle text-muted"></i></span>
                    <input type="password" name="confirm_password" class="form-control border-start-0 ps-0" placeholder="Type password again" required>
                </div>
            </div>

            <button type="submit" class="btn-gradient">
                Secure My Account <i class="fas fa-arrow-right ms-2"></i>
            </button>
            
            <div class="text-center mt-4">
                <a href="{% url 'customer_portal:portal_logout' %}" class="text-muted small text-decoration-none hover-white">Cancel & Log Out</a>
            </div>
        </form>
    </div>

</body>
</html>
