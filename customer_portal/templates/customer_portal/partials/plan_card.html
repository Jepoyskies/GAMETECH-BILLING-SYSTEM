          <div class="col-12 col-md-6 col-lg-4">
            <div class="card h-100 border-0 shadow-sm plan-card {% if customer.plan_id == p.id %}border-success{% endif %}" style="background: var(--p-surface); border-radius: 16px; transition: all 0.2s; {% if customer.plan_id == p.id %}box-shadow: 0 0 0 2px #10b981 !important;{% endif %}">
              <div class="card-body p-4 d-flex flex-column">
                <div class="d-flex justify-content-between align-items-start mb-3">
                  <h5 class="fw-bold mb-0 text-primary" style="color: #60a5fa !important;">{{ p.name }}</h5>
                  <span class="badge rounded-pill" style="background: rgba(96,165,250,0.1); color: #60a5fa;">ID: {{ p.id }}</span>
                </div>
                
                <h3 class="fw-bold mb-3" style="color: #10b981;">₱{{ p.price|floatformat:2 }} <span class="fs-6 fw-normal" style="color: var(--p-text-muted);">/ 30 days</span></h3>
                
                <div class="d-flex flex-column gap-2 mb-4">
                  <div class="d-flex align-items-center gap-2">
                    <div class="rounded-circle d-flex justify-content-center align-items-center" style="width: 28px; height: 28px; background: rgba(16,185,129,0.1); color: #34d399;"><i class="fas fa-arrow-down fs-7"></i></div>
                    <div>
                      <div class="fw-bold lh-1" style="color: var(--p-text);">{{ p.speed_down|default:'0' }} Mbps</div>
                      <div style="font-size: 0.75rem; color: var(--p-text-muted);">Download Speed</div>
                    </div>
                  </div>
                  <div class="d-flex align-items-center gap-2">
                    <div class="rounded-circle d-flex justify-content-center align-items-center" style="width: 28px; height: 28px; background: rgba(56,189,248,0.1); color: #38bdf8;"><i class="fas fa-arrow-up fs-7"></i></div>
                    <div>
                      <div class="fw-bold lh-1" style="color: var(--p-text);">{{ p.speed_up|default:'0' }} Mbps</div>
                      <div style="font-size: 0.75rem; color: var(--p-text-muted);">Upload Speed</div>
                    </div>
                  </div>
                  {% if p.description %}
                  <div class="d-flex align-items-center gap-2 mt-2">
                    <div class="rounded-circle d-flex justify-content-center align-items-center" style="width: 28px; height: 28px; background: rgba(148,163,184,0.1); color: #94a3b8;"><i class="fas fa-info fs-7"></i></div>
                    <div style="font-size: 0.8rem; color: var(--p-text-muted);">
                      {{ p.description }}
                    </div>
                  </div>
                  {% endif %}
                </div>

                <div class="mt-auto">
                  <button type="button" class="btn w-100 fw-bold rounded-pill select-plan-btn" 
                          data-id="{{ p.id }}" 
                          data-price="{{ p.price }}" 
                          data-name="{{ p.name }}"
                          data-bs-target="#mockPaymentModal" data-bs-toggle="modal" data-bs-dismiss="modal"
                          style="background: {% if customer.plan_id == p.id %}#10b981{% else %}var(--p-input-bg){% endif %}; color: {% if customer.plan_id == p.id %}#fff{% else %}var(--p-text){% endif %}; border: 1px solid {% if customer.plan_id == p.id %}#10b981{% else %}var(--p-input-border){% endif %};">
                    {% if customer.plan_id == p.id %}<i class="fas fa-check-circle me-1"></i> Current Plan{% else %}Select Plan{% endif %}
                  </button>
                </div>
              </div>
            </div>
          </div>
