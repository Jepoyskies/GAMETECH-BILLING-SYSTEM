{% load static %}
<!-- Base Partial: Navbar -->
<!-- NAVBAR -->
<nav class="p-navbar">
    <div class="brand">
        <a href="#">
            <img id="navbar-logo" src="{% static 'assets/images/logo_white.png' %}" alt="Gametech Unli Fiber"
                 onerror="this.onerror=null;this.src='https://via.placeholder.com/140x36/1565c0/ffffff?text=GAMETECH'">
        </a>
    </div>
    <div class="nav-actions">
        <button class="theme-toggle" id="themeToggle" title="Toggle dark/light mode" aria-label="Toggle theme">
            <i class="fas fa-sun icon-sun"></i>
            <i class="fas fa-moon icon-moon"></i>
        </button>
        <a href="https://www.speedtest.net" target="_blank" class="btn btn-sm btn-outline-info me-2 px-3 fw-bold rounded-pill" style="border: 1px solid var(--p-border);"><i class="fas fa-gauge-high me-2"></i>Speedtest</a>
        <a href="{% url 'customer_portal:portal_tickets' %}" class="btn btn-sm btn-outline-warning me-2 px-3 fw-bold rounded-pill position-relative" style="border: 1px solid var(--p-border);"><i class="fas fa-screwdriver-wrench me-1"></i>My Tickets{% if open_tickets_count and open_tickets_count > 0 %}<span class="badge bg-danger rounded-pill ms-1" style="font-size:0.65rem;">{{ open_tickets_count }}</span>{% endif %}</a>
        <a href="{% url 'customer_portal:submit_ticket' %}" class="btn btn-sm btn-outline-primary me-2 px-3 fw-bold rounded-pill" style="border: 1px solid var(--p-border);"><i class="fas fa-headset me-2"></i>Support</a>
        <a href="{% url 'customer_portal:portal_logout' %}" class="p-logout-btn">
            <i class="fas fa-sign-out-alt"></i> Log Out
        </a>
    </div>
</nav>
