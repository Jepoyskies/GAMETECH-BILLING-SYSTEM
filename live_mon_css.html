{% extends 'billing/base.html' %}
{% load static %}

{% block title %}Live Monitoring{% endblock %}

{% block extra_css %}
<style>
/* Theme Styles for Live Monitoring Command Center */
body {
    font-family: 'Inter', -apple-system, sans-serif;
    /* Optional sleek background grid pattern */
    background-image: linear-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
    background-size: 30px 30px;
    background-color: #f8fafc;
    color: #1e293b;
}
.dark-mode body {
    background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-color: #0f172a !important;
    color: #f8fafc !important;
}

.topbar {
    background: rgba(255, 255, 255, 0.8) !important;
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(0, 0, 0, 0.05) !important;
}
.dark-mode .topbar {
    background: rgba(15, 23, 42, 0.8) !important;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05) !important;
}
.topbar .topbar-title, .topbar .menu-btn, .topbar .hide-btn, .topbar .show-btn, .topbar-right { color: #1e293b !important; }
.dark-mode .topbar .topbar-title, .dark-mode .topbar .menu-btn, .dark-mode .topbar .hide-btn, .dark-mode .topbar .show-btn, .dark-mode .topbar-right { color: #f8fafc !important; }

/* HEADER */
.live-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px;
    padding: 24px 32px;
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(24px);
    border-bottom: 1px solid rgba(0,0,0,0.05);
    border-radius: 0 0 24px 24px;
    margin-bottom: 40px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
}
.dark-mode .live-header-row {
    background: rgba(15, 23, 42, 0.6);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}
.live-title {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 2.5em;
    font-weight: 800;
    margin: 0;
    letter-spacing: -1px;
    color: #1e293b;
}
.dark-mode .live-title { color: #f8fafc; }

.live-dot {
    width: 16px;
    height: 16px;
    background: #10b981;
    border-radius: 50%;
    animation: pulse 1.5s infinite;
    flex-shrink: 0;
}
@keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
    70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
}

/* CONTROLS */
.controls-container {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    align-items: center;
}
.controls-container input,
.controls-container select {
    min-width: 160px;
    padding: 12px 20px;
    border-radius: 12px;
    border: 1px solid rgba(0,0,0,0.1);
    background: rgba(255, 255, 255, 0.9);
    color: #1e293b;
    font-size: 1.1em;
    font-weight: 600;
    transition: all .2s;
    backdrop-filter: blur(10px);
}
.dark-mode .controls-container input,
.dark-mode .controls-container select {
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255, 255, 255, 0.05);
    color: #f8fafc;
}
.controls-container input:focus, .controls-container select:focus {
    border: 1px solid #38bdf8;
    background: rgba(56, 189, 248, 0.05);
    outline: none;
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
}
.controls-container input::placeholder { color: #64748b; }
.controls-container select option {
    background: #ffffff;
    color: #1e293b;
}
.dark-mode .controls-container select option {
    background: #0f172a;
    color: #f8fafc;
}

/* SUMMARY / KPI BOXES */
.summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
    margin-bottom: 40px;
}
.sum-box {
    padding: 20px;
    border-radius: 20px;
    position: relative;
    overflow: hidden;
    min-height: 100px;
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(0,0,0,0.05);
    border-top: 1px solid rgba(255,255,255,0.6);
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    justify-content: center;
}
.dark-mode .sum-box {
    background: rgba(30, 41, 59, 0.6);
    border: 1px solid rgba(255,255,255,0.05);
    border-top: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 15px 35px rgba(0,0,0,0.2), inset 0 0 0 1px rgba(255,255,255,0.05);
}
.sum-box:hover {
    transform: translateY(-5px);
}

/* Stunning Gradients and Glows - Light Mode */
.box-uplink { border-left: 6px solid #a855f7; background: linear-gradient(135deg, rgba(168,85,247,0.05) 0%, rgba(255,255,255,0.8) 100%); }
.box-rx { border-left: 6px solid #38bdf8; background: linear-gradient(135deg, rgba(56,189,248,0.05) 0%, rgba(255,255,255,0.8) 100%); }
.box-tx { border-left: 6px solid #fbbf24; background: linear-gradient(135deg, rgba(251,191,36,0.05) 0%, rgba(255,255,255,0.8) 100%); }
.box-net { border-left: 6px solid #10b981; background: linear-gradient(135deg, rgba(16,185,129,0.05) 0%, rgba(255,255,255,0.8) 100%); }
.box-users { border-left: 6px solid #6366f1; background: linear-gradient(135deg, rgba(99,102,241,0.05) 0%, rgba(255,255,255,0.8) 100%); }
.box-top { border-left: 6px solid #ec4899; background: linear-gradient(135deg, rgba(236,72,153,0.05) 0%, rgba(255,255,255,0.8) 100%); }

/* Stunning Gradients and Glows - Dark Mode */
.dark-mode .box-uplink { box-shadow: 0 15px 35px rgba(168, 85, 247, 0.15); background: linear-gradient(135deg, rgba(168,85,247,0.1) 0%, rgba(30,41,59,0.6) 100%); }
.dark-mode .box-rx { box-shadow: 0 15px 35px rgba(56, 189, 248, 0.15); background: linear-gradient(135deg, rgba(56,189,248,0.1) 0%, rgba(30,41,59,0.6) 100%); }
.dark-mode .box-tx { box-shadow: 0 15px 35px rgba(251, 191, 36, 0.15); background: linear-gradient(135deg, rgba(251,191,36,0.1) 0%, rgba(30,41,59,0.6) 100%); }
.dark-mode .box-net { box-shadow: 0 15px 35px rgba(16, 185, 129, 0.15); background: linear-gradient(135deg, rgba(16,185,129,0.1) 0%, rgba(30,41,59,0.6) 100%); }
.dark-mode .box-users { box-shadow: 0 15px 35px rgba(99, 102, 241, 0.15); background: linear-gradient(135deg, rgba(99,102,241,0.1) 0%, rgba(30,41,59,0.6) 100%); }
.dark-mode .box-top { box-shadow: 0 15px 35px rgba(236, 72, 153, 0.15); background: linear-gradient(135deg, rgba(236,72,153,0.1) 0%, rgba(30,41,59,0.6) 100%); }

.sum-box h3 {
    margin: 0 0 8px 0;
    font-size: 0.95rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #64748b;
}
.dark-mode .sum-box h3 { color: #cbd5e1; }
.sum-box p {
    margin: 0;
    font-size: 2.8rem;
    font-weight: 900;
    color: #1e293b;
    line-height: 1.1;
    text-shadow: none;
}
.dark-mode .sum-box p {
    color: #f8fafc;
    text-shadow: 0 0 30px rgba(255,255,255,0.2);
}

.gauge-canvas {
    width: 100px !important;
    height: 100px !important;
    position: absolute;
    top: 24px;
    right: 24px;
    background: transparent;
    pointer-events: none;
    opacity: 0.8;
}

/* HARDWARE WARNING STATE */
.hw-warning {
    border-left: 6px solid #ef4444 !important;
    background: linear-gradient(135deg, rgba(239,68,68,0.1) 0%, rgba(255,255,255,0.9) 100%) !important;
}
.dark-mode .hw-warning {
    background: linear-gradient(135deg, rgba(239,68,68,0.2) 0%, rgba(30,41,59,0.8) 100%) !important;
    box-shadow: 0 0 40px rgba(239, 68, 68, 0.3) !important;
}
.hw-warning h3, .hw-warning p { color: #ef4444 !important; }

/* FEED ALERTS */
.feed-panel {
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    border: 1px solid rgba(0,0,0,0.05);
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    overflow: hidden;
}
.dark-mode .feed-panel {
    background: rgba(30, 41, 59, 0.5);
    border: 1px solid rgba(255,255,255,0.05);
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}

.feed-header {
    padding: 24px 32px;
    background: rgba(0,0,0,0.02);
    border-bottom: 1px solid rgba(0,0,0,0.05);
}
.dark-mode .feed-header {
    background: rgba(0,0,0,0.2);
    border-bottom: 1px solid rgba(255,255,255,0.05);
}

.network-alert-card {
    border: none;
    background: none;
}
.network-alert-item {
    background: rgba(255, 255, 255, 0.9);
    margin: 16px 32px;
    padding: 24px 32px;
    border-radius: 16px;
    border: 1px solid rgba(239, 68, 68, 0.2);
    border-left: 6px solid #ef4444;
    box-shadow: 0 5px 15px rgba(239, 68, 68, 0.05);
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.dark-mode .network-alert-item {
    background: rgba(15, 23, 42, 0.6);
    box-shadow: 0 0 30px rgba(239, 68, 68, 0.15);
}

.network-alert-item h6 { font-size: 1.5rem; color: #1e293b; margin-bottom: 4px; }
.dark-mode .network-alert-item h6 { color: #f8fafc; }

.network-alert-item p { margin-bottom: 0; color: #64748b; font-size: 1.1rem; }
.dark-mode .network-alert-item p { color: #cbd5e1; }

/* CUSTOM TABLES */
.table { color: #334155; }
.dark-mode .table { color: #e2e8f0; }
.table th { background: rgba(0,0,0,0.2); border-bottom: 1px solid rgba(255,255,255,0.05); color: #94a3b8; font-weight: 700; font-size: 1.1rem; padding: 20px 32px; }
.table td { border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 1.25rem; padding: 20px 32px; }
.table-hover tbody tr:hover { background-color: rgba(255,255,255,0.02); }

/* GLOBAL SIZES */
.container { max-width: 98% !important; margin: 0 auto; }

/* USER CARDS */
.users-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
}
.user-card {
    padding: 24px;
    border-radius: 20px;
    background: rgba(30, 41, 59, 0.6);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.05);
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    transition: 0.2s;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.user-card:hover {
    transform: translateY(-2px);
    border-color: rgba(0,0,0,0.15);
}
.dark-mode .user-card:hover {
    border-color: rgba(255,255,255,0.15);
}
.user-card.heavy {
    border: 1px solid #ef4444;
    box-shadow: 0 0 10px rgba(239, 68, 68, 0.2);
}

.user-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
}
.user-card .username {
    font-weight: 800;
    color: #38bdf8;
    font-size: 1.5em;
    word-break: break-all;
    line-height: 1.2;
}
.user-card .ip {
    color: #a78bfa;
    font-size: 1em;
    margin-left: 8px;
    opacity: 0.8;
}
.user-card .speed-row {
    display: flex;
    align-items: center;
    gap: 16px;
}
.user-card .speed-number {
    display: flex;
    align-items: center;
    font-size: 1.8em;
    font-weight: 900;
    width: 130px;
    color: #f8fafc;
}
.user-card .speed-number.upload { color: #0284c7; }
.dark-mode .user-card .speed-number.upload { color: #38bdf8; }
.user-card .speed-number.download { color: #10b981; }
.dark-mode .user-card .speed-number.download { color: #34d399; }
.user-card .speed-icon {
    font-size: 0.9em;
    margin-right: 6px;
}
.user-card .stat-label {
    font-size: 0.85em;
    color: #64748b;
}
.dark-mode .user-card .stat-label { color: #94a3b8; }
.speed-badge {
    position: absolute;
    top: 14px;
    right: 14px;
    color: #fff;
    font-size: 0.75rem;
    padding: 4px 8px;
    border-radius: 6px;
    font-weight: 600;
}
.user-card .legend {
    position: absolute;
    bottom: 12px;
    right: 14px;
    font-size: 0.7rem;
    background: rgba(255, 255, 255, 0.8);
    color: #64748b;
    border-radius: 6px;
    padding: 2px 6px;
    display: flex;
    gap: 8px;
    align-items: center;
    border: 1px solid rgba(0,0,0,0.05);
}
.dark-mode .user-card .legend {
    background: rgba(15, 23, 42, 0.8);
    color: #94a3b8;
    border: 1px solid rgba(255,255,255,0.05);
}
.user-card .legend span {
    display: inline-block;
    width: 10px;
    height: 3px;
    border-radius: 2px;
    margin-right: 4px;
    vertical-align: middle;
}
.user-card .legend .ul { background: #0284c7; }
.dark-mode .user-card .legend .ul { background: #38bdf8; }
.user-card .legend .dl { background: #10b981; }
.dark-mode .user-card .legend .dl { background: #34d399; }

.user-card.heavy {
    border: 1px solid #ef4444;
    box-shadow: 0 0 10px rgba(239, 68, 68, 0.2);
}
