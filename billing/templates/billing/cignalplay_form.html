{% extends "billing/base.html" %}
{% load static %}

{% block title %}Cignal Play Payment{% endblock %}

{% block content %}
<main class="container py-4 px-3 px-md-4">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <h2 class="mb-0 fw-bold text-primary">
            <i class="fa-solid fa-money-bill me-2"></i> Add Payment for {{ customer.full_name }}
        </h2>
        <a href="{% url 'cignal_play_list' %}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i> Back
        </a>
    </div>

    <div class="dashboard-card">
        <div class="card-body p-4">
            <form method="post">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-12">
                        <label class="form-label fw-bold">Plan / Item Name</label>
                        <input type="text" name="plan_name" class="form-control" required placeholder="e.g. Cignal Play Premium">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Start / Received Date</label>
                        <input type="date" name="start_date" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">End Date</label>
                        <input type="date" name="end_date" class="form-control">
                        <div class="form-text">Optional for one-time add-ons.</div>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label fw-bold">Processed By</label>
                        <input type="text" name="adjusted_by" class="form-control" value="{{ request.user.username }}" required>
                    </div>
                </div>
                
                <div class="mt-4 text-end">
                    <button type="submit" class="btn btn-success shadow-sm px-4 py-2">
                        <i class="fas fa-check me-2"></i> Save Payment
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>
{% endblock %}
