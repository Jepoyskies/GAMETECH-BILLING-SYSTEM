<!-- Page Hero Header (Harmonized with Staff & Admins) -->
<div class="page-hero d-flex align-items-center justify-content-between flex-wrap gap-3 animate-fade-in"
     style="background: linear-gradient(135deg, #1e1b4b 0%, #312e81 60%, #4338ca 100%);">
  <div class="d-flex align-items-center">
    <div class="hero-icon"><i class="fas fa-user-tie"></i></div>
    <div>
      <div class="hero-title">Sales Agents</div>
      <div class="hero-sub">Manage sales partners, customer referrals, and commission payouts</div>
    </div>
  </div>
  <div class="d-flex gap-2 position-relative" style="z-index: 5;">
    <button type="button" class="btn-premium btn-p-primary" data-bs-toggle="modal" data-bs-target="#modal-add-agent">
      <i class="fas fa-user-plus"></i> Add Agent
    </button>
  </div>
</div>

{% if messages %}
{% for message in messages %}
<div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show rounded-3 shadow-sm mb-3" role="alert">
  {{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
{% endfor %}
{% endif %}
