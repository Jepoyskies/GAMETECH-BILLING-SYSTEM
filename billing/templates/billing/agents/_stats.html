<!-- Page Header (Unified Gametech Design System) -->
<div class="gt-page-header d-flex flex-wrap align-items-center justify-content-between gap-3" style="--section-accent: #8b5cf6;">
  <div class="d-flex align-items-center gap-3">
    <div class="gt-header-icon" style="color:#8b5cf6; border-color: rgba(139,92,246,0.3); background: rgba(139,92,246,0.15);">
      <i class="fas fa-user-tie"></i>
    </div>
    <div>
      <div class="gt-header-eyebrow mb-1" style="color:#8b5cf6; border-color: rgba(139,92,246,0.25); background: rgba(139,92,246,0.12);">
        <i class="fas fa-handshake"></i> Sales Partners
      </div>
      <h1 class="gt-header-title">Sales Agents</h1>
      <p class="gt-header-sub">Manage sales partners, customer referrals, and commission payouts</p>
    </div>
  </div>
  <div class="d-flex align-items-center gap-2">
    <button type="button" class="gt-btn-primary" data-bs-toggle="modal" data-bs-target="#modal-add-agent">
      <i class="fas fa-user-plus"></i> Add Agent
    </button>
  </div>
</div>

{% if messages %}
{% for message in messages %}
<div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show rounded-3 shadow-sm mb-3" role="alert">
  {{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
{% endfor %}
{% endif %}
