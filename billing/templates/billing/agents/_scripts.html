<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script>
$(document).ready(function() {
  var table = $('#agentsDataTable').DataTable({
    paging: true,
    searching: true,
    ordering: true,
    info: true,
    pageLength: 25,
    dom: 't<"d-flex justify-content-between align-items-center p-3 border-top border-secondary border-opacity-25"ip>',
    columnDefs: [
      { orderable: false, targets: 6 }
    ],
    language: {
      emptyTable: '<div class="py-5 text-center text-muted"><i class="fas fa-user-friends fa-3x mb-3 text-secondary opacity-50 d-block"></i><p class="mb-0">No sales agents registered yet.</p></div>',
      zeroRecords: '<div class="py-4 text-center text-muted"><i class="fas fa-search fa-2x mb-2 text-secondary opacity-50 d-block"></i><p class="mb-0">No matching agents found.</p></div>'
    }
  });

  $('#agents-search').on('keyup', function() {
    table.search(this.value).draw();
    updateInfo();
  });

  $('#agents-length').on('change', function() {
    table.page.len(this.value).draw();
    updateInfo();
  });

  function updateInfo() {
    var info = table.page.info();
    if (info.recordsTotal === 0) {
      $('#agents-info').html('No registered agents');
    } else {
      $('#agents-info').html('Showing ' + (info.start + 1) + '–' + info.end + ' of ' + info.recordsDisplay + ' records');
    }
  }

  table.on('draw', updateInfo);
  updateInfo();
});

function copyText(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function() {
      showToast("Copied to clipboard: " + text);
    });
  }
}

function showToast(msg) {
  const toast = document.createElement('div');
  toast.innerText = msg;
  toast.style.position = 'fixed';
  toast.style.bottom = '24px';
  toast.style.right = '24px';
  toast.style.background = '#10b981';
  toast.style.color = '#fff';
  toast.style.padding = '8px 16px';
  toast.style.borderRadius = '8px';
  toast.style.fontSize = '0.8rem';
  toast.style.zIndex = '99999';
  toast.style.boxShadow = '0 4px 12px rgba(0,0,0,0.3)';
  document.body.appendChild(toast);
  setTimeout(function() { toast.remove(); }, 2200);
}
</script>
