<!-- Add Agent Modal (Harmonized with Add Staff Modal) -->
<div class="modal fade" id="modal-add-agent" tabindex="-1" aria-labelledby="addAgentModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered gt-modal-scroll">
    <div class="modal-content gt-modal-card">
      
      <!-- Modal Header -->
      <div class="modal-header px-4 py-3" style="background: var(--surface-subtle);">
        <div class="d-flex align-items-center gap-3">
          <div class="rounded-circle d-flex align-items-center justify-content-center" 
               style="width: 42px; height: 42px; background: var(--color-primary-bg); color: var(--color-primary-ink);">
            <i class="fas fa-user-plus"></i>
          </div>
          <div>
            <h5 class="modal-title fw-bold mb-0" id="addAgentModalLabel" style="font-size: 1.1rem;">Add Sales Agent</h5>
            <span class="text-muted" style="font-size: 0.78rem;">Register a sales partner for customer referrals and commissions</span>
          </div>
        </div>
        <button type="button" class="gt-icon-btn" data-bs-dismiss="modal" aria-label="Close" aria-label="Close"><i class="fas fa-times"></i></button>
      </div>

      <!-- Modal Body / Form -->
      <form method="POST" action="{% url 'add_agent' %}" autocomplete="off">
        {% csrf_token %}
        <div class="modal-body px-4 py-3">
          <div class="mb-3">
            <label class="form-label text-xs text-muted text-uppercase fw-semibold mb-1">Agent Full Name <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control rounded-3" 
                   required placeholder="e.g. Maria Santos" autocomplete="off" style="font-size: 0.9rem;">
          </div>
          <div class="mb-3">
            <label class="form-label text-xs text-muted text-uppercase fw-semibold mb-1">Email Address <span class="text-danger">*</span></label>
            <input type="email" name="email" class="form-control rounded-3" 
                   required placeholder="agent@gametech.com" autocomplete="off" style="font-size: 0.9rem;">
          </div>
          <div class="mb-3">
            <label class="form-label text-xs text-muted text-uppercase fw-semibold mb-1">Contact Phone Number</label>
            <input type="text" name="phone" class="form-control rounded-3" 
                   placeholder="0917XXXXXXX" autocomplete="off" style="font-size: 0.9rem;">
          </div>
          <div class="mb-2">
            <label class="form-label text-xs text-muted text-uppercase fw-semibold mb-1">Account Password <span class="text-danger">*</span></label>
            <input type="password" name="password" class="form-control rounded-3" 
                   required placeholder="Create secure password" autocomplete="new-password" style="font-size: 0.9rem;">
            <div class="text-muted mt-1" style="font-size: 0.74rem;">
              <i class="fas fa-info-circle me-1 text-primary"></i>Allows the agent to log in and track their referrals
            </div>
          </div>
        </div>

        <!-- Modal Footer -->
        <div class="modal-footer px-4 py-3 justify-content-between">
          <button type="button" class="gt-btn-secondary btn-sm" data-bs-dismiss="modal" style="font-size: 0.85rem;">
            Cancel
          </button>
          <button type="submit" class="btn-premium btn-p-primary px-4 py-2" style="font-size: 0.88rem;">
            <i class="fas fa-user-plus me-1"></i> Save Agent
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
