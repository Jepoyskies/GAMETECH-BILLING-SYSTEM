<!-- Add Agent Modal -->
<div class="modal fade" id="modal-add-agent" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-dark border-secondary text-white shadow-lg" style="border-radius: 14px;">
      <div class="modal-header border-secondary">
        <h5 class="modal-title fw-bold text-white"><i class="fas fa-user-plus text-primary me-2"></i> Add New Sales Agent</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form method="POST" action="{% url 'add_agent' %}">
        {% csrf_token %}
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label text-sm fw-bold">Agent Full Name <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control bg-dark border-secondary text-white" required placeholder="e.g. Maria Santos" autocomplete="off">
          </div>
          <div class="mb-3">
            <label class="form-label text-sm fw-bold">Email Address <span class="text-danger">*</span></label>
            <input type="email" name="email" class="form-control bg-dark border-secondary text-white" required placeholder="agent@gametech.com" autocomplete="off">
          </div>
          <div class="mb-3">
            <label class="form-label text-sm fw-bold">Contact Phone Number</label>
            <input type="text" name="phone" class="form-control bg-dark border-secondary text-white" placeholder="0917XXXXXXX" autocomplete="off">
          </div>
          <div class="mb-2">
            <label class="form-label text-sm fw-bold">Account Password <span class="text-danger">*</span></label>
            <input type="password" name="password" class="form-control bg-dark border-secondary text-white" required placeholder="Create a password" autocomplete="new-password">
            <div class="text-xs text-muted mt-1"><i class="fas fa-info-circle me-1"></i>Allows the agent to log in and track their referrals</div>
          </div>
        </div>
        <div class="modal-footer border-secondary">
          <button type="button" class="btn btn-secondary btn-sm px-3" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm px-4 fw-semibold shadow-sm">
            <i class="fas fa-save me-1"></i> Save Agent
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
