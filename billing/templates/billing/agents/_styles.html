<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css">
<style>
  /* ── /agents/ page-scoped contrast fixes ────────────────────────────
     The gold-on-white ink bug and the .text-warning bug are now fixed in
     the shared design system (--gt-gold-ink across static/css/gt/, and the
     .gt-gold-amount utility in components.css), so they no longer need a
     local override here. What remains below is genuinely page-local. */

  /* Disabled pagination leaned on opacity 0.45, which blends the label into
     the card and leaves it at ~1.5:1. Disabled controls are exempt from WCAG,
     but an unreadable "Previous" just looks broken - so drop the opacity and
     use the readable secondary text token instead. */
  .gt-table-card .pagination .page-item.disabled .page-link {
    opacity: 1;
    color: var(--gt-text-secondary) !important;
  }

  /* The row count and the column headers both inherited --gt-text-muted
     (#94a3b8), which is 4.4:1 on the light card - just under AA for the
     12px uppercase labels. */
  .gt-table-card .dataTables_info,
  .gt-table-card .gt-table thead th { color: var(--gt-text-secondary) !important; }
</style>
