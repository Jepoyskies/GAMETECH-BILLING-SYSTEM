{% extends "billing/base.html" %}
{% load static %}

{% block title %}Add Prospect | Gametech{% endblock %}

{% block content %}
<div class="container-fluid py-4 px-3 px-md-4">
    <!-- Hero Banner -->
    <div class="gt-cl-card p-4 mb-4" style="border-left: 4px solid #14b8a6;">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div class="d-flex align-items-center">
                <div class="hero-icon me-3" style="background: rgba(20,184,166,0.15); color: #14b8a6; padding: 15px; border-radius: 12px;">
                    <i class="fas fa-user-plus fa-2x"></i>
                </div>
                <div>
                    <h4 class="mb-1 fw-bold text-white">Add Prospect Client</h4>
                    <p class="mb-0 text-muted small">Register a new customer application under your agent account.</p>
                </div>
            </div>
            <div>
                <a href="{% url 'agent_dashboard' %}" class="btn btn-outline-secondary fw-bold"><i class="fas fa-arrow-left me-2"></i> Back to Portal</a>
            </div>
        </div>
    </div>

    <!-- Add Prospect Form -->
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="gt-cl-card h-100">
                <div class="card-body p-4">
                    <form action="{% url 'agent_add_prospect' %}" method="POST">
                        {% csrf_token %}
                        <div class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">Full Name</label>
                                <input type="text" name="full_name" class="form-control bg-dark text-white border-secondary py-2" required placeholder="e.g. John Doe">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">Contact Number</label>
                                <input type="text" name="phone" class="form-control bg-dark text-white border-secondary py-2" required placeholder="09123456789">
                            </div>
                            <div class="col-12">
                                <label class="form-label text-muted small fw-bold">Specific Address</label>
                                <textarea name="address" class="form-control bg-dark text-white border-secondary" rows="2" placeholder="Block, Lot, Street, Landmark..."></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">Barangay</label>
                                <select name="barangay" class="form-select bg-dark text-white border-secondary py-2" required>
                                    <option value="" selected disabled>Select Barangay</option>
                                    {% for brgy in barangays %}
                                        <option value="{{ brgy.id }}">{{ brgy.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">ID Presented (Optional)</label>
                                <input type="text" name="id_presented" class="form-control bg-dark text-white border-secondary py-2" placeholder="e.g. UMID 323232323">
                            </div>
                        </div>
                        <div class="mt-5 text-end border-top border-secondary pt-4">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold px-5"><i class="fas fa-paper-plane me-2"></i> Submit Prospect Client</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
