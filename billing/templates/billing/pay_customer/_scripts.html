<script>
document.addEventListener('DOMContentLoaded', function() {
    let monthlyPrice = parseFloat("{{ customer.plan.price|default:0 }}");
    const isCurrentPlanGimi = {% if customer.plan and "GIMI" in customer.plan.name %}true{% else %}false{% endif %};
    let upgradeFee = 0;
    const currentExpiryStr = "{{ customer.expires_at|date:'c' }}";
    
    const hiddenPlanInput = document.getElementById('hidden_new_plan_id');
    const priceDisplay = document.getElementById('monthly-price-display');
    const planSelectBtn = document.getElementById('plan-select-btn');

    document.querySelectorAll('.select-plan-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const planId = this.getAttribute('data-id');
            const planPrice = this.getAttribute('data-price');
            const planName = this.getAttribute('data-name');
            const isGimi = this.getAttribute('data-is-gimi') === 'true';
            
            // Update hidden input
            hiddenPlanInput.value = planId;
            monthlyPrice = parseFloat(planPrice) || 0;

            // Check if GIMI upgrade fee applies
            const upgradeBanner = document.getElementById('gimi-upgrade-banner');
            const upgradeRow = document.getElementById('gimi-upgrade-fee-row');
            if (isGimi && !isCurrentPlanGimi) {
                upgradeFee = 500;
                if (upgradeBanner) upgradeBanner.style.display = 'flex';
                if (upgradeRow) upgradeRow.style.display = 'flex';
            } else {
                upgradeFee = 0;
                if (upgradeBanner) upgradeBanner.style.display = 'none';
                if (upgradeRow) upgradeRow.style.display = 'none';
            }
            
            // Update UI elements
            if (priceDisplay) {
                let priceHtml = '<strong>₱' + monthlyPrice.toFixed(2) + '</strong>';
                if (upgradeFee > 0) {
                    priceHtml += ' <span class="badge bg-warning-subtle text-warning ms-1">+₱500 Fee</span>';
                }
                priceDisplay.innerHTML = priceHtml;
            }
            if (planSelectBtn) planSelectBtn.innerHTML = planName + ' <i class="fas fa-chevron-down ms-2 fs-6"></i>';
            
            // Update active state in modal
            document.querySelectorAll('.plan-card').forEach(card => {
                card.style.boxShadow = 'none';
                const cardBtn = card.querySelector('.select-plan-btn');
                if (cardBtn) cardBtn.innerHTML = 'Select Plan';
            });
            const myCard = this.closest('.plan-card');
            myCard.style.boxShadow = '0 0 0 2px #10b981';
            this.innerHTML = '<i class="fas fa-check-circle me-1"></i> Selected';
            
            // Close modal
            const modalEl = document.getElementById('planModal');
            const modalInstance = bootstrap.Modal.getInstance(modalEl);
            if (modalInstance) modalInstance.hide();
            
            // Recalculate grid buttons
            updateGridMath();
            
            // Trigger recalculation on the active button
            const activeBtn = document.querySelector('.quick-btn.active');
            if (activeBtn) activeBtn.click();
        });
    });

    // Parse Initial Date (Default Start Date)
    let initialDate = new Date();
    if (currentExpiryStr && currentExpiryStr !== 'None' && currentExpiryStr !== '') {
        let parsed = new Date(currentExpiryStr);
        if (!isNaN(parsed.getTime())) {
            // Only use the current expiry if it's in the future!
            if (parsed > new Date()) {
                initialDate = parsed;
            }
        }
    }
    
    // Set default value for Start Date input
    const startInput = document.getElementById('start_date');
    function formatInputDatetime(dt) {
        const pad = (n) => n < 10 ? '0'+n : n;
        return dt.getFullYear() + '-' + pad(dt.getMonth()+1) + '-' + pad(dt.getDate()) + 'T' + pad(dt.getHours()) + ':' + pad(dt.getMinutes());
    }
    startInput.value = formatInputDatetime(initialDate);
    
    // Setup Quick Pay Grid Math
    function updateGridMath() {
        document.querySelectorAll('.calc-price').forEach(el => {
            if (el.hasAttribute('data-mult')) {
                let mult = parseInt(el.getAttribute('data-mult'));
                el.textContent = ((monthlyPrice * mult) + upgradeFee).toFixed(2);
            } else if (el.hasAttribute('data-days')) {
                let days = parseInt(el.getAttribute('data-days'));
                el.textContent = (((monthlyPrice / 30) * days) + upgradeFee).toFixed(2);
            }
        });
    }
    updateGridMath();

    const amountInput = document.getElementById('amount');
    const reasonBlock = document.getElementById('reason-block');
    const reasonInput = document.getElementById('reason');
    const previewDateEl = document.getElementById('preview-date');
    const quickBtns = document.querySelectorAll('.quick-btn');

    function safeAddOneMonth(dt) {
        let year = dt.getFullYear();
        let month = dt.getMonth(); // 0-indexed
        let day = dt.getDate();
        let hours = dt.getHours();
        let mins = dt.getMinutes();
        let secs = dt.getSeconds();
        
        month += 1;
        if (month > 11) {
            month = 0;
            year += 1;
        }
        
        // Get max days in the new month
        let maxDays = new Date(year, month + 1, 0).getDate();
        let safeDay = Math.min(day, maxDays);
        
        return new Date(year, month, safeDay, hours, mins, secs);
    }

    function calculateExpiryPreview(paymentAmount) {
        // Read dynamic start date
        let baseDate = new Date(startInput.value);
        if (isNaN(baseDate.getTime())) baseDate = new Date();

        let amountForTime = Math.max(0, paymentAmount - upgradeFee);
        if (monthlyPrice <= 0 || amountForTime <= 0) {
            return { previewDate: baseDate, advanceAmount: 0 };
        }
        
        let usedForTime = amountForTime;
        let advanceAmount = 0;
        if (amountForTime > monthlyPrice) {
            usedForTime = monthlyPrice;
            advanceAmount = amountForTime - monthlyPrice;
        }

        let fullMonths = Math.floor(usedForTime / monthlyPrice);
        let remainder = usedForTime % monthlyPrice;
        
        let previewDate = new Date(baseDate.getTime());
        for(let i=0; i<fullMonths; i++) {
            previewDate = safeAddOneMonth(previewDate);
        }
        
        if (remainder > 0.01) {
            let pricePerDay = monthlyPrice / 30.0;
            let daysGranted = remainder / pricePerDay;
            previewDate = new Date(previewDate.getTime() + (daysGranted * 24 * 60 * 60 * 1000));
        }
        
        return { previewDate: previewDate, advanceAmount: advanceAmount };
    }

    function updatePreview() {
        let amt = parseFloat(amountInput.value) || 0;
        let res = calculateExpiryPreview(amt);
        
        // Format nicely: e.g. "Oct 15, 2024, 10:30 AM"
        const options = { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
        let text = res.previewDate.toLocaleDateString('en-US', options);
        if (res.advanceAmount > 0) {
            text += ` (+ ₱${res.advanceAmount.toFixed(2)} Advance Payment)`;
        }
        previewDateEl.textContent = text;
        
        // Handle Reason block
        let netTimeAmt = Math.max(0, amt - upgradeFee);
        if (netTimeAmt > 0 && netTimeAmt < monthlyPrice) {
            reasonBlock.style.display = 'block';
            reasonInput.required = true;
        } else {
            reasonBlock.style.display = 'none';
            reasonInput.required = false;
        }
    }

    // Quick Button Click Handling
    quickBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            quickBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            if (btn.hasAttribute('data-months')) {
                let months = btn.getAttribute('data-months');
                if (months === 'custom') {
                    amountInput.readOnly = false;
                    amountInput.focus();
                } else {
                    amountInput.readOnly = true;
                    amountInput.value = (monthlyPrice * parseInt(months)).toFixed(2);
                    updatePreview();
                }
            } else if (btn.hasAttribute('data-days')) {
                let days = parseInt(btn.getAttribute('data-days'));
                amountInput.readOnly = true;
                amountInput.value = ((monthlyPrice / 30) * days).toFixed(2);
                updatePreview();
            }
        });
    });

    // Inputs listeners
    amountInput.addEventListener('input', () => {
        // Only run if Custom is selected
        if (document.getElementById('btn-custom').classList.contains('active')) {
            updatePreview();
        }
    });

    startInput.addEventListener('change', updatePreview);

    // Payment method logic
    const paymentMethod = document.getElementById('payment_method');
    const refNo = document.getElementById('reference_no');
    
    paymentMethod.addEventListener('change', () => {
        if (paymentMethod.value === 'cash') {
            refNo.required = false;
        } else {
            refNo.required = true;
        }
    });

    // Initialize Page State
    amountInput.readOnly = true; // 1 Month is active by default
    amountInput.value = monthlyPrice.toFixed(2);
    updatePreview();
});
</script>
