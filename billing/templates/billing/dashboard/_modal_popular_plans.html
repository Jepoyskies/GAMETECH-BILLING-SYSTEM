<!-- Dashboard Partial: Popular Plans Modal -->
  <!-- Popular Plans Modal -->
  <div class="modal fade premium-modal" id="popularPlansModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content" style="background: transparent; border: none;">
        <div class="glass-card w-100" style="border-radius: 28px;">
          <div class="modal-header border-bottom-0 pb-3 px-4 pt-4 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
              <div class="modal-icon-wrapper">
                <i class="fa-solid fa-wifi"></i>
              </div>
              <h4 class="modal-title fw-bold m-0">Popular Plans</h4>
            </div>
            <button type="button" class="custom-close-btn" data-bs-dismiss="modal" aria-label="Close">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <div class="modal-body px-4 pb-4 pt-2">
            <div class="d-flex justify-content-center mb-4">
              <div class="btn-group shadow-sm" role="group">
                <input type="radio" class="btn-check popular-plans-filter" name="popularPlansFilter" id="ppWeek" value="week" autocomplete="off">
                <label class="btn btn-outline-chart-blue px-4 py-2" for="ppWeek">This Week</label>
              
                <input type="radio" class="btn-check popular-plans-filter" name="popularPlansFilter" id="ppMonth" value="month" autocomplete="off" checked>
                <label class="btn btn-outline-chart-blue px-4 py-2" for="ppMonth">This Month</label>
              
                <input type="radio" class="btn-check popular-plans-filter" name="popularPlansFilter" id="ppYear" value="year" autocomplete="off">
                <label class="btn btn-outline-chart-blue px-4 py-2" for="ppYear">This Year</label>
              </div>
            </div>
            <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
              <table class="glass-table w-100">
                <thead style="position: sticky; top: 0; background: rgba(255, 255, 255, 0.9); z-index: 1;">
                  <tr>
                    <th class="ps-3" style="font-size: 0.7rem;">Plan</th>
                    <th class="text-end pe-3" style="font-size: 0.7rem;">Users</th>
                  </tr>
                </thead>
                <tbody id="popularPlansTbody">
                  {% for p in top_plans|slice:":10" %}
                  <tr style="border-bottom: 1px solid rgba(0,0,0,0.04);">
                    <td class="ps-3 py-4 d-flex align-items-center gap-3">
                      <span class="table-rank">#{{ forloop.counter }}</span>
                      <span class="fw-semibold text-dark table-text-dark">{{ p.plan_name }}</span>
                    </td>
                    <td class="text-end pe-3 py-4 fw-bold table-value" style="color: #2151A1;">{{ p.cnt }}</td>
                  </tr>
                  {% empty %}
                  <tr><td colspan="2" class="text-center py-5 opacity-50">No data available.</td></tr>
                  {% endfor %}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
