<!-- Dashboard Partial: Primary KPI Cards -->
  <!-- KPI Cards Row -->
  <div class="row g-4 kpi-cards-row">
    <!-- Revenue Growth -->
    <div class="col-12 col-md-4">
      <div class="kpi-card" data-bs-toggle="modal" data-bs-target="#revenueModal">
        <div class="expand-btn" title="Expand">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 9V4h5M4 4l6 6" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M20 9V4h-5m5 0l-6 6" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 15v5h5m-5 0l6-6" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M20 15v5h-5m5 0l-6-6" />
          </svg>
        </div>
        <div class="kpi-card-icon">
          <i class="fas fa-chart-line"></i>
        </div>
        <div class="kpi-card-content">
          <div class="kpi-value">{{ growth_percent_formatted|default:"0.0" }}%</div>
          <div class="kpi-label">REVENUE GROWTH</div>
        </div>
      </div>
    </div>

    <!-- New Customers -->
    <div class="col-12 col-md-4">
      <div class="kpi-card" data-bs-toggle="modal" data-bs-target="#customersModal">
        <div class="expand-btn" title="Expand">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 9V4h5M4 4l6 6" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M20 9V4h-5m5 0l-6 6" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 15v5h5m-5 0l6-6" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M20 15v5h-5m5 0l-6-6" />
          </svg>
        </div>
        <div class="kpi-card-icon">
          <i class="fas fa-user-plus"></i>
        </div>
        <div class="kpi-card-content">
          <div class="kpi-value">{{ new_customers_this_month|default:"0" }}</div>
          <div class="kpi-label">NEW CUSTOMERS</div>
        </div>
      </div>
    </div>

    <!-- Collection Rate -->
    <div class="col-12 col-md-4">
      <div class="kpi-card" data-bs-toggle="modal" data-bs-target="#collectionModal">
        <div class="expand-btn" title="Expand">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 9V4h5M4 4l6 6" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M20 9V4h-5m5 0l-6 6" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 15v5h5m-5 0l6-6" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M20 15v5h-5m5 0l-6-6" />
          </svg>
        </div>
        <div class="kpi-card-icon">
          <i class="fas fa-coins"></i>
        </div>
        <div class="kpi-card-content">
          <div class="kpi-value">{{ collection_rate_formatted|default:"0.0" }}%</div>
          <div class="kpi-label">COLLECTION RATE</div>
        </div>
      </div>
    </div>
  </div>
