{% load static %}
<!-- Dashboard Partial: Hero Banner -->
  <!-- Custom Hero Banner -->
  <div class="custom-hero-banner">
    <!-- Inner Max-Width Wrapper to prevent infinite stretching -->
    <div class="w-100 mx-auto d-flex align-items-center justify-content-between gap-4 gap-lg-5" style="max-width: 1024px;">
      <div class="hero-title-wrapper mb-0">
        <h1 class="hero-title">Welcome Back, {{ request.user.username }}</h1>
        <p class="hero-subtitle mb-2">Here is how your business is performing today</p>
        <div style="opacity: 0.85; font-size: 0.95rem; font-weight: 500; font-family: 'Montserrat', sans-serif;">
          <i class="fas fa-clock me-1"></i> Manila Time: <span id="live-clock-square" style="font-family: 'Courier New', monospace; font-weight: bold; letter-spacing: 1px;">--:--:--</span>
        </div>
      </div>
      
      <!-- Protected Image Container with flex-shrink-0 -->
      <div class="d-none d-md-block flex-shrink-0">
        <img src="{% static 'images/GIMI ICON.gif' %}" alt="GIMI Mascot" style="height: 160px; width: 160px; object-fit: contain; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 50%; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 3px solid rgba(255,255,255,0.2);">
      </div>
    </div>
  </div>
