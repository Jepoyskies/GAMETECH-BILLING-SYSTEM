<!-- Dashboard Partial: Top Clients Modal -->
  <!-- Top Clients Modal -->
  <div class="modal fade premium-modal" id="topClientsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content" style="background: transparent; border: none;">
        <div class="glass-card w-100" style="border-radius: 28px;">
          <div class="modal-header border-bottom-0 pb-3 px-4 pt-4 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
              <div class="modal-icon-wrapper gold-icon">
                <i class="fa-solid fa-crown"></i>
              </div>
              <h4 class="modal-title fw-bold m-0">Top Clients Overview</h4>
            </div>
            <button type="button" class="custom-close-btn" data-bs-dismiss="modal" aria-label="Close">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <div class="modal-body px-4 pb-4 pt-2">
            <div class="d-flex justify-content-center mb-4">
              <div class="btn-group shadow-sm" role="group">
                <input type="radio" class="btn-check top-clients-filter" name="topClientsFilter" id="tcWeek" value="week" autocomplete="off">
                <label class="btn btn-outline-chart-blue px-4 py-2" for="tcWeek">This Week</label>
              
                <input type="radio" class="btn-check top-clients-filter" name="topClientsFilter" id="tcMonth" value="month" autocomplete="off" checked>
                <label class="btn btn-outline-chart-blue px-4 py-2" for="tcMonth">This Month</label>
              
                <input type="radio" class="btn-check top-clients-filter" name="topClientsFilter" id="tcYear" value="year" autocomplete="off">
                <label class="btn btn-outline-chart-blue px-4 py-2" for="tcYear">This Year</label>
              </div>
            </div>
            <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
              <table class="glass-table w-100" id="topClientsTable">
                <thead style="position: sticky; top: 0; background: rgba(255, 255, 255, 0.9); z-index: 1;">
                  <tr>
                    <th class="ps-3" style="font-size: 0.75rem;">Client Name</th>
                    <th style="font-size: 0.75rem;">Plan</th>
                    <th class="text-end pe-3" style="font-size: 0.75rem;">Revenue</th>
                  </tr>
                </thead>
                <tbody id="topClientsTbody">
                  <tr><td colspan="3" class="text-center py-5 text-muted">Loading data...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
