<!-- Dashboard Partial: New Customers Modal -->
  <!-- New Customers Modal -->
  <div class="modal fade" id="customersModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content" style="background: transparent; border: none;">
        <div class="glass-card w-100" style="border-radius: 28px;">
          <div class="modal-header border-bottom-0 pb-3 px-4 pt-4">
            <h4 class="modal-title fw-bold"><i class="fas fa-user-plus me-2 text-primary"></i> New Customers</h4>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-4">
            <div class="table-responsive">
              <table class="glass-table mb-0">
                <thead>
                  <tr>
                    <th class="ps-0">Client</th>
                    <th>Plan</th>
                    <th class="text-end pe-0">Joined Date</th>
                  </tr>
                </thead>
                <tbody>
                  {% for c in new_customers_list %}
                  <tr>
                    <td class="ps-0 fw-bold">{{ c.username }}</td>
                    <td><span class="premium-badge"><span class="glow-dot glow-success"></span> {{ c.plan_name }}</span>
                    </td>
                    <td class="text-end pe-0 text-muted">{{ c.created_at|date:"M d, Y" }}</td>
                  </tr>
                  {% empty %}
                  <tr>
                    <td colspan="3" class="text-center py-4 opacity-50">No new customers this month.</td>
                  </tr>
                  {% endfor %}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
