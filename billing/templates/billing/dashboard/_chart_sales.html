<!-- Dashboard Partial: Sales Overview Chart -->
  <!-- Sales Overview Chart -->
  <div class="glass-card p-4 mt-4 fade-in-up d2" style="border-radius: 20px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h5 class="fw-bold mb-0">Sales Overview</h5>
      <div>
        <div class="btn-group shadow-sm" role="group" aria-label="Sales Overview Filter">
          <input type="radio" class="btn-check sales-toggle" name="salesFilter" id="salesFilter12m" value="12m" autocomplete="off">
          <label class="btn btn-outline-chart-blue btn-sm fw-bold px-3" for="salesFilter12m">12 Months</label>

          <input type="radio" class="btn-check sales-toggle" name="salesFilter" id="salesFilter7d" value="7d" autocomplete="off" checked>
          <label class="btn btn-outline-chart-blue btn-sm fw-bold px-3" for="salesFilter7d">7 Days</label>
        </div>
      </div>
    </div>
    <div style="height: 350px;">
      <canvas id="dashboardSalesChart"></canvas>
    </div>
  </div>
