<!-- Dashboard Partial: Revenue Growth Modal -->
  <!-- Revenue Growth Modal -->

  <div class="modal fade" id="revenueModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
      <div class="modal-content" style="background: transparent; border: none;">
        <div class="glass-card w-100" style="border-radius: 28px;">
          <div class="modal-header border-bottom-0 pb-3 px-4 pt-4">
            <h4 class="modal-title fw-bold"><i class="fas fa-chart-line me-2 text-primary"></i> Revenue Statistics</h4>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-4">
            <div class="row g-4">
              <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <h6 class="fw-bold mb-0 text-muted text-uppercase" id="revenueChartTitle">Revenue (Last 12 Months)
                  </h6>
                  <div class="btn-group btn-group-sm" role="group">
                    <input type="radio" class="btn-check" name="btnrevfilter" id="btnrev12m" autocomplete="off" checked>
                    <label class="btn btn-outline-primary" for="btnrev12m">12 Months</label>

                    <input type="radio" class="btn-check" name="btnrevfilter" id="btnrev7d" autocomplete="off">
                    <label class="btn btn-outline-primary" for="btnrev7d">7 Days</label>
                  </div>
                </div>
                <div style="height: 350px;"><canvas id="revenueMainChart"></canvas></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
