<!-- Dashboard Partial: Collection Rate Modal -->
  <!-- Collection Rate Modal -->
  <div class="modal fade" id="collectionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content" style="background: transparent; border: none;">
        <div class="glass-card w-100" style="border-radius: 28px;">
          <div class="modal-header border-bottom-0 pb-3 px-4 pt-4">
            <h4 class="modal-title fw-bold"><i class="fas fa-coins me-2 text-primary"></i> Collection Statistics</h4>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-4">
            <div class="row g-4 justify-content-center">
              
              <!-- Left Chart: Overall Collection Rate -->
              <div class="col-12 col-md-6">
                <div class="sleek-radial-card">
                  <h6 class="sleek-radial-title">Overall Collection Rate</h6>
                  <div class="sleek-radial-canvas-container">
                    <canvas id="collectionRateChart"></canvas>
                  </div>
                  <div id="collectionRateData" 
                       data-rate="{{ collection_rate_formatted|default:'0' }}" 
                       data-subtitle="{{ distinct_payers_this_month }} of {{ total_customers }} paid"
                       style="display: none;">
                  </div>
                </div>
              </div>

              <!-- Right Chart: By Payment Method -->
              <div class="col-12 col-md-6">
                <div class="sleek-radial-card">
                  <h6 class="sleek-radial-title">By Payment Method</h6>
                  <div class="sleek-radial-canvas-container">
                    <canvas id="salesPieChart"></canvas>
                  </div>
                  <div id="paymentMethodData" 
                       data-title="Totals" 
                       data-subtitle="Breakdown"
                       style="display: none;">
                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
