<script>
// ── Restore filter state from URL ─────────────────────────────────────────────
(function () {
  const p = new URLSearchParams(window.location.search);
  const s = document.getElementById('subs-search');
  const st = document.getElementById('subs-status');
  const cn = document.getElementById('subs-connection');
  if (s && p.get('search'))     s.value = p.get('search');
  if (st && p.get('status'))    st.value = p.get('status');
  if (cn && p.get('connection')) cn.value = p.get('connection');
})();

// ── Data loading ──────────────────────────────────────────────────────────────
let _subsTimer = null;

function buildQS() {
  const q = new URLSearchParams();
  const s  = (document.getElementById('subs-search')?.value || '').trim();
  const st = document.getElementById('subs-status')?.value || '';
  const cn = document.getElementById('subs-connection')?.value || '';
  if (s)  q.set('search', s);
  if (st) q.set('status', st);
  if (cn) q.set('connection', cn);
  return q.toString();
}

function loadSubs(qs) {
  const tableContainer = document.getElementById('async-table-container');
  const kpiContainer = document.getElementById('async-kpi-container');
  if (tableContainer) {
    tableContainer.style.opacity = '0.5';
  }
  fetch('/subscriptions/api/data/' + (qs ? '?' + qs : ''))
    .then(r => { if (!r.ok) throw 0; return r.text(); })
    .then(html => {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');

      const newKpis = doc.getElementById('kpi-data-source');
      if (newKpis && kpiContainer) {
        kpiContainer.innerHTML = newKpis.innerHTML;
      }

      const newCount = doc.getElementById('meta-count-source');
      const countDisplay = document.getElementById('subs-count-display');
      if (newCount && countDisplay) {
        countDisplay.textContent = newCount.textContent;
      }

      const newTable = doc.getElementById('table-data-source');
      if (newTable && tableContainer) {
        tableContainer.innerHTML = newTable.innerHTML;
        tableContainer.style.opacity = '1';
      } else if (document.getElementById('async-data-container')) {
        document.getElementById('async-data-container').innerHTML = html;
      }
      initCheckboxes();
    })
    .catch(() => {
      if (tableContainer) {
        tableContainer.style.opacity = '1';
        tableContainer.innerHTML = `<div class="gt-empty-state py-5 text-center">
          <div class="gt-empty-icon text-danger mx-auto mb-3"><i class="fas fa-exclamation-triangle"></i></div>
          <h6 class="fw-bold mb-1">Error Loading Subscriptions</h6>
          <p class="text-muted small">Please refresh or check server connection.</p>
        </div>`;
      }
    });
}

function onFilterChange() {
  clearTimeout(_subsTimer);
  _subsTimer = setTimeout(() => {
    const qs = buildQS();
    history.replaceState(null, '', qs ? '?' + qs : window.location.pathname);
    // Show/hide reset button
    const hasFilter = !!(document.getElementById('subs-search')?.value || document.getElementById('subs-status')?.value || document.getElementById('subs-connection')?.value);
    document.getElementById('btn-subs-reset')?.classList.toggle('d-none', !hasFilter);
    loadSubs(qs);
  }, 380);
}

// KPI card click filter handler
function subsSetFilter(key, val) {
  const stSelect = document.getElementById('subs-status');
  const cnSelect = document.getElementById('subs-connection');

  if (key === 'status') {
    if (stSelect.value === val) {
      stSelect.value = '';
    } else {
      stSelect.value = val;
    }
  } else if (key === 'connection') {
    if (cnSelect.value === val) {
      cnSelect.value = '';
    } else {
      cnSelect.value = val;
    }
  }
  onFilterChange();
}

document.addEventListener('DOMContentLoaded', () => {
  loadSubs(window.location.search.slice(1));

  document.getElementById('subs-search')?.addEventListener('input', onFilterChange);
  document.getElementById('subs-status')?.addEventListener('change', onFilterChange);
  document.getElementById('subs-connection')?.addEventListener('change', onFilterChange);

  document.getElementById('btn-subs-reset')?.addEventListener('click', () => {
    document.getElementById('subs-search').value = '';
    document.getElementById('subs-status').value = '';
    document.getElementById('subs-connection').value = '';
    document.getElementById('btn-subs-reset').classList.add('d-none');
    history.replaceState(null, '', window.location.pathname);
    loadSubs('');
  });

  // Show reset if filters already active
  const initialParams = new URLSearchParams(window.location.search);
  if (initialParams.get('search') || initialParams.get('status') || initialParams.get('connection')) {
    document.getElementById('btn-subs-reset')?.classList.remove('d-none');
  }
});

// ── Checkboxes ────────────────────────────────────────────────────────────────
function initCheckboxes() {
  const all = document.getElementById('selectAll');
  const bar = document.getElementById('bulk-action-bar');
  const cnt = document.getElementById('selected-count');

  function update() {
    const n = document.querySelectorAll('.customer-checkbox:checked').length;
    cnt.textContent = n;
    bar.classList.toggle('d-none', n === 0);
    if (!n && all) all.checked = false;
  }

  if (all) all.addEventListener('change', () => {
    document.querySelectorAll('.customer-checkbox').forEach(cb => cb.checked = all.checked);
    update();
  });
  document.querySelectorAll('.customer-checkbox').forEach(cb => cb.addEventListener('change', update));
}

function getSelectedIds() {
  return Array.from(document.querySelectorAll('.customer-checkbox:checked')).map(cb => +cb.value);
}

// ── Bulk actions ──────────────────────────────────────────────────────────────
function sendBulkAction(type) {
  const ids = getSelectedIds();
  if (!ids.length) return;
  let payload = { customer_ids: ids }, endpoint = '';
  if (type === 'sms') {
    const msg = document.getElementById('bulkSmsMessage').value;
    if (!msg) return alert('Message cannot be empty.');
    payload.message = msg; endpoint = '/customers/bulk-sms/';
  } else {
    const sub = document.getElementById('bulkEmailSubject').value || 'Important Notice';
    const msg = document.getElementById('bulkEmailMessage').value;
    if (!msg) return alert('Message cannot be empty.');
    payload.subject = sub; payload.message = msg; endpoint = '/customers/bulk-email/';
  }
  fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
    body: JSON.stringify(payload)
  })
  .then(r => r.json())
  .then(d => { if (d.success) { alert(`Sent ${d.sent_count} messages!`); location.reload(); } else alert('Error: ' + d.error); })
  .catch(() => alert('Network error occurred.'));
}

function getCookie(n) {
  let v = null;
  document.cookie.split(';').forEach(c => {
    c = c.trim();
    if (c.startsWith(n + '=')) v = decodeURIComponent(c.slice(n.length + 1));
  });
  return v;
}
</script>
