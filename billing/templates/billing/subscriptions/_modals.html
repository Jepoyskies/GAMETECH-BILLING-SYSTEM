<!-- Bulk Action Bar -->
<div id="bulk-action-bar" class="d-none"
     style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
            background:rgba(15,23,42,0.97);backdrop-filter:blur(12px);
            padding:12px 22px;border-radius:50px;
            box-shadow:0 8px 30px rgba(0,0,0,0.55);z-index:1050;
            border:1px solid rgba(255,255,255,0.1);
            display:flex;align-items:center;gap:14px;">
  <span style="color:#fff;font-weight:700;font-size:0.85rem;">
    <span id="selected-count">0</span> Selected
  </span>
  <div style="width:1px;height:20px;background:rgba(255,255,255,0.2);"></div>
  <button class="btn btn-sm btn-primary rounded-pill px-3" data-bs-toggle="modal" data-bs-target="#bulkSmsModal">
    <i class="fas fa-sms me-1"></i> SMS
  </button>
  <button class="btn btn-sm btn-info rounded-pill px-3" data-bs-toggle="modal" data-bs-target="#bulkEmailModal">
    <i class="fas fa-envelope me-1"></i> Email
  </button>
</div>

<!-- Bulk SMS Modal -->
<div class="modal fade" id="bulkSmsModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:14px;">
      <div class="modal-header border-bottom-0">
        <h5 class="modal-title" style="font-size:1rem;font-weight:700;"><i class="fas fa-sms text-primary me-2"></i>Send Bulk SMS</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <label class="form-label text-muted" style="font-size:0.8rem;font-weight:600;">Message Content</label>
        <textarea id="bulkSmsMessage" class="form-control" rows="4"
                  style="background:var(--surface-subtle);color:var(--text-primary);border:1px solid var(--border-subtle);border-radius:8px;"
                  placeholder="Type your SMS message here..."></textarea>
      </div>
      <div class="modal-footer border-top-0">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary btn-sm" onclick="sendBulkAction('sms')">Send SMS <i class="fas fa-paper-plane ms-1"></i></button>
      </div>
    </div>
  </div>
</div>

<!-- Bulk Email Modal -->
<div class="modal fade" id="bulkEmailModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:14px;">
      <div class="modal-header border-bottom-0">
        <h5 class="modal-title" style="font-size:1rem;font-weight:700;"><i class="fas fa-envelope text-info me-2"></i>Send Bulk Email</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label text-muted" style="font-size:0.8rem;font-weight:600;">Subject</label>
          <input type="text" id="bulkEmailSubject" class="form-control"
                 style="background:var(--surface-subtle);color:var(--text-primary);border:1px solid var(--border-subtle);border-radius:8px;"
                 placeholder="Important Notice">
        </div>
        <div>
          <label class="form-label text-muted" style="font-size:0.8rem;font-weight:600;">Message Content</label>
          <textarea id="bulkEmailMessage" class="form-control" rows="6"
                    style="background:var(--surface-subtle);color:var(--text-primary);border:1px solid var(--border-subtle);border-radius:8px;"
                    placeholder="Type your email message here..."></textarea>
        </div>
      </div>
      <div class="modal-footer border-top-0">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-info btn-sm" onclick="sendBulkAction('email')">Send Email <i class="fas fa-paper-plane ms-1"></i></button>
      </div>
    </div>
  </div>
</div>
