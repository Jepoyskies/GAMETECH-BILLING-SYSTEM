<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   Cignal Play & Box — Premium Design System v3.0
   Font: Inter | Theme: Unconditional Dark Glassmorphism | 2026
   FIXED: Removed all .dark-mode prefix dependencies — all styles are dark by default
   ========================================================================== */

/* ── Scope Inter font ────────────────────────────────────────────── */
.content, .cignal-page-header, .cignal-glass-card, .cignal-stat-card,
.cignal-table, .cignal-tab-btn, .cignal-nav-tabs, .cignal-card-header {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

/* ── Design Tokens ───────────────────────────────────────────────── */
:root {
    --cig-bg:        rgba(15, 23, 42, 0.75);
    --cig-bg-card:   rgba(17, 24, 39, 0.60);
    --cig-border:    rgba(255, 255, 255, 0.07);
    --cig-border-h:  rgba(239, 68, 68, 0.35);
    --cig-red:       #ef4444;
    --cig-red-d:     #f87171;
    --cig-amber:     #f59e0b;
    --cig-amber-d:   #fbbf24;
    --cig-green:     #10b981;
    --cig-green-d:   #34d399;
    --cig-cyan:      #06b6d4;
    --cig-cyan-d:    #38bdf8;
    --cig-text:      #e2e8f0;
    --cig-muted:     #64748b;
    --cig-muted-d:   #475569;
}

/* ── Page Header (unified banner) ────────────────────────────────── */
.cignal-page-header {
    background: linear-gradient(135deg, rgba(30,41,59,0.65) 0%, rgba(15,23,42,0.88) 100%);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--cig-border);
    border-radius: 18px;
    padding: 1.5rem 1.75rem;
    margin-bottom: 1.5rem;
    position: relative;
    overflow: hidden;
}
.cignal-page-header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(239,68,68,0.45), transparent);
}
.cignal-page-header::after {
    content: '';
    position: absolute;
    top: -80px; right: -60px;
    width: 320px; height: 320px;
    background: radial-gradient(circle, rgba(239,68,68,0.07) 0%, transparent 70%);
    pointer-events: none;
}
.cignal-header-icon {
    width: 52px; height: 52px; min-width: 52px;
    background: rgba(239,68,68,0.12);
    border: 1.5px solid rgba(239,68,68,0.28);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; color: #f87171; flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(239,68,68,0.18);
}
.cignal-header-title {
    font-size: 1.45rem; font-weight: 800;
    letter-spacing: -0.025em; color: #f8fafc; line-height: 1.2;
}
.cignal-header-sub { font-size: 0.82rem; color: #64748b; margin-top: 0.2rem; }

/* Live badge */
.cignal-live-badge {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em;
    text-transform: uppercase; color: #34d399;
    background: rgba(16,185,129,0.08);
    border: 1px solid rgba(16,185,129,0.22);
    border-radius: 9999px; padding: 0.3rem 0.85rem;
}
.cignal-live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #4ade80; animation: cigPulse 2.2s infinite;
}
@keyframes cigPulse {
    0%   { box-shadow: 0 0 0 0 rgba(74,222,128,0.8); transform: scale(0.95); }
    60%  { box-shadow: 0 0 0 7px rgba(74,222,128,0);  transform: scale(1.05); }
    100% { box-shadow: 0 0 0 0 rgba(74,222,128,0);   transform: scale(0.95); }
}

/* ── KPI Stat Cards (FIXED: unconditionally dark) ────────────────── */
.cignal-stat-card {
    display: flex; align-items: center; gap: 1rem;
    padding: 1.35rem 1.4rem;
    border-radius: 18px;
    background: rgba(17,24,39,0.65);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--cig-border);
    box-shadow: 0 8px 24px -6px rgba(0,0,0,0.4);
    transition: all 0.28s cubic-bezier(0.34,1.56,0.64,1);
    position: relative; overflow: hidden; cursor: default;
}
.cignal-stat-card::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0;
    height: 2px; opacity: 0; transition: opacity 0.3s ease;
    border-radius: 0 0 18px 18px;
}
.cignal-stat-card:hover::after { opacity: 1; }
.cignal-stat-card:hover {
    transform: translateY(-4px);
    border-color: rgba(255,255,255,0.12);
    box-shadow: 0 16px 40px -8px rgba(0,0,0,0.5);
}
.cignal-stat-card-red::after    { background: linear-gradient(90deg,#ef4444,#f87171); }
.cignal-stat-card-amber::after  { background: linear-gradient(90deg,#f59e0b,#fbbf24); }
.cignal-stat-card-emerald::after{ background: linear-gradient(90deg,#10b981,#34d399); }
.cignal-stat-card-cyan::after   { background: linear-gradient(90deg,#06b6d4,#38bdf8); }
.cignal-stat-card-red:hover     { border-color: rgba(239,68,68,0.25) !important; }
.cignal-stat-card-amber:hover   { border-color: rgba(245,158,11,0.25) !important; }
.cignal-stat-card-emerald:hover { border-color: rgba(16,185,129,0.25) !important; }
.cignal-stat-card-cyan:hover    { border-color: rgba(6,182,212,0.25) !important; }

.cignal-stat-icon {
    width: 52px; height: 52px; min-width: 52px;
    border-radius: 15px; display: flex; align-items: center;
    justify-content: center; font-size: 1.35rem;
    transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
.cignal-stat-card:hover .cignal-stat-icon { transform: scale(1.1) rotate(-5deg); }
.cignal-stat-icon-red     { background: rgba(239,68,68,0.12); color: #f87171; border: 1.5px solid rgba(239,68,68,0.25); }
.cignal-stat-icon-amber   { background: rgba(245,158,11,0.12); color: #fbbf24; border: 1.5px solid rgba(245,158,11,0.25); }
.cignal-stat-icon-emerald { background: rgba(16,185,129,0.12); color: #34d399; border: 1.5px solid rgba(16,185,129,0.25); }
.cignal-stat-icon-cyan    { background: rgba(6,182,212,0.12);  color: #38bdf8; border: 1.5px solid rgba(6,182,212,0.25); }

.cignal-stat-content { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.cignal-stat-value {
    font-size: 2.2rem; font-weight: 900; line-height: 1.05;
    letter-spacing: -0.04em; color: #f8fafc;
}
.cignal-stat-label {
    font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: #475569; margin-top: 0.2rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.trend-up { color: #34d399; font-size: 0.75rem; }

/* 5-card single row on desktop */
@media (min-width: 1200px) {
    .row-cols-xl-5 > * { flex: 0 0 auto; width: 20%; }
    .cignal-stat-card  { padding: 1.1rem 1rem; gap: 0.85rem; }
    .cignal-stat-icon  { width: 46px; height: 46px; min-width: 46px; font-size: 1.2rem; border-radius: 13px; }
    .cignal-stat-value { font-size: 1.8rem; }
    .cignal-stat-label { font-size: 0.65rem; }
}

/* ── Glass Cards (FIXED: unconditionally dark) ───────────────────── */
.cignal-glass-card {
    border-radius: 18px;
    background: rgba(17,24,39,0.60);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--cig-border);
    box-shadow: 0 8px 32px -6px rgba(0,0,0,0.35);
    overflow: hidden;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
}
.cignal-glass-card:hover {
    border-color: rgba(255,255,255,0.1);
    box-shadow: 0 14px 40px -8px rgba(0,0,0,0.45);
}

.cignal-card-header {
    background: rgba(0,0,0,0.22);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    padding: 1rem 1.4rem;
    display: flex; align-items: center; justify-content: space-between;
}
.cignal-card-header h6 {
    font-size: 0.88rem; font-weight: 800; margin: 0;
    display: flex; align-items: center; gap: 0.5rem;
    color: #f1f5f9; letter-spacing: -0.01em;
}
.cignal-card-header .header-icon-danger { color: #f87171; }

/* ── Tables (FIXED: unconditionally dark) ────────────────────────── */
.cignal-table { margin-bottom: 0; width: 100%; border-collapse: separate; border-spacing: 0; }
.cignal-table thead th {
    font-size: 0.68rem; text-transform: uppercase;
    letter-spacing: 0.09em; font-weight: 700;
    padding: 0.85rem 1.1rem; color: #475569;
    background: rgba(15,23,42,0.55);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    white-space: nowrap; font-family: 'Inter', sans-serif;
}
.cignal-table tbody td {
    padding: 0.95rem 1.1rem; vertical-align: middle;
    border-bottom: 1px solid rgba(255,255,255,0.035);
    color: #cbd5e1; background: transparent;
    transition: background 0.12s ease; font-size: 0.84rem;
}
.cignal-table tbody tr:hover td { background: rgba(239,68,68,0.03) !important; }
.cignal-table tbody tr:hover td:first-child { box-shadow: inset 3px 0 0 rgba(239,68,68,0.4); }
.cignal-table tbody tr:last-child td { border-bottom: none; }

/* ── Segmented Navigation Tabs ───────────────────────────────────── */
.cignal-nav-tabs {
    display: flex; gap: 5px; background: transparent;
    padding: 2px 0; border: none; overflow-x: auto; scrollbar-width: none;
}
.cignal-nav-tabs::-webkit-scrollbar { display: none; }
.cignal-tab-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 0.42rem 1rem;
    font-size: 0.79rem; font-weight: 600; border-radius: 9999px;
    text-decoration: none !important; transition: all 0.2s ease;
    white-space: nowrap; cursor: pointer;
    background: rgba(15,23,42,0.65);
    border: 1px solid rgba(255,255,255,0.09);
    color: #64748b;
    font-family: 'Inter', sans-serif;
}
.cignal-tab-btn:hover {
    background: rgba(255,255,255,0.06);
    color: #e2e8f0 !important;
    border-color: rgba(255,255,255,0.18);
    transform: translateY(-1px);
}
.cignal-tab-btn.active {
    background: rgba(239,68,68,0.14) !important;
    color: #ffffff !important;
    border: 1px solid rgba(239,68,68,0.4) !important;
    box-shadow: 0 0 14px rgba(239,68,68,0.25), 0 2px 6px rgba(0,0,0,0.2);
}
.cignal-tab-btn.tab-deleted.active {
    background: rgba(220,38,38,0.2) !important;
    color: #fca5a5 !important;
    border: 1px solid rgba(239,68,68,0.45) !important;
}
.cignal-tab-badge {
    font-size: 0.65rem; padding: 1px 6px;
    border-radius: 9999px; font-weight: 800;
    font-family: 'Inter', sans-serif;
}

/* ── Sub Subscription Cards ──────────────────────────────────────── */
.cignal-sub-card {
    background: rgba(255,255,255,0.025);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 14px; padding: 0.85rem 1rem 0.85rem 1.2rem;
    min-width: 310px; position: relative; overflow: hidden;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.cignal-sub-card:hover {
    border-color: rgba(239,68,68,0.3);
    box-shadow: 0 4px 16px rgba(239,68,68,0.1);
}
.cignal-sub-strip {
    position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: linear-gradient(180deg,#ef4444,#b91c1c);
    border-radius: 14px 0 0 14px;
}

/* ── Chip Components ─────────────────────────────────────────────── */
.cignal-acct-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25);
    border-radius: 8px; padding: 3px 9px; font-size: 0.7rem; font-weight: 700;
    color: #fca5a5; font-family: 'Courier New', monospace; letter-spacing: 0.02em;
    transition: background 0.2s ease;
}
.cignal-acct-chip:hover { background: rgba(239,68,68,0.18); }
.cignal-acct-chip-box { background: rgba(99,102,241,0.1); border-color: rgba(99,102,241,0.25); color: #a5b4fc; }

.cignal-load-badge {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(56,189,248,0.1); border: 1px solid rgba(56,189,248,0.25);
    color: #38bdf8; border-radius: 8px; padding: 3px 9px;
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.02em;
}

/* ── Progress Bars ───────────────────────────────────────────────── */
.cignal-hw-bar-wrap {
    background: rgba(255,255,255,0.07); border-radius: 9999px;
    height: 5px; overflow: hidden; min-width: 72px;
}
.cignal-hw-bar {
    height: 100%; border-radius: 9999px;
    background: linear-gradient(90deg,#10b981,#34d399);
    transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 0 6px rgba(16,185,129,0.4);
}
.cignal-hw-bar-install { background: linear-gradient(90deg,#f59e0b,#fbbf24); box-shadow: 0 0 6px rgba(245,158,11,0.4); }

/* ── Expiry Badges ───────────────────────────────────────────────── */
.cignal-expiry-badge {
    display: inline-flex; align-items: center; gap: 5px;
    border-radius: 8px; padding: 3px 9px; font-size: 0.7rem; font-weight: 700;
}
.cignal-expiry-ok   { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.25); color: #34d399; }
.cignal-expiry-warn { background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.25); color: #fbbf24; }
.cignal-expiry-crit { background: rgba(239,68,68,0.12);  border: 1px solid rgba(239,68,68,0.25);  color: #f87171; }

/* ── Status/Label Badges ─────────────────────────────────────────── */
.cignal-badge-pending {
    background: rgba(245,158,11,0.12) !important; color: #fbbf24 !important;
    border: 1px solid rgba(245,158,11,0.28) !important;
    font-weight: 700; font-size: 0.68rem; padding: 3px 10px;
    border-radius: 9999px; display: inline-flex; align-items: center; gap: 4px;
}
.cignal-badge-addon {
    background: rgba(239,68,68,0.12) !important; color: #f87171 !important;
    border: 1px solid rgba(239,68,68,0.28) !important;
    font-weight: 700; font-size: 0.68rem; padding: 3px 10px;
    border-radius: 9999px; display: inline-flex; align-items: center; gap: 4px;
}
.cignal-badge-neutral {
    background: rgba(100,116,139,0.12) !important; color: #94a3b8 !important;
    border: 1px solid rgba(100,116,139,0.2) !important;
    font-weight: 600; font-size: 0.68rem; padding: 3px 9px; border-radius: 9999px;
}

/* ── Buttons ─────────────────────────────────────────────────────── */
.btn-cignal-primary {
    background: linear-gradient(135deg,#dc2626,#991b1b);
    color: #fff !important; border: none;
    box-shadow: 0 4px 14px rgba(220,38,38,0.35);
    border-radius: 10px; font-weight: 700; font-size: 0.8rem;
    padding: 0.45rem 1rem; transition: all 0.25s ease;
    display: inline-flex; align-items: center; gap: 0.4rem;
    text-decoration: none !important;
}
.btn-cignal-primary:hover {
    background: linear-gradient(135deg,#ef4444,#dc2626);
    box-shadow: 0 6px 22px rgba(220,38,38,0.5);
    transform: translateY(-2px); color: #fff !important;
}
.btn-cignal-glass {
    background: rgba(255,255,255,0.06); color: #94a3b8 !important;
    border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
    font-weight: 600; font-size: 0.79rem; padding: 0.42rem 0.9rem;
    transition: all 0.2s ease; display: inline-flex; align-items: center;
    text-decoration: none !important; gap: 0.4rem;
}
.btn-cignal-glass:hover {
    background: rgba(255,255,255,0.12); color: #f8fafc !important;
    border-color: rgba(255,255,255,0.2); transform: translateY(-1px);
}
.btn-cignal-icon {
    background: rgba(255,255,255,0.05); color: #64748b !important;
    border: 1px solid rgba(255,255,255,0.09); border-radius: 10px;
    padding: 0.38rem 0.65rem; font-size: 0.8rem; transition: all 0.2s ease;
    display: inline-flex; align-items: center; justify-content: center;
    text-decoration: none !important;
}
.btn-cignal-icon:hover {
    background: rgba(255,255,255,0.1); color: #f8fafc !important;
    border-color: rgba(255,255,255,0.18); transform: translateY(-1px);
}
.btn-cignal-details {
    background: rgba(239,68,68,0.08); color: #f87171 !important;
    border: 1px solid rgba(239,68,68,0.25); border-radius: 8px;
    font-size: 0.72rem; font-weight: 600; padding: 0.3rem 0.75rem;
    transition: all 0.2s ease; text-decoration: none !important;
    display: inline-flex; align-items: center; gap: 4px;
}
.btn-cignal-details:hover {
    background: rgba(239,68,68,0.18); border-color: rgba(239,68,68,0.4); color: #fca5a5 !important;
}

/* ── Action Group ────────────────────────────────────────────────── */
.cignal-action-group {
    display: flex; gap: 5px; align-items: center;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 4px 6px;
}

/* ── Search Bar ──────────────────────────────────────────────────── */
.cignal-search-input {
    background: rgba(15,23,42,0.7) !important;
    border: 1px solid rgba(255,255,255,0.09) !important;
    color: #e2e8f0 !important; border-radius: 0 9px 9px 0 !important;
    font-size: 0.82rem !important; font-family: 'Inter', sans-serif !important;
}
.cignal-search-input::placeholder { color: #334155 !important; }
.cignal-search-input:focus {
    border-color: rgba(239,68,68,0.45) !important;
    box-shadow: 0 0 0 3px rgba(239,68,68,0.1) !important; outline: none !important;
}
.cignal-search-addon {
    background: rgba(15,23,42,0.7) !important;
    border: 1px solid rgba(255,255,255,0.09) !important;
    border-right: none !important; color: #334155 !important;
    border-radius: 9px 0 0 9px !important;
}

/* ── Filter Bar ──────────────────────────────────────────────────── */
.cignal-filter-bar {
    background: rgba(17,24,39,0.55);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--cig-border);
    border-radius: 14px; padding: 1.25rem 1.5rem; margin-bottom: 1.5rem;
}
.cignal-filter-input {
    background: rgba(15,23,42,0.7) !important;
    border: 1px solid rgba(255,255,255,0.09) !important;
    color: #e2e8f0 !important; border-radius: 10px !important;
    font-size: 0.84rem !important; font-family: 'Inter', sans-serif !important;
    padding: 0.5rem 0.85rem !important;
}
.cignal-filter-input::placeholder { color: #334155 !important; }
.cignal-filter-input:focus {
    border-color: rgba(239,68,68,0.4) !important;
    box-shadow: 0 0 0 3px rgba(239,68,68,0.08) !important; outline: none !important;
}
.cignal-filter-label {
    font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.07em; color: #475569; margin-bottom: 0.4rem;
    display: block;
}
.btn-cignal-submit {
    background: linear-gradient(135deg,#f59e0b,#d97706);
    color: #fff !important; border: none; border-radius: 10px;
    font-weight: 700; font-size: 0.82rem; padding: 0.5rem 1.2rem;
    transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 0.4rem;
}
.btn-cignal-submit:hover {
    background: linear-gradient(135deg,#fbbf24,#f59e0b);
    box-shadow: 0 4px 14px rgba(245,158,11,0.4); transform: translateY(-1px);
}
.btn-cignal-ghost {
    background: rgba(255,255,255,0.05); color: #64748b !important;
    border: 1px solid rgba(255,255,255,0.09); border-radius: 10px;
    font-size: 0.82rem; font-weight: 600; padding: 0.5rem 1rem;
    transition: all 0.2s ease; display: inline-flex; align-items: center;
    text-decoration: none !important; justify-content: center;
}
.btn-cignal-ghost:hover { background: rgba(255,255,255,0.1); color: #e2e8f0 !important; }

/* ── Empty States ────────────────────────────────────────────────── */
.cignal-empty-state {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 3rem 1.5rem; text-align: center;
}
.cignal-empty-icon {
    font-size: 2rem; opacity: 0.35; margin-bottom: 0.75rem;
}
.cignal-empty-title { font-size: 0.9rem; font-weight: 700; color: #475569; }
.cignal-empty-sub   { font-size: 0.78rem; color: #334155; margin-top: 0.25rem; max-width: 300px; }

/* ── Notification / List Items ───────────────────────────────────── */
.cignal-notif-item {
    border-bottom: 1px solid rgba(255,255,255,0.04);
    padding: 0.9rem 1.4rem; transition: background 0.15s ease;
}
.cignal-notif-item:hover { background: rgba(255,255,255,0.025); }
.cignal-notif-item:last-child { border-bottom: none; }
