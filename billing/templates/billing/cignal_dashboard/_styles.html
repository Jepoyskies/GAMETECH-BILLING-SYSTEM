<!-- Scoped Cignal Play & Box Design System Styles -->
<style>
/* Page-level Section Accent: Crimson / Red */
:root {
  --section-accent: #ef4444;
}

/* Explicit table cell spacing and padding */
#cignalSubscriptionsTable thead th,
.gt-table thead th {
  white-space: nowrap !important;
  text-transform: uppercase !important;
  font-size: 12px !important;
  letter-spacing: 0.05em;
  padding: 0.85rem 1rem !important;
}

#cignalSubscriptionsTable thead th:first-child,
#cignalSubscriptionsTable tbody td:first-child,
.gt-table thead th:first-child,
.gt-table tbody td:first-child {
  padding-left: 1.5rem !important; /* 24px at card edges */
}

#cignalSubscriptionsTable thead th:last-child,
#cignalSubscriptionsTable tbody td:last-child,
.gt-table thead th:last-child,
.gt-table tbody td:last-child {
  padding-right: 1.5rem !important; /* 24px at card edges */
}

#cignalSubscriptionsTable tbody td,
.gt-table tbody td {
  padding-top: 1rem !important; /* 16px vertical */
  padding-bottom: 1rem !important;
}

/* Responsive Stacked Cards on Narrow Screens */
@media (max-width: 768px) {
  #cignalSubscriptionsTable thead,
  .gt-table thead {
    display: none;
  }

  #cignalSubscriptionsTable,
  #cignalSubscriptionsTable tbody,
  .gt-table,
  .gt-table tbody {
    display: block;
    width: 100%;
  }

  #cignalSubscriptionsTable tbody tr,
  .gt-table tbody tr {
    display: block;
    padding: 1.25rem 1.25rem !important;
    border-bottom: 1px solid var(--gt-border-divider);
  }

  #cignalSubscriptionsTable tbody td,
  .gt-table tbody td {
    display: block !important;
    width: 100% !important;
    padding: 0.35rem 0 !important;
    border: none !important;
  }

  #cignalSubscriptionsTable tbody td:first-child,
  .gt-table tbody td:first-child {
    padding-left: 0 !important;
    margin-bottom: 0.25rem;
  }

  #cignalSubscriptionsTable tbody td:last-child,
  .gt-table tbody td:last-child {
    padding-right: 0 !important;
    text-align: left !important;
    margin-top: 0.75rem;
    padding-top: 0.75rem !important;
    border-top: 1px solid var(--gt-border-divider) !important;
  }

  #cignalSubscriptionsTable tbody td:last-child .d-inline-flex,
  .gt-table tbody td:last-child .d-inline-flex {
    justify-content: flex-start !important;
    width: 100%;
  }
}

/* Animations */
.animate-fade-in {
  animation: gtFadeIn 0.3s ease-out both;
}
.animate-delay-1 { animation-delay: 0.08s; }
.animate-delay-2 { animation-delay: 0.16s; }

@keyframes gtFadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
