<style>
/* ==========================================================================
   Cignal Play & Box Dashboard — Premium Dark Glassmorphism v2
   ========================================================================== */

/* ── Hero Banner ─────────────────────────────────────────────────── */
.cignal-hero-banner {
    position: relative; overflow: hidden; border-radius: 24px;
    padding: 2rem 2.25rem; margin-bottom: 1.75rem;
    background: linear-gradient(135deg, #450a0a 0%, #7f1d1d 30%, #b91c1c 70%, #ef4444 100%);
    border: 1px solid rgba(239,68,68,0.4);
    box-shadow: 0 0 0 1px rgba(239,68,68,0.12), 0 24px 48px -8px rgba(185,28,28,0.5), 0 8px 20px -4px rgba(0,0,0,0.3);
}
.cignal-hero-banner::before {
    content: ''; position: absolute; top: -80px; right: -60px;
    width: 420px; height: 420px;
    background: radial-gradient(circle, rgba(252,165,165,0.25) 0%, transparent 65%);
    pointer-events: none; animation: heroOrb1 8s ease-in-out infinite alternate;
}
.cignal-hero-banner::after {
    content: ''; position: absolute; bottom: -100px; left: 10%;
    width: 360px; height: 360px;
    background: radial-gradient(circle, rgba(254,202,202,0.14) 0%, transparent 65%);
    pointer-events: none; animation: heroOrb2 10s ease-in-out infinite alternate;
}
@keyframes heroOrb1 { from { transform: translate(0,0) scale(1); } to { transform: translate(20px,-15px) scale(1.08); } }
@keyframes heroOrb2 { from { transform: translate(0,0) scale(1); } to { transform: translate(-20px,10px) scale(1.06); } }
.cignal-hero-icon {
    width: 62px; height: 62px;
    background: rgba(255,255,255,0.18); border: 1.5px solid rgba(255,255,255,0.3);
    border-radius: 18px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.65rem; color: #fff; flex-shrink: 0;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.25);
    animation: iconFloat 4s ease-in-out infinite;
}
@keyframes iconFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.cignal-hero-title { font-size: 1.65rem; font-weight: 900; letter-spacing: -0.03em; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,0.35); line-height: 1.15; }
.cignal-hero-sub { font-size: 0.9rem; color: rgba(255,255,255,0.82); margin-top: 0.3rem; font-weight: 500; }
.cignal-live-badge {
    background: rgba(255,255,255,0.14); border: 1.5px solid rgba(255,255,255,0.25);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 0.79rem; font-weight: 700; padding: 7px 16px; border-radius: 9999px; color: #fff;
    display: inline-flex; align-items: center; gap: 7px; letter-spacing: 0.02em;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.18);
}
.cignal-live-dot { width: 9px; height: 9px; border-radius: 50%; background: #4ade80; animation: livePulse 2.2s infinite; }
@keyframes livePulse {
    0%   { box-shadow: 0 0 0 0 rgba(74,222,128,0.8); transform: scale(0.95); }
    60%  { box-shadow: 0 0 0 8px rgba(74,222,128,0);  transform: scale(1.05); }
    100% { box-shadow: 0 0 0 0 rgba(74,222,128,0);   transform: scale(0.95); }
}

/* ── KPI Stat Cards ──────────────────────────────────────────────── */
.cignal-stat-card {
    display: flex; align-items: center; gap: 1.1rem;
    padding: 1.4rem 1.5rem; border-radius: 20px; background: #fff;
    border: 1px solid rgba(226,232,240,0.9);
    box-shadow: 0 4px 24px -4px rgba(0,0,0,0.07), 0 1px 4px rgba(0,0,0,0.04);
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
    position: relative; overflow: hidden; cursor: default;
}
.cignal-stat-card::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0;
    height: 3px; opacity: 0; transition: opacity 0.3s ease; border-radius: 0 0 20px 20px;
}
.cignal-stat-card:hover::after { opacity: 1; }
.cignal-stat-card:hover { transform: translateY(-5px) scale(1.01); box-shadow: 0 16px 40px -6px rgba(0,0,0,0.14); }
.dark-mode .cignal-stat-card {
    background: rgba(15,23,42,0.7) !important; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.07) !important;
    box-shadow: 0 8px 32px -6px rgba(0,0,0,0.4), 0 2px 8px rgba(0,0,0,0.2) !important;
}
.dark-mode .cignal-stat-card:hover { border-color: rgba(255,255,255,0.15) !important; box-shadow: 0 20px 50px -8px rgba(0,0,0,0.5) !important; }
.cignal-stat-card-red::after   { background: linear-gradient(90deg,#ef4444,#f87171); }
.cignal-stat-card-amber::after { background: linear-gradient(90deg,#f59e0b,#fbbf24); }
.cignal-stat-card-emerald::after { background: linear-gradient(90deg,#10b981,#34d399); }
.cignal-stat-card-cyan::after  { background: linear-gradient(90deg,#06b6d4,#38bdf8); }
.cignal-stat-card-red:hover    { border-color: rgba(239,68,68,0.3) !important; }
.cignal-stat-card-amber:hover  { border-color: rgba(245,158,11,0.3) !important; }
.cignal-stat-card-emerald:hover{ border-color: rgba(16,185,129,0.3) !important; }
.cignal-stat-card-cyan:hover   { border-color: rgba(6,182,212,0.3) !important; }
.cignal-stat-icon {
    width: 56px; height: 56px; min-width: 56px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center; font-size: 1.4rem;
    transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
.cignal-stat-card:hover .cignal-stat-icon { transform: scale(1.12) rotate(-5deg); }
.cignal-stat-icon-red     { background: linear-gradient(135deg,rgba(239,68,68,0.15),rgba(239,68,68,0.06)); color: #ef4444; border: 1.5px solid rgba(239,68,68,0.25); box-shadow: 0 0 20px rgba(239,68,68,0.2); }
.cignal-stat-icon-amber   { background: linear-gradient(135deg,rgba(245,158,11,0.15),rgba(245,158,11,0.06)); color: #f59e0b; border: 1.5px solid rgba(245,158,11,0.25); box-shadow: 0 0 20px rgba(245,158,11,0.2); }
.cignal-stat-icon-emerald { background: linear-gradient(135deg,rgba(16,185,129,0.15),rgba(16,185,129,0.06)); color: #10b981; border: 1.5px solid rgba(16,185,129,0.25); box-shadow: 0 0 20px rgba(16,185,129,0.2); }
.cignal-stat-icon-cyan    { background: linear-gradient(135deg,rgba(6,182,212,0.15),rgba(6,182,212,0.06)); color: #06b6d4; border: 1.5px solid rgba(6,182,212,0.25); box-shadow: 0 0 20px rgba(6,182,212,0.2); }
.dark-mode .cignal-stat-icon-red    { color: #f87171 !important; }
.dark-mode .cignal-stat-icon-amber  { color: #fbbf24 !important; }
.dark-mode .cignal-stat-icon-emerald{ color: #34d399 !important; }
.dark-mode .cignal-stat-icon-cyan   { color: #38bdf8 !important; }
.cignal-stat-content { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.cignal-stat-value { font-size: 2.4rem; font-weight: 900; line-height: 1.05; letter-spacing: -0.04em; color: #0f172a; }
.dark-mode .cignal-stat-value { color: #f8fafc !important; }
.cignal-stat-label { font-size: 0.73rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #94a3b8; margin-top: 0.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dark-mode .cignal-stat-label { color: #64748b !important; }

/* ── Glass Cards ─────────────────────────────────────────────────── */

    box-shadow: 0 12px 40px -8px rgba(0,0,0,0.5), 0 4px 12px rgba(0,0,0,0.25) !important;

.cignal-card-header {

/* ── Tables ──────────────────────────────────────────────────────── */

.cignal-sub-strip { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: linear-gradient(180deg,#ef4444,#b91c1c); border-radius: 14px 0 0 14px; }

/* Account number chips */
.cignal-acct-chip {

.dark-mode .cignal-acct-chip { background: rgba(239,68,68,0.1) !important; border-color: rgba(239,68,68,0.25) !important; color: #fca5a5 !important; }
.cignal-acct-chip-box { background: rgba(99,102,241,0.08); border-color: rgba(99,102,241,0.22); color: #4338ca; }
.dark-mode .cignal-acct-chip-box { background: rgba(99,102,241,0.12) !important; border-color: rgba(99,102,241,0.28) !important; color: #a5b4fc !important; }

/* Load plan badge */
.cignal-load-badge {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(56,189,248,0.1); border: 1px solid rgba(56,189,248,0.25);

}
.dark-mode .cignal-load-badge { background: rgba(56,189,248,0.12) !important; border-color: rgba(56,189,248,0.3) !important; color: #38bdf8 !important; }

/* Hardware progress bar */
.cignal-hw-bar-wrap { background: rgba(0,0,0,0.07); border-radius: 9999px; height: 5px; overflow: hidden; min-width: 72px; }

.cignal-hw-bar-install { background: linear-gradient(90deg,#f59e0b,#fbbf24); box-shadow: 0 0 6px rgba(245,158,11,0.5); }

/* Expiry badge */

.cignal-expiry-warn { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.25); color: #b45309; }
.cignal-expiry-crit { background: rgba(239,68,68,0.1);  border: 1px solid rgba(239,68,68,0.25);  color: #b91c1c; }
.dark-mode .cignal-expiry-ok   { color: #34d399 !important; }
.dark-mode .cignal-expiry-warn { color: #fbbf24 !important; }
.dark-mode .cignal-expiry-crit { color: #f87171 !important; }

/* ── Badges ──────────────────────────────────────────────────────── */
.cignal-badge-pending { background: rgba(245,158,11,0.1) !important; color: #b45309 !important; border: 1px solid rgba(245,158,11,0.25) !important; font-weight: 700; font-size: 0.71rem; padding: 4px 11px; border-radius: 9999px; display: inline-flex; align-items: center; gap: 4px; }
.dark-mode .cignal-badge-pending { color: #fbbf24 !important; }
.cignal-badge-addon { background: rgba(239,68,68,0.1) !important; color: #b91c1c !important; border: 1px solid rgba(239,68,68,0.25) !important; font-weight: 700; font-size: 0.71rem; padding: 4px 11px; border-radius: 9999px; display: inline-flex; align-items: center; gap: 4px; }
.dark-mode .cignal-badge-addon { color: #f87171 !important; }
.cignal-badge-neutral { background: rgba(148,163,184,0.1) !important; color: #64748b !important; border: 1px solid rgba(148,163,184,0.2) !important; font-weight: 600; font-size: 0.71rem; padding: 3px 9px; border-radius: 9999px; }
.dark-mode .cignal-badge-neutral { color: #94a3b8 !important; }

/* ── Buttons ─────────────────────────────────────────────────────── */
.btn-cignal-glass { background: rgba(0,0,0,0.05); color: #334155 !important; border: 1px solid rgba(0,0,0,0.1); border-radius: 10px; font-weight: 700; font-size: 0.79rem; padding: 5px 13px; transition: all 0.2s ease; display: inline-flex; align-items: center; text-decoration: none !important; }
.btn-cignal-glass:hover { background: rgba(0,0,0,0.1); color: #0f172a !important; transform: translateY(-1px); }

.btn-cignal-icon:hover { background: rgba(0,0,0,0.09); color: #0f172a !important; transform: translateY(-1px); }
.dark-mode .btn-cignal-icon { background: rgba(255,255,255,0.06) !important; color: #94a3b8 !important; border: 1px solid rgba(255,255,255,0.1) !important; }

.btn-cignal-details { background: rgba(239,68,68,0.08); color: #dc2626 !important; border: 1px solid rgba(239,68,68,0.25); border-radius: 8px; font-size: 0.72rem; font-weight: 600; padding: 4px 12px; transition: all 0.2s ease; text-decoration: none !important; display: inline-flex; align-items: center; gap: 4px; }
