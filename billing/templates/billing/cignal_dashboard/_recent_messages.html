<!-- Recent Cignal Messages & Alerts Card -->
<div class="cignal-glass-card mb-4">
    <div class="cignal-card-header">
      <h6><i class="fas fa-bell header-icon-danger"></i> Messages & Alerts</h6>
    </div>
    <div class="list-group list-group-flush" style="max-height: 400px; overflow-y: auto; scrollbar-width: thin;">
        {% for notif in notifications %}
        <div class="cignal-notif-item" style="padding: 0.85rem 1.15rem;">
            <div class="d-flex w-100 justify-content-between align-items-center mb-1">
                <h6 class="mb-0 fw-bold" style="font-size:0.84rem; color:#38bdf8;">
                  <i class="fas fa-info-circle me-1"></i> {{ notif.title }}
                </h6>
                <span class="cignal-notif-id">#{{ notif.id }}</span>
            </div>
            <p class="mb-1 text-muted small" style="white-space: pre-wrap; font-size:0.78rem; line-height: 1.35;">{{ notif.message }}</p>
            {% if notif.link %}
            <div class="text-end">
                <a href="{{ notif.link }}" class="btn-cignal-details gt-btn" style="padding: 2px 10px; font-size: 0.72rem;">
                  <i class="fas fa-external-link-alt me-1"></i> View Details
                </a>
            </div>
            {% endif %}
        </div>
        {% empty %}
        <div class="cignal-empty-state py-3">
            <div class="cignal-empty-icon mb-1"><i class="fas fa-bell-slash text-muted" style="font-size: 1.5rem;"></i></div>
            <div class="cignal-empty-title" style="font-size: 0.95rem;">No Cignal Notifications</div>
            <div class="cignal-empty-sub" style="font-size: 0.8rem;">All clear! Operational notices will stream here.</div>
        </div>
        {% endfor %}
    </div>
</div>
