{% extends "billing/base.html" %}
{% load static %}

{% block title %}Add Subscription Plan{% endblock %}

{% block extra_css %}
</style>
{% endblock %}

{% block content %}
<div class="container-fluid py-3 px-3 px-md-4">
    <div class="form-card">
        <div class="form-page-title">
            <div class="title-icon"><i class="fas fa-plus"></i></div>
            Add Subscription Plan
        </div>

        {% if error %}
        <div class="error-alert"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
        {% endif %}

        <form method="post" autocomplete="off">
            {% csrf_token %}

            <div class="form-section-label"><i class="fas fa-info-circle me-1"></i> Plan Details</div>

            <div class="mb-3">
                <label class="plan-form-label">Plan Name <span class="req">*</span></label>
                <div class="input-icon-wrapper">
                    <i class="fas fa-tag i-icon"></i>
                    <input type="text" name="plan_name" class="plan-form-control" required placeholder="e.g. Basic 10Mbps" value="{{ data.plan_name|default:'' }}">
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-6">
                    <label class="plan-form-label">Upload Speed (Mbps) <span class="req">*</span></label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-arrow-up i-icon"></i>
                        <input type="number" name="speed_up" class="plan-form-control" required min="1" placeholder="e.g. 10" value="{{ data.speed_up|default:'' }}">
                    </div>
                </div>
                <div class="col-6">
                    <label class="plan-form-label">Download Speed (Mbps) <span class="req">*</span></label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-arrow-down i-icon"></i>
                        <input type="number" name="speed_down" class="plan-form-control" required min="1" placeholder="e.g. 10" value="{{ data.speed_down|default:'' }}">
                    </div>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-6">
                    <label class="plan-form-label">Price (&#8369;) <span class="req">*</span></label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-peso-sign i-icon"></i>
                        <input type="number" name="price" class="plan-form-control" required min="0" step="0.01" placeholder="e.g. 999.00" value="{{ data.price|default:'' }}">
                    </div>
                </div>
                <div class="col-6">
                    <label class="plan-form-label">Validity (days) <span class="req">*</span></label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-calendar-days i-icon"></i>
                        <input type="number" name="validity_days" class="plan-form-control" required min="1" placeholder="e.g. 30" value="{{ data.validity_days|default:'' }}">
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <label class="plan-form-label">Description</label>
                <textarea name="description" class="plan-form-control" rows="3" placeholder="Optional description of this plan...">{{ data.description|default:'' }}</textarea>
            </div>

            <div class="d-flex align-items-center justify-content-between gap-2">
                <a href="{% url 'plan_list' %}" class="btn-cancel">Cancel</a>
                <button type="submit" class="btn-submit"><i class="fas fa-save me-2"></i>Add Plan</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
