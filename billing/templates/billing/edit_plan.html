{% extends "billing/base.html" %}
{% load static %}

{% block title %}Edit Subscription Plan{% endblock %}

{% block content %}
<div class="container-fluid py-3 px-3 px-md-4">
    <div class="form-card">
        <div class="form-page-title">
            <div class="title-icon"><i class="fas fa-edit"></i></div>
            <div>
                Edit Plan
                <div style="font-size:0.75rem;font-weight:400;color:#94a3b8;margin-top:2px;">
                    <span class="plan-id-badge">ID #{{ plan.id }}</span>
                    &nbsp;{{ plan.name }}
                </div>
            </div>
        </div>

        {% if error %}
        <div class="error-alert"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
        {% endif %}

        <form method="post" autocomplete="off">
            {% csrf_token %}

            <div class="form-section-label"><i class="fas fa-info-circle me-1"></i> Plan Details</div>

            <div class="mb-3">
                <label class="plan-form-label">Plan Name <span class="req">*</span></label>
                <div class="input-icon-wrapper">
                    <i class="fas fa-tag i-icon"></i>
                    <input type="text" name="plan_name" class="plan-form-control" required placeholder="e.g. Basic 10Mbps" value="{{ plan.name }}">
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-6">
                    <label class="plan-form-label">Upload Speed (Mbps) <span class="req">*</span></label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-arrow-up i-icon"></i>
                        <input type="number" name="speed_up" class="plan-form-control" required min="1" value="{{ plan.speed_up }}">
                    </div>
                </div>
                <div class="col-6">
                    <label class="plan-form-label">Download Speed (Mbps) <span class="req">*</span></label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-arrow-down i-icon"></i>
                        <input type="number" name="speed_down" class="plan-form-control" required min="1" value="{{ plan.speed_down }}">
                    </div>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-6">
                    <label class="plan-form-label">Price (&#8369;) <span class="req">*</span></label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-peso-sign i-icon"></i>
                        <input type="number" name="price" class="plan-form-control" required min="0" step="0.01" value="{{ plan.price }}">
                    </div>
                </div>
                <div class="col-6">
                    <label class="plan-form-label">Validity (days) <span class="req">*</span></label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-calendar-days i-icon"></i>
                        <input type="number" name="validity_days" class="plan-form-control" required min="1" value="{{ plan.validity_days }}">
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <label class="plan-form-label">Description</label>
                <textarea name="description" class="plan-form-control" rows="3" placeholder="Optional description...">{{ plan.description|default:'' }}</textarea>
            </div>

            <div class="d-flex align-items-center justify-content-between gap-2">
                <a href="{% url 'plan_list' %}" class="btn-cancel">Cancel</a>
                <button type="submit" class="btn-submit"><i class="fas fa-save me-2"></i>Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
