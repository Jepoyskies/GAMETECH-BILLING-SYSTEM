<!-- STEP 1: MANDATORY POLICY CHECKLIST -->
<div class="gt-cl-card p-4 mb-4" id="step1-checklist-card" style="border-left: 4px solid #3b82f6;">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <div>
            <h5 class="fw-bold text-white mb-0">
                <i class="fas fa-clipboard-check text-primary me-2"></i> Step 1: Onboarding Policy Checklist
                <span class="badge bg-danger ms-2" id="checklist-mandatory-pill" style="font-size: 0.72rem;">Mandatory for Installation</span>
            </h5>
            <p class="text-muted small mb-0 mt-1">All 6 policy commitments must be explained to and confirmed by the applicant before registration.</p>
        </div>
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-sm btn-outline-info fw-bold" onclick="quickCheckAllPolicies()">
                <i class="fas fa-check-double me-1"></i> Check All 6
            </button>
            <button type="button" class="btn btn-sm btn-outline-danger fw-bold" data-bs-toggle="modal" data-bs-target="#declineWalkinModal">
                <i class="fas fa-times me-1"></i> Applicant Declined
            </button>
        </div>
    </div>

    <div class="row g-2 mb-3">
        <div class="col-md-6">
            <label class="plan-form-label fw-bold small">Verification Method <span class="req">*</span></label>
            <select name="checklist_method" id="checklist_method" class="plan-form-control">
                <option value="in_person" selected>In-Person (Walk-In)</option>
                <option value="phone">Phone Call</option>
            </select>
        </div>
        <div class="col-md-6 d-flex align-items-end">
            <div id="checklist-counter-badge" class="badge bg-secondary p-2 w-100 text-center fw-bold" style="font-size: 0.85rem;">
                <i class="fas fa-tasks me-1"></i> 0 of 6 Policies Verified
            </div>
        </div>
    </div>

    <!-- The 6 Check Items -->
    <div class="row g-3">
        <div class="col-md-6">
            <div class="form-check p-3 border rounded bg-dark border-secondary h-100 policy-check-box">
                <input class="form-check-input ms-0 me-2 policy-item-checkbox" type="checkbox" name="item_free_install" id="item_free_install" value="true">
                <label class="form-check-label text-white small" for="item_free_install" style="cursor: pointer;">
                    <strong class="d-block text-info">Free installation</strong>
                </label>
            </div>
        </div>
        <div class="col-md-6">
            <div class="form-check p-3 border rounded bg-dark border-secondary h-100 policy-check-box">
                <input class="form-check-input ms-0 me-2 policy-item-checkbox" type="checkbox" name="item_specific_plan" id="item_specific_plan" value="true">
                <label class="form-check-label text-white small" for="item_specific_plan" style="cursor: pointer;">
                    <strong class="d-block text-info" id="checklist_plan_display">Their plan: <span id="checklist_plan_name">{% if prospect and prospect.plan %}{{ prospect.plan.name }}{% else %}Select Plan{% endif %}</span> (<span id="checklist_plan_price">{% if prospect and prospect.plan %}₱{{ prospect.plan.price }}{% else %}₱0.00{% endif %}</span>/month)</strong>
                </label>
            </div>
        </div>
        <div class="col-md-6">
            <div class="form-check p-3 border rounded bg-dark border-secondary h-100 policy-check-box">
                <input class="form-check-input ms-0 me-2 policy-item-checkbox" type="checkbox" name="item_no_lockin" id="item_no_lockin" value="true">
                <label class="form-check-label text-white small" for="item_no_lockin" style="cursor: pointer;">
                    <strong class="d-block text-info">No lock-in period</strong>
                </label>
            </div>
        </div>
        <div class="col-md-6">
            <div class="form-check p-3 border rounded bg-dark border-secondary h-100 policy-check-box">
                <input class="form-check-input ms-0 me-2 policy-item-checkbox" type="checkbox" name="item_staggered_lock" id="item_staggered_lock" value="true">
                <label class="form-check-label text-white small" for="item_staggered_lock" style="cursor: pointer;">
                    <strong class="d-block text-info">Staggered payments (3-day, 15-day payments): <span id="checklist_staggered_status">{% if prospect or prefill_agent_id %}Not available for 60 days from your first payment{% else %}Available{% endif %}</span></strong>
                </label>
            </div>
        </div>
        <div class="col-md-6">
            <div class="form-check p-3 border rounded bg-dark border-secondary h-100 policy-check-box">
                <input class="form-check-input ms-0 me-2 policy-item-checkbox" type="checkbox" name="item_same_day_repair" id="item_same_day_repair" value="true">
                <label class="form-check-label text-white small" for="item_same_day_repair" style="cursor: pointer;">
                    <strong class="d-block text-info">Repair within the day</strong>
                </label>
            </div>
        </div>
        <div class="col-md-6">
            <div class="form-check p-3 border rounded bg-dark border-secondary h-100 policy-check-box">
                <input class="form-check-input ms-0 me-2 policy-item-checkbox" type="checkbox" name="item_rebates_24h" id="item_rebates_24h" value="true">
                <label class="form-check-label text-white small" for="item_rebates_24h" style="cursor: pointer;">
                    <strong class="d-block text-info">Rebates within 24 hours</strong>
                </label>
            </div>
        </div>
    </div>

    <div id="override-bypass-notice" class="alert alert-secondary mt-3 mb-0 py-2 px-3 small border-secondary" style="display: none;">
        <i class="fas fa-info-circle text-warning me-1"></i> <strong>Manual Override Active:</strong> Pre-existing installed subscribers skip the onboarding checklist.
    </div>
</div>
