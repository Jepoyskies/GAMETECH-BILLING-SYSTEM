<!-- Gametech Unified Design System Tokens & Components (Light & Dark Mode) -->
<style>
:root {
  /* Spacing Scale */
  --gt-sp-1: 4px;
  --gt-sp-2: 8px;
  --gt-sp-3: 12px;
  --gt-sp-4: 16px;
  --gt-sp-5: 20px;
  --gt-sp-6: 24px;
  --gt-sp-8: 32px;

  /* Radius Scale */
  --gt-radius-card: 16px;
  --gt-radius-btn: 10px;
  --gt-radius-pill: 999px;

  /* Universal Brand & CTA Colors */
  --color-primary: #3533cd;
  --color-primary-hover: #2927a8;

  /* ── LIGHT MODE (Default) ── */
  --surface-page: #F3F5F9;
  --surface-card: #FFFFFF;
  --surface-subtle: #F6F8FB;
  --surface-hover: rgba(15, 23, 42, 0.04);
  --border-subtle: #D5DCE8;
  --border-divider: #E2E8F0;
  --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.06), 0 4px 12px rgba(15, 23, 42, 0.05);

  /* Typography / Text Tokens (Light >= 4.5:1 contrast) */
  --text-primary: #0F172A;
  --text-secondary: #475569;
  --text-muted: #64748B;
  --text-subtle: #94A3B8;

  /* Inputs & Form Controls (Light) */
  --input-bg: #FFFFFF;
  --input-border: #C3CCDB;
  --input-placeholder: #64748B;

  /* Status Badge Tokens (Light bg + text pairs) */
  --badge-success-bg: #D1FAE5;
  --badge-success-text: #047857;
  --badge-warning-bg: #FEF3C7;
  --badge-warning-text: #92400E;
  --badge-danger-bg: #FEE2E2;
  --badge-danger-text: #B91C1C;
  --badge-info-bg: #DBEAFE;
  --badge-info-text: #1D4ED8;
  --badge-neutral-bg: #E2E8F0;
  --badge-neutral-text: #334155;

  /* Section Accents (Light mode: darker text for contrast >= 4.5:1 on white) */
  --section-accent: #2563EB;
  --section-accent-text: #1D4ED8;
  --section-accent-subtle: #DBEAFE;
  --accent-violet: #7C3AED;
  --accent-violet-text: #6D28D9;
  --accent-violet-subtle: #EDE9FE;
  --accent-red: #DC2626;
  --accent-red-text: #B91C1C;
  --accent-red-subtle: #FEE2E2;

  /* Filter Pill Active State */
  --pill-active-bg: color-mix(in srgb, var(--section-accent) 12%, transparent);

  /* Backward Compatibility Aliases */
  --gt-surface-card: var(--surface-card);
  --gt-surface-subtle: var(--surface-subtle);
  --gt-surface-hover: var(--surface-hover);
  --gt-border-card: 1px solid var(--border-subtle);
  --gt-border-divider: 1px solid var(--border-divider);
  --gt-shadow-card: var(--shadow-card);
  --gt-text-title: var(--text-primary);
  --gt-text-body: var(--text-secondary);
  --gt-text-muted: var(--text-muted);
  --gt-text-subtle: var(--text-subtle);
  --gt-input-bg: var(--input-bg);
  --gt-input-border: var(--input-border);

  /* Legacy Status Color Aliases */
  --status-success: var(--badge-success-text);
  --status-warning: var(--badge-warning-text);
  --status-danger: var(--badge-danger-text);
  --status-info: var(--badge-info-text);
  --status-purple: var(--accent-violet);
  --gt-status-success: var(--badge-success-text);
  --gt-status-warning: var(--badge-warning-text);
  --gt-status-danger: var(--badge-danger-text);
  --gt-status-info: var(--badge-info-text);
  --gt-status-purple: var(--accent-violet);
}

/* ── DARK MODE OVERRIDES (Retaining current dark values) ── */
html.dark-mode,
body.dark-mode,
.dark-mode {
  --surface-page: #0a0f1e;
  --surface-card: #1e293b;
  --surface-subtle: #0f172a;
  --surface-hover: rgba(255, 255, 255, 0.06);
  --border-subtle: rgba(255, 255, 255, 0.08);
  --border-divider: rgba(255, 255, 255, 0.07);
  --shadow-card: 0 6px 24px -2px rgba(0, 0, 0, 0.45);

  /* Typography / Text Tokens (Dark) */
  --text-primary: #F8FAFC;
  --text-secondary: #CBD5E1;
  --text-muted: #94A3B8;
  --text-subtle: #64748B;

  /* Inputs & Form Controls (Dark) */
  --input-bg: #0F172A;
  --input-border: rgba(255, 255, 255, 0.15);
  --input-placeholder: #94A3B8;

  /* Status Badge Tokens (Dark: translucent ~15% tint + lighter text) */
  --badge-success-bg: rgba(16, 185, 129, 0.15);
  --badge-success-text: #34D399;
  --badge-warning-bg: rgba(245, 158, 11, 0.15);
  --badge-warning-text: #FBBF24;
  --badge-danger-bg: rgba(239, 68, 68, 0.15);
  --badge-danger-text: #F87171;
  --badge-info-bg: rgba(59, 130, 246, 0.15);
  --badge-info-text: #60A5FA;
  --badge-neutral-bg: rgba(148, 163, 184, 0.15);
  --badge-neutral-text: #CBD5E1;

  /* Section Accents (Dark mode) */
  --section-accent: #3B82F6;
  --section-accent-text: #60A5FA;
  --section-accent-subtle: rgba(59, 130, 246, 0.15);
  --accent-violet: #8B5CF6;
  --accent-violet-text: #A78BFA;
  --accent-violet-subtle: rgba(139, 92, 246, 0.15);
  --accent-red: #EF4444;
  --accent-red-text: #F87171;
  --accent-red-subtle: rgba(239, 68, 68, 0.15);

  /* Filter Pill Active State */
  --pill-active-bg: rgba(59, 130, 246, 0.15);

  /* Backward Compatibility Aliases */
  --gt-surface-card: var(--surface-card);
  --gt-surface-subtle: var(--surface-subtle);
  --gt-surface-hover: var(--surface-hover);
  --gt-border-card: 1px solid var(--border-subtle);
  --gt-border-divider: 1px solid var(--border-divider);
  --gt-shadow-card: var(--shadow-card);
  --gt-text-title: var(--text-primary);
  --gt-text-body: var(--text-secondary);
  --gt-text-muted: var(--text-muted);
  --gt-text-subtle: var(--text-subtle);
  --gt-input-bg: var(--input-bg);
  --gt-input-border: var(--input-border);
  --status-success: var(--badge-success-text);
  --status-warning: var(--badge-warning-text);
  --status-danger: var(--badge-danger-text);
  --status-info: var(--badge-info-text);
  --status-purple: var(--accent-violet);
  --gt-status-success: var(--badge-success-text);
  --gt-status-warning: var(--badge-warning-text);
  --gt-status-danger: var(--badge-danger-text);
  --gt-status-info: var(--badge-info-text);
  --gt-status-purple: var(--accent-violet);
}

/* ── Universal Text Utility Classes ── */
.text-title,
.gt-text-title {
  color: var(--gt-text-title) !important;
}

.text-muted,
.gt-text-muted,
.text-body-secondary {
  color: var(--gt-text-muted) !important;
}

input::placeholder,
textarea::placeholder {
  color: var(--gt-text-subtle) !important;
}

/* ── Inputs & Selects in Light & Dark Mode ── */
.form-control,
.form-select,
.gt-select-filter {
  background-color: var(--gt-input-bg) !important;
  border: 1px solid var(--gt-input-border) !important;
  color: var(--gt-text-title) !important;
  border-radius: var(--gt-radius-btn) !important;
}

.form-control:focus,
.form-select:focus,
.gt-select-filter:focus {
  background-color: var(--gt-input-bg) !important;
  border-color: var(--section-accent) !important;
  color: var(--gt-text-title) !important;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--section-accent) 25%, transparent) !important;
}

.form-select option,
.gt-select-filter option {
  background-color: var(--gt-surface-card) !important;
  color: var(--gt-text-title) !important;
}

/* ============================================================
   SHARED COMPONENT 1: .gt-page-header / .page-header
   ============================================================ */
.page-header,
.gt-page-header {
  background: var(--gt-surface-card) !important;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: var(--gt-border-card) !important;
  border-radius: var(--gt-radius-card);
  box-shadow: var(--gt-shadow-card);
  padding: 1.25rem 1.5rem;
  margin-bottom: var(--gt-sp-5);
  position: relative;
  overflow: hidden;
}

.page-header::before,
.gt-page-header::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--section-accent), transparent);
}

.page-header::after,
.gt-page-header::after {
  content: '';
  position: absolute;
  top: -80px; right: -60px;
  width: 320px; height: 320px;
  background: radial-gradient(circle, var(--section-accent) 0%, transparent 70%);
  opacity: 0.12;
  pointer-events: none;
}

.header-icon,
.gt-header-icon {
  width: 48px;
  height: 48px;
  min-width: 48px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.35rem;
  color: var(--section-accent);
  background: color-mix(in srgb, var(--section-accent) 15%, transparent);
  border: 1px solid color-mix(in srgb, var(--section-accent) 30%, transparent);
  flex-shrink: 0;
}

.header-eyebrow,
.gt-header-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.2rem 0.65rem;
  border-radius: var(--gt-radius-pill);
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--section-accent);
  background: color-mix(in srgb, var(--section-accent) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--section-accent) 25%, transparent);
}

.header-title,
.gt-header-title {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--gt-text-title);
  line-height: 1.25;
  margin-bottom: 0.2rem;
}

.header-sub,
.gt-header-sub {
  font-size: 14px;
  color: var(--gt-text-muted);
  line-height: 1.4;
  margin-bottom: 0;
}

/* ============================================================
   SHARED COMPONENT 2: .gt-kpi-card / .kpi-card
   ============================================================ */
.kpi-card,
.gt-kpi-card {
  background: var(--gt-surface-card) !important;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: var(--gt-border-card) !important;
  border-radius: var(--gt-radius-card);
  box-shadow: var(--gt-shadow-card);
  padding: 1.1rem 1.25rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  text-decoration: none !important;
  color: inherit !important;
  position: relative;
  overflow: hidden;
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}

.kpi-card:hover,
.gt-kpi-card:hover {
  transform: translateY(-2px);
  border-color: color-mix(in srgb, var(--section-accent) 40%, transparent);
  box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.2);
}

.kpi-icon,
.gt-kpi-icon {
  width: 44px;
  height: 44px;
  min-width: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.25rem;
  flex-shrink: 0;
  background: color-mix(in srgb, var(--section-accent) 15%, transparent);
  color: var(--section-accent);
  border: 1px solid color-mix(in srgb, var(--section-accent) 25%, transparent);
}

.kpi-val,
.gt-kpi-val {
  font-size: 24px;
  font-weight: 700;
  color: var(--gt-text-title);
  line-height: 1.15;
  display: flex;
  align-items: center;
  gap: 0.35rem;
}

.kpi-lbl,
.gt-kpi-lbl {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--gt-text-muted);
  margin-top: 0.2rem;
}

/* ============================================================
   SHARED COMPONENT 3: .gt-filter-pill / .filter-pill
   ============================================================ */
.filter-pills-row,
.gt-filter-pills-row {
  display: flex;
  align-items: center;
  gap: var(--gt-sp-3);
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
  padding: 2px 0 6px 0;
  margin-bottom: var(--gt-sp-4);
  flex-wrap: nowrap;
}

.filter-pills-row::-webkit-scrollbar,
.gt-filter-pills-row::-webkit-scrollbar {
  display: none;
}

.filter-pill,
.gt-filter-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  height: 40px;
  padding: 0 1.1rem;
  border-radius: var(--gt-radius-pill);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary) !important;
  background: var(--surface-card) !important;
  border: 1px solid var(--border-subtle) !important;
  text-decoration: none !important;
  white-space: nowrap;
  transition: all 0.2s ease;
  flex-shrink: 0;
}

.filter-pill:hover,
.gt-filter-pill:hover {
  color: var(--text-primary) !important;
  background: var(--surface-hover) !important;
  border-color: color-mix(in srgb, var(--section-accent) 40%, transparent) !important;
}

.filter-pill.active,
.gt-filter-pill.active {
  color: var(--section-accent-text) !important;
  background: var(--pill-active-bg) !important;
  border: 1px solid var(--section-accent) !important;
  font-weight: 600;
  box-shadow: none !important;
}

.filter-pill .pill-count,
.filter-pill .gt-pill-count,
.gt-filter-pill .gt-pill-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  padding: 0.15rem 0.5rem;
  border-radius: var(--gt-radius-pill);
  background: var(--surface-subtle);
  color: var(--text-muted);
  margin-left: 0.25rem;
}

.filter-pill.active .pill-count,
.filter-pill.active .gt-pill-count,
.gt-filter-pill.active .gt-pill-count {
  background: color-mix(in srgb, var(--section-accent) 20%, transparent);
  color: var(--section-accent-text);
}

/* ============================================================
   SHARED COMPONENT 4: .gt-table-card / .table-card & TOOLBAR
   ============================================================ */
.table-card,
.gt-table-card {
  background: var(--gt-surface-card) !important;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: var(--gt-border-card) !important;
  border-radius: var(--gt-radius-card);
  box-shadow: var(--gt-shadow-card);
  overflow: hidden;
  margin-bottom: var(--gt-sp-5);
}

.table-toolbar,
.gt-table-toolbar {
  padding: 1rem 1.5rem;
  border-bottom: var(--gt-border-divider);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--gt-sp-3);
}

.gt-table-toolbar-left {
  display: flex;
  align-items: center;
  gap: var(--gt-sp-3);
  flex-grow: 1;
}

.gt-table-toolbar-right {
  display: flex;
  align-items: center;
  gap: var(--gt-sp-3);
}

/* Standardized Table Typography & Padding */
.gt-table {
  width: 100%;
  margin-bottom: 0;
  border-collapse: collapse;
  color: var(--gt-text-body) !important;
}

.gt-table thead th {
  padding: 0.85rem 1rem;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--gt-text-muted) !important;
  border-bottom: var(--gt-border-divider) !important;
  background: var(--gt-surface-subtle) !important;
  white-space: nowrap;
  vertical-align: middle;
}

.gt-table thead th:first-child,
.gt-table tbody td:first-child {
  padding-left: 1.5rem !important;
}

.gt-table thead th:last-child,
.gt-table tbody td:last-child {
  padding-right: 1.5rem !important;
}

.gt-table tbody td {
  padding: 1rem 1rem;
  font-size: 14px;
  color: var(--gt-text-body) !important;
  border-bottom: var(--gt-border-divider) !important;
  vertical-align: middle;
  background: transparent !important;
}

.gt-table tbody tr {
  background: transparent !important;
  transition: background-color 0.15s ease;
}

.gt-table tbody tr:hover {
  background-color: var(--gt-surface-hover) !important;
}

/* Explicit table styling in Light & Dark Mode */
.gt-table,
html:not(.dark-mode) .gt-table {
  color: #334155 !important;
  --bs-table-bg: transparent !important;
  --bs-table-color: #334155 !important;
}

.dark-mode .gt-table,
html.dark-mode .gt-table {
  color: #cbd5e1 !important;
  --bs-table-bg: transparent !important;
  --bs-table-color: #cbd5e1 !important;
}

.dark-mode .gt-table tbody tr:hover,
html.dark-mode .gt-table tbody tr:hover {
  background-color: rgba(255, 255, 255, 0.04) !important;
}

.gt-table a:not(.btn):not(.gt-btn-primary):not(.gt-btn-secondary):not(.gt-filter-pill):not(.gt-icon-btn) {
  color: var(--gt-text-title) !important;
  text-decoration: none !important;
}
.gt-table a:not(.btn):not(.gt-btn-primary):not(.gt-btn-secondary):not(.gt-filter-pill):not(.gt-icon-btn):hover {
  color: var(--section-accent) !important;
}

/* ============================================================
   SHARED COMPONENT 5: .gt-status-badge / .status-badge
   ============================================================ */
.status-badge,
.gt-status-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.22rem 0.65rem;
  border-radius: var(--gt-radius-pill);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.02em;
  line-height: 1.25;
  white-space: nowrap;
}

.status-dot,
.gt-status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}

.status-badge--success,
.gt-status-badge--success {
  background-color: var(--badge-success-bg) !important;
  color: var(--badge-success-text) !important;
  border: 1px solid color-mix(in srgb, var(--badge-success-text) 25%, transparent) !important;
}
.status-badge--success .status-dot,
.status-badge--success .gt-status-dot,
.gt-status-badge--success .gt-status-dot { background: var(--badge-success-text); }

.status-badge--warning,
.gt-status-badge--warning {
  background-color: var(--badge-warning-bg) !important;
  color: var(--badge-warning-text) !important;
  border: 1px solid color-mix(in srgb, var(--badge-warning-text) 25%, transparent) !important;
}
.status-badge--warning .status-dot,
.status-badge--warning .gt-status-dot,
.gt-status-badge--warning .gt-status-dot { background: var(--badge-warning-text); }

.status-badge--danger,
.gt-status-badge--danger {
  background-color: var(--badge-danger-bg) !important;
  color: var(--badge-danger-text) !important;
  border: 1px solid color-mix(in srgb, var(--badge-danger-text) 25%, transparent) !important;
}
.status-badge--danger .status-dot,
.status-badge--danger .gt-status-dot,
.gt-status-badge--danger .gt-status-dot { background: var(--badge-danger-text); }

.status-badge--info,
.gt-status-badge--info {
  background-color: var(--badge-info-bg) !important;
  color: var(--badge-info-text) !important;
  border: 1px solid color-mix(in srgb, var(--badge-info-text) 25%, transparent) !important;
}
.status-badge--info .status-dot,
.status-badge--info .gt-status-dot,
.gt-status-badge--info .gt-status-dot { background: var(--badge-info-text); }

.status-badge--neutral,
.gt-status-badge--neutral {
  background-color: var(--badge-neutral-bg) !important;
  color: var(--badge-neutral-text) !important;
  border: 1px solid color-mix(in srgb, var(--badge-neutral-text) 25%, transparent) !important;
}
.status-badge--neutral .status-dot,
.status-badge--neutral .gt-status-dot,
.gt-status-badge--neutral .gt-status-dot { background: var(--badge-neutral-text); }

.status-meta,
.gt-status-meta {
  font-size: 12px;
  color: var(--gt-text-muted);
  margin-top: 0.2rem;
  line-height: 1.2;
}

/* ============================================================
   SHARED COMPONENT 6: .gt-icon-btn / .icon-btn & BUTTONS
   ============================================================ */
.icon-btn,
.gt-icon-btn {
  width: 34px;
  height: 34px;
  border-radius: var(--gt-radius-btn);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--gt-surface-subtle);
  border: var(--gt-border-card);
  color: var(--gt-text-muted) !important;
  text-decoration: none !important;
  transition: all 0.15s ease;
  font-size: 0.85rem;
  padding: 0;
  cursor: pointer;
}

.icon-btn:hover,
.gt-icon-btn:hover {
  color: var(--gt-text-title) !important;
  background: var(--gt-surface-hover);
  border-color: rgba(100, 116, 139, 0.3);
}

.dark-mode .icon-btn,
html.dark-mode .icon-btn,
.dark-mode .gt-icon-btn,
html.dark-mode .gt-icon-btn {
  background: rgba(255, 255, 255, 0.05);
  border-color: rgba(255, 255, 255, 0.1);
  color: #94a3b8 !important;
}
.dark-mode .icon-btn:hover,
html.dark-mode .icon-btn:hover,
.dark-mode .gt-icon-btn:hover,
html.dark-mode .gt-icon-btn:hover {
  background: rgba(255, 255, 255, 0.1);
  color: #f8fafc !important;
  border-color: rgba(255, 255, 255, 0.2);
}

.icon-btn--danger:hover,
