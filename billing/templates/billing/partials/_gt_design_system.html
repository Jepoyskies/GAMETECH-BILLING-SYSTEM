<!-- Gametech Unified Design System Tokens & Components -->
<style>
:root {
  /* Spacing Scale */
  --gt-sp-1: 4px;
  --gt-sp-2: 8px;
  --gt-sp-3: 12px;
  --gt-sp-4: 16px;
  --gt-sp-5: 20px;
  --gt-sp-6: 24px;
  --gt-sp-8: 32px;

  /* Radius Scale */
  --gt-radius-card: 16px;
  --gt-radius-btn: 10px;
  --gt-radius-pill: 999px;

  /* Universal Brand & CTA Colors */
  --color-primary: #3533cd;
  --color-primary-hover: #2927a8;
  --section-accent: #3b82f6; /* Default accent (overridden per page/section) */

  /* Light Theme Surfaces & Text (Default) */
  --gt-surface-card: #ffffff;
  --gt-surface-subtle: #f8fafc;
  --gt-surface-hover: rgba(0, 0, 0, 0.03);
  --gt-border-card: 1px solid rgba(0, 0, 0, 0.08);
  --gt-border-divider: 1px solid rgba(0, 0, 0, 0.06);
  --gt-shadow-card: 0 4px 16px -2px rgba(0, 0, 0, 0.06);
  --gt-text-title: #0f172a;
  --gt-text-body: #334155;
  --gt-text-muted: #64748b;
  --gt-text-subtle: #94a3b8;
  --gt-input-bg: #ffffff;
  --gt-input-border: rgba(0, 0, 0, 0.12);

  /* Status Colors */
  --gt-status-success: #10b981;
  --gt-status-warning: #f59e0b;
  --gt-status-danger: #ef4444;
  --gt-status-info: #0ea5e9;
  --gt-status-purple: #8b5cf6;
}

/* Dark Theme Overrides */
html.dark-mode,
body.dark-mode {
  --gt-surface-card: rgba(17, 24, 39, 0.75);
  --gt-surface-subtle: rgba(255, 255, 255, 0.03);
  --gt-surface-hover: rgba(255, 255, 255, 0.04);
  --gt-border-card: 1px solid rgba(255, 255, 255, 0.08);
  --gt-border-divider: 1px solid rgba(255, 255, 255, 0.06);
  --gt-shadow-card: 0 4px 20px -2px rgba(0, 0, 0, 0.35);
  --gt-text-title: #f8fafc;
  --gt-text-body: #e2e8f0;
  --gt-text-muted: #94a3b8;
  --gt-text-subtle: #64748b;
  --gt-input-bg: rgba(15, 23, 42, 0.65);
  --gt-input-border: rgba(255, 255, 255, 0.12);
}

/* ============================================================
   SHARED COMPONENT 1: .gt-page-header
   ============================================================ */
.gt-page-header {

  -webkit-backdrop-filter: blur(14px);
  border: var(--gt-border-card);
  border-radius: var(--gt-radius-card);
  box-shadow: var(--gt-shadow-card);
  padding: 1.25rem 1.5rem;
  margin-bottom: var(--gt-sp-5);
  position: relative;
  overflow: hidden;
}

.gt-page-header::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--section-accent), transparent);
}

.gt-page-header::after {
  content: '';
  position: absolute;
  top: -80px; right: -60px;
  width: 320px; height: 320px;
  background: radial-gradient(circle, var(--section-accent) 0%, transparent 70%);
  opacity: 0.12;
  pointer-events: none;
}

.gt-header-icon {
  width: 48px;
  height: 48px;
  min-width: 48px;
  border-radius: 12px;

  align-items: center;
  justify-content: center;
  font-size: 1.35rem;
  color: var(--section-accent);
  background: color-mix(in srgb, var(--section-accent) 15%, transparent);
  border: 1px solid color-mix(in srgb, var(--section-accent) 30%, transparent);
  flex-shrink: 0;
}

.gt-header-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.2rem 0.65rem;
  border-radius: var(--gt-radius-pill);
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--section-accent);
  background: color-mix(in srgb, var(--section-accent) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--section-accent) 25%, transparent);
}

.gt-header-title {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--gt-text-title);
  line-height: 1.25;
  margin-bottom: 0.2rem;
}

.gt-header-sub {
  font-size: 14px;
  color: var(--gt-text-muted);
  line-height: 1.4;
  margin-bottom: 0;
}

/* ============================================================

   ============================================================ */
.gt-kpi-card {

  border-radius: var(--gt-radius-card);
  box-shadow: var(--gt-shadow-card);
  padding: 1.1rem 1.25rem;

  align-items: center;
  gap: 1rem;
  text-decoration: none !important;
  color: inherit !important;

  overflow: hidden;

}

.gt-kpi-card:hover {
  transform: translateY(-2px);
  border-color: color-mix(in srgb, var(--section-accent) 40%, transparent);
  box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.2);
}

.gt-kpi-icon {
  width: 44px;
  height: 44px;
  min-width: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.25rem;
  flex-shrink: 0;
  background: color-mix(in srgb, var(--section-accent) 15%, transparent);
  color: var(--section-accent);
  border: 1px solid color-mix(in srgb, var(--section-accent) 25%, transparent);
}

.gt-kpi-val {
  font-size: 24px;

  color: var(--gt-text-title);
  line-height: 1.15;
  display: flex;
  align-items: center;

}

.gt-kpi-lbl {
  font-size: 12px;
  font-weight: 600;

  letter-spacing: 0.05em;

}

/* ============================================================
   SHARED COMPONENT 3: .gt-filter-pill
   ============================================================ */
.gt-filter-pills-row {
  display: flex;
  align-items: center;
  gap: var(--gt-sp-3);
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;

  margin-bottom: var(--gt-sp-4);
  flex-wrap: nowrap;
}

.gt-filter-pills-row::-webkit-scrollbar {
  display: none;
}

.gt-filter-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  height: 36px;
  padding: 0 1rem;
  border-radius: var(--gt-radius-pill);
  font-size: 13px;
  font-weight: 500;
  color: var(--gt-text-muted);
  background: var(--gt-surface-card);
  border: var(--gt-border-card);
  text-decoration: none !important;
  white-space: nowrap;
  transition: all 0.2s ease;
  flex-shrink: 0;
}

.gt-filter-pill:hover {
  color: var(--gt-text-title);
  background: var(--gt-surface-hover);
  border-color: color-mix(in srgb, var(--section-accent) 30%, transparent);
}

.gt-filter-pill.active {
  color: #ffffff !important;
  background: var(--section-accent) !important;
  border-color: var(--section-accent) !important;
  font-weight: 600;
  box-shadow: 0 2px 10px -1px color-mix(in srgb, var(--section-accent) 50%, transparent);
}

.gt-filter-pill .gt-pill-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  padding: 0.1rem 0.45rem;
  border-radius: var(--gt-radius-pill);
  background: var(--gt-surface-subtle);
  color: var(--gt-text-muted);
  margin-left: 0.2rem;
}

.gt-filter-pill.active .gt-pill-count {
  background: rgba(255, 255, 255, 0.25);
  color: #ffffff;
}

/* ============================================================
   SHARED COMPONENT 4: .gt-table-card & TOOLBAR
   ============================================================ */
.gt-table-card {
  background: var(--gt-surface-card);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: var(--gt-border-card);
  border-radius: var(--gt-radius-card);
  box-shadow: var(--gt-shadow-card);
  overflow: hidden;
  margin-bottom: var(--gt-sp-5);
}

.gt-table-toolbar {
  padding: 1rem 1.5rem;
  border-bottom: var(--gt-border-divider);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--gt-sp-3);
}

.gt-table-toolbar-left {
  display: flex;
  align-items: center;
  gap: var(--gt-sp-3);
  flex-grow: 1;
}

.gt-table-toolbar-right {
  display: flex;
  align-items: center;
  gap: var(--gt-sp-3);
}

/* Standardized Table Typography & Padding */
.gt-table {
  width: 100%;
  margin-bottom: 0;
  border-collapse: collapse;
}

.gt-table thead th {
  padding: 0.85rem 1rem;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--gt-text-subtle);
  border-bottom: var(--gt-border-divider);
  background: var(--gt-surface-subtle);
  white-space: nowrap;
  vertical-align: middle;
}

.gt-table thead th:first-child,
.gt-table tbody td:first-child {
  padding-left: 1.5rem;
}

.gt-table thead th:last-child,
.gt-table tbody td:last-child {
  padding-right: 1.5rem;
}

.gt-table tbody td {
  padding: 1rem 1rem; /* 16px vertical padding */
  font-size: 14px;
  color: var(--gt-text-body);
  border-bottom: var(--gt-border-divider);
  vertical-align: middle;
}

.gt-table tbody tr {
  transition: background-color 0.15s ease;
}

.gt-table tbody tr:hover {
  background-color: var(--gt-surface-hover) !important;
}

/* ============================================================
   SHARED COMPONENT 5: .gt-status-badge
   ============================================================ */
.gt-status-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.22rem 0.65rem;
  border-radius: var(--gt-radius-pill);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.02em;
  line-height: 1.25;
  white-space: nowrap;
}

.gt-status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}

.gt-status-badge--success {
  background: rgba(16, 185, 129, 0.12);
  color: var(--gt-status-success);
  border: 1px solid rgba(16, 185, 129, 0.25);
}
.gt-status-badge--success .gt-status-dot { background: var(--gt-status-success); box-shadow: 0 0 6px var(--gt-status-success); }

.gt-status-badge--warning {
  background: rgba(245, 158, 11, 0.12);
  color: var(--gt-status-warning);
  border: 1px solid rgba(245, 158, 11, 0.25);
}
.gt-status-badge--warning .gt-status-dot { background: var(--gt-status-warning); }

.gt-status-badge--danger {
  background: rgba(239, 68, 68, 0.12);
  color: var(--gt-status-danger);
  border: 1px solid rgba(239, 68, 68, 0.25);
}
.gt-status-badge--danger .gt-status-dot { background: var(--gt-status-danger); }

.gt-status-badge--info {
  background: rgba(14, 165, 233, 0.12);
  color: var(--gt-status-info);
  border: 1px solid rgba(14, 165, 233, 0.25);
}
.gt-status-badge--info .gt-status-dot { background: var(--gt-status-info); }

.gt-status-badge--neutral {
  background: rgba(100, 116, 139, 0.12);
  color: var(--gt-text-muted);
  border: 1px solid rgba(100, 116, 139, 0.25);
}
.gt-status-badge--neutral .gt-status-dot { background: var(--gt-text-muted); }

.gt-status-meta {
  font-size: 12px;
  color: var(--gt-text-muted);
  margin-top: 0.2rem;
  line-height: 1.2;
}

/* ============================================================
   SHARED COMPONENT 6: .gt-icon-btn & BUTTONS
   ============================================================ */
.gt-icon-btn {
  width: 34px;
  height: 34px;
  border-radius: var(--gt-radius-btn);
  display: inline-flex;
  align-items: center;
  justify-content: center;

  font-size: 0.85rem;

}

.gt-icon-btn:hover {

}

.gt-btn-primary {

  color: #ffffff !important;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: var(--gt-radius-btn);
  padding: 0.5rem 1rem;
  font-size: 14px;
  font-weight: 600;
  text-decoration: none !important;

.gt-btn-primary:hover {

}

/* Neutral Outline / Secondary Button */
.gt-btn-secondary {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  background: var(--gt-surface-card);
  color: var(--gt-text-title) !important;
  border: var(--gt-border-card);
  border-radius: var(--gt-radius-btn);
  padding: 0.5rem 0.95rem;
  font-size: 14px;
  font-weight: 500;
  text-decoration: none !important;
  transition: all 0.2s ease;
  white-space: nowrap;
  cursor: pointer;
}

.gt-btn-secondary:hover {
  background: var(--gt-surface-hover);
  border-color: rgba(255, 255, 255, 0.18);
}

/* Standardized Dropdown Menu */
.gt-dropdown-menu {
  background: var(--gt-surface-card) !important;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: var(--gt-border-card) !important;
  border-radius: 12px !important;
  box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.35) !important;
  padding: 0.35rem !important;
}

.gt-dropdown-menu .dropdown-item {

.gt-dropdown-menu .dropdown-item.text-danger:hover {

}
