{% extends "billing/base.html" %}
{% load static %}

{% block title %}Settings{% endblock %}

{% block content %}
<div class="container-fluid py-5 text-center">
    <div style="max-width:500px; margin:0 auto; padding:50px 20px; background:#fff; border-radius:20px; box-shadow:0 4px 24px rgba(0,0,0,0.06);" class="dark-mode-card">
        <div style="font-size:4rem; color:#38bdf8; margin-bottom:20px;">
            <i class="fa-solid fa-cogs"></i>
        </div>
        <h2 style="font-weight:700; color:#1e293b;" class="dark-mode-text">System Settings</h2>
        <p style="color:#64748b;" class="dark-mode-text-muted">This module is currently under construction and will be deployed in a future sprint.</p>
        <a href="{% url 'dashboard' %}" class="btn mt-3" style="background:linear-gradient(135deg,#2151A1,#38bdf8); color:#fff; border-radius:12px; font-weight:600; padding:10px 20px;">Return to Dashboard</a>
    </div>
</div>
<style>
.dark-mode .dark-mode-card { background:#1e293b !important; box-shadow:0 4px 24px rgba(0,0,0,0.3) !important; }
.dark-mode .dark-mode-text { color:#f1f5f9 !important; }
.dark-mode .dark-mode-text-muted { color:#94a3b8 !important; }
</style>
{% endblock %}
