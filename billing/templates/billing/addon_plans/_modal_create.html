<!-- Create Add-on Plan Modal -->
<div class="modal fade" id="createAddonPlanModal" tabindex="-1" role="dialog" aria-labelledby="createAddonPlanModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered gt-modal-scroll">
    <div class="modal-content gt-modal-card">
      <div class="modal-header">
        <div class="d-flex align-items-center gap-3">
          <div class="gt-modal-icon"><i class="fas fa-plus-circle"></i></div>
          <h5 class="modal-title" id="createAddonPlanModalLabel">Add New Add-on Package</h5>
        </div>
        <button type="button" class="gt-icon-btn" data-bs-dismiss="modal" aria-label="Close"><i class="fas fa-times"></i></button>
      </div>
      <form action="{% url 'create_addon_plan' %}" method="post">
        {% csrf_token %}
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="newPlanName">Plan Name</label>
            <input type="text" class="form-control" id="newPlanName" name="name" placeholder="e.g. Cignal Play Premium 30-Day" required autofocus>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-6">
              <label class="form-label" for="newPlanType">Service Type</label>
              <select name="addon_type" id="newPlanType" class="form-select" required>
                <option value="Cignal Play" selected>Cignal Play</option>
                <option value="Cignal Box">Cignal Box</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label" for="newPlanDuration">Duration (Days)</label>
              <input type="number" class="form-control" id="newPlanDuration" name="duration_days" value="30" min="1" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="newPlanPrice">Price</label>
            <div class="input-group">
              <span class="input-group-text">₱</span>
              <input type="number" step="0.01" min="0" class="form-control" id="newPlanPrice" name="price" placeholder="150.00" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="newPlanDesc">Description <span class="gt-optional-tag">Optional</span></label>
            <textarea class="form-control" id="newPlanDesc" name="description" rows="3" placeholder="Optional details, channel count, or tier information..."></textarea>
          </div>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" name="is_active" id="newPlanActiveSwitch" checked>
            <label class="form-check-label fw-semibold" for="newPlanActiveSwitch">Active and Available for Customers</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="gt-btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="gt-btn-primary">
            <i class="fas fa-check-circle me-1"></i> Create Plan
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
