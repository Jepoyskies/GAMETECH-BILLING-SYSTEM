<!-- SMS Edit Modal -->
<div class="modal fade" id="editSmsModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form id="editSmsForm" method="post" action="{% url 'sms_messaging' %}">
      {% csrf_token %}
      <div class="modal-content gt-modal-card">
        <div class="modal-header border-0 pb-0 mt-3 mx-3">
          <h5 class="modal-title fw-bold" style="color: var(--text-primary);"><i class="fa fa-paper-plane text-primary me-2"></i> Edit and Send SMS</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body px-4 py-4">
          <input type="hidden" name="phone" id="smsPhone">
          
          <div class="mb-3">
            <label class="form-label text-muted fw-semibold small text-uppercase">To:</label>
            <div id="smsPhoneDisplay" class="form-control fw-bold" style="background: var(--surface-subtle); color: var(--text-primary); border: 1px solid var(--border-subtle);"></div>
          </div>

          <div class="mb-3">
            <label class="form-label text-muted fw-semibold small text-uppercase">Templates</label>
            <select id="smsTemplates" class="form-select" style="background: var(--surface-subtle); color: var(--text-primary); border: 1px solid var(--border-subtle);">
              <option value="">-- Choose a template --</option>
              <option value="Hello {name}! Kindly renew your subscription. Thank you!">Default Renewal</option>
              <option value="Dear {name}, please renew your account to continue services.">Polite Notice</option>
              <option value="Hi {name}, renew now to avoid interruption.">Short Notice</option>
            </select>
          </div>
          
          <div class="mb-3">
            <label class="form-label text-muted fw-semibold small text-uppercase">Message</label>
            <textarea class="form-control" name="message" id="smsMessage" rows="4" required style="background: var(--surface-card); color: var(--text-primary); border: 1px solid var(--border-subtle);"></textarea>
            <div class="d-flex justify-content-between mt-2">
              <span id="smsCharCount" class="sms-counter"><i class="fas fa-pencil-alt me-1"></i> 0/160</span>
              <span id="smsCharWarning" class="sms-counter warn d-none"><i class="fa fa-exclamation-triangle"></i> Over 160 chars!</span>
            </div>
          </div>
          
          <div class="mb-2">
            <label class="form-label text-muted fw-semibold small text-uppercase">Preview</label>
            <div class="sms-preview" id="smsPreview"></div>
          </div>
        </div>
        <div class="modal-footer border-0 px-4 pb-4">
          <button type="button" class="gt-btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" name="send_sms_custom" class="gt-btn-primary"><i class="fa fa-paper-plane me-1"></i> Send SMS</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Bulk SMS Modal -->
<div class="modal fade" id="bulkSmsModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form id="bulkSmsForm" method="post" action="{% url 'sms_messaging' %}">
      {% csrf_token %}
      <div class="modal-content gt-modal-card">
        <div class="modal-header border-0 pb-0 mt-3 mx-3">
          <h5 class="modal-title fw-bold" style="color: var(--text-primary);"><i class="fa fa-paper-plane text-success me-2"></i> Send Bulk SMS</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body px-4 py-4">
          <input type="hidden" name="selected_phones" id="bulkModalPhones">
          
          <div class="mb-3">
            <label class="form-label text-muted fw-semibold small text-uppercase">Recipients:</label>
            <div id="bulkPhoneCountDisplay" class="form-control fw-bold" style="background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.25);"></div>
          </div>

          <div class="mb-3">
            <label class="form-label text-muted fw-semibold small text-uppercase">Templates</label>
            <select id="bulkSmsTemplates" class="form-select" style="background: var(--surface-subtle); color: var(--text-primary); border: 1px solid var(--border-subtle);">
              <option value="">-- Choose a template --</option>
              <option value="Hello! Kindly renew your subscription. Thank you!">Default Renewal</option>
              <option value="Dear customer, please renew your account to continue services.">Polite Notice</option>
              <option value="Hi, renew now to avoid interruption.">Short Notice</option>
              <option value="Network maintenance will occur tonight from 12AM-2AM. We apologize for the inconvenience.">System Maintenance</option>
            </select>
          </div>
          
          <div class="mb-3">
            <label class="form-label text-muted fw-semibold small text-uppercase">Message</label>
            <textarea class="form-control" name="bulk_message" id="bulkSmsMessage" rows="4" required style="background: var(--surface-card); color: var(--text-primary); border: 1px solid var(--border-subtle);"></textarea>
            <div class="d-flex justify-content-between mt-2">
              <span id="bulkSmsCharCount" class="sms-counter"><i class="fas fa-pencil-alt me-1"></i> 0/160</span>
              <span id="bulkSmsCharWarning" class="sms-counter warn d-none"><i class="fa fa-exclamation-triangle"></i> Over 160 chars!</span>
            </div>
          </div>
          
          <div class="mb-2">
            <label class="form-label text-muted fw-semibold small text-uppercase">Preview</label>
            <div class="sms-preview" id="bulkSmsPreview"></div>
          </div>
        </div>
        <div class="modal-footer border-0 px-4 pb-4">
          <button type="button" class="gt-btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" name="bulk_send_sms" class="gt-btn-primary" style="background: #10b981; border-color: #10b981;"><i class="fa fa-paper-plane me-1"></i> Confirm &amp; Send Bulk</button>
        </div>
      </div>
    </form>
  </div>
</div>
