<!-- Base Partial: Scripts -->
<!-- Layout scripts (put at end for better performance) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
    const sidebar = document.getElementById('sidebar');
    const openSidebarBtn = document.getElementById('openSidebar');
    const closeSidebarBtn = document.getElementById('closeSidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    const sidebarToggle = document.getElementById('sidebar-toggle');
    const mainContent = document.getElementById('mainContent');

    // Restore state
    let collapsed = localStorage.getItem('sidebarCollapsed') === 'true';
    if (sidebarToggle) sidebarToggle.checked = !collapsed;
    if (collapsed && window.innerWidth >= 992) {
        sidebar.classList.add('collapsed');
        if (mainContent) mainContent.classList.add('full');
    }

    function openSidebar() {
        sidebar.classList.add('open');
        sidebar.classList.remove('collapsed');
        mainContent.classList.remove('full');
        if (window.innerWidth < 992) {
            sidebarOverlay.classList.add('active');
        }
        if (window.innerWidth >= 992) {
            if (sidebarToggle) sidebarToggle.checked = true;
        }
    }

    function closeSidebar() {
        sidebar.classList.remove('open');
        sidebar.classList.remove('collapsed');
        if (window.innerWidth < 992) {
            sidebarOverlay.classList.remove('active');
        } else {
            mainContent.classList.add('full');
        }
        if (window.innerWidth >= 992) {
            if (sidebarToggle) sidebarToggle.checked = false;
        }
    }

    function hideSidebar() {
        if (window.innerWidth >= 992) {
            sidebar.classList.add('collapsed');
            sidebar.classList.remove('open');
            mainContent.classList.add('full');
            if (sidebarToggle) sidebarToggle.checked = false;
            localStorage.setItem('sidebarCollapsed', 'true');
        }
    }

    function showSidebar() {
        if (window.innerWidth >= 992) {
            sidebar.classList.remove('collapsed');
            mainContent.classList.remove('full');
            if (sidebarToggle) sidebarToggle.checked = true;
            localStorage.setItem('sidebarCollapsed', 'false');
        }
    }

    if (openSidebarBtn) openSidebarBtn.addEventListener('click', openSidebar);
    if (closeSidebarBtn) closeSidebarBtn.addEventListener('click', closeSidebar);
    if (sidebarOverlay) sidebarOverlay.addEventListener('click', closeSidebar);
    if (sidebarToggle) {
        sidebarToggle.addEventListener('change', function() {
            if (this.checked) {
                showSidebar();
            } else {
                hideSidebar();
            }
        });
    }

    // Expand sidebar if dropdown clicked while collapsed
    const dropdownToggles = document.querySelectorAll('.dropdown-toggle');
    dropdownToggles.forEach(toggle => {
        toggle.addEventListener('click', function(e) {
            if (sidebar.classList.contains('collapsed')) {
                showSidebar();
            }
        });
    });
    });

    // =============================================
    // GAMER THEME TOGGLE — v2.0
    // =============================================
    const gtToggleBtn = document.getElementById('gt-theme-toggle');
    const themeIcon   = document.getElementById('themeIcon');
    const themeLabel  = document.getElementById('themeLabel');
    const gtScanline  = document.getElementById('gt-scanline');
    const htmlEl      = document.documentElement;

    // 8-bit click sound via Web Audio API
    function playGamerClick(isDark) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            // Dark mode: low-pitched bwoop. Light mode: high-pitched ping.
            osc.type = 'square';
            osc.frequency.setValueAtTime(isDark ? 180 : 880, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(isDark ? 80 : 440, ctx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.15);
        } catch(e) { /* audio not supported, silently skip */ }
    }

    // Scanline flash animation
    function triggerScanline() {
        if (!gtScanline) return;
        gtScanline.classList.remove('flash');
        void gtScanline.offsetWidth; // reflow to restart animation
        gtScanline.classList.add('flash');
        gtScanline.addEventListener('animationend', () => gtScanline.classList.remove('flash'), { once: true });
    }

    function updateThemeUI() {
        const isDark = htmlEl.classList.contains('dark-mode');
        if (isDark) {
            themeIcon.className = 'fas fa-gamepad gt-toggle-icon';
            if (themeLabel) themeLabel.textContent = 'DARK';
        } else {
            themeIcon.className = 'fas fa-sun gt-toggle-icon';
            if (themeLabel) themeLabel.textContent = 'LIGHT';
        }
    }

    if (gtToggleBtn) {
        updateThemeUI();

        gtToggleBtn.addEventListener('click', () => {
            triggerScanline();
            // Small delay so the scanline starts before the color swap
            setTimeout(() => {
                htmlEl.classList.toggle('dark-mode');
                const isDark = htmlEl.classList.contains('dark-mode');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                updateThemeUI();
                playGamerClick(isDark);
                // Dispatch so charts/live monitoring can re-render
                window.dispatchEvent(new Event('themeChanged'));
            }, 80);
        });
    }

    // Global DataTables Placeholder & Icon Injector
    document.addEventListener("DOMContentLoaded", function() {
        const observer = new MutationObserver(function() {
            // Safely remove text node from labels so the input stays visible
            document.querySelectorAll('.dataTables_filter label').forEach(label => {
                Array.from(label.childNodes).forEach(node => {
                    if (node.nodeType === Node.TEXT_NODE && node.textContent.trim() !== '') {
                        node.textContent = '';
                    }
                });
            });
            document.querySelectorAll('.dataTables_length label').forEach(label => {
                Array.from(label.childNodes).forEach(node => {
                    if (node.nodeType === Node.TEXT_NODE && node.textContent.trim() !== '') {
                        node.textContent = '';
                    }
                });
            });

            const dtInputs = document.querySelectorAll('.dataTables_filter input:not([placeholder])');
            dtInputs.forEach(input => {
                input.setAttribute('placeholder', 'Search records...');
                input.classList.add('dt-premium-search');
            });
            const dtSelects = document.querySelectorAll('.dataTables_length select:not(.dt-premium-select)');
            dtSelects.forEach(select => {
                select.classList.add('dt-premium-select');
                // Replace default text if possible
                Array.from(select.options).forEach(opt => {
                    if (!opt.text.includes('per page')) {
                        opt.text = opt.value + ' per page';
                    }
                });
            });
        });
        observer.observe(document.body, { childList: true, subtree: true });
        
        // Convert Django Messages to Floating Toasts
        const toastContainer = document.createElement('div');
        toastContainer.id = 'toast-container';
        toastContainer.style.cssText = 'position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; max-width: 450px;';
        document.body.appendChild(toastContainer);
        
        // Grab alerts that look like messages (usually have 'fa-check-circle' or are direct children of the main container)
        document.querySelectorAll('.content-wrapper .alert').forEach(alert => {
            // Avoid moving static alerts like form errors inside forms
            if(alert.closest('form')) return;
            
            toastContainer.appendChild(alert);
            alert.style.animation = 'slideInRight 0.3s ease-out forwards';
            alert.style.cursor = 'pointer';
            alert.title = "Click to dismiss";
            alert.style.boxShadow = '0 10px 15px -3px rgba(0,0,0,0.2)';
            
            // Auto dismiss after 5 seconds
            setTimeout(() => {
                alert.style.opacity = '0';
                alert.style.transition = 'opacity 0.5s';
                setTimeout(() => alert.remove(), 500);
            }, 5000);
            
            // Click to dismiss
            alert.addEventListener('click', () => alert.remove());
        });
    });
</script>
<style>
@keyframes slideInRight {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
    
    // Online sessions JS (Staff & Customers)
    let currentOnlineTab = 'staff';
    let cachedOnlineData = { staff: [], customers: [] };

    function switchOnlineTab(tab, event) {
        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }
        currentOnlineTab = tab;
        const btnStaff = document.getElementById('tabBtnStaff');
        const btnCust = document.getElementById('tabBtnCustomer');
        if (btnStaff && btnCust) {
            if (tab === 'staff') {
                btnStaff.style.background = '#059669';
                btnStaff.style.color = '#ffffff';
                btnStaff.style.boxShadow = '0 2px 6px rgba(0,0,0,0.25)';
                btnCust.style.background = 'transparent';
                btnCust.style.color = 'rgba(255,255,255,0.75)';
                btnCust.style.boxShadow = 'none';
            } else {
                btnCust.style.background = '#059669';
                btnCust.style.color = '#ffffff';
                btnCust.style.boxShadow = '0 2px 6px rgba(0,0,0,0.25)';
                btnStaff.style.background = 'transparent';
                btnStaff.style.color = 'rgba(255,255,255,0.75)';
                btnStaff.style.boxShadow = 'none';
            }
        }
        renderOnlineList();
    }

    function renderOnlineList() {
        const list = document.getElementById('onlineStaffList');
        if (!list) return;

        const colors = ['#059669','#2563eb','#7c3aed','#dc2626','#ea580c','#0891b2'];

        if (currentOnlineTab === 'staff') {
            const staff = cachedOnlineData.staff || [];
            if (staff.length > 0) {
                let html = '<div class="p-2 d-flex flex-column gap-2">';
                staff.forEach((user, idx) => {
                    const color = colors[idx % colors.length];
                    const initial = (user.username || 'S').charAt(0).toUpperCase();
                    const roleColor = user.role === 'Admin' ? '#dc2626' : user.role === 'CSR' ? '#2563eb' : '#059669';
                    html += `
                    <div class="d-flex align-items-center gap-3 p-2 rounded-3 gt-staff-row">
                        <div class="position-relative flex-shrink-0">
                            <div class="d-flex align-items-center justify-content-center rounded-circle text-white fw-bold" style="width:40px;height:40px;background:${color};font-size:1.05rem;letter-spacing:-1px;">
                                ${initial}
                            </div>
                            <span class="position-absolute bottom-0 end-0 border border-2 border-white rounded-circle bg-success" style="width:11px;height:11px;"></span>
                        </div>
                        <div class="flex-grow-1 overflow-hidden">
                            <div class="fw-bold gt-staff-name" style="font-size:0.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${user.username}</div>
                            <span class="badge rounded-pill" style="font-size:0.65rem;background:${roleColor}20;color:${roleColor};border:1px solid ${roleColor}40;">${user.role}</span>
                        </div>
                        <div class="text-end flex-shrink-0">
                            <span class="badge rounded-pill gt-online-badge">
                                <i class="fas fa-circle" style="font-size:0.5rem;"></i> Online
                            </span>
                        </div>
                    </div>`;
                });
                html += '</div>';
                list.innerHTML = html;
            } else {
                list.innerHTML = `
                <div class="p-4 text-center gt-muted-text">
                    <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-2 gt-icon-circle">
                        <i class="fas fa-user-slash" style="font-size:1.2rem;"></i>
                    </div>
                    <div class="fw-semibold" style="font-size:0.85rem;">No staff online</div>
                    <div style="font-size:0.75rem;opacity:0.7;">No other staff active right now</div>
                </div>`;
            }
        } else {
            // Customer tab
            const customers = cachedOnlineData.customers || [];
            if (customers.length > 0) {
                let html = '<div class="p-2 d-flex flex-column gap-2">';
                customers.forEach((cust, idx) => {
                    const color = colors[(idx + 2) % colors.length];
                    const initial = (cust.name || cust.username || 'C').charAt(0).toUpperCase();
                    html += `
                    <a href="/customers/view/${cust.id}/" class="text-decoration-none d-flex align-items-center gap-3 p-2 rounded-3 gt-staff-row" style="color:inherit; transition: background 0.15s ease;">
                        <div class="position-relative flex-shrink-0">
                            <div class="d-flex align-items-center justify-content-center rounded-circle text-white fw-bold" style="width:40px;height:40px;background:${color};font-size:1.05rem;">
                                ${initial}
                            </div>
                            <span class="position-absolute bottom-0 end-0 border border-2 border-white rounded-circle bg-success" style="width:11px;height:11px;"></span>
                        </div>
                        <div class="flex-grow-1 overflow-hidden">
                            <div class="fw-bold gt-staff-name" style="font-size:0.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${cust.name}</div>
                            <div class="d-flex align-items-center gap-1 mt-1">
                                <span class="badge bg-secondary bg-opacity-25 text-secondary" style="font-size:0.62rem; font-family: monospace;">@${cust.username}</span>
                                ${cust.plan ? `<span class="badge bg-success bg-opacity-15 text-success" style="font-size:0.62rem;">${cust.plan}</span>` : ''}
                            </div>
                        </div>
                        <div class="text-end flex-shrink-0">
                            <span class="badge rounded-pill gt-online-badge">
                                <i class="fas fa-circle" style="font-size:0.5rem;"></i> Active
                            </span>
                        </div>
                    </a>`;
                });
                html += '</div>';
                list.innerHTML = html;
            } else {
                list.innerHTML = `
                <div class="p-4 text-center gt-muted-text">
                    <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-2 gt-icon-circle">
                        <i class="fas fa-user-clock" style="font-size:1.2rem;"></i>
                    </div>
                    <div class="fw-semibold" style="font-size:0.85rem;">No customers online</div>
                    <div style="font-size:0.75rem;opacity:0.7;">No active Customer Portal sessions</div>
                </div>`;
            }
        }
    }

    function fetchOnlineStaff() {
        fetch('/api/online-staff/')
            .then(r => r.json())
            .then(data => {
                if(data.status === 'success') {
                    cachedOnlineData.staff = data.staff || data.data || [];
                    cachedOnlineData.customers = data.customers || [];

                    const badge = document.getElementById('onlineStaffBadge');
                    const totalPill = document.getElementById('onlineTotalPill');
                    const staffCountEl = document.getElementById('staffTabCount');
                    const custCountEl = document.getElementById('customerTabCount');

                    const staffCount = cachedOnlineData.staff.length;
                    const custCount = cachedOnlineData.customers.length;
                    const totalCount = (typeof data.total_count === 'number') ? data.total_count : (staffCount + custCount);

                    if (staffCountEl) staffCountEl.innerText = staffCount;
                    if (custCountEl) custCountEl.innerText = custCount;
                    if (totalPill) totalPill.innerText = `${totalCount} Active`;

                    if (badge) {
                        if (totalCount > 0) {
                            badge.style.display = 'inline-block';
                            badge.innerText = totalCount;
                        } else {
                            badge.style.display = 'none';
                        }
                    }

                    renderOnlineList();
                }
            })
            .catch(err => console.error(err));
    }

    // Re-render staff list when theme changes so colors update immediately
    window.addEventListener('themeChanged', () => {
        if(document.getElementById('onlineStaffBadge')?.style.display !== 'none') {
            fetchOnlineStaff();
        }
    });

    
    // Fetch once on load to show badge
    setTimeout(fetchOnlineStaff, 2000);
    // Poll every 5 seconds for a truly live list
    setInterval(fetchOnlineStaff, 5000);

    // ============================================================
    // Notification Dropdown JS
    // ============================================================
    function fetchNotifications() {
        const loading = document.getElementById('notifLoading');
        const empty = document.getElementById('notifEmpty');
        const list = document.getElementById('notifList');
        const badge = document.getElementById('notifBadge');

        fetch('/api/notifications/')
            .then(r => r.json())
            .then(data => {
                if (data.status === 'success') {
                    // Update unread badge on bell
                    if (badge) {
                        if (data.unread_count > 0) {
                            badge.style.display = 'inline-block';
                        } else {
                            badge.style.display = 'none';
                        }
                    }

                    if (loading) loading.classList.add('d-none');

                    if (!data.notifications || data.notifications.length === 0) {
                        if (empty) empty.classList.remove('d-none');
                        const oldItems = list ? list.querySelectorAll('.notif-dropdown-item') : [];
                        oldItems.forEach(el => el.remove());
                    } else {
                        if (empty) empty.classList.add('d-none');

                        let html = '';
                        data.notifications.forEach(n => {
                            let icon = '<i class="fas fa-info-circle"></i>';
                            let iconBg = 'rgba(37, 99, 235, 0.12)';
                            let iconColor = '#2563eb';

                            if (n.type === 'payment') {
                                icon = '<i class="fas fa-check-circle"></i>';
                                iconBg = 'rgba(22, 163, 74, 0.12)';
                                iconColor = '#16a34a';
                            } else if (n.type === 'network') {
                                icon = '<i class="fas fa-network-wired"></i>';
                                iconBg = 'rgba(220, 38, 38, 0.12)';
                                iconColor = '#dc2626';
                            } else if (n.type === 'cignal') {
                                icon = '<i class="fas fa-satellite-dish"></i>';
                                iconBg = 'rgba(124, 58, 237, 0.12)';
                                iconColor = '#7c3aed';
                            }

                            const unreadDot = !n.is_read ? '<span class="position-absolute top-50 end-0 translate-middle-y me-3 p-1 bg-primary rounded-circle" style="width:7px;height:7px;"></span>' : '';
                            const unreadClass = !n.is_read ? 'unread' : '';

                            let timeAgo = '';
                            try {
                                const created = new Date(n.created_at);
                                const diffMs = Date.now() - created.getTime();
                                const diffMin = Math.floor(diffMs / 60000);
                                if (diffMin < 1) timeAgo = 'Just now';
                                else if (diffMin < 60) timeAgo = `${diffMin}m ago`;
                                else {
                                    const diffHr = Math.floor(diffMin / 60);
                                    if (diffHr < 24) timeAgo = `${diffHr}h ago`;
                                    else timeAgo = `${Math.floor(diffHr / 24)}d ago`;
                                }
                            } catch(e) {
                                timeAgo = '';
                            }

                            const link = (n.link && n.link !== '#') ? n.link : 'javascript:void(0);';

                            html += `
                            <a href="${link}" onclick="markNotificationRead(${n.id}, event, '${link}')" class="notif-dropdown-item d-flex align-items-start gap-3 p-3 border-bottom text-decoration-none position-relative ${unreadClass}">
                                <div class="flex-shrink-0 d-flex align-items-center justify-content-center rounded-circle" style="width:34px;height:34px;background:${iconBg};color:${iconColor};font-size:0.95rem;">
                                    ${icon}
                                </div>
                                <div class="flex-grow-1 min-w-0 pe-2">
                                    <div class="fw-semibold text-truncate notif-item-title" style="font-size:0.84rem;">${n.title}</div>
                                    <div class="text-muted small text-truncate" style="font-size:0.75rem;">${n.message}</div>
                                    <div class="text-muted small mt-1" style="font-size:0.68rem; opacity:0.75;">${timeAgo}</div>
                                </div>
                                ${unreadDot}
                            </a>`;
                        });

                        if (list) {
                            list.innerHTML = `
                                <div class="text-center py-5 d-none" id="notifLoading">
                                    <div class="spinner-border text-primary" role="status" style="width:1.5rem;height:1.5rem;"></div>
                                    <p class="mt-2 text-muted small">Loading updates...</p>
                                </div>
                                <div class="text-center py-5 d-none" id="notifEmpty">
                                    <div class="mb-3">
                                        <div class="d-inline-flex justify-content-center align-items-center rounded-circle" style="width: 60px; height: 60px; background: rgba(53,51,205,0.1);">
                                            <i class="fas fa-bell-slash fa-2x" style="color: #a0aec0;"></i>
                                        </div>
                                    </div>
                                    <h6 class="text-secondary fw-semibold">All Caught Up!</h6>
                                    <p class="text-muted small mb-0 px-4">You have no new notifications.</p>
                                </div>
                                ${html}
                            `;
                        }
                    }
                }
            })
            .catch(err => {
                console.error("Error fetching notifications:", err);
                if (loading) {
                    loading.classList.remove('d-none');
                    loading.innerHTML = '<p class="text-danger small my-4">Failed to load notifications</p>';
                }
            });
    }

    function markNotificationRead(id, event, link) {
        const csrf = document.cookie.match(/csrftoken=([^;]+)/)?.[1] || '';
        fetch(`/api/notifications/mark-read/${id}/`, {
            method: 'POST',
            headers: { 'X-CSRFToken': csrf }
        }).then(() => {
            if (link && link !== 'javascript:void(0);' && link !== '#') {
                window.location.href = link;
            } else {
                fetchNotifications();
            }
        }).catch(() => {
            if (link && link !== 'javascript:void(0);' && link !== '#') {
                window.location.href = link;
            }
        });
    }

    function markAllNotificationsRead(event) {
        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }
        const csrf = document.cookie.match(/csrftoken=([^;]+)/)?.[1] || '';
        fetch('/api/notifications/mark-all-read/', {
            method: 'POST',
            headers: { 'X-CSRFToken': csrf }
        }).then(() => {
            fetchNotifications();
        });
    }

    window.fetchNotifications = fetchNotifications;
    window.markNotificationRead = markNotificationRead;
    window.markAllNotificationsRead = markAllNotificationsRead;

    // Fetch notifications on load & poll every 30s
    setTimeout(fetchNotifications, 1000);
    setInterval(fetchNotifications, 30000);
    window.addEventListener('notificationsUpdated', fetchNotifications);

    // Idle timeout: automatically log out after 5 minutes of inactivity
    let idleTimeout;
    function resetIdleTimeout() {
        clearTimeout(idleTimeout);
        idleTimeout = setTimeout(() => {
            window.location.href = '/logout/';
        }, 5 * 60 * 1000); // 5 minutes
    }
    
    // Listen for any interaction to reset the timer
    ['mousemove', 'mousedown', 'keypress', 'touchmove', 'scroll'].forEach(evt => {
        document.addEventListener(evt, resetIdleTimeout, false);
    });
    resetIdleTimeout();
});
</script>

<script>
document.getElementById('submitImprovementBtn').addEventListener('click', function() {
    const msg = document.getElementById('improvementMessage').value.trim();
    const errEl = document.getElementById('improvementError');
    const btn = this;

    if (!msg) {
        errEl.textContent = 'Please describe what you would like us to improve.';
        errEl.style.display = 'block';
        return;
    }
    errEl.style.display = 'none';
    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Sending...';
    btn.disabled = true;

    fetch('/api/improvement-request/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.cookie.match(/csrftoken=([^;]+)/)?.[1] || ''
        },
        body: JSON.stringify({ message: msg })
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            const modal = bootstrap.Modal.getInstance(document.getElementById('improvementModal'));
            modal.hide();
            document.getElementById('improvementMessage').value = '';
            
            // Show success toast using Gametech brand styling
            if (!document.getElementById('improvToast')) {
                const toastHTML = `
                <div id="improvToast" style="position:fixed;bottom:24px;right:24px;z-index:9999;min-width:300px;" class="toast show align-items-center text-white border-0 shadow-lg" role="alert" style="border-radius:16px;background:#0349cb;">
                    <div class="d-flex" style="background:#0349cb;border-radius:14px;">
                        <div class="toast-body d-flex align-items-center gap-3 py-3 px-4">
                            <div class="rounded-circle d-flex align-items-center justify-content-center" style="width:36px;height:36px;background:rgba(255,255,255,0.2);">
                                <i class="fas fa-check"></i>
                            </div>
                            <div>
                                <strong class="d-block mb-1">Request Sent!</strong>
                                <span style="opacity:0.9;font-size:0.85rem;">The devs will look into it.</span>
                            </div>
                        </div>
                        <button type="button" class="btn-close btn-close-white me-3 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                </div>`;
                document.body.insertAdjacentHTML('beforeend', toastHTML);
                setTimeout(() => { const t = document.getElementById('improvToast'); if(t) t.remove(); }, 4000);
            }
        } else {
            errEl.textContent = data.error || 'Something went wrong. Please try again.';
            errEl.style.display = 'block';
        }
    })
    .catch(() => {
        errEl.textContent = 'Network error. Please try again.';
        errEl.style.display = 'block';
    })
    .finally(() => {
        btn.innerHTML = '<i class="fas fa-paper-plane me-2"></i>Send Request';
        btn.disabled = false;
    });
});

// Hover effect on improvement button
const impBtn = document.getElementById('improvementBtn');
if (impBtn) {
    impBtn.addEventListener('mouseenter', () => impBtn.style.transform = 'scale(1.05)');
    impBtn.addEventListener('mouseleave', () => impBtn.style.transform = 'scale(1)');
}
</script>
