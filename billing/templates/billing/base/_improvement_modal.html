<!-- Base Partial: Improvement Request Modal -->
<!-- Improvement Request Modal -->
<div class="modal fade" id="improvementModal" tabindex="-1" aria-labelledby="improvementModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 20px; overflow: hidden;">
            <div class="modal-header text-white border-0 pb-2" style="background: #0349cb;">
                <h5 class="modal-title fw-bold" id="improvementModalLabel">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-wand-magic-sparkles me-2" style="color:#fbae1a;"></i>Request an Improvement
                    </div>
                </h5>
                <button type="button" class="btn-close btn-close-white shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body px-4 pt-4 pb-2">
                <p class="text-muted small mb-4">Have an idea to make Gametech Billing System better? Found an annoying bug? Let the dev team know directly!</p>
                
                <div class="mb-3 position-relative">
                    <label for="improvementMessage" class="form-label fw-bold text-dark mb-1" style="font-size: 0.9rem;">Your Idea or Feedback</label>
                    <textarea class="form-control bg-light border-0" id="improvementMessage" rows="5" placeholder="e.g., 'It would be awesome if we could export the user list to PDF...' or 'The dark mode button is hard to see...'" style="resize: none; border-radius: 12px; padding: 12px; font-size: 0.95rem; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);"></textarea>
                    <div id="improvementError" class="text-danger mt-1 small d-none"><i class="fas fa-exclamation-circle me-1"></i>Please write a message before sending.</div>
                </div>
            </div>
            <div class="modal-footer border-0 px-4 pb-4 pt-2 gt-modal-footer">
                <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                <button type="button" id="submitImprovementBtn" class="btn rounded-pill px-5 fw-bold text-white" 
                        style="background: #0349cb; box-shadow: 0 4px 12px rgba(3,73,203,0.3);"
                        onmouseover="this.style.background='#fbae1a'; this.style.boxShadow='0 4px 12px rgba(251,174,26,0.4)';"
                        onmouseout="this.style.background='#0349cb'; this.style.boxShadow='0 4px 12px rgba(3,73,203,0.3)';">
                    <i class="fas fa-paper-plane me-2"></i>Send Request
                </button>
            </div>
        </div>
    </div>
</div>
