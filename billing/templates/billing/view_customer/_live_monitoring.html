<!-- Base Partial: Live Monitoring & Map -->
    <div class="row g-4 mt-1">
        <!-- Live Monitoring -->
        <div class="col-lg-6">
            <div class="info-card h-100 mb-0">
                <h3 class="info-title">
                    <i class="fas fa-satellite-dish text-success"></i> Live Monitoring
                    <span id="live-stability-badge" class="badge ms-2" style="display:none; font-size: 0.75rem;"></span>
                </h3>
                <div class="live-monitor-box mb-3 shadow-sm" style="background: #1e3a8a; border-radius: 12px; padding: 25px 0; display: flex; text-align: center;">
                    <div class="monitor-metric border-end" style="border-color: rgba(255,255,255,0.2) !important; flex: 1;">
                        <div class="monitor-metric-title" style="color: #e2e8f0; font-size: 0.8rem; font-weight: bold; letter-spacing: 1px;"><i class="fas fa-download me-2"></i>DOWNLOAD</div>
                        <div class="monitor-metric-value" id="live-dl-val" style="color: #06b6d4; font-size: 1.8rem; font-weight: 800; margin-top: 5px;">0 <span style="font-size: 0.9rem; font-weight: 600;">Mbps</span></div>
                    </div>
                    <div class="monitor-metric" style="flex: 1;">
                        <div class="monitor-metric-title" style="color: #e2e8f0; font-size: 0.8rem; font-weight: bold; letter-spacing: 1px;"><i class="fas fa-upload me-2"></i>UPLOAD</div>
                        <div class="monitor-metric-value" id="live-ul-val" style="color: #eab308; font-size: 1.8rem; font-weight: 800; margin-top: 5px;">0 <span style="font-size: 0.9rem; font-weight: 600;">Mbps</span></div>
                    </div>
                </div>
                <div style="height: 180px; width: 100%;">
                    <canvas id="liveTrafficChart"></canvas>
                </div>
                <div class="mt-4 pb-2 text-center text-muted" style="font-size: 0.8rem;">
                    Updates every 5 seconds when customer is connected.
                </div>
            </div>
        </div>

        <!-- Location Map -->
        <div class="col-lg-6">
            <div class="info-card mb-0 h-100">
                <h3 class="info-title"><i class="fas fa-map"></i> Exact Location</h3>
                <div class="mb-3 text-muted" style="font-size:0.9rem;">
                    <strong>Address:</strong> {{ customer.address|default:"Not provided" }}
                </div>
                <div id="map" style="height: 350px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.1);"></div>
            </div>
        </div>
    </div>
