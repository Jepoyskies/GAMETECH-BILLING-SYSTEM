<!-- Base Partial: Live Monitoring & Map -->
    <div class="row g-4 mt-1">
        <!-- Live Monitoring -->
        <div class="col-lg-6">
            <div class="info-card h-100 mb-0">
                <h3 class="info-title">
                    <i class="fas fa-satellite-dish text-primary"></i> Live Monitoring
                    <span id="live-stability-badge" class="status-badge status-badge--success ms-2" style="display:none; font-size: 0.72rem; padding: 2px 8px;"></span>
                </h3>
                <div class="live-monitor-box mb-3" style="background: var(--surface-subtle); border: 1px solid var(--border-subtle); border-radius: var(--radius-md, 12px); padding: 18px 0; display: flex; text-align: center;">
                    <div class="monitor-metric border-end" style="border-color: var(--border-subtle) !important; flex: 1;">
                        <div class="monitor-metric-title text-muted" style="font-size: 0.75rem; font-weight: 700; letter-spacing: 0.5px;"><i class="fas fa-download me-1 text-primary"></i>DOWNLOAD</div>
                        <div class="monitor-metric-value text-body" id="live-dl-val" style="font-size: 24px; font-weight: 800; margin-top: 4px;">0 <span class="text-muted" style="font-size: 0.85rem; font-weight: 500;">Mbps</span></div>
                    </div>
                    <div class="monitor-metric" style="flex: 1;">
                        <div class="monitor-metric-title text-muted" style="font-size: 0.75rem; font-weight: 700; letter-spacing: 0.5px;"><i class="fas fa-upload me-1 text-primary"></i>UPLOAD</div>
                        <div class="monitor-metric-value text-body" id="live-ul-val" style="font-size: 24px; font-weight: 800; margin-top: 4px;">0 <span class="text-muted" style="font-size: 0.85rem; font-weight: 500;">Mbps</span></div>
                    </div>
                </div>
                <div style="height: 180px; width: 100%;">
                    <canvas id="liveTrafficChart"></canvas>
                </div>
                <div class="mt-4 pb-2 text-center text-muted" style="font-size: 0.8rem;">
                    Updates every 5 seconds when customer is connected.
                </div>
            </div>
        </div>

        <!-- Location Map -->
        <div class="col-lg-6">
            <div class="info-card mb-0 h-100">
                <h3 class="info-title"><i class="fas fa-map-location-dot text-primary"></i> Exact Location</h3>
                <div class="mb-2 text-muted" style="font-size: 0.85rem;">
                    Address: {{ customer.address|default:"Not provided" }}
                </div>
                <div id="map" style="height: 320px; border-radius: var(--radius-md, 12px); border: 1px solid var(--border-subtle);"></div>
            </div>
        </div>
    </div>
