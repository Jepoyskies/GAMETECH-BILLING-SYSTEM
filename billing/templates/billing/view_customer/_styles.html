<!-- Base Partial: Styles -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
/* Page & Profile Header
   The header markup now uses the shared .gt-page-header / .gt-header-icon
   components, so the old .customer-view-header rules are gone. The two things
   that must stay page-specific are the dropdown stacking (the shared header
   clips its overflow for the gold sheen) and the long "More Actions" menu. */
.gt-page-header.customer-profile-header {
  overflow: visible;
  z-index: 1050;
}
.gt-page-header.customer-profile-header .dropdown {
  position: relative;
  z-index: 1055;
}
.gt-page-header.customer-profile-header .dropdown-menu {
  position: absolute;
  top: 100%;
  right: 0;
  left: auto;
  margin-top: 8px;
  z-index: 1060;
  min-width: 250px;
  max-width: 90vw;
  max-height: min(450px, 65vh);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.gt-page-header.customer-profile-header .dropdown-menu::-webkit-scrollbar { width: 6px; }
.gt-page-header.customer-profile-header .dropdown-menu::-webkit-scrollbar-track { background: transparent; }
.gt-page-header.customer-profile-header .dropdown-menu::-webkit-scrollbar-thumb {
  background: var(--border-subtle);
  border-radius: 4px;
}
.gt-page-header.customer-profile-header .dropdown-menu::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* Info Cards */
/* Info cards use the shared card surface (gradient + gold accent) so the
   profile page matches the Dashboard's card treatment. */
.info-card {
  background: var(--surface-card-gradient);
  border-radius: var(--gt-radius-card);
  padding: 1.5rem 1.75rem;
  box-shadow: var(--gt-shadow-card);
  margin-bottom: 0;
  border: 1px solid var(--border-subtle);
  border-left: 4px solid var(--gt-gold);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.info-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gt-gold), transparent);
}

.info-title {
  font-size: var(--gt-fs-md);
  font-weight: 700;
  color: var(--gt-text-title);
  letter-spacing: var(--gt-ls-tight);
  margin-bottom: 1.1rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--border-divider);
  display: flex;
  align-items: center;
  gap: 0.6rem;
}
.info-title i { color: var(--section-accent-text); }

.info-list {
  list-style: none;
  padding: 0;
  margin: 0;
}

.info-list li {
  display: flex;
  justify-content: space-between;
  min-height: 38px;
  padding: 0.5rem 0;
  border-bottom: 1px solid var(--border-divider);
  align-items: center;
  gap: 1rem;
}

.info-list li:last-child {
  border-bottom: none;
  padding-bottom: 0;
}

.info-label {
  color: var(--gt-text-muted);
  font-size: var(--gt-fs-xs);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: var(--gt-ls-label);
  flex-shrink: 0;
}

.info-value {
  color: var(--gt-text-title);
  font-size: var(--gt-fs-base);
  font-weight: 600;
  text-align: right;
  line-height: 1.45;
}

/* Password eye toggle & masked text */
.pw-toggle-btn {
  opacity: 0.7;
  transition: opacity 0.2s;
}
.pw-toggle-btn:hover {
  opacity: 1;
}

/* Live Traffic & Metrics */
.live-monitor-box {
  background: var(--surface-subtle);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md, 12px);
  padding: 18px 0;
  display: flex;
  text-align: center;
}

/* Activity Log Details Formatting (plain text, unboxed) */
.activity-log-details div.border,
.activity-log-details .bg-light,
.activity-log-details .bg-danger-subtle,
.activity-log-details .border-danger-subtle,
.activity-log-details .border-light {
  background: transparent !important;
  border: none !important;
  padding: 0 !important;
  box-shadow: none !important;
}

.activity-log-details table {
  margin-bottom: 0 !important;
  background: transparent !important;
}

.activity-log-details td {
  padding: 2px 4px !important;
  background: transparent !important;
}

.activity-log-details .text-success {
  color: var(--text-primary) !important;
  font-weight: 600 !important;
}

/* Red Offline Row Highlight */
.active-offline-row-highlight {
  background: rgba(239, 68, 68, 0.08) !important;
  border: 1px solid rgba(239, 68, 68, 0.35) !important;
  border-radius: 8px !important;
  padding: 8px 12px !important;
  margin: 4px 0 !important;
}

/* Cignal Pending Request Banner */
.cignal-pending-card {
  border: 2px solid var(--color-primary) !important;
}
</style>
