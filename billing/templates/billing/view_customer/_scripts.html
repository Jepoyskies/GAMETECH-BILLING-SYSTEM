<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
function confirmAction(e, title, text, icon) {
    e.preventDefault();
    const form = e.target;
    const isDark = document.documentElement.classList.contains('dark-mode');
    
    Swal.fire({
        title: title,
        text: text,
        icon: icon,
        showCancelButton: true,
        confirmButtonText: 'Yes, proceed',
        customClass: {
            popup: isDark ? `gt-modal-content gt-emotion-${icon}` : '',
            confirmButton: 'btn btn-primary rounded-pill px-4 shadow-sm',
            cancelButton: 'btn btn-secondary rounded-pill px-4 ms-2'
        },
        buttonsStyling: false,
        background: isDark ? 'rgba(13, 20, 40, 0.95)' : '#fff',
        color: isDark ? '#f8fafc' : '#1e293b'
    }).then((result) => {
        if (result.isConfirmed) {
            form.submit();
        }
    });
    return false;
}
</script>
