<!-- Base Partial: Scripts -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
function confirmAction(e, title, text, icon) {
    e.preventDefault();
    const form = e.target.closest('form') || e.target;
    const isDark = document.documentElement.classList.contains('dark-mode');
    
    Swal.fire({
        title: title,
        text: text,
        icon: icon,
        showCancelButton: true,
        confirmButtonText: 'Yes, proceed',
        cancelButtonText: 'Cancel',
        customClass: {
            popup: isDark ? `gt-modal-content gt-emotion-${icon}` : '',
            confirmButton: 'btn btn-primary rounded-pill px-4 shadow-sm',
            cancelButton: 'btn btn-secondary rounded-pill px-4 ms-2'
        },
        buttonsStyling: false,
        background: isDark ? 'rgba(13, 20, 40, 0.95)' : '#fff',
        color: isDark ? '#f8fafc' : '#1e293b'
    }).then((result) => {
        if (result.isConfirmed && form) {
            form.submit();
        }
    });
    return false;
}

function sendSingleAction(type) {
    const isDark = document.documentElement.classList.contains('dark-mode');
    const ids = [{{ customer.id }}];
    let payload = { customer_ids: ids };
    let endpoint = '';
    let modalId = '';
    
    if (type === 'sms') {
        const msg = document.getElementById('singleSmsMessage').value;
        if (!msg.trim()) {
            Swal.fire({ icon: 'warning', text: 'Message cannot be empty.' });
            return;
        }
        payload.message = msg;
        endpoint = '/customers/bulk-sms/';
        modalId = 'singleSmsModal';
    } else {
        const sub = document.getElementById('singleEmailSubject').value || 'Important Notice';
        const msg = document.getElementById('singleEmailMessage').value;
        if (!msg.trim()) {
            Swal.fire({ icon: 'warning', text: 'Message cannot be empty.' });
            return;
        }
        payload.subject = sub;
        payload.message = msg;
        endpoint = '/customers/bulk-email/';
        modalId = 'singleEmailModal';
    }

    const modalEl = document.getElementById(modalId);
    if (modalEl) {
        const modalInstance = bootstrap.Modal.getInstance(modalEl);
        if (modalInstance) modalInstance.hide();
    }

    fetch(endpoint, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            Swal.fire({
                title: 'Sent!',
                text: 'Message successfully sent to customer.',
                icon: 'success',
                confirmButtonColor: '#10b981'
            }).then(() => location.reload());
        } else {
            Swal.fire({
                title: 'Failed',
                text: data.error || 'Unable to send message.',
                icon: 'error',
                confirmButtonColor: '#ef4444'
            });
        }
    })
    .catch(err => {
        Swal.fire({
            title: 'Network Error',
            text: 'A network error occurred while sending the message.',
            icon: 'error',
            confirmButtonColor: '#ef4444'
        });
    });
}

document.addEventListener("DOMContentLoaded", function() {
    // 1. Initialize Bootstrap tooltips
    var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
    tooltipTriggerList.map(function(el) {
        return new bootstrap.Tooltip(el);
    });

    // 2. Leaflet Map Initialization
    var lat = {{ customer.latitude|default:"null" }};
    var lng = {{ customer.longitude|default:"null" }};
    var mapEl = document.getElementById('map');
    
    if (lat !== null && lng !== null && mapEl) {
        var map = L.map('map').setView([lat, lng], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        L.marker([lat, lng]).addTo(map)
            .bindPopup('<b>{{ customer.full_name|escapejs }}</b>')
            .openPopup();
    } else if (mapEl) {
        mapEl.innerHTML = '<div class="h-100 d-flex align-items-center justify-content-center text-muted">No coordinates provided for this customer.</div>';
        mapEl.style.background = '#f8fafc';
    }

    // 3. Live Traffic Chart Initialization
    const customerId = "{{ customer.id }}";
    const chartCanvas = document.getElementById('liveTrafficChart');
    let trafficChart = null;

    if (chartCanvas) {
        const ctx = chartCanvas.getContext('2d');
        trafficChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Download (Mbps)',
                        borderColor: '#38bdf8',
                        backgroundColor: 'rgba(56, 189, 248, 0.1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true,
                        data: []
                    },
                    {
                        label: 'Upload (Mbps)',
                        borderColor: '#fbbf24',
                        backgroundColor: 'rgba(251, 191, 36, 0.1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true,
                        data: []
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        mode: 'index',
                        intersect: false,
                        backgroundColor: 'rgba(15, 23, 42, 0.9)'
                    }
                },
                scales: {
                    x: { display: false },
                    y: {
                        beginAtZero: true,
                        grid: { color: 'rgba(0,0,0,0.05)' },
                        ticks: { font: { size: 10 } }
                    }
                },
                interaction: {
                    mode: 'nearest',
                    axis: 'x',
                    intersect: false
                }
            }
        });
    }

    // 4. Live Mikrotik Polling
    function fetchStatus() {
        fetch(`/customers/api/status/${customerId}/`)
            .then(response => {
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response.json();
            })
            .then(data => {
                const statusContainer = document.getElementById('mt-status-container');
                if (statusContainer) {
                    if (data.mt_status === 'Connected') {
                        statusContainer.innerHTML = '<span class="text-success"><i class="fas fa-circle me-1" style="font-size:0.6rem;"></i>Connected</span>';
                    } else {
                        statusContainer.innerHTML = '<span class="text-danger"><i class="fas fa-circle me-1" style="font-size:0.6rem;"></i>' + (data.mt_status || 'Error') + '</span>';
                    }
                }

                const macEl = document.getElementById('mt-live-mac');
                if (macEl) macEl.innerText = data.live_mac || 'N/A';

                const uptimeContainer = document.getElementById('uptime-container');
                const lastLoggedOutContainer = document.getElementById('last-logged-out-container');
                const stabilityBadge = document.getElementById('live-stability-badge');

                if (data.mt_status === 'Connected') {
                    const uptimeEl = document.getElementById('mt-uptime');
                    if (uptimeEl) uptimeEl.innerText = data.uptime || 'N/A';
                    if (uptimeContainer) uptimeContainer.style.display = 'flex';
                    if (lastLoggedOutContainer) lastLoggedOutContainer.style.display = 'none';
                    
                    if (data.stability && stabilityBadge) {
                        stabilityBadge.innerText = data.stability;
                        stabilityBadge.className = 'badge ms-2 bg-' + data.stability_color;
                        stabilityBadge.style.display = 'inline-block';
                    }
                    
                    if (data.rx_mbps !== undefined && data.tx_mbps !== undefined) {
                        const dlVal = document.getElementById('live-dl-val');
                        const ulVal = document.getElementById('live-ul-val');
                        if (dlVal) dlVal.innerHTML = data.rx_mbps + ' <span style="font-size: 0.9rem; font-weight: 600;">Mbps</span>';
                        if (ulVal) ulVal.innerHTML = data.tx_mbps + ' <span style="font-size: 0.9rem; font-weight: 600;">Mbps</span>';
                        
                        const now = new Date().toLocaleTimeString('en-US', { hour12: false, hour: "numeric", minute: "numeric", second: "numeric" });
                        
                        if (trafficChart) {
                            trafficChart.data.labels.push(now);
                            trafficChart.data.datasets[0].data.push(parseFloat(data.rx_mbps));
                            trafficChart.data.datasets[1].data.push(parseFloat(data.tx_mbps));
                            
                            if (trafficChart.data.labels.length > 15) {
                                trafficChart.data.labels.shift();
                                trafficChart.data.datasets[0].data.shift();
                                trafficChart.data.datasets[1].data.shift();
                            }
                            trafficChart.update('none');
                        }
                    }
                } else {
                    if (stabilityBadge) stabilityBadge.style.display = 'none';
                    if (data.last_logged_out && data.last_logged_out !== 'N/A') {
                        const lastOutEl = document.getElementById('mt-last-logged-out');
                        if (lastOutEl) lastOutEl.innerText = data.last_logged_out;
                        if (lastLoggedOutContainer) lastLoggedOutContainer.style.display = 'flex';
                    } else if (lastLoggedOutContainer) {
                        lastLoggedOutContainer.style.display = 'none';
                    }
                    if (uptimeContainer) uptimeContainer.style.display = 'none';
                    
                    const dlVal = document.getElementById('live-dl-val');
                    const ulVal = document.getElementById('live-ul-val');
                    if (dlVal) dlVal.innerHTML = '0 <span style="font-size: 0.9rem; font-weight: 600;">Mbps</span>';
                    if (ulVal) ulVal.innerHTML = '0 <span style="font-size: 0.9rem; font-weight: 600;">Mbps</span>';
                }
            })
            .catch(error => {
                const statusContainer = document.getElementById('mt-status-container');
                if (statusContainer) {
                    statusContainer.innerHTML = '<span class="text-danger" title="' + error.message + '"><i class="fas fa-exclamation-triangle me-1" style="font-size:0.6rem;"></i>Error</span>';
                }
                const uptimeContainer = document.getElementById('uptime-container');
                const lastLoggedOutContainer = document.getElementById('last-logged-out-container');
                if (uptimeContainer) uptimeContainer.style.display = 'none';
                if (lastLoggedOutContainer) lastLoggedOutContainer.style.display = 'none';
            });
    }

    fetchStatus();
    setInterval(function() {
        if (!document.hidden) {
            fetchStatus();
        }
    }, 5000);

    // 5. Auto-resolve Addon Request via query parameter
    const urlParams = new URLSearchParams(window.location.search);
    const resolveAddonId = urlParams.get('resolve_addon');
    if (resolveAddonId) {
        fetch('{% url "resolve_addon_request_api" %}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({ request_id: resolveAddonId })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                const editBtn = document.querySelector('a.btn-edit[href*="/edit/"]');
                if (editBtn) {
                    editBtn.classList.remove('btn-edit');
                    editBtn.classList.add('bg-danger', 'text-white', 'pulse-animation');
                    editBtn.innerHTML = '<i class="fas fa-exclamation-circle"></i> Complete Add-on Here';
                    Swal.fire({
                        icon: 'info',
                        title: 'Add-on Requested',
                        text: "Add-on Application processed! Click 'Complete Add-on Here' to update Cignal Play details."
                    });
                }
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        });
    }

    // 6. Edit Advance Payment Modal - Auto-revert expiration to Month 1 on Reset
    const inputWalletBalance = document.getElementById('inputWalletBalance');
    const inputNewExpiration = document.getElementById('inputNewExpirationDate');
    const btnResetBalance = document.getElementById('btnResetBalance');
    const revertNotice = document.getElementById('revertNotice');
    const revertedExpiryStr = "{{ reverted_expiration|date:'Y-m-d\\TH:i'|default:'' }}";
    const revertedExpiryLabel = "{{ reverted_expiration|date:'M d, Y h:i A'|default:'' }}";

    function triggerRevertToMonth1() {
        if (inputWalletBalance) {
            inputWalletBalance.value = '0.00';
        }
        if (inputNewExpiration && revertedExpiryStr) {
            inputNewExpiration.value = revertedExpiryStr;
            if (revertNotice) {
                revertNotice.innerHTML = '<span class="text-success fw-semibold"><i class="fas fa-undo me-1"></i>Reverted to Month 1 base expiration (' + revertedExpiryLabel + ')</span>';
            }
        }
    }

    if (btnResetBalance) {
        btnResetBalance.addEventListener('click', function (e) {
            e.preventDefault();
            triggerRevertToMonth1();
        });
    }

    if (inputWalletBalance) {
        inputWalletBalance.addEventListener('input', function () {
            const val = parseFloat(this.value);
            if (!isNaN(val) && val === 0) {
                triggerRevertToMonth1();
            } else if (revertNotice) {
                revertNotice.innerHTML = 'Will default to their current expiration date. Modify if resetting advance payments.';
            }
        });
    }
});
</script>
