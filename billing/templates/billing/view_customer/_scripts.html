<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
function confirmAction(e, title, text, icon) {
    e.preventDefault();
    const form = e.target;
    const isDark = document.documentElement.classList.contains('dark-mode');
    
    Swal.fire({
        title: title,
        text: text,
        icon: icon,
        showCancelButton: true,
        confirmButtonText: 'Yes, proceed',
        customClass: {
            popup: isDark ? `gt-modal-content gt-emotion-${icon}` : '',
            confirmButton: 'btn btn-primary rounded-pill px-4 shadow-sm',
            cancelButton: 'btn btn-secondary rounded-pill px-4 ms-2'
        },
        buttonsStyling: false,
        background: isDark ? 'rgba(13, 20, 40, 0.95)' : '#fff',
        color: isDark ? '#f8fafc' : '#1e293b'
    }).then((result) => {
        if (result.isConfirmed) {
            form.submit();
        }
    });
    return false;
</script>
<script>
function sendSingleAction(type) {
    const ids = [{{ customer.id }}];
    let payload = { customer_ids: ids };
    let endpoint = '';
    
    if (type === 'sms') {
        const msg = document.getElementById('singleSmsMessage').value;
        if(!msg) return alert("Message cannot be empty.");
        payload.message = msg;
        endpoint = '/customers/bulk-sms/';
    } else {
        const sub = document.getElementById('singleEmailSubject').value || 'Important Notice';
        const msg = document.getElementById('singleEmailMessage').value;
        if(!msg) return alert("Message cannot be empty.");
        payload.subject = sub;
        payload.message = msg;
        endpoint = '/customers/bulk-email/';
    }

    fetch(endpoint, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(data => {
        if(data.success) {
            alert(`Successfully sent message!`);
            location.reload();
        } else {
            alert("Error: " + data.error);
        }
    })
    .catch(err => {
        alert("Network error occurred.");
    });
}
</script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const customerId = "{{ customer.id }}";
        
        // 1. Initialize Chart.js First
        const ctx = document.getElementById('liveTrafficChart').getContext('2d');
        const trafficChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Download (Mbps)',
                        borderColor: '#38bdf8',
                        backgroundColor: 'rgba(56, 189, 248, 0.1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true,
                        data: []
                    },
                    {
                        label: 'Upload (Mbps)',
                        borderColor: '#fbbf24',
                        backgroundColor: 'rgba(251, 191, 36, 0.1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true,
                        data: []
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        mode: 'index',
                        intersect: false,
                        backgroundColor: 'rgba(15, 23, 42, 0.9)'
                    }
                },
                scales: {
                    x: { display: false },
                    y: {
                        beginAtZero: true,
                        grid: { color: 'rgba(0,0,0,0.05)' },
                        ticks: { font: { size: 10 } }
                    }
                },
                interaction: {
                    mode: 'nearest',
                    axis: 'x',
                    intersect: false
                }
            }
        });

        // 2. Define and start Mikrotik Polling
        function fetchStatus() {
            fetch(`/customers/api/status/${customerId}/`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    const statusContainer = document.getElementById('mt-status-container');
                    if (data.mt_status === 'Connected') {
                        statusContainer.innerHTML = '<span class="text-success"><i class="fas fa-circle me-1" style="font-size:0.6rem;"></i>Connected</span>';
                    } else {
                        statusContainer.innerHTML = '<span class="text-danger"><i class="fas fa-circle me-1" style="font-size:0.6rem;"></i>' + (data.mt_status || 'Error') + '</span>';
                    }

                    document.getElementById('mt-live-mac').innerText = data.live_mac;

                    const uptimeContainer = document.getElementById('uptime-container');
                    const lastLoggedOutContainer = document.getElementById('last-logged-out-container');
                    const stabilityBadge = document.getElementById('live-stability-badge');

                    if (data.mt_status === 'Connected') {
                        document.getElementById('mt-uptime').innerText = data.uptime;
                        uptimeContainer.style.display = 'flex';
                        lastLoggedOutContainer.style.display = 'none';
                        
                        if (data.stability && stabilityBadge) {
                            stabilityBadge.innerText = data.stability;
                            stabilityBadge.className = 'badge ms-2 bg-' + data.stability_color;
                            stabilityBadge.style.display = 'inline-block';
                        }
                        
                        if (data.rx_mbps !== undefined && data.tx_mbps !== undefined) {
                            document.getElementById('live-dl-val').innerHTML = data.rx_mbps + ' <span style="font-size: 0.9rem; font-weight: 600;">Mbps</span>';
                            document.getElementById('live-ul-val').innerHTML = data.tx_mbps + ' <span style="font-size: 0.9rem; font-weight: 600;">Mbps</span>';
                            
                            const now = new Date().toLocaleTimeString('en-US', { hour12: false, hour: "numeric", minute: "numeric", second: "numeric" });
                            
                            if (typeof trafficChart !== 'undefined' && trafficChart !== null) {
                                trafficChart.data.labels.push(now);
                                trafficChart.data.datasets[0].data.push(parseFloat(data.rx_mbps)); // DL
                                trafficChart.data.datasets[1].data.push(parseFloat(data.tx_mbps)); // UL
                                
                                // Keep only last 15 points
                                if (trafficChart.data.labels.length > 15) {
                                    trafficChart.data.labels.shift();
                                    trafficChart.data.datasets[0].data.shift();
                                    trafficChart.data.datasets[1].data.shift();
                                }
                                trafficChart.update('none'); // Update without full animation
                            }
                        }
                    } else {
                        if (stabilityBadge) stabilityBadge.style.display = 'none';
                        if (data.last_logged_out !== 'N/A') {
                            document.getElementById('mt-last-logged-out').innerText = data.last_logged_out;
                            lastLoggedOutContainer.style.display = 'flex';
                        } else {
                            lastLoggedOutContainer.style.display = 'none';
                        }
                        uptimeContainer.style.display = 'none';
                        document.getElementById('live-dl-val').innerHTML = '0 <span style="font-size: 0.9rem; font-weight: 600;">Mbps</span>';
                        document.getElementById('live-ul-val').innerHTML = '0 <span style="font-size: 0.9rem; font-weight: 600;">Mbps</span>';
                    }
                })
                .catch(error => {
                    console.error("Error fetching Mikrotik status:", error);
                    document.getElementById('mt-status-container').innerHTML = '<span class="text-danger" title="' + error.message + '"><i class="fas fa-exclamation-triangle me-1" style="font-size:0.6rem;"></i>Error</span>';
                    
                    const uptimeContainer = document.getElementById('uptime-container');
                    const lastLoggedOutContainer = document.getElementById('last-logged-out-container');
                    
                    if(uptimeContainer) uptimeContainer.style.display = 'none';
                    if(lastLoggedOutContainer) lastLoggedOutContainer.style.display = 'none';
                    
                    const macEl = document.getElementById('mt-live-mac');
                    if(macEl) macEl.innerText = 'N/A';
                });
        }

        fetchStatus();
        setInterval(fetchStatus, 5000);

        // 3. Auto-resolve Addon Request
        const urlParams = new URLSearchParams(window.location.search);
        const resolveAddonId = urlParams.get('resolve_addon');
        if (resolveAddonId) {
            fetch('{% url "resolve_addon_request_api" %}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({ request_id: resolveAddonId })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    const editBtn = document.querySelector('a.btn-edit[href*="/edit/"]');
                    if(editBtn) {
                        editBtn.classList.remove('btn-edit');
                        editBtn.classList.add('bg-danger', 'text-white', 'pulse-animation');
                        editBtn.innerHTML = '<i class="fas fa-exclamation-circle"></i> Complete Add-on Here';
                        alert("Add-on Application processed!\nPlease click the 'Complete Add-on Here' button to update the customer's Cignal Play details.");
                    }
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            });
        }
    });
</script>
