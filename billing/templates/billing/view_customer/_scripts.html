{% load static %}
<!-- Base Partial: Scripts -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{% static 'js/network_monitor.js' %}"></script>
<script>
function confirmAction(e, title, text, icon) {
    e.preventDefault();
    const form = e.target;
    const isDark = document.documentElement.classList.contains('dark-mode');
    
    Swal.fire({
        title: title,
        text: text,
        icon: icon,
        showCancelButton: true,
        confirmButtonText: 'Yes, proceed',
        customClass: {
            popup: isDark ? `gt-modal-content gt-emotion-${icon}` : '',
            confirmButton: 'btn btn-primary rounded-pill px-4 shadow-sm',
            cancelButton: 'btn btn-secondary rounded-pill px-4 ms-2'
        },
        buttonsStyling: false,
        background: isDark ? 'rgba(13, 20, 40, 0.95)' : '#fff',
        color: isDark ? '#f8fafc' : '#1e293b'
    }).then((result) => {
        if (result.isConfirmed) {
            form.submit();
        }
    });
    return false;
}

function sendSingleAction(type) {
    const ids = [{{ customer.id }}];
    let payload = { customer_ids: ids };
    let endpoint = '';
    
    if (type === 'sms') {
        const msg = document.getElementById('singleSmsMessage').value;
        if(!msg) return alert("Message cannot be empty.");
        payload.message = msg;
        endpoint = '/customers/bulk-sms/';
    } else {
        const sub = document.getElementById('singleEmailSubject').value || 'Important Notice';
        const msg = document.getElementById('singleEmailMessage').value;
        if(!msg) return alert("Message cannot be empty.");
        payload.subject = sub;
        payload.message = msg;
        endpoint = '/customers/bulk-email/';
    }

    fetch(endpoint, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(data => {
        if(data.success) {
            alert(`Successfully sent message!`);
            location.reload();
        } else {
            alert("Error: " + (data.error || 'Failed to send'));
        }
    })
    .catch(err => {
        alert("Network error occurred.");
    });
}

document.addEventListener("DOMContentLoaded", function() {
    // 1. Initialize Bootstrap Tooltips
    var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
    tooltipTriggerList.map(function (tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl);
    });

    const customerId = "{{ customer.id }}";

    // 2. Initialize Chart.js
    let trafficChart = null;
    const chartCanvas = document.getElementById('liveTrafficChart');
    if (chartCanvas) {
        const ctx = chartCanvas.getContext('2d');
        trafficChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Download (Mbps)',
                        borderColor: '#38bdf8',
                        backgroundColor: 'rgba(56, 189, 248, 0.1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true,
                        data: []
                    },
                    {
                        label: 'Upload (Mbps)',
                        borderColor: '#fbbf24',
                        backgroundColor: 'rgba(251, 191, 36, 0.1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true,
                        data: []
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        mode: 'index',
                        intersect: false,
                        backgroundColor: 'rgba(15, 23, 42, 0.9)'
                    }
                },
                scales: {
                    x: { display: false },
                    y: {
                        beginAtZero: true,
                        grid: { color: 'rgba(0,0,0,0.05)' },
                        ticks: { font: { size: 10 } }
                    }
                },
                interaction: {
                    mode: 'nearest',
                    axis: 'x',
                    intersect: false
                }
            }
        });
    }

    // 3. Start Polling Mikrotik Status via NetworkMonitor
    if (window.NetworkMonitor && customerId) {
        window.NetworkMonitor.pollCustomerStatus(customerId, 5000, {
            chart: trafficChart
        });
    }

    // 4. Auto-resolve Addon Request
    const urlParams = new URLSearchParams(window.location.search);
    const resolveAddonId = urlParams.get('resolve_addon');
    if (resolveAddonId) {
        fetch('{% url "resolve_addon_request_api" %}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({ request_id: resolveAddonId })
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'success') {
                const editBtn = document.querySelector('a.btn-edit[href*="/edit/"]');
                if(editBtn) {
                    editBtn.classList.remove('btn-edit');
                    editBtn.classList.add('bg-danger', 'text-white', 'pulse-animation');
                    editBtn.innerHTML = '<i class="fas fa-exclamation-circle"></i> Complete Add-on Here';
                    alert("Add-on Application processed!\nPlease click the 'Complete Add-on Here' button to update the customer's Cignal Play details.");
                }
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        });
    }
});
</script>
