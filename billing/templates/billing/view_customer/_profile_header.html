<!-- Base Partial: Profile Header -->
    <div class="profile-header">
        <div class="d-flex align-items-center">
            <div class="profile-avatar-ring">{{ customer.full_name|make_list|first|upper }}</div>
            <div>
                <h1 class="profile-title">{{ customer.full_name }}</h1>
                <div class="profile-subtitle">
                    <i class="fas fa-map-marker-alt me-1"></i> {{ customer.barangay.name|default:"No Barangay" }}
                    {% if customer.pppoe_username %} &bull; <i class="fas fa-user me-1"></i>{{ customer.pppoe_username }}{% endif %}
                </div>
                <div class="status-badge {{ customer.status }}">
                    <span style="width:7px; height:7px; border-radius:50%; background:currentColor; opacity:0.7; display:inline-block;"></span>
                    {{ customer.get_status_display }}
                </div>
            </div>
        </div>
    </div>
