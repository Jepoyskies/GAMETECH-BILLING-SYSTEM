<!-- Base Partial: Modern Toggle Filters -->
<div class="gt-filter-pills-row animate-fade-in animate-delay-1" style="--section-accent: #3b82f6;">
    <a href="?filter=all" class="gt-filter-pill {% if filter_type == 'all' or not filter_type %}active{% endif %}">
        <i class="fas fa-layer-group"></i> All Subscribers
    </a>
    <a href="?filter=active" class="gt-filter-pill {% if filter_type == 'active' %}active{% endif %}">
        <i class="fas fa-wifi text-success"></i> Active
    </a>
    <a href="?filter=expiring" class="gt-filter-pill {% if filter_type == 'expiring' %}active{% endif %}">
        <i class="fas fa-clock text-warning"></i> Expiring (&le; 7d)
    </a>
    <a href="?filter=paid_offline" class="gt-filter-pill {% if filter_type == 'paid_offline' or filter_type == 'paid_but_offline' %}active{% endif %}">
        <i class="fas fa-triangle-exclamation text-warning"></i> Paid but Offline
    </a>
    <a href="?filter=expired" class="gt-filter-pill {% if filter_type == 'expired' %}active{% endif %}">
        <i class="fas fa-ban text-danger"></i> Expired (&le; 7d)
    </a>
    <a href="?filter=inactive" class="gt-filter-pill {% if filter_type == 'inactive' %}active{% endif %}">
        <i class="fas fa-power-off text-secondary"></i> Inactive (&gt; 7d)
    </a>
</div>
