<!--
  Lifecycle filters. Driven by billing.customer_state.FILTERS so the pills and
  the KPI cards can never drift apart, and so each pill is exactly one
  mutually exclusive bucket.

  "Connected, Unpaid" is new and is the state the old PHP system could not
  represent: past due on paper, still online in reality. That is a
  collections queue, not an outage, and it must never be auto-suspended.
-->
<div class="gt-filter-pills-row animate-fade-in animate-delay-1">
    <a href="?filter=all" class="gt-filter-pill {% if filter_type == 'all' or not filter_type %}active{% endif %}">
        <i class="fas fa-layer-group"></i> All Subscribers
    </a>
    {% for key, label, icon, tone, count in lifecycle_filters %}
    <a href="?filter={{ key }}" class="gt-filter-pill {% if filter_type == key %}active{% endif %}"
       title="{{ label }}">
        <i class="fas {{ icon }} text-{{ tone }}"></i> {{ label }}
        {% if count %}<span class="badge bg-secondary rounded-pill ms-1">{{ count }}</span>{% endif %}
    </a>
    {% endfor %}
</div>
