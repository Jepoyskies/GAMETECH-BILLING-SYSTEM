<!-- Base Partial: Modern Toggle Filters -->
<div class="mb-4 d-flex flex-wrap align-items-center justify-content-between gap-3 animate-fade-in animate-delay-1">
    <div class="gt-filter-pills-container">
        <a href="?filter=all" class="gt-filter-pill {% if filter_type == 'all' or not filter_type %}active{% endif %}">
            <i class="fas fa-layer-group"></i> All Subscribers
        </a>
        <a href="?filter=active" class="gt-filter-pill active-success {% if filter_type == 'active' %}active{% endif %}">
            <i class="fas fa-wifi text-success"></i> Active
        </a>
        <a href="?filter=expiring" class="gt-filter-pill active-warning {% if filter_type == 'expiring' %}active{% endif %}">
            <i class="fas fa-clock text-warning"></i> Expiring (&le; 7d)
        </a>
        <a href="?filter=paid_offline" class="gt-filter-pill active-warning {% if filter_type == 'paid_offline' or filter_type == 'paid_but_offline' %}active{% endif %}">
            <i class="fas fa-triangle-exclamation text-warning"></i> Paid but Offline
        </a>
        <a href="?filter=expired" class="gt-filter-pill active-danger {% if filter_type == 'expired' %}active{% endif %}">
            <i class="fas fa-triangle-exclamation text-danger"></i> Expired (&le; 7d)
        </a>
        <a href="?filter=inactive" class="gt-filter-pill active-secondary {% if filter_type == 'inactive' %}active{% endif %}">
            <i class="fas fa-power-off text-secondary"></i> Inactive (&gt; 7d)
        </a>
    </div>
</div>
