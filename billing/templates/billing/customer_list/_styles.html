<!-- Base Partial: Styles -->
<!-- DataTables Bootstrap 5 & Responsive CSS -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css">
<style>
    #customerTable th,
    #customerTable td {
        padding: 0.6rem !important;
        font-size: 0.95rem;
    }

    /* Subtle row hover effect */
    #customerTable tbody tr {
        transition: background-color 0.15s ease, transform 0.1s ease;
    }
    #customerTable tbody tr:hover {
        background-color: rgba(255, 255, 255, 0.05) !important;
    }
    html.dark-mode #customerTable tbody tr:hover,
    body.dark-mode #customerTable tbody tr:hover {
        background-color: rgba(255, 255, 255, 0.05) !important;
    }

    .dataTables_length,
    .dataTables_filter {
        margin-bottom: 1rem;
    }

    /* ============================================================
       FUTURISTIC GLASSMORPHIC HEADER & CONTROLS
    ============================================================ */
    .customer-hero-card {
        position: relative;
        background: radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.18) 0%, rgba(15, 23, 42, 0.95) 75%),
                    linear-gradient(135deg, rgba(30, 41, 59, 0.9) 0%, rgba(15, 23, 42, 0.98) 100%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 18px;
        padding: 1.5rem 1.75rem;
        box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.5), 0 0 35px -5px rgba(56, 189, 248, 0.15);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        overflow: hidden;
    }
    .customer-hero-card::after {
        content: '';
        position: absolute;
        top: -50%;
        right: -15%;
        width: 320px;
        height: 320px;
        background: radial-gradient(circle, rgba(14, 165, 233, 0.22) 0%, rgba(14, 165, 233, 0) 70%);
        border-radius: 50%;
        pointer-events: none;
        filter: blur(30px);
    }
    .customer-hero-icon {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        background: rgba(56, 189, 248, 0.15);
        border: 1px solid rgba(56, 189, 248, 0.35);
        color: #38bdf8;
        box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
    }

    /* ============================================================
       TOP STAT PILLS (EXCITEMENT COUNTERS)
    ============================================================ */
    .gt-stat-pill {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        padding: 0.85rem 1.25rem;
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s ease, box-shadow 0.2s ease;
        text-decoration: none;
        color: inherit;
    }
    .gt-stat-pill:hover {
        transform: translateY(-2px);
        border-color: rgba(56, 189, 248, 0.35);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25), 0 0 15px rgba(56, 189, 248, 0.1);
    }
    .gt-stat-pill-icon {
        width: 42px;
        height: 42px;
        border-radius: 11px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.15rem;
        flex-shrink: 0;
    }
    .gt-stat-pill-total .gt-stat-pill-icon {
        background: rgba(56, 189, 248, 0.15);
        border: 1px solid rgba(56, 189, 248, 0.3);
        color: #38bdf8;
    }
    .gt-stat-pill-active .gt-stat-pill-icon {
        background: rgba(34, 197, 94, 0.15);
        border: 1px solid rgba(34, 197, 94, 0.3);
        color: #22c55e;
    }
    .gt-stat-pill-expiring .gt-stat-pill-icon {
        background: rgba(245, 158, 11, 0.15);
        border: 1px solid rgba(245, 158, 11, 0.3);
        color: #f59e0b;
    }
    .gt-stat-pill-offline .gt-stat-pill-icon {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #ef4444;
    }
    .gt-stat-pill-inactive .gt-stat-pill-icon {
        background: rgba(148, 163, 184, 0.15);
        border: 1px solid rgba(148, 163, 184, 0.3);
        color: #94a3b8;
    }
    .gt-stat-pill-val {
        font-size: 1.35rem;
        font-weight: 800;
        line-height: 1.1;
        color: #f8fafc;
        font-family: var(--gt-font-mono, monospace);
    }
    .gt-stat-pill-lbl {
        font-size: 0.72rem;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 600;
    }

    /* ============================================================
       MODERN TOGGLE FILTER PILLS
    ============================================================ */
    .gt-filter-pills-container {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
    }
    .gt-filter-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.45rem 1.1rem;
        font-size: 0.84rem;
        font-weight: 600;
        border-radius: 9999px;
        text-decoration: none;
        transition: all 0.2s ease;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #94a3b8;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }
    .gt-filter-pill:hover {
        background: rgba(255, 255, 255, 0.08);
        color: #f8fafc;
        border-color: rgba(255, 255, 255, 0.25);
        transform: translateY(-1px);
    }
    .gt-filter-pill.active {
        background: #0284c7;
        border-color: #38bdf8;
        color: #ffffff;
        box-shadow: 0 0 15px rgba(2, 132, 199, 0.45), 0 4px 10px rgba(0, 0, 0, 0.2);
    }
    .gt-filter-pill.active-success.active {
        background: #16a34a;
        border-color: #4ade80;
        box-shadow: 0 0 15px rgba(22, 163, 74, 0.45);
    }
    .gt-filter-pill.active-warning.active {
        background: #d97706;
        border-color: #fbbf24;
        box-shadow: 0 0 15px rgba(217, 119, 6, 0.45);
    }
    .gt-filter-pill.active-danger.active {
        background: #dc2626;
        border-color: #f87171;
        box-shadow: 0 0 15px rgba(220, 38, 38, 0.45);
    }
    .gt-filter-pill.active-secondary.active {
        background: #475569;
        border-color: #94a3b8;
        box-shadow: 0 0 15px rgba(71, 85, 105, 0.45);
    }

    /* ============================================================
       ULTRA-COMPACT MOBILE-FIRST ARCHITECTURE
       Mobile (<768px): block-level cards  |  Desktop: normal table
    ============================================================ */
    @media (max-width: 767.98px) {

        /* ── Hide desktop table chrome ── */
        #customerTable thead { display: none !important; }
        #customerTable,
        #customerTable tbody { display: block !important; width: 100% !important; }

        /* ── Each <tr> becomes a compact profile card ── */
        #customerTable tbody tr {
            display: block;
            position: relative;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 11px 13px 9px 13px;
            margin-bottom: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        #customerTable tbody tr.table-warning { border-color: #fde68a; background: #fffbeb; }
        #customerTable tbody tr.table-secondary { border-color: #e2e8f0; background: #f8fafc; }

        /* ── All <td> reset ── */
        #customerTable tbody tr td {
            display: block;
            padding: 0 !important;
            border: none !important;
        }

        /* col 1 – Checkbox: hide on mobile */
        #customerTable tbody tr td:nth-child(1) { display: none; }

        /* col 2 – Full Name: bold, leave room for button */
        #customerTable tbody tr td:nth-child(2) {
            font-size: 0.9rem;
            font-weight: 700;
            color: #1e293b;
            padding-right: 72px !important;
        }

        /* col 3 – Email: hide */
        #customerTable tbody tr td:nth-child(3) { display: none; }

        /* col 4 – Phone */
        #customerTable tbody tr td:nth-child(4) {
            font-size: 0.76rem;
            color: #64748b;
            margin-top: 3px;
        }

        /* col 5 – Plan: inline */
        #customerTable tbody tr td:nth-child(5) {
            display: inline !important;
            font-size: 0.74rem;
            color: #64748b;
            margin-top: 4px;
        }

        /* col 6 – Agent: hide */
        #customerTable tbody tr td:nth-child(6) { display: none; }

        /* col 7 – Barangay: inline next to Plan */
        #customerTable tbody tr td:nth-child(7) {
            display: inline !important;
            font-size: 0.74rem;
            color: #64748b;
        }
        #customerTable tbody tr td:nth-child(7)::before {
            content: '  ·  ';
            color: #cbd5e1;
        }

        /* col 8 – Router: hide */
        #customerTable tbody tr td:nth-child(8) { display: none; }

        /* col 9 – Status: hide the big badge; show only conn-status badge */
        #customerTable tbody tr td:nth-child(9) { margin-top: 5px; }
        #customerTable tbody tr td:nth-child(9) > .badge:first-child { display: none !important; }

        /* col 10 – Actions: absolute top-right */
        #customerTable tbody tr td:nth-child(10) {
            position: absolute;
            top: 10px;
            right: 10px;
        }
        #customerTable tbody tr td:nth-child(10) .btn {
            padding: 3px 10px;
            font-size: 0.74rem;
        }
    }
</style>
