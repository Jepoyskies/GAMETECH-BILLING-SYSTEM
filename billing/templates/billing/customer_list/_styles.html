<!-- Base Partial: Customer Directory Scoped Styles -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css">

<style>
/* The shared design system (static/css/gt/*) already themes DataTables.
   Only page-specific layout rules belong here. */

/* Ellipsis on long cells. Auto table layout (no fixed colgroup) so the
   Status/Actions columns are never clipped; DataTables Responsive collapses
   low-priority columns (data-priority on <th>) when space runs out. */
#customerTable td {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 190px;
}
#customerTable td.gt-cell-status,
#customerTable td:last-child {
  max-width: none;
  overflow: visible;
}
.gt-table-card .table-responsive {
  overflow-x: auto;
  overflow-y: hidden;
}

/* KPI filter grid: fills each row evenly at any width (no orphan card). */
.gt-cust-kpis {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 0.75rem;
}
.gt-cust-kpis .gt-kpi-card { min-width: 0; text-decoration: none; align-items: center; transition: transform .15s ease, border-color .2s ease, opacity .2s ease; }
.gt-cust-kpis .gt-kpi-card:hover { transform: translateY(-2px); }
.gt-cust-kpis .gt-kpi-card > div:last-child { min-width: 0; }
/* Wrap to two lines instead of truncating ("NOT LINKED TO ROUâ€¦"). */
.gt-cust-kpis .gt-kpi-card .gt-kpi-lbl {
  white-space: normal;
  line-height: 1.25;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.gt-cust-kpis .gt-kpi-card.is-zero:not(.is-active) { opacity: 0.6; }
.gt-cust-kpis .gt-kpi-card.is-zero:not(.is-active):hover { opacity: 1; }

/* Provisioning integrity strip */
.gt-integrity {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem 1.25rem;
  padding: .85rem 1.1rem; border-radius: 16px;
  background: var(--gt-surface); border: 1px solid var(--gt-border);
}
.gt-integrity__label { display: flex; align-items: flex-start; gap: .6rem; font-size: var(--gt-fs-sm, .85rem); color: var(--gt-text); min-width: 0; flex: 1 1 320px; }
.gt-integrity__label > i { color: #60a5fa; margin-top: .2rem; }
.gt-integrity__hint { display: block; font-size: .78rem; color: var(--gt-text-muted); }
.gt-integrity__chips { display: flex; flex-wrap: wrap; gap: .5rem; }
.gt-int-chip {
  --chip-bg: var(--gt-surface-2); --chip-fg: var(--gt-text);
  display: inline-flex; align-items: center; gap: .45rem;
  padding: .4rem .5rem .4rem .8rem; border-radius: 999px;
  font-size: .78rem; font-weight: 600; text-decoration: none; white-space: nowrap;
  color: var(--chip-fg); background: transparent;
  border: 1px solid color-mix(in srgb, var(--chip-fg) 35%, transparent);
  transition: background .2s ease, transform .15s ease;
}
.gt-int-chip:hover { color: var(--chip-fg); background: var(--chip-bg); transform: translateY(-1px); }
.gt-int-chip.is-active { background: var(--chip-bg); border-color: var(--chip-fg); box-shadow: 0 0 0 3px color-mix(in srgb, var(--chip-fg) 18%, transparent); }
.gt-int-chip--warning { --chip-bg: var(--badge-warning-bg); --chip-fg: var(--badge-warning-text); }
.gt-int-chip--danger  { --chip-bg: var(--badge-danger-bg);  --chip-fg: var(--badge-danger-text); }
.gt-int-chip--clear   { --chip-fg: var(--gt-text-muted); padding-right: .8rem; }
.gt-int-chip__count {
  min-width: 1.6rem; padding: .1rem .5rem; border-radius: 999px; text-align: center;
  font-size: .72rem; font-weight: 800; background: var(--chip-bg); color: var(--chip-fg);
}

/* Name cell: the name truncates, the flags never do. */
#customerTable td.gt-cell-name { max-width: 260px; }
.gt-name-wrap { display: flex; align-items: center; gap: .35rem; min-width: 0; }
.gt-name-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gt-name-flag {
  flex: 0 0 auto; display: inline-grid; place-items: center;
  width: 20px; height: 20px; border-radius: 6px; font-size: .62rem;
}
.gt-name-flag--danger  { background: var(--badge-danger-bg);  color: var(--badge-danger-text); }
.gt-name-flag--warning { background: var(--badge-warning-bg); color: var(--badge-warning-text); }

/* Table toolbar */
.gt-cust-search { flex: 1 1 260px; max-width: 380px; }
.gt-cust-select { width: auto; min-width: 150px; max-width: 200px; }
.gt-cust-count { font-size: var(--gt-fs-sm, 0.85rem); color: var(--gt-text-muted); white-space: nowrap; }
.gt-cust-count strong { color: var(--gt-text-title); }

/* Blind-mode banner (.gt-alert had no styles anywhere in static/css/gt). */
.gt-alert {
  display: flex;
  align-items: flex-start;
  gap: 0.65rem;
  padding: 0.8rem 1rem;
  border-radius: 12px;
  font-size: var(--gt-fs-sm, 0.85rem);
  line-height: 1.5;
}
.gt-alert > i { margin-top: 0.2rem; }
.gt-alert--warning {
  background: var(--badge-warning-bg);
  color: var(--badge-warning-text);
  border: 1px solid color-mix(in srgb, var(--badge-warning-text) 30%, transparent);
}

/* Row State Visual Highlights (triage semantics â€” see AGENTS.md rule 35) */
.table-row-paid-offline  { background: var(--badge-danger-bg) !important; }
.table-row-pending-install{ background: var(--badge-info-bg) !important; }
.table-row-suspended      { background: var(--badge-warning-bg) !important; }
.table-row-expired        { background: var(--badge-danger-bg) !important; }
.table-row-inactive       { opacity: 0.7; }

/* Connection status indicator: hidden telemetry anchor for the poller
   (JS reads its data-* attributes â€” must stay in the DOM). */
.conn-status-indicator { display: none !important; }

/* Server-side sort links in the table header. */
.gt-sort-link {
    color: inherit;
    text-decoration: none;
    white-space: nowrap;
}
.gt-sort-link:hover { color: var(--brand-gold, #fbae1a); }

/* "We cannot measure" state. Must be visibly distinct from BOTH online
   (green) and offline (red) -- this is the guard that stops a router outage
   from being rendered as "every customer is down". See ERR-092 / ERR-094. */
.gt-conn-dot--unknown {
    background: #64748b !important;
    box-shadow: none !important;
    opacity: 0.65;
}

/* Row-level utilities.
   These were inline `style="..."` attributes repeated on every cell of every
   row: 15 per row, 9 distinct values. At 50-100 rows a page that meant 750-1500
   repeated style attributes the browser had to re-resolve on every load. Moved
   here with byte-identical declarations, so rendering is unchanged. */
.gt-cl-center { text-align: center; }
.gt-cl-pick   { cursor: pointer; }
.gt-cl-trunc  { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gt-cl-sm     { font-size: 12px; }
.gt-cl-xs     { font-size: 0.68rem; }
/* The router cell sets this alongside .text-title, which resolves to the same
   colour token; keeping it explicit preserves the original inline value. */
.gt-cl-router { color: var(--text-primary); font-size: 12px; }
.gt-cl-gap    { gap: 0.5rem; }
.gt-cl-gap-sm { gap: 0.4rem; }
/* Pending-install and unknown connection dots, previously inline. */
.gt-cl-dot--pending { background: #0ea5e9; box-shadow: 0 0 6px rgba(14, 165, 233, 0.7); }
.gt-cl-dot--plain   { background: #64748b; }
.gt-cl-hidden { display: none; }
</style>
