<!-- Base Partial: Scripts -->
<!-- JS dependencies for DataTables -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
<script src="https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap5.min.js"></script>

<script>
    $(document).ready(function () {
        // DataTables is retained ONLY as the checkbox/row-helper layer for the
        // bulk actions (SMS, email, transfer router), which use `table.$()`.
        //
        // Searching, filtering, sorting and pagination now happen on the
        // server: the view ships one page of rows instead of all 2,041. That
        // dropped the page from 13.2 MB / ~11s to a few hundred KB / ~1s, and
        // it was regularly OOM-killing the web container on this 2 GB box.
        //
        // So DataTables' own search and ordering are disabled here to avoid two
        // competing UIs, and it renders the current page in full because the
        // server is doing the paging.
        var table = $('#customerTable').DataTable({
            "responsive": true,
            "dom": 'rt',
            "pageLength": -1,
            "searching": false,
            "ordering": false,
            "paging": false,
            "info": false,
            "lengthChange": false,
            "columnDefs": [
                { "orderable": false, "targets": "_all" }
            ]
        });

        {% include "billing/customer_list/_scripts_bulk.html" %}
    });

    function showReason(btn) {
        let el = btn.closest('.conn-status-indicator');
        let status = el.getAttribute('data-status');
        let cid = el.getAttribute('data-customer-id');
        let reason = el.getAttribute('data-health-reason') || "No specific reason provided.";
        let health = el.getAttribute('data-health-status') || "Excellent";
        let balance = el.getAttribute('data-balance');
        
        let routerHealth = el.getAttribute('data-router-health');
        let routerName = el.getAttribute('data-router-name');
        let brgyHealth = el.getAttribute('data-barangay-health');
        let brgyName = el.getAttribute('data-barangay-name');
        let routerUnreachable = el.getAttribute('data-router-unreachable') === 'true';
        let routerApiDown = el.getAttribute('data-router-api-down') === 'true';
        let diffRouter = el.getAttribute('data-different-router');
        let pppoe = el.getAttribute('data-pppoe');

        let effectiveReason = reason;
        let effectiveHealth = health;
        let canResolve = false; 
        let resolveScope = 'customer';
        let resolveId = cid;

        if (status === 'suspended') {
            Swal.fire({
                icon: 'warning',
                title: 'Account Suspended',
                html: `This account is currently suspended.<br><br><b>Advance Payment:</b> ₱${balance}`,
                showCancelButton: true,
                confirmButtonText: '<i class="fas fa-eye me-1"></i> View Profile',
                cancelButtonText: 'Close',
                confirmButtonColor: '#3085d6'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = '/customers/view/' + cid + '/';
                }
            });
            return;
        }

        // Intelligent Diagnosis Logic
        if (diffRouter) {
            effectiveHealth = 'Session on Different Router';
            effectiveReason = `This subscriber's PPPoE session (<b>${pppoe}</b>) is currently active on <b>${diffRouter}</b>, but this account is assigned to <b>${routerName}</b>.<br><br><b>Remedy:</b> Disconnect the session on ${diffRouter} or verify physical port/VLAN routing to authenticate on ${routerName}.`;
            canResolve = false;
        } else if (health === 'Excellent' || !health) {
            if (routerApiDown) {
                effectiveHealth = 'Router API Down';
                effectiveReason = `Cannot communicate with <b>${routerName}</b> over the MikroTik API. The router may be powered off or unreachable from the server.`;
                canResolve = false;
            } else if (routerUnreachable) {
                effectiveHealth = 'Router Uplink Offline';
                effectiveReason = `The assigned router (<b>${routerName}</b>) has lost its internet connection (Uplink Offline - 100% packet loss to 8.8.8.8) or is unreachable. Subscribers on this router cannot connect until uplink is restored.`;
                canResolve = false; 
            } else if (routerHealth && routerHealth !== 'Excellent') {
                effectiveHealth = `${routerHealth} (Router Issue)`;
                effectiveReason = `The main router (${routerName}) is currently experiencing issues.`;
                resolveScope = 'router';
                resolveId = el.getAttribute('data-router-id');
                canResolve = true;
            } else if (brgyHealth && brgyHealth !== 'Excellent') {
                effectiveHealth = `${brgyHealth} (Barangay Issue)`;
                effectiveReason = `The area (${brgyName}) is currently experiencing an outage.`;
                resolveScope = 'barangay';
                resolveId = el.getAttribute('data-barangay-id');
                canResolve = true;
            } else {
                effectiveHealth = 'Isolated Client Offline';
                effectiveReason = `Router <b>${routerName}</b> is online with internet, but customer ONU/CPE (<b>${pppoe || 'No PPPoE'}</b>) is disconnected.<br><br>Possible causes: Customer Wi-Fi router powered off, optical fiber cable unplugged or cut, or ONU LOS red light.`;
                canResolve = false; 
            }
        } else {
            canResolve = true; 
        }

        let swalOptions = {
            icon: canResolve ? 'warning' : 'error',
            title: 'Customer Offline Diagnosis',
            html: `<div class="text-start mt-3 p-3 bg-light rounded border">
                    <b>Network Health:</b> <span class="${canResolve ? 'text-warning' : 'text-danger'}">${effectiveHealth}</span><br>
                    <hr class="my-2">
                    <b>System Diagnosis:</b> <span class="text-muted">${effectiveReason}</span>
                   </div>`,
            showCancelButton: true,
            cancelButtonText: 'Close'
        };

        if (canResolve) {
            swalOptions.confirmButtonText = '<i class="fas fa-check me-1"></i> Resolve Status';
            swalOptions.confirmButtonColor = '#10b981';
        } else {
            swalOptions.showConfirmButton = false;
        }

        Swal.fire(swalOptions).then((result) => {
            if (result.isConfirmed && canResolve) {
                window.location.href = `/network/health/resolve/${resolveScope}/${resolveId}/`;
            }
        });
    }

    function updateConnectionStatuses() {
        if (document.hidden) return; // Skip when tab is hidden
        let indicators = document.querySelectorAll('.conn-status-indicator');
        if (indicators.length === 0) return;
        
        Promise.all([
            fetch('/api/active-usernames/').then(r => { if (!r.ok) throw new Error('Failed to fetch active users'); return r.json(); }),
            fetch('/api/router-uplink/').then(r => { if (!r.ok) throw new Error('Failed to fetch router uplinks'); return r.json(); })
        ])
        .then(([activeData, uplinkData]) => {
            if (activeData.status === 'success') {
                let active_users = new Set(activeData.active_usernames || []);
                let user_router_map = activeData.user_router_map || {};
                let offline_routers = new Set(activeData.offline_routers || []);
                
                let router_uplinks = {};
                if (uplinkData && uplinkData.routers) {
                    uplinkData.routers.forEach(r => {
                        router_uplinks[r.id] = r.uplink_status;
                    });
                }
                
                indicators.forEach(el => {
                    // BLINDNESS GUARD. `active_users` is empty when the routers
                    // cannot be reached, and an empty set means "we could not
                    // look", NOT "nobody is online". Without this check the page
                    // painted every single row red "Offline" during a router
                    // outage -- the browser-side twin of the 1,240 false alarms
                    // the server had (see ERR-092).
                    let canMeasure = active_users && active_users.size > 0;

                    let pppoe = el.getAttribute('data-pppoe');
                    let status = el.getAttribute('data-status');
                    let routerId = parseInt(el.getAttribute('data-router-id'));
                    let tr = el.closest('tr');
                    let baseBadge = tr ? tr.querySelector('.cust-base-badge') : null;
                    let routerBadge = tr ? tr.querySelector('.unified-router-badge') : null;
                    let connBadge = tr ? tr.querySelector('.unified-connection-badge') : null;
                    
                    // 1. Router status: MikroTik device reachable + has uplink
                    let isRouterOnline = true;
                    if (!isNaN(routerId)) {
                        if (offline_routers.has(routerId) || router_uplinks[routerId] === 'Offline') {
                            isRouterOnline = false;
                        }
                    }
                    
                    // 2. Connection status: Customer's PPPoE session active (internet reaching them)
                    let isConnectionOnline = active_users.has(pppoe);
                    
                    // Update router dot (MikroTik device). Class hooks are load-bearing
                    // (queried above) — only the rendered content changed to a dot.
                    if (routerBadge) {
                        if (isRouterOnline) {
                            routerBadge.className = 'unified-status-badge unified-router-badge gt-conn-dot gt-conn-dot--online status-badge--success';
                            routerBadge.title = 'MikroTik Router: Online';
                            routerBadge.innerHTML = '';
                        } else {
                            routerBadge.className = 'unified-status-badge unified-router-badge gt-conn-dot gt-conn-dot--offline status-badge--neutral';
                            routerBadge.title = 'MikroTik Router: Offline';
                            routerBadge.innerHTML = '';
                        }
                    }
                    
                    // Update connection dot (Customer's PPPoE session)
                    if (connBadge) {
                        if (!canMeasure) {
                            // We cannot see. Say so, never accuse.
                            connBadge.className = 'unified-status-badge unified-connection-badge gt-conn-dot gt-conn-dot--unknown status-badge--neutral';
                            connBadge.title = 'Customer Connection: Unknown (routers not visible right now)';
                            connBadge.innerHTML = '';
                        } else if (isConnectionOnline) {
                            connBadge.className = 'unified-status-badge unified-connection-badge gt-conn-dot gt-conn-dot--online status-badge--success';
                            connBadge.title = 'Customer Connection: Online';
                            connBadge.innerHTML = '';
                        } else {
                            connBadge.className = 'unified-status-badge unified-connection-badge gt-conn-dot gt-conn-dot--offline status-badge--danger';
                            connBadge.title = 'Customer Connection: Offline';
                            connBadge.innerHTML = '';
                        }
                    }
                    
                    // Set diagnostic attributes for showReason()
                    if (!isRouterOnline) {
                        el.setAttribute('data-router-unreachable', 'true');
                        if (offline_routers.has(routerId)) {
                            el.setAttribute('data-router-api-down', 'true');
                        }
                    }
                    if (isConnectionOnline && user_router_map[pppoe] && !isNaN(routerId) && user_router_map[pppoe].router_id !== routerId) {
                        el.setAttribute('data-different-router', user_router_map[pppoe].router_name);
                    }
                    
                    // Update row highlighting
                    if (tr) {
                        tr.classList.remove('table-row-paid-offline');
                        tr.classList.remove('table-row-pending-install');
                        tr.classList.remove('table-row-suspended');
                        
                        if (status === 'suspended') {
                            tr.classList.add('table-row-suspended');
                        } else if (status === 'active' && !isConnectionOnline) {
                            tr.classList.add('table-row-paid-offline');
                        }
                    }
                    
                    // Update base badge visibility
                    if (baseBadge) {
                        baseBadge.style.display = '';
                        if (status === 'active' && isConnectionOnline) {
                            baseBadge.className = 'status-badge status-badge--success cust-base-badge';
                            baseBadge.innerHTML = '<span class="status-dot"></span>Active';
                        }
                    }
                });
            }
        })
        .catch(err => console.error("Error fetching connection statuses", err));
    }
    
    // Run immediately, then every 60 seconds (reduced from 30s)
    updateConnectionStatuses();
    setInterval(updateConnectionStatuses, 60000);
    
    // Also run when DataTables redraws the page
    $('#customerTable').on('draw.dt', function () {
        updateConnectionStatuses();
    });
</script>
