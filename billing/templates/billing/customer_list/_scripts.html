<!-- Base Partial: Scripts -->
<!-- JS dependencies for DataTables -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
<script src="https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap5.min.js"></script>

<script>
    $(document).ready(function () {
        var table = $('#customerTable').DataTable({
            "responsive": true,
            "dom": '<"d-flex flex-column flex-md-row justify-content-between align-items-center mt-4 mb-3 px-3 px-md-4"lf>rt<"d-flex flex-column flex-md-row justify-content-between align-items-center mt-3 mb-4 px-3 px-md-4"ip>',
            "lengthMenu": [10, 25, 50, 100, -1],
            "pageLength": 10,
            "order": [], // Use backend custom sorting
            "language": {
                "search": "",
                "searchPlaceholder": "Search customers..."
            },
            "columnDefs": [
                { "orderable": false, "targets": 0 }, // Disable sorting on Checkbox column
                { "orderable": false, "targets": 9 }  // Disable sorting on Actions column
            ]
        });

        $('#routerFilter').on('change', function () {
            table.column(7).search(this.value).draw();
        });

        $('#barangayFilter').on('change', function () {
            table.column(6).search(this.value).draw();
        });

        // --- Bulk SMS & Email Logic ---
        function updateSelectedCount() {
            var selectedCount = table.$('.customer-checkbox:checked').length;
            $('#selectedCount').text(selectedCount);
            $('#modalSelectedCount').text(selectedCount);
            $('#btnBulkSms').prop('disabled', selectedCount === 0);
            
            $('#selectedEmailCount').text(selectedCount);
            $('#modalSelectedEmailCount').text(selectedCount);
            $('#btnBulkEmail').prop('disabled', selectedCount === 0);
            
            var totalCount = table.$('.customer-checkbox').length;
            $('#selectAllCheckbox').prop('checked', selectedCount > 0 && selectedCount === totalCount);
            
            // Add Transfer Logic
            $('#selectedTransferCount').text(selectedCount);
            $('#transferCountDisplay').text(selectedCount);
            $('#btnBulkTransfer').prop('disabled', selectedCount === 0);
            $('#transferCustomerInputs').empty();
            table.$('.customer-checkbox:checked').each(function() {
                $('#transferCustomerInputs').append(`<input type="hidden" name="customer_ids" value="${$(this).val()}">`);
            });
        }

        $('#selectAllCheckbox').on('change', function() {
            var isChecked = $(this).prop('checked');
            // Only select the rows that are currently visible/filtered by the user's search
            table.$('.customer-checkbox', {"filter":"applied"}).prop('checked', isChecked);
            updateSelectedCount();
        });

        $('#customerTable tbody').on('change', '.customer-checkbox', function() {
            updateSelectedCount();
        });

        table.on('draw', function() {
            updateSelectedCount(); // re-eval when page/filter changes
        });

        $('#btnSendBulkSms').on('click', function() {
            var selectedIds = [];
            // We use table.$ to query all pages of the datatable, not just the visible page.
            table.$('.customer-checkbox:checked').each(function() {
                selectedIds.push($(this).val());
            });
            var message = $('#bulkSmsMessage').val();
            
            if (!message.trim()) {
                Swal.fire('Error', 'Please enter a message.', 'error');
                return;
            }
            
            $(this).html('<i class="fas fa-spinner fa-spin me-2"></i> Sending...').prop('disabled', true);
            
            $.ajax({
                url: '{% url "bulk_sms_view" %}',
                type: 'POST',
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                contentType: 'application/json',
                data: JSON.stringify({
                    customer_ids: selectedIds,
                    message: message
                }),
                success: function(response) {
                    if (response.success) {
                        $('#bulkSmsModal').modal('hide');
                        $('#bulkSmsMessage').val('');
                        table.$('.customer-checkbox').prop('checked', false);
                        $('#selectAllCheckbox').prop('checked', false);
                        updateSelectedCount();
                        
                        Swal.fire({
                            title: 'Success!',
                            text: 'Successfully sent ' + response.sent_count + ' SMS messages.',
                            icon: 'success',
                            confirmButtonColor: '#10b981'
                        });
                    } else {
                        Swal.fire('Error', response.error || 'Unknown error occurred.', 'error');
                    }
                },
                error: function(err) {
                    Swal.fire('Error', 'A network error occurred.', 'error');
                },
                complete: function() {
                    $('#btnSendBulkSms').html('Send Now <i class="fas fa-paper-plane ms-2"></i>').prop('disabled', false);
                }
            });
        });

        $('#btnSendBulkEmail').on('click', function() {
            var selectedIds = [];
            table.$('.customer-checkbox:checked').each(function() {
                selectedIds.push($(this).val());
            });
            var subject = $('#bulkEmailSubject').val();
            var message = $('#bulkEmailMessage').val();
            
            if (!subject.trim() || !message.trim()) {
                Swal.fire('Error', 'Please enter a subject and a message.', 'error');
                return;
            }
            
            $(this).html('<i class="fas fa-spinner fa-spin me-2"></i> Sending...').prop('disabled', true);
            
            $.ajax({
                url: '{% url "bulk_email_view" %}',
                type: 'POST',
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                contentType: 'application/json',
                data: JSON.stringify({
                    customer_ids: selectedIds,
                    subject: subject,
                    message: message
                }),
                success: function(response) {
                    if (response.success) {
                        $('#bulkEmailModal').modal('hide');
                        $('#bulkEmailSubject').val('');
                        $('#bulkEmailMessage').val('');
                        table.$('.customer-checkbox').prop('checked', false);
                        $('#selectAllCheckbox').prop('checked', false);
                        updateSelectedCount();
                        
                        Swal.fire({
                            title: 'Success!',
                            text: 'Successfully sent ' + response.sent_count + ' Email messages.',
                            icon: 'success',
                            confirmButtonColor: '#10b981'
                        });
                    } else {
                        Swal.fire('Error', response.error || 'Unknown error occurred.', 'error');
                    }
                },
                error: function(err) {
                    Swal.fire('Error', 'A network error occurred.', 'error');
                },
                complete: function() {
                    $('#btnSendBulkEmail').html('Send Now <i class="fas fa-paper-plane ms-2"></i>').prop('disabled', false);
                }
            });
        });
    });
</script>

<script>
    function showReason(btn) {
        let el = btn.closest('.conn-status-indicator');
        let status = el.getAttribute('data-status');
        let cid = el.getAttribute('data-customer-id');
        let reason = el.getAttribute('data-health-reason') || "No specific reason provided.";
        let health = el.getAttribute('data-health-status') || "Excellent";
        let balance = el.getAttribute('data-balance');
        
        let routerHealth = el.getAttribute('data-router-health');
        let routerName = el.getAttribute('data-router-name');
        let brgyHealth = el.getAttribute('data-barangay-health');
        let brgyName = el.getAttribute('data-barangay-name');
        let routerUnreachable = el.getAttribute('data-router-unreachable') === 'true';

        let effectiveReason = reason;
        let effectiveHealth = health;
        let canResolve = false; 
        let resolveScope = 'customer';
        let resolveId = cid;

        if (status === 'suspended') {
            Swal.fire({
                icon: 'warning',
                title: 'Account Suspended',
                html: `This account is currently suspended.<br><br><b>Advance Payment:</b> ₱${balance}`,
                showCancelButton: true,
                confirmButtonText: '<i class="fas fa-eye me-1"></i> View Profile',
                cancelButtonText: 'Close',
                confirmButtonColor: '#3085d6'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = '/customers/view/' + cid + '/';
                }
            });
            return;
        }

        // Intelligent Diagnosis Logic
        if (health === 'Excellent' || !health) {
            if (routerUnreachable) {
                effectiveHealth = 'Router Uplink Offline';
                effectiveReason = `The main router (${routerName}) has lost its internet connection (Uplink Offline) or is completely unreachable from the server.`;
                canResolve = false; 
            } else if (routerHealth && routerHealth !== 'Excellent') {
                effectiveHealth = `${routerHealth} (Router Issue)`;
                effectiveReason = `The main router (${routerName}) is currently experiencing issues.`;
                resolveScope = 'router';
                resolveId = el.getAttribute('data-router-id');
                canResolve = true;
            } else if (brgyHealth && brgyHealth !== 'Excellent') {
                effectiveHealth = `${brgyHealth} (Barangay Issue)`;
                effectiveReason = `The area (${brgyName}) is currently experiencing an outage.`;
                resolveScope = 'barangay';
                resolveId = el.getAttribute('data-barangay-id');
                canResolve = true;
            } else {
                effectiveHealth = 'Isolated Offline';
                effectiveReason = 'Customer router is unplugged, fiber cable is cut, or there is a localized power outage.';
                canResolve = false; 
            }
        } else {
            canResolve = true; 
        }

        let swalOptions = {
            icon: canResolve ? 'warning' : 'error',
            title: 'Customer Offline Diagnosis',
            html: `<div class="text-start mt-3 p-3 bg-light rounded border">
                    <b>Network Health:</b> <span class="${canResolve ? 'text-warning' : 'text-danger'}">${effectiveHealth}</span><br>
                    <hr class="my-2">
                    <b>System Diagnosis:</b> <span class="text-muted">${effectiveReason}</span>
                   </div>`,
            showCancelButton: true,
            cancelButtonText: 'Close'
        };

        if (canResolve) {
            swalOptions.confirmButtonText = '<i class="fas fa-check me-1"></i> Resolve Status';
            swalOptions.confirmButtonColor = '#10b981';
        } else {
            swalOptions.showConfirmButton = false;
        }

        Swal.fire(swalOptions).then((result) => {
            if (result.isConfirmed && canResolve) {
                window.location.href = `/network/health/resolve/${resolveScope}/${resolveId}/`;
            }
        });
    }

    function updateConnectionStatuses() {
        let indicators = document.querySelectorAll('.conn-status-indicator');
        if (indicators.length === 0) return;
        
        Promise.all([
            fetch('/api/active-usernames/').then(res => res.json()),
            fetch('/api/router-uplink/').then(res => res.json())
        ])
        .then(([activeData, uplinkData]) => {
            if (activeData.status === 'success') {
                let active_users = new Set(activeData.active_usernames);
                let offline_routers = new Set(activeData.offline_routers || []);
                
                // Map router uplink statuses
                let router_uplinks = {};
                if (uplinkData.routers) {
                    uplinkData.routers.forEach(r => {
                        router_uplinks[r.id] = r.uplink_status;
                    });
                }
                
                indicators.forEach(el => {
                    let pppoe = el.getAttribute('data-pppoe');
                    let status = el.getAttribute('data-status');
                    let routerId = parseInt(el.getAttribute('data-router-id'));
                    let btnHtml = '<button class="btn btn-sm btn-light p-0 ms-1 rounded-circle shadow-sm border" onclick="showReason(this)" title="View Reason" style="width: 22px; height: 22px; line-height: 20px; display: inline-flex; align-items: center; justify-content: center;"><i class="fas fa-exclamation-circle text-danger" style="font-size: 0.8rem;"></i></button>';
                    
                    if (status === 'suspended') {
                        el.innerHTML = '<span class="badge bg-danger rounded-pill shadow-sm mt-1"><i class="fas fa-ban me-1"></i>Suspended</span>' + btnHtml;
                    } else if (!pppoe) {
                        el.innerHTML = '<span class="badge bg-secondary rounded-pill shadow-sm mt-1"><i class="fas fa-question-circle me-1"></i>No PPPoE</span>';
                    } else if (active_users.has(pppoe)) {
                        el.innerHTML = '<span class="badge bg-success rounded-pill shadow-sm mt-1" style="background-color: #10b981 !important;"><i class="fas fa-check-circle me-1"></i>Active</span>';
                    } else {
                        let isRouterOffline = false;
                        if (!isNaN(routerId)) {
                            // Offline if API connection completely failed
                            if (offline_routers.has(routerId)) isRouterOffline = true;
                            // OR offline if router is connected but has no internet (uplink offline)
                            if (router_uplinks[routerId] === 'Offline') isRouterOffline = true;
                        }

                        if (isRouterOffline) {
                            el.setAttribute('data-router-unreachable', 'true');
                        }
                        el.innerHTML = '<span class="badge rounded-pill shadow-sm mt-1" style="background-color: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3);"><i class="fas fa-wifi me-1" style="text-decoration: line-through;"></i>Offline</span>' + btnHtml;
                    }
                });
            }
        })
        .catch(err => console.error("Error fetching connection statuses", err));
    }
    
    // Run immediately, then every 30 seconds
    updateConnectionStatuses();
    setInterval(updateConnectionStatuses, 30000);
    
    // Also run when DataTables redraws the page
    $('#customerTable').on('draw.dt', function () {
        updateConnectionStatuses();
    });
</script>
{% endblock %}
