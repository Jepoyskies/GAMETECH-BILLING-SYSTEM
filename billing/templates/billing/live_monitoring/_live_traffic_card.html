<!-- Base Partial: Live Traffic Card -->
<!-- Bottom Live Traffic Card -->
<div class="traffic-card">
    <div class="traffic-header">
        <div class="traffic-title" style="cursor: pointer;" onclick="openViewAllModal('traffic')" title="Click bar to expand to larger window">
            <i class="fas fa-network-wired text-success"></i>
            <span>Live Traffic Activity</span>
            <span class="traffic-pulse-dot" title="Live stream active"></span>
        </div>
        <div class="d-flex align-items-center gap-2">
            <div class="traffic-search-wrap">
                <i class="fas fa-search traffic-search-icon"></i>
                <input type="search" id="customSearch" class="form-control"
                    placeholder="Search customer, IP..." aria-label="Search live traffic">
            </div>
            <button type="button" class="btn-card-expand" onclick="openViewAllModal('traffic')" title="Expand to larger window" aria-label="Expand Live Traffic Activity">
                <i class="fas fa-up-right-and-down-left-from-center"></i>
            </button>
        </div>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table id="liveTrafficTable" class="table align-middle dt-responsive nowrap gt-traffic-table mb-0"
                style="width:100%">
                <thead>
                    <tr>
                        <th>Customer (PPPoE)</th>
                        <th>Real-time Bandwidth</th>
                        <th>Uptime</th>
                        <th class="text-end">Action</th>
                    </tr>
                </thead>
                <tbody id="usersGrid">
                </tbody>
            </table>
        </div>
    </div>
</div>
