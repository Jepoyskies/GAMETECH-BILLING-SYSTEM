<!-- Base Partial: Search Customer Modal -->
    <!-- Search Customer Modal -->
    <div class="modal fade" id="searchCustomerModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content gt-modal-content">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold"><i class="fas fa-search text-primary me-2"></i> Search Customer</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">Select Customer</label>
                        <select class="form-select" id="customerSearchSelect" style="width: 100%;">
                            <option value="">Search by Name...</option>
                            {% for c in customers %}
                                <option value="{{ c.id }}">{{ c.full_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div id="searchCustomerDetails" style="display: none;" class="mt-4">
                        <div class="p-3 rounded bg-light border">
                            <h6 class="fw-bold mb-3" id="searchCustName">Customer Name</h6>
                            <div class="row g-2 text-sm">
                                <div class="col-6"><span class="text-muted">Status:</span> <strong id="searchCustStatus">...</strong></div>
                                <div class="col-6"><span class="text-muted">Stability:</span> <strong id="searchCustStability">...</strong></div>
                                <div class="col-6"><span class="text-muted">Download:</span> <strong id="searchCustDl" class="text-info">...</strong></div>
                                <div class="col-6"><span class="text-muted">Upload:</span> <strong id="searchCustUl" class="text-warning">...</strong></div>
                                <div class="col-12"><span class="text-muted">Uptime:</span> <strong id="searchCustUptime">...</strong></div>
                                <div class="col-12"><span class="text-muted">MAC:</span> <strong id="searchCustMac">...</strong></div>
                            </div>
                            <div class="mt-3 text-end">
                                <a href="#" id="searchCustLink" class="btn btn-primary btn-sm px-4 rounded-pill">View Profile</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
