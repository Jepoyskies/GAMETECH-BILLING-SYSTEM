<!-- Base Partial: View All Modal -->
<!-- View All / Expanded Window Modal -->
<div class="modal fade" id="viewAllModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content gt-modal-card">
            <div class="modal-header">
                <div class="d-flex align-items-center gap-2">
                    <span class="gt-modal-icon-badge" id="viewAllModalIcon"><i class="fas fa-chart-pie"></i></span>
                    <h5 class="modal-title fw-bold mb-0" id="viewAllModalTitle">Expanded View</h5>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill px-3" id="viewAllModalFullscreenBtn" onclick="toggleModalFullscreen()" title="Toggle Fullscreen">
                        <i class="fas fa-up-right-and-down-left-from-center me-1"></i> Fullscreen
                    </button>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
            </div>
            <div class="modal-body p-0" id="viewAllModalBody">
            </div>
        </div>
    </div>
</div>
