<!-- JS dependencies for DataTables -->

<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
<!-- DataTables Responsive JS -->
<script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>

<script>
    let allData = [];
    let maxRx = 0;
    let maxTx = 0;
    let fastTimer = null;
    let slowTimer = null;
    let liveTrafficTable = null;
    
    let modalCustomer = null;
    let customerChartObj = null;
    let custRxData = Array(20).fill(0);
    let custTxData = Array(20).fill(0);

    let currentNetworkAlerts = [];
    let currentAddonRequests = [];
    let currentOfflineUsers = [];
    let currentHardwareData = [];

    function openViewAllModal(type) {
        let title = document.getElementById('viewAllModalTitle');
        let body = document.getElementById('viewAllModalBody');
        let html = '<div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light">';

        if (type === 'network') {
            title.innerText = 'All Network Alerts';
            html += '<tr><th class="ps-3">Name</th><th>Type</th><th>Status</th><th>Reason</th><th class="pe-3 text-end">Action</th></tr></thead><tbody>';
            currentNetworkAlerts.forEach(a => {
                let btnColor = 'btn-danger';
                html += `<tr>
                    <td class="ps-3"><span class="fw-bold">${a.name}</span></td>
                    <td><span class="badge bg-secondary">${a.type.toUpperCase()}</span></td>
                    <td><span class="fw-semibold text-danger">${a.status}</span></td>
                    <td class="text-muted small" style="max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${a.reason || '-'}</td>
                    <td class="pe-3 text-end"><a href="${a.type === 'customer' ? '/customers/view/' + a.id + '/' : '/network/health/resolve/' + a.type + '/' + a.id + '/'}" class="btn ${btnColor} rounded-circle d-inline-flex justify-content-center align-items-center" style="width: 26px; height: 26px; padding: 0; font-size: 0.75rem;" title="Resolve"><i class="fas fa-eye"></i></a></td>
                </tr>`;
            });
        } else if (type === 'addons') {
            title.innerText = 'All Pending Add-on Requests';
            html += '<tr><th class="ps-3">Customer</th><th>Add-on Type</th><th>Requested At</th><th class="pe-3 text-end">Action</th></tr></thead><tbody>';
            currentAddonRequests.forEach(req => {
                html += `<tr>
                    <td class="ps-3"><span class="fw-bold">${req.customer_name}</span></td>
                    <td><span class="badge bg-warning text-dark">${req.addon_type}</span></td>
                    <td class="text-muted small">${req.requested_at}</td>
                    <td class="pe-3 text-end"><a href="/customers/view/${req.customer_id}/" class="btn btn-warning rounded-circle d-inline-flex justify-content-center align-items-center" style="width: 26px; height: 26px; padding: 0; font-size: 0.75rem;" title="Process"><i class="fas fa-eye"></i></a></td>
                </tr>`;
            });
        } else if (type === 'offline') {
            title.innerText = 'All Paid Offline Customers';
            html += '<tr><th class="ps-3">Customer</th><th>Username</th><th>Down Since</th><th class="pe-3 text-end">Action</th></tr></thead><tbody>';
            currentOfflineUsers.forEach(u => {
                html += `<tr>
                    <td class="ps-3"><span class="fw-bold">${u.full_name}</span></td>
                    <td><span class="badge bg-primary">${u.username}</span></td>
                    <td class="text-muted small">${u.last_logged_out}</td>
                    <td class="pe-3 text-end"><a href="/customers/view/${u.id}/" class="btn btn-primary rounded-circle d-inline-flex justify-content-center align-items-center" style="width: 26px; height: 26px; padding: 0; font-size: 0.75rem;" title="View"><i class="fas fa-eye"></i></a></td>
                </tr>`;
            });
        } else if (type === 'hardware') {
            title.innerText = 'Hardware Telemetry';
            html += '<tr><th class="ps-3">Device Name</th><th>Status</th><th>CPU</th><th>RAM</th><th>Disk</th><th class="pe-3">Uptime</th></tr></thead><tbody>';
            currentHardwareData.forEach(h => {
                let badgeClass = h.status === 'Online' ? 'bg-success' : 'bg-danger';
                html += `<tr>
                    <td class="ps-3"><span class="fw-bold">${h.name}</span></td>
                    <td><span class="badge ${badgeClass}">${h.status}</span></td>
                    <td><span class="fw-semibold text-info">${h.cpu}</span></td>
                    <td><span class="fw-semibold text-warning">${h.ram}</span></td>
                    <td><span class="fw-semibold text-danger">${h.disk}</span></td>
                    <td class="pe-3 text-muted small">${h.uptime}</td>
                </tr>`;
            });
        }

        if ((type === 'network' && currentNetworkAlerts.length === 0) ||
            (type === 'addons' && currentAddonRequests.length === 0) ||
            (type === 'offline' && currentOfflineUsers.length === 0) ||
            (type === 'hardware' && currentHardwareData.length === 0)) {
            html = '<div class="text-center text-muted p-5">No data to display. <i class="fas fa-check-circle text-success ms-1"></i></div>';
        } else {
            html += '</tbody></table></div>';
        }

        body.innerHTML = html;
        $('#viewAllModal').modal('show');
    }

    function renderOfflineCustomers(offline_users) {
        currentOfflineUsers = offline_users || [];
        let tbody = document.getElementById('offlineUsersList');
        let badge = document.getElementById('offline-badge');
        if (!offline_users || offline_users.length === 0) {
            if (badge) badge.style.display = 'none';
            tbody.innerHTML = '<div class="text-muted small text-center mt-4">All Paid Customers are Online <i class="fas fa-check-circle text-success ms-1"></i></div>';
            return;
        }

        if (badge) {
            badge.style.display = 'inline-block';
            badge.innerText = offline_users.length + ' Offline';
        }

        let html = '';
        offline_users.forEach(u => {
            html += `
        <div class="d-flex justify-content-between align-items-center p-1 px-2 mb-1 border rounded bg-primary-subtle">
            <div class="d-flex align-items-center">
                <i class="fas fa-user-slash text-primary me-2 fs-6"></i>
                <div>
                    <h6 class="mb-0 text-primary fw-bold" style="font-size: 0.85rem;">${u.full_name} <span class="badge bg-primary ms-1">${u.username}</span></h6>
                    <p class="mb-0 text-primary-emphasis small" style="font-size: 0.7rem;"><i class="fas fa-clock me-1"></i>Down since: ${u.last_logged_out}</p>
                </div>
            </div>
            <a href="/customers/view/${u.id}/" class="btn btn-primary rounded-circle d-flex justify-content-center align-items-center me-1" style="width: 22px; height: 22px; padding: 0; font-size: 0.65rem;" title="View" data-bs-toggle="tooltip"><i class="fas fa-eye"></i></a>
        </div>`;
        });
        tbody.innerHTML = html;
    }



    function loadAddonRequests() {
        fetch("{% url 'live_addon_requests_api' %}")
            .then(r => r.json())
            .then(d => {
                currentAddonRequests = d.data || [];
                let list = document.getElementById('addon-requests-list');
                let badge = document.getElementById('addon-badge');
                if (d.data && d.data.length > 0) {
                    badge.style.display = 'inline-block';
                    badge.innerText = d.data.length + ' New';
                    let html = '';
                    d.data.forEach(req => {
                        html += `
                <div class="d-flex justify-content-between align-items-center p-1 px-2 mb-1 border rounded bg-warning-subtle">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-tv text-warning me-2 fs-6"></i>
                        <div>
                            <h6 class="mb-0 text-warning fw-bold" style="font-size: 0.85rem;">${req.addon_type}</h6>
                            <p class="mb-0 fw-semibold text-body" style="font-size: 0.75rem;">${req.customer_name}</p>
                            <p class="mb-0 text-warning-emphasis small" style="font-size: 0.7rem;"><i class="fas fa-clock me-1"></i>${req.requested_at}</p>
                        </div>
                    </div>
                    <div class="d-flex gap-1">
                        <a href="/customers/view/${req.customer_id}/" class="btn btn-warning rounded-circle d-flex justify-content-center align-items-center me-1" style="width: 22px; height: 22px; padding: 0; font-size: 0.65rem;" title="View Profile" data-bs-toggle="tooltip"><i class="fas fa-eye"></i></a>
                        <button type="button" class="btn btn-success rounded-circle d-flex justify-content-center align-items-center" style="width: 22px; height: 22px; padding: 0; font-size: 0.65rem;" title="Apply Add-on" onclick="openApplyAddonModal(${req.id}, ${req.customer_id}, '${req.customer_name}', '${req.addon_type}')"><i class="fas fa-check"></i></button>
                    </div>
                </div>
                `;
                    });
                    list.innerHTML = html;
                } else {
                    badge.style.display = 'none';
                    list.innerHTML = '<div class="text-muted small text-center mt-3">No pending requests <i class="fas fa-check-circle text-success ms-1"></i></div>';
                }
            });
    }

    function loadNetworkAlerts() {
        fetch("{% url 'api_network_alerts' %}")
            .then(r => r.json())
            .then(d => {
                currentNetworkAlerts = d.alerts || [];
                let list = document.getElementById('network-alerts-list');
                let badge = document.getElementById('network-badge');
                if (d.alerts && d.alerts.length > 0) {
                    if (badge) {
                        badge.style.display = 'inline-block';
                        badge.innerText = d.alerts.length + ' New';
                    }
                    let inner = '';
                    d.alerts.forEach(a => {
                        let icon = a.type === 'device' ? 'fa-server' : (a.type === 'barangay' ? 'fa-map-marker-alt' : 'fa-user-times');
                        let btnColor = 'btn-danger';
                        let subClass = 'bg-danger-subtle';
                        let textColor = 'text-danger';
                        let pulseClass = a.type === 'customer' ? 'alert-pulse-danger' : '';

                        inner += `
                <div class="d-flex justify-content-between align-items-center p-1 px-2 mb-1 border border-danger rounded ${subClass} ${pulseClass}">
                    <div class="d-flex align-items-center">
                        <i class="fas ${icon} ${textColor} me-2 fs-6"></i>
                        <div>
                            <h6 class="mb-0 ${textColor} fw-bold" style="font-size: 0.85rem;">${a.name}</h6>
                            <p class="mb-0 fw-semibold text-body" style="font-size: 0.75rem;">${a.status}</p>
                            ${a.reason ? `<p class="mb-0 text-muted small" style="max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.7rem;">${a.reason}</p>` : ''}
                        </div>
                    </div>
                    <a href="${a.type === 'customer' ? '/customers/view/' + a.id + '/' : '/network/health/resolve/' + a.type + '/' + a.id + '/'}" class="btn ${btnColor} rounded-circle d-flex justify-content-center align-items-center me-1" style="width: 22px; height: 22px; padding: 0; font-size: 0.65rem;" title="Resolve" data-bs-toggle="tooltip"><i class="fas fa-eye"></i></a>
                </div>
                `;
                    });
                    list.innerHTML = inner;
                } else {
                    if (badge) badge.style.display = 'none';
                    list.innerHTML = '<div class="text-muted small text-center mt-3">No active alerts <i class="fas fa-check-circle text-success ms-1"></i></div>';
                }
            });
    }

    let bandwidthChart = null;
    let chartLabels = Array(20).fill('');
    let rxChartData = Array(20).fill(0);
    let txChartData = Array(20).fill(0);

    function initChart() {
        const ctx = document.getElementById('bandwidthChart');
        if (!ctx) return;
        bandwidthChart = new Chart(ctx.getContext('2d'), {
            type: 'line',
            data: {
                labels: chartLabels,
                datasets: [
                    {
                        label: 'Download (Mbps)',
                        data: rxChartData,
                        borderColor: '#38bdf8',
                        backgroundColor: 'rgba(56, 189, 248, 0.2)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0
                    },
                    {
                        label: 'Upload (Mbps)',
                        data: txChartData,
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.2)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: { enabled: false }
                },
                scales: {
                    x: { display: false },
                    y: {
                        display: true,
                        position: 'right',
                        ticks: { color: 'rgba(255,255,255,0.7)', font: { size: 10 }, maxTicksLimit: 4 },
                        grid: { color: 'rgba(255,255,255,0.1)' },
                        beginAtZero: true
                    }
                },
                animation: { duration: 0 }
            }
        });
    }

    function initCustomerChart() {
        const ctx = document.getElementById('customerSpecificChart');
        if (!ctx) return;
        customerChartObj = new Chart(ctx.getContext('2d'), {
            type: 'line',
            data: {
                labels: Array(20).fill(''),
                datasets: [
                    {
                        label: 'Download',
                        data: custRxData,
                        borderColor: '#38bdf8',
                        backgroundColor: 'rgba(56, 189, 248, 0.2)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0
                    },
                    {
                        label: 'Upload',
                        data: custTxData,
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.2)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false }, tooltip: { enabled: false } },
                scales: { 
                    x: { display: false }, 
                    y: { 
                        display: true, 
                        position: 'right',
                        ticks: { color: 'rgba(100,116,139,0.8)', font: { size: 10 }, maxTicksLimit: 4 }
                    } 
                },
                animation: { duration: 0 }
            }
        });
    }

    function openCustomerLiveChart(username) {
        modalCustomer = username;
        document.getElementById('modalCustomerTitle').innerText = username;
        
        // Reset chart data
        custRxData.fill(0);
        custTxData.fill(0);
        if (customerChartObj) customerChartObj.update();
        document.getElementById('modalRxText').innerText = "0.0";
        document.getElementById('modalTxText').innerText = "0.0";
        
        var myModal = new bootstrap.Modal(document.getElementById('customerLiveChartModal'));
        myModal.show();
    }

    function updateSummary() {
        let rx = allData.reduce((s, u) => s + +u.rx_mbps, 0);
        let tx = allData.reduce((s, u) => s + +u.tx_mbps, 0);
        let totalBw = rx + tx;
        document.getElementById('kpi-dl').innerHTML = `${rx.toFixed(1)} <span class="text-muted small">Mbps</span>`;
        document.getElementById('kpi-ul').innerHTML = `${tx.toFixed(1)} <span class="text-muted small">Mbps</span>`;
        document.getElementById('kpi-bw').innerHTML = `${totalBw.toFixed(1)} <span class="text-muted small">Mbps</span>`;
        document.getElementById('kpi-users').innerText = allData.length;

        let topUser = 'Jane Doe';
        if (allData.length > 0) {
            let sorted = [...allData].sort((a, b) => (b.rx_mbps + b.tx_mbps) - (a.rx_mbps + a.tx_mbps));
            topUser = sorted[0].user;
        }
        document.getElementById('kpi-top-user').innerText = topUser;

        // Update Chart
        rxChartData.shift(); rxChartData.push(rx);
        txChartData.shift(); txChartData.push(tx);
        if (bandwidthChart) bandwidthChart.update();
    }

    function applyFilter() {
        // DataTables handles its own filtering now, but we need to populate the rows.
        if (!liveTrafficTable) return;

        // Sort array descending by total bandwidth before adding to table
        let sorted = [...allData].sort((a, b) => (b.rx_mbps + b.tx_mbps) - (a.rx_mbps + a.tx_mbps));

        let rows = [];
        sorted.forEach(u => {
            let rxPct = maxRx > 0 ? (u.rx_mbps / maxRx) * 100 : 0;
            let txPct = maxTx > 0 ? (u.tx_mbps / maxTx) * 100 : 0;
            let totalBw = u.rx_mbps + u.tx_mbps;

            rows.push([
                `<div class="fw-bold text-body" style="font-size:1.0rem;">${u.user}</div>
             <div class="small text-muted"><i class="fas fa-network-wired me-1"></i>${u.ip}</div>`,

                `<div class="d-flex justify-content-between mb-1">
                <span class="text-primary small fw-semibold"><i class="fas fa-download me-1"></i>${Number(u.rx_mbps).toFixed(1)} M</span>
                <span class="text-info small fw-semibold"><i class="fas fa-upload me-1"></i>${Number(u.tx_mbps).toFixed(1)} M</span>
            </div>
            <div class="progress" style="height: 4px;">
                <div class="progress-bar bg-primary" style="width: ${rxPct}%;"></div>
                <div class="progress-bar bg-info" style="width: ${txPct}%;"></div>
            </div>
            <!-- Hidden sort value for DataTables -->
            <span style="display:none;">${totalBw.toFixed(5)}</span>`,

                `<div class="small text-muted"><i class="fas fa-clock me-1"></i>${u.uptime}</div>`,
                
                `<div class="text-end"><button class="btn btn-sm btn-outline-primary rounded-pill px-3" onclick="openCustomerLiveChart('${u.user}')"><i class="fas fa-chart-line me-1"></i> Chart</button></div>`
            ]);
        });

        // Update DataTables smoothly
        liveTrafficTable.clear();
        liveTrafficTable.rows.add(rows);
        liveTrafficTable.draw(false); // false keeps current pagination
    }

    function loadHardwareData() {
        {% for device in devices %}
        fetch("{% url 'device_hardware_api' device.id %}")
            .then(r => r.json())
            .then(d => {
                let errorHtml = '';
                if (d.status === 'error') {
                    errorHtml = `<div class="alert alert-danger border-0 shadow-sm p-2 mb-2 small rounded-3"><i class="fas fa-exclamation-triangle me-1"></i> <strong>Connection Error:</strong> Could not connect to Mikrotik API. Please verify IP and credentials in the <a href="{% url 'device_list' %}" class="alert-link text-decoration-underline">Mikrotik Devices</a> tab.</div>`;
                }

                let cpu = d.cpu_load ? d.cpu_load + "%" : "-";
                let ram = "-";
                if (d.free_memory && d.total_memory) {
                    let freeM = parseFloat(d.free_memory);
                    let totM = parseFloat(d.total_memory);
                    let used = totM - freeM;
                    let pct = Math.round((used / totM) * 100);
                    ram = pct + "%";
                }
                let sto = "-";
                if (d.free_hdd_space && d.total_hdd_space) {
                    let freeH = parseFloat(d.free_hdd_space);
                    let totH = parseFloat(d.total_hdd_space);
                    let usedH = totH - freeH;
                    let pctH = Math.round((usedH / totH) * 100);
                    sto = pctH + "%";
                }
                let upt = d.uptime || "-";
                
                let hwItem = {
                    name: '{{ device.device_name }}',
                    status: d.status === 'error' ? 'Error' : 'Online',
                    cpu: cpu,
                    ram: ram,
                    disk: sto,
                    uptime: upt
                };
                let idx = currentHardwareData.findIndex(x => x.name === hwItem.name);
                if (idx > -1) { currentHardwareData[idx] = hwItem; }
                else { currentHardwareData.push(hwItem); }

                let existing = document.getElementById('hw-box-{{ device.id }}');
                let html = `
        <div id="hw-box-{{ device.id }}" class="mb-4">
            <div class="text-muted small mb-2 fw-bold">{{ device.device_name }}</div>
            ${errorHtml}
            <div class="hw-grid row text-center g-2">
                <div class="col-3"><div class="text-muted small text-uppercase">CPU</div><div class="fw-bold text-info">${cpu}</div></div>
                <div class="col-3"><div class="text-muted small text-uppercase">RAM</div><div class="fw-bold text-warning">${ram}</div></div>
                <div class="col-3"><div class="text-muted small text-uppercase">Disk</div><div class="fw-bold text-danger">${sto}</div></div>
                <div class="col-3"><div class="text-muted small text-uppercase">Uptime</div><div class="fw-bold text-success">${upt}</div></div>
            </div>
        </div>
        `;
                if (existing) { existing.outerHTML = html; }
                else { document.getElementById('hardwareList').insertAdjacentHTML('beforeend', html); }
            });
        {% endfor %}
    }

    let currentPollId = 0;

    function openApplyAddonModal(requestId, customerId, customerName, addonType) {
        if (addonType !== 'Cignal Play Add-on' && !addonType.toLowerCase().includes('cignal')) {
            alert('This modal is only for Cignal Play Add-ons. Other add-ons must be handled manually.');
            return;
        }
        document.getElementById('modalCustomerName').innerText = customerName;
        document.getElementById('applyAddonForm').action = '/cignal-play/approve/' + requestId + '/';
        var myModal = new bootstrap.Modal(document.getElementById('applyAddonModal'));
        myModal.show();
    }

    function pollFastData(id) {
        let fastSpeed = parseInt(document.getElementById('interval').value);
        let selectedRouterIP = document.getElementById('routerFilter').value;
        fetch("{% url 'api_live_monitoring' %}")
            .then(r => r.json())
            .then(d => {
                if (id !== currentPollId) return; // Drop old responses
                
                // --- Customer Modal Chart Logic ---
                if (modalCustomer) {
                    let targetUser = (d.users || []).find(u => u.user === modalCustomer);
                    if (targetUser) {
                        custRxData.shift(); custRxData.push(targetUser.rx_mbps);
                        custTxData.shift(); custTxData.push(targetUser.tx_mbps);
                        document.getElementById('modalRxText').innerText = Number(targetUser.rx_mbps).toFixed(1);
                        document.getElementById('modalTxText').innerText = Number(targetUser.tx_mbps).toFixed(1);
                        if (customerChartObj) customerChartObj.update();
                    }
                }
                
                // --- Router Filtering Logic ---
                if (selectedRouterIP === "ALL") {
                    allData = d.users || [];
                    document.getElementById('totalActiveSubs').innerText = d.total_active_subs || 0;
                } else {
                    allData = (d.users || []).filter(u => u.device_ip === selectedRouterIP);
                    document.getElementById('totalActiveSubs').innerText = allData.length;
                }
                
                maxRx = 0; maxTx = 0;
                allData.forEach(u => {
                    if (u.rx_mbps > maxRx) maxRx = u.rx_mbps;
                    if (u.tx_mbps > maxTx) maxTx = u.tx_mbps;
                });
                updateSummary();
                applyFilter();
            })
            .catch(err => console.error("Fast fetch error", err))
            .finally(() => {
                if (id === currentPollId) {
                    fastTimer = setTimeout(() => pollFastData(id), fastSpeed);
                }
            });
    }

    function pollSlowData() {
        let slowSpeed = 20000;
        fetch("{% url 'api_offline_users' %}")
            .then(r => r.json())
            .then(d => renderOfflineCustomers(d.offline_users || []))
            .catch(err => console.error("Offline fetch error", err));

        fetch("{% url 'api_router_uplink' %}")
            .then(r => r.json())
            .then(d => {
                let statusText = document.getElementById('uplinkStatus');
                if (statusText) statusText.classList.remove('syncing');

                if (d.routers && d.routers.length > 0) {
                    let r = d.routers[0];
                    let box = document.getElementById('kpi-uplink-box');
                    let pingText = document.getElementById('uplinkPing');
                    if (statusText) statusText.innerText = r.uplink_status;
                    if (pingText) pingText.innerText = "Ping: " + r.uplink_ping;

                    if (box) {
                        box.classList.remove('border-danger', 'border-warning', 'border-info', 'border-success');
                        box.style.setProperty('border-color', '', 'important');

                        if (r.uplink_status === 'Offline') {
                            box.classList.add('border-danger');
                        } else if (r.uplink_status === 'Unstable') {
                            box.classList.add('border-warning');
                        } else {
                            box.classList.add('border-info');
                        }
                    }
                } else {
                    let box = document.getElementById('kpi-uplink-box');
                    let pingText = document.getElementById('uplinkPing');
                    if (statusText) statusText.innerText = "Offline";
                    if (pingText) pingText.innerText = "Ping: -";
                    if (box) {
                        box.classList.remove('border-info', 'border-warning', 'border-success');
                        box.classList.add('border-danger');
                    }
                }
            })
            .catch(err => {
                console.error("Uplink ping error", err);
                let box = document.getElementById('kpi-uplink-box');
                let statusText = document.getElementById('uplinkStatus');
                let pingText = document.getElementById('uplinkPing');
                if (statusText) {
                    statusText.innerText = "Error";
                    statusText.classList.remove('syncing');
                    pingText.innerText = "ping: failed";
                    if (box) {
                        box.classList.remove('border-info', 'border-warning', 'border-success');
                        box.classList.add('border-danger');
                    }
                }
            });

        loadHardwareData();
        loadNetworkAlerts();
        loadAddonRequests();

        slowTimer = setTimeout(pollSlowData, slowSpeed);
    }

    function startInterval() {
        currentPollId++; // Invalidate any pending fast loops
        loadNetworkAlerts();
        loadAddonRequests();
        if (fastTimer) clearTimeout(fastTimer);
        if (slowTimer) clearTimeout(slowTimer);
        pollFastData(currentPollId);
        pollSlowData();
    }

    document.getElementById('interval').addEventListener('change', startInterval);
    document.getElementById('routerFilter').addEventListener('change', () => {
        chartLabels = Array(20).fill('');
        rxChartData = Array(20).fill(0);
        txChartData = Array(20).fill(0);
        if (bandwidthChart) bandwidthChart.update();
        startInterval();
    });

    $(document).ready(function () {
        // Start polling immediately so metrics update without delay
        startInterval();

        try {
            initChart();
            initCustomerChart();
        } catch (e) {
            console.error("Chart init error:", e);
        }

        try {
            if ($.fn.DataTable) {
                liveTrafficTable = $('#liveTrafficTable').DataTable({
                    "paging": false,
                    "info": false,
                    "lengthChange": false,
                    "order": [[1, "desc"]],
                    "responsive": true,
                    "dom": 'rt'
                });
            }
        } catch (e) {
            console.error("DataTable init error:", e);
        }

        // Initialize Select2 for Customer Search safely
        function initCustomerSearchSelect() {
            if ($.fn.select2) {
                if (!$('#customerSearchSelect').hasClass('select2-hidden-accessible')) {
                    $('#customerSearchSelect').select2({
                        dropdownParent: $('#searchCustomerModal'),
                        placeholder: "Search by Name or PPPoE...",
                        allowClear: true,
                        theme: 'bootstrap-5',
                        width: '100%'
                    });
                }
            }
        }
        initCustomerSearchSelect();

        $('#searchCustomerModal').on('shown.bs.modal', function () {
            initCustomerSearchSelect();
        });

        let searchInterval = null;
        $('#customerSearchSelect').on('change', function() {
            const customerId = $(this).val();
            const detailsDiv = document.getElementById('searchCustomerDetails');
            const placeholderDiv = document.getElementById('searchCustomerPlaceholder');
            
            if (searchInterval) {
                clearInterval(searchInterval);
                searchInterval = null;
            }
            
            if (!customerId) {
                if (detailsDiv) detailsDiv.style.display = 'none';
                if (placeholderDiv) placeholderDiv.style.display = 'block';
                return;
            }
            
            if (detailsDiv) detailsDiv.style.display = 'block';
            if (placeholderDiv) placeholderDiv.style.display = 'none';
            
            const selectedText = $(this).find("option:selected").text().trim();
            const nameEl = document.getElementById('searchCustName');
            if (nameEl) nameEl.innerText = selectedText;
            
            const linkEl = document.getElementById('searchCustLink');
            if (linkEl) linkEl.href = '/customers/view/' + customerId + '/';
            
            function fetchCustomerLiveStatus() {
                const endpoint = '/customers/api/status/' + customerId + '/';
                fetch(endpoint)
                    .then(response => {
                        if (!response.ok) {
                            return fetch('/api/customer/' + customerId + '/mikrotik-status/').then(r => r.json());
                        }
                        return response.json();
                    })
                    .then(data => {
                        const statusEl = document.getElementById('searchCustStatus');
                        if (statusEl) {
                            if (data.mt_status === 'Connected') {
                                statusEl.innerHTML = `<span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-2.5 py-1 small"><i class="fas fa-circle text-success me-1 fa-beat" style="font-size: 0.45rem;"></i> Connected</span>`;
                            } else {
                                statusEl.innerHTML = `<span class="badge bg-danger-subtle text-danger border border-danger-subtle rounded-pill px-2.5 py-1 small"><i class="fas fa-circle text-danger me-1" style="font-size: 0.45rem;"></i> Disconnected</span>`;
                            }
                        }
                        
                        const uptimeEl = document.getElementById('searchCustUptime');
                        if (uptimeEl) {
                            uptimeEl.innerText = (data.uptime && data.uptime !== 'N/A') ? data.uptime : ((data.last_logged_out && data.last_logged_out !== 'N/A') ? 'Offline since ' + data.last_logged_out : 'N/A');
                        }
                        
                        const macEl = document.getElementById('searchCustMac');
                        if (macEl) {
                            macEl.innerText = data.live_mac || 'N/A';
                        }
                        
                        const stabEl = document.getElementById('searchCustStability');
                        if (stabEl) {
                            if (data.stability) {
                                const stabColor = data.stability_color || 'info';
                                stabEl.innerHTML = `<span class="badge bg-${stabColor}-subtle text-${stabColor} border border-${stabColor}-subtle rounded-pill px-2 py-0.5 small">${data.stability}</span>`;
                            } else {
                                stabEl.innerText = 'N/A';
                            }
                        }
                        
                        const dlEl = document.getElementById('searchCustDl');
                        const ulEl = document.getElementById('searchCustUl');
                        if (dlEl && ulEl) {
                            if (data.rx_mbps !== undefined && data.tx_mbps !== undefined) {
                                dlEl.innerText = data.tx_mbps + ' Mbps';
                                ulEl.innerText = data.rx_mbps + ' Mbps';
                            } else {
                                dlEl.innerText = '0.0 Mbps';
                                ulEl.innerText = '0.0 Mbps';
                            }
                        }
                    })
                    .catch(error => console.error('Error fetching status:', error));
            }
            
            fetchCustomerLiveStatus();
            searchInterval = setInterval(fetchCustomerLiveStatus, 5000);
        });

        // Clear interval when modal closes
        $('#searchCustomerModal').on('hidden.bs.modal', function () {
            if (searchInterval) {
                clearInterval(searchInterval);
                searchInterval = null;
            }
            $('#customerSearchSelect').val('').trigger('change');
        });
        
        $('#customerLiveChartModal').on('hidden.bs.modal', function () {
            modalCustomer = null;
        });

        // Wire up custom search bar to DataTables
        $('#customSearch').on('keyup input', function () {
            liveTrafficTable.search(this.value).draw();
        });

        startInterval();
    });
</script>
