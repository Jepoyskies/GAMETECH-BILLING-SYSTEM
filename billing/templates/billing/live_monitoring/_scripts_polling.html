<!-- Partial: Polling Engine & Real-time Event Loops -->
<script>
    let currentPollId = 0;

    function pollFastData(id) {
        let fastSpeed = parseInt(document.getElementById('interval').value);
        let selectedRouterIP = document.getElementById('routerFilter').value;

        // Tab-aware guard: skip network fetch when tab is minimized/hidden
        if (document.hidden) {
            if (id === currentPollId) {
                fastTimer = setTimeout(() => pollFastData(id), fastSpeed);
            }
            return;
        }

        fetch("{% url 'api_live_monitoring' %}")
            .then(r => r.json())
            .then(d => {
                if (id !== currentPollId) return; // Drop old responses
                
                // --- Customer Modal Chart Logic ---
                if (modalCustomer) {
                    let targetUser = (d.users || []).find(u => u.user === modalCustomer);
                    if (targetUser) {
                        custRxData.shift(); custRxData.push(targetUser.rx_mbps);
                        custTxData.shift(); custTxData.push(targetUser.tx_mbps);
                        document.getElementById('modalRxText').innerText = Number(targetUser.rx_mbps).toFixed(1);
                        document.getElementById('modalTxText').innerText = Number(targetUser.tx_mbps).toFixed(1);
                        if (customerChartObj) customerChartObj.update();
                    }
                }
                
                // --- Router Filtering Logic ---
                if (selectedRouterIP === "ALL") {
                    allData = d.users || [];
                    document.getElementById('totalActiveSubs').innerText = d.total_active_subs || 0;
                } else {
                    allData = (d.users || []).filter(u => u.device_ip === selectedRouterIP);
                    document.getElementById('totalActiveSubs').innerText = allData.length;
                }
                
                maxRx = 0; maxTx = 0;
                allData.forEach(u => {
                    if (u.rx_mbps > maxRx) maxRx = u.rx_mbps;
                    if (u.tx_mbps > maxTx) maxTx = u.tx_mbps;
                });
                updateSummary();
                applyFilter();
                let spinner = document.getElementById('routerLoadingSpinner');
                if (spinner) {
                    spinner.classList.remove('d-inline-flex');
                    spinner.classList.add('d-none');
                }
            })
            .catch(err => {
                console.error("Fast fetch error", err);
                let spinner = document.getElementById('routerLoadingSpinner');
                if (spinner) {
                    spinner.classList.remove('d-inline-flex');
                    spinner.classList.add('d-none');
                }
            })
            .finally(() => {
                if (id === currentPollId) {
                    fastTimer = setTimeout(() => pollFastData(id), fastSpeed);
                }
            });
    }

    function pollSlowData() {
        let slowSpeed = 20000;

        // Tab-aware guard: skip network fetches when tab is minimized/hidden
        if (document.hidden) {
            slowTimer = setTimeout(pollSlowData, slowSpeed);
            return;
        }

        fetch("{% url 'api_offline_users' %}")
            .then(r => r.json())
            .then(d => renderOfflineCustomers(d.offline_users || []))
            .catch(err => console.error("Offline fetch error", err));

        fetch("{% url 'api_router_uplink' %}")
            .then(r => r.json())
            .then(d => {
                let statusText = document.getElementById('uplinkStatus');
                if (statusText) statusText.classList.remove('syncing');

                if (d.routers && d.routers.length > 0) {
                    let selectedRouter = document.getElementById('routerFilter') ? document.getElementById('routerFilter').value : 'ALL';
                    let r = null;

                    if (selectedRouter === 'ALL') {
                        let onlineRouters = d.routers.filter(x => x.uplink_status === 'Online');
                        if (onlineRouters.length > 0) {
                            r = {
                                uplink_status: onlineRouters.length === d.routers.length ? 'Online' : 'Online (' + onlineRouters.length + '/' + d.routers.length + ')',
                                uplink_ping: onlineRouters[0].uplink_ping,
                                is_partial: onlineRouters.length < d.routers.length
                            };
                        } else {
                            r = {
                                uplink_status: 'Offline',
                                uplink_ping: 'Timeout',
                                is_partial: false
                            };
                        }
                    } else {
                        r = d.routers.find(x => x.ip === selectedRouter || x.name === selectedRouter || String(x.id) === selectedRouter) || d.routers[0];
                    }

                    let box = document.getElementById('kpi-uplink-box');
                    let pingText = document.getElementById('uplinkPing');
                    if (statusText) statusText.innerText = r.uplink_status;
                    if (pingText) pingText.innerText = "Ping: " + r.uplink_ping;

                    if (box) {
                        box.classList.remove('border-danger', 'border-warning', 'border-info', 'border-success');
                        box.style.setProperty('border-color', '', 'important');

                        if (r.uplink_status.startsWith('Offline')) {
                            box.classList.add('border-danger');
                        } else if (r.uplink_status === 'Unstable' || r.is_partial) {
                            box.classList.add('border-warning');
                        } else {
                            box.classList.add('border-info');
                        }
                    }
                } else {
                    let box = document.getElementById('kpi-uplink-box');
                    let pingText = document.getElementById('uplinkPing');
                    if (statusText) statusText.innerText = "Offline";
                    if (pingText) pingText.innerText = "Ping: -";
                    if (box) {
                        box.classList.remove('border-info', 'border-warning', 'border-success');
                        box.classList.add('border-danger');
                    }
                }
            })
            .catch(err => {
                console.error("Uplink ping error", err);
                let box = document.getElementById('kpi-uplink-box');
                let statusText = document.getElementById('uplinkStatus');
                let pingText = document.getElementById('uplinkPing');
                if (statusText) {
                    statusText.innerText = "Error";
                    statusText.classList.remove('syncing');
                    pingText.innerText = "ping: failed";
                    if (box) {
                        box.classList.remove('border-info', 'border-warning', 'border-success');
                        box.classList.add('border-danger');
                    }
                }
            });

        loadHardwareData();
        loadNetworkAlerts();
        loadAddonRequests();

        slowTimer = setTimeout(pollSlowData, slowSpeed);
    }

    function startInterval() {
        currentPollId++; // Invalidate any pending fast loops
        loadNetworkAlerts();
        loadAddonRequests();
        if (fastTimer) clearTimeout(fastTimer);
        if (slowTimer) clearTimeout(slowTimer);
        pollFastData(currentPollId);
        pollSlowData();
    }

    document.getElementById('interval').addEventListener('change', startInterval);
    document.getElementById('routerFilter').addEventListener('change', () => {
        let spinner = document.getElementById('routerLoadingSpinner');
        if (spinner) {
            spinner.classList.remove('d-none');
            spinner.classList.add('d-inline-flex');
        }

        let statusText = document.getElementById('uplinkStatus');
        let pingText = document.getElementById('uplinkPing');
        let box = document.getElementById('kpi-uplink-box');
        if (statusText) {
            statusText.classList.add('syncing');
            statusText.innerHTML = 'Syncing... <i class="fas fa-sync fa-spin" style="font-size: 18px;"></i>';
        }
        if (pingText) pingText.innerText = 'ping: checking...';
        if (box) {
            box.classList.remove('border-danger', 'border-warning', 'border-info', 'border-success');
            box.style.setProperty('border-color', 'rgba(255,255,255,0.4)', 'important');
        }

        chartLabels = Array(20).fill('');
        rxChartData = Array(20).fill(0);
        txChartData = Array(20).fill(0);
        if (bandwidthChart) bandwidthChart.update();
        startInterval();
    });

    // Re-trigger live polling as soon as user returns to tab
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
            startInterval();
        }
    });

    $(document).ready(function () {
        try {
            initChart();
            initCustomerChart();
        } catch (e) {
            console.error("Chart init error:", e);
        }

        // Single clean startup invocation
        startInterval();
    });
</script>
