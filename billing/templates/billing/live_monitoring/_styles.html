<!-- Base Partial: Styles -->
<style>
    /* Base Variables and Styling */
    :root {
        --bg-main: #f4f7fe;
        --card-bg: #ffffff;
        --text-main: #1e293b;
        --text-muted: #64748b;
        --border-color: #1e61cc;
        --hero-bg: #1e61cc;
        --accent: #FBBF24;
        --danger: #ef4444;
        --success: #10b981;
    }

    :root.dark-mode {
        --bg-main: #0f172a;
        --card-bg: #1e293b;
        --text-main: #f8fafc;
        --text-muted: #cbd5e1;
        --border-color: #334155;
        /* Hero, accent, danger, success can remain the same */
    }

    /* Dashboard Grid */
    .dashboard-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        /* 50/50 split */
        gap: 24px;
        font-family: 'Inter', sans-serif;
        min-height: calc(100vh - 120px);
        /* Stretch to fill available screen height */
    }

    @media (max-width: 1200px) {
        .dashboard-container {
            grid-template-columns: 1fr;
        }
    }

    /* --- Blue Hero Card (Left) --- */
    .hero-card {
        background-color: var(--hero-bg);
        border-radius: 16px;
        padding: 24px;
        color: white;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
        box-shadow: 0 15px 35px rgba(30, 97, 204, 0.25);
    }

    .hero-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 24px;
    }

    .hero-title h1 {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 16px;
        color: white;
    }

    .hero-actions {
        display: flex;
        gap: 12px;
        z-index: 2;
        /* Keep above illustration */
    }

    .btn-update {
        background-color: var(--accent);
        color: #452B00;
        border: none;
        padding: 6px 14px;
        border-radius: 30px;
        font-weight: 600;
        font-size: 0.8rem;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(251, 191, 36, 0.3);
        transition: transform 0.2s;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
    }

    .btn-update:hover {
        transform: translateY(-2px);
        color: #452B00;
    }

    .select-speed {
        background-color: rgba(255, 255, 255, 0.15);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.3);
        padding: 6px 32px 6px 12px;
        border-radius: 30px;
        font-weight: 500;
        font-size: 0.8rem;
        outline: none;
        cursor: pointer;
        backdrop-filter: blur(4px);
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: right 10px center;
        background-size: 14px;
    }

    .select-speed option {
        background-color: var(--hero-bg);
        color: white;
        font-weight: 500;
        font-size: 0.75rem;
        padding: 4px 8px;
    }

    .metrics-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
        position: relative;
        z-index: 20;
        margin-top: 10px;
    }

    .metric-item {
        display: flex;
        flex-direction: column;
        gap: 8px;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.12);
    }

    .metric-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: rgba(255, 255, 255, 0.7);
        font-weight: 600;
    }

    .metric-value {
        font-size: 2rem;
        font-weight: 700;
    }

    .metric-value.syncing {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .metric-sub {
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.7);
    }

    /* Placeholder for 3D Character */
    .hero-illustration {
        position: absolute;
        bottom: -25px;
        right: -10px;
        width: 350px;
        height: 350px;
        pointer-events: none;
        z-index: 1;
        opacity: 0.65;
    }

    /* --- Right Column Layout --- */
    .right-column {
        display: flex;
        flex-direction: column;
        gap: 24px;
    }

    /* Top 2x2 Grid Card */
    .info-card-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 24px;
        flex: 1;
    }

    .info-cell {
        background-color: var(--card-bg);
        border-radius: 16px;
        border: 2px solid var(--border-color);
        box-shadow: 0 10px 30px rgba(30, 97, 204, 0.2);
        padding: 24px;
        display: flex;
        flex-direction: column;
        max-height: 280px;
    }

    .cell-header {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 0.9rem;
        margin-bottom: 12px;
    }

    .cell-header.alert {
        color: var(--accent);
    }

    .cell-header.danger {
        color: var(--danger);
    }

    .cell-header.info {
        color: #3B82F6;
    }

    .cell-content {
        font-size: 0.85rem;
        color: var(--text-muted);
        overflow-y: auto;
        -ms-overflow-style: none;
        /* IE and Edge */
        scrollbar-width: none;
        /* Firefox */
    }

    .cell-content::-webkit-scrollbar {
        display: none;
    }

    .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
        background-color: var(--success);
        margin-left: 8px;
    }

    @keyframes pulse-danger {
        0% {
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
        }

        70% {
            box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
        }

        100% {
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
        }
    }

    @keyframes pulse-warning {
        0% {
            box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4);
        }

        70% {
            box-shadow: 0 0 0 10px rgba(245, 158, 11, 0);
        }

        100% {
            box-shadow: 0 0 0 0 rgba(245, 158, 11, 0);
        }
    }

    @keyframes pulse-primary {
        0% {
            box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4);
        }

        70% {
            box-shadow: 0 0 0 10px rgba(59, 130, 246, 0);
        }

        100% {
            box-shadow: 0 0 0 0 rgba(59, 130, 246, 0);
        }
    }

    .alert-pulse-danger {
        animation: pulse-danger 2s infinite;
        border: 1px solid rgba(239, 68, 68, 0.5) !important;
    }

    .alert-pulse-warning {
        animation: pulse-warning 2s infinite;
        border: 1px solid rgba(245, 158, 11, 0.5) !important;
    }

    .alert-pulse-primary {
        animation: pulse-primary 2s infinite;
        border: 1px solid rgba(59, 130, 246, 0.5) !important;
    }

    /* Bottom Card: Live Traffic */
    .traffic-card {
        background-color: var(--card-bg);
        border-radius: 16px;
        border: 2px solid var(--border-color);
        padding: 24px;
        box-shadow: 0 10px 30px rgba(30, 97, 204, 0.2);
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .traffic-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .traffic-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        color: var(--success);
    }
    
    /* Search Modal Styles */
    .search-customer-btn {
        background-color: var(--hero-bg);
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 8px;
        font-weight: 600;
        transition: opacity 0.2s;
    }
    .search-customer-btn:hover {
        opacity: 0.9;
        color: white;
    }

    #customSearch {
        background-color: var(--card-bg);
        color: var(--text-main);
        border: 1px solid var(--border-color);
    }

    #customSearch::placeholder {
        color: var(--text-muted);
    }

    /* --- Mobile Responsiveness --- */
    @media (max-width: 768px) {
        .metrics-grid {
            grid-template-columns: 1fr;
            padding-right: 0;
        }

        .traffic-header {
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
        }

        .traffic-header .d-flex {
            width: 100%;
        }

        .traffic-header input {
            width: 100% !important;
        }

        .info-card-container {
            grid-template-columns: 1fr;
            grid-template-rows: auto;
        }
    }
</style>
