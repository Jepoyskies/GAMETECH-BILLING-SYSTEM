<!-- Base Partial: Live Chart Modal -->
<!-- Customer Live Chart Modal -->
<div class="modal fade" id="customerLiveChartModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold"><i class="fas fa-chart-area text-primary me-2"></i>Live Monitoring: <span id="modalCustomerTitle" class="text-secondary">Customer</span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body pb-4 mt-2">
                <div class="d-flex justify-content-between mb-3 px-2">
                    <span class="badge bg-primary text-white fw-bold px-3 py-2" style="font-size: 0.85rem;"><i class="fas fa-download me-1"></i><span id="modalRxText">0.0</span> Mbps DL</span>
                    <span class="badge bg-info text-white fw-bold px-3 py-2" style="font-size: 0.85rem;"><i class="fas fa-upload me-1"></i><span id="modalTxText">0.0</span> Mbps UL</span>
                </div>
                <div style="height: 250px; width: 100%; position: relative;">
                    <canvas id="customerSpecificChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>
