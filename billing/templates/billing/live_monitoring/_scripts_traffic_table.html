<!-- Partial: Traffic Table & Summary KPI Scripts -->
<script>
    function updateSummary() {
        let rx = allData.reduce((s, u) => s + +u.rx_mbps, 0);
        let tx = allData.reduce((s, u) => s + +u.tx_mbps, 0);
        let totalBw = rx + tx;
        document.getElementById('kpi-dl').innerHTML = `${rx.toFixed(1)} <span class="text-muted small">Mbps</span>`;
        document.getElementById('kpi-ul').innerHTML = `${tx.toFixed(1)} <span class="text-muted small">Mbps</span>`;
        document.getElementById('kpi-bw').innerHTML = `${totalBw.toFixed(1)} <span class="text-muted small">Mbps</span>`;
        document.getElementById('kpi-users').innerText = allData.length;

        let topUserEl = document.getElementById('kpi-top-user');
        if (topUserEl) {
            if (allData.length > 0) {
                let sorted = [...allData].sort((a, b) => (b.rx_mbps + b.tx_mbps) - (a.rx_mbps + a.tx_mbps));
                let topItem = sorted[0];
                let displayName = topItem.customer_name || topItem.user;
                if (topItem.customer_name && topItem.customer_name !== topItem.user) {
                    topUserEl.innerHTML = `<span>${displayName}</span><span class="d-block text-white-50" style="font-size: 0.75rem; font-weight: normal; margin-top: 2px;"><i class="fas fa-user-tag me-1"></i>${topItem.user}</span>`;
                } else {
                    topUserEl.innerText = displayName;
                }
            } else {
                topUserEl.innerText = 'Jane Doe';
            }
        }

        // Update Bandwidth Chart
        if (typeof rxChartData !== 'undefined' && typeof txChartData !== 'undefined') {
            rxChartData.shift(); rxChartData.push(rx);
            txChartData.shift(); txChartData.push(tx);
            if (bandwidthChart) bandwidthChart.update();
        }
    }

    function applyFilter() {
        if (!liveTrafficTable) return;

        let sorted = [...allData].sort((a, b) => (b.rx_mbps + b.tx_mbps) - (a.rx_mbps + a.tx_mbps));

        let rows = [];
        sorted.forEach(u => {
            let rxPct = maxRx > 0 ? (u.rx_mbps / maxRx) * 100 : 0;
            let txPct = maxTx > 0 ? (u.tx_mbps / maxTx) * 100 : 0;
            let totalBw = u.rx_mbps + u.tx_mbps;

            let custDisplay = u.customer_name || u.user;
            let custSub = (u.customer_name && u.customer_name !== u.user)
                ? `<div class="small text-muted"><i class="fas fa-user-tag me-1"></i>${u.user} &bull; <i class="fas fa-network-wired ms-1 me-1"></i>${u.ip}</div>`
                : `<div class="small text-muted"><i class="fas fa-network-wired me-1"></i>${u.ip}</div>`;

            let nameHtml = u.customer_id
                ? `<a href="/customers/view/${u.customer_id}/" class="text-decoration-none fw-bold text-body" style="font-size:1.0rem;">${custDisplay}</a>`
                : `<div class="fw-bold text-body" style="font-size:1.0rem;">${custDisplay}</div>`;

            let safeDisplay = (custDisplay || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
            let safeUser = (u.user || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');

            rows.push([
                `${nameHtml}
                 ${custSub}`,

                `<div class="d-flex justify-content-between mb-1">
                <span class="text-primary small fw-semibold"><i class="fas fa-download me-1"></i>${Number(u.rx_mbps).toFixed(1)} M</span>
                <span class="text-info small fw-semibold"><i class="fas fa-upload me-1"></i>${Number(u.tx_mbps).toFixed(1)} M</span>
            </div>
            <div class="progress" style="height: 4px;">
                <div class="progress-bar bg-primary" style="width: ${rxPct}%;"></div>
                <div class="progress-bar bg-info" style="width: ${txPct}%;"></div>
            </div>
            <!-- Hidden sort value for DataTables -->
            <span style="display:none;">${totalBw.toFixed(5)}</span>`,

                `<div class="small text-muted"><i class="fas fa-clock me-1"></i>${u.uptime}</div>`,
                
                `<div class="text-end"><button class="btn btn-sm btn-outline-primary rounded-pill px-3" onclick="openCustomerLiveChart('${safeUser}', '${safeDisplay}')"><i class="fas fa-chart-line me-1"></i> Chart</button></div>`
            ]);
        });

        liveTrafficTable.clear();
        liveTrafficTable.rows.add(rows);
        liveTrafficTable.draw(false);
    }

    $(document).ready(function () {
        try {
            if ($.fn.DataTable) {
                liveTrafficTable = $('#liveTrafficTable').DataTable({
                    "paging": false,
                    "info": false,
                    "lengthChange": false,
                    "order": [[1, "desc"]],
                    "responsive": true,
                    "dom": 'rt'
                });
            }
        } catch (e) {
            console.error("DataTable init error:", e);
        }

        // Wire up custom search bar to DataTables
        $('#customSearch').on('keyup input', function () {
            if (liveTrafficTable) {
                liveTrafficTable.search(this.value).draw();
            }
        });
    });
</script>
