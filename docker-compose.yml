version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=gametech_user
      - POSTGRES_PASSWORD=gametech_pass
      - POSTGRES_DB=gametech_db

  redis:
    image: redis:7-alpine

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: /app/docker/start_web.sh
    volumes:
      - .:/app
      - static_volume:/app/static
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgres://gametech_user:gametech_pass@db:5432/gametech_db
      - CELERY_BROKER_URL=redis://redis:6379/0

  celery:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: /app/docker/start_celery.sh
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgres://gametech_user:gametech_pass@db:5432/gametech_db
      - CELERY_BROKER_URL=redis://redis:6379/0

  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: /app/docker/start_celerybeat.sh
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgres://gametech_user:gametech_pass@db:5432/gametech_db
      - CELERY_BROKER_URL=redis://redis:6379/0

volumes:
  postgres_data:
  static_volume:
