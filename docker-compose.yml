
# Gametech Unli Fiber — Production Compose Stack
# NOTE: This project is the single source of truth for container lifecycle.
# Do not run `docker compose` from a directory with a different name; it creates
# a second project that fights over ports. Always: cd /root/GAMETECH-BILLING-SYSTEM first.
name: gametech

x-app-env: &app-env
  DATABASE_URL: postgres://gametech_user:gametech_pass@db:5432/gametech_db
  CELERY_BROKER_URL: redis://redis:6379/0
  ROUTER_MODE: live
  SEMAPHORE_API_KEY: ${SEMAPHORE_API_KEY:-}
  SECRET_KEY: ${SECRET_KEY:-}
  DEBUG: ${DEBUG:-False}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}

services:
  db:
    image: postgres:15-alpine
    container_name: gametech-db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: gametech_user
      POSTGRES_PASSWORD: gametech_pass
      POSTGRES_DB: gametech_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gametech_user -d gametech_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gametech-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: gametech-web
    container_name: gametech-web
    restart: unless-stopped
    command: /app/docker/start_web.sh
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *app-env

  celery:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: gametech-web
    container_name: gametech-celery
    restart: unless-stopped
    command: /app/docker/start_celery.sh
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *app-env

  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: gametech-web
    container_name: gametech-celery-beat
    restart: unless-stopped
    command: /app/docker/start_celerybeat.sh
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *app-env

volumes:
  postgres_data:
    # NOTE: This is the volume holding the live production database (79M).
    # Do NOT rename without a verified pg_dump/pg_restore migration plan.
    # 2026-09-30: this was briefly pointed at the empty
    # `gametech-billing-system_postgres_data` volume, which silently booted the
    # stack on a blank database. The live data lives in
    # `gametech-billing_postgres_data` — do not switch it back.
    name: gametech-billing_postgres_data
