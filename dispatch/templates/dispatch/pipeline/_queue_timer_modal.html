<!-- Dispatch Timer Correction Modal -->
<div class="modal fade" id="modalCorrectTimer" tabindex="-1" aria-labelledby="modalCorrectTimerLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow-lg border-0" style="background: var(--surface-card); color: var(--text-main); border-radius: 14px;">
      <div class="modal-header border-bottom" style="border-color: var(--border-subtle) !important;">
        <h5 class="modal-title d-flex align-items-center gap-2" id="modalCorrectTimerLabel">
          <span class="badge bg-warning text-dark"><i class="fas fa-stopwatch"></i></span>
          <span>Correct Job Timer: <strong id="timerTicketNumber" class="text-primary">-</strong></span>
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <form id="correctTimerForm" onsubmit="submitTimerCorrection(event)">
        <input type="hidden" id="timerTicketId" name="ticket_id" value="">
        <div class="modal-body p-4">
          <div class="alert alert-warning small py-2 mb-3">
            <i class="fas fa-exclamation-triangle me-1"></i>
            Manual timer adjustments are logged in the permanent audit trail. A valid operational reason is mandatory.
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold small text-uppercase">Arrived / Start Timestamp</label>
            <input type="datetime-local" id="timerArrivedAt" name="arrived_at" class="form-control">
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold small text-uppercase">Done / Finish Timestamp</label>
            <input type="datetime-local" id="timerFinishedAt" name="finished_at" class="form-control">
          </div>

          <div class="mb-2">
            <label class="form-label fw-bold small text-uppercase">Reason for Correction <span class="text-danger">*</span></label>
            <textarea id="timerReason" name="reason" class="form-control" rows="3" required placeholder="e.g. Technician had no cellular coverage on site; arrived at 2:00 PM and finished at 3:15 PM verified via customer call."></textarea>
          </div>
        </div>

        <div class="modal-footer border-top" style="border-color: var(--border-subtle) !important;">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" id="btnSubmitTimer" class="btn btn-warning fw-bold px-4">
            <i class="fas fa-save me-1"></i> Save Timer Correction
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
