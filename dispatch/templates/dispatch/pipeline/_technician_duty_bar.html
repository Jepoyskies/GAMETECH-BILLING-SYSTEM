<!-- Technician Duty Roster Toolbar -->
<div class="gt-table-card mb-4">
    <div class="gt-table-toolbar">
        <div class="gt-table-toolbar-title">
            <i class="fas fa-user-clock"></i> Field Technician Roster &amp; Duty Status
        </div>
    </div>
    <div class="p-3">
        <div class="d-flex flex-wrap gap-2 align-items-center">
            {% for tech in all_technicians %}
            <button type="button"
                    class="gt-btn-secondary gt-btn-sm"
                    id="techDutyBtn{{ tech.id }}"
                    onclick="toggleTechDuty({{ tech.id }})"
                    title="Click to toggle duty status">
                <span class="status-dot" style="background: {% if tech.is_available %}var(--badge-success-text){% else %}var(--text-subtle){% endif %};"></span>
                <strong>{{ tech.name }}</strong>
                <span class="status-badge {% if tech.is_available %}status-badge--success{% else %}status-badge--neutral{% endif %}" id="techBadge{{ tech.id }}">
                    {% if tech.is_available %}On Duty{% else %}Off Duty{% endif %}
                </span>
            </button>
            {% empty %}
            <span class="text-muted small">No technicians registered yet.</span>
            {% endfor %}
        </div>
        <div class="gt-status-meta mt-2">Click any technician badge to toggle On-Duty / Off-Duty</div>
    </div>
</div>
