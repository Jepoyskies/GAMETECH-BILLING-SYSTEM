<!-- Team & Technician Assignment Modal -->
<div class="modal fade" id="modalAssignTicket" tabindex="-1" aria-labelledby="modalAssignTicketLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content shadow-lg border-0" style="background: var(--surface-card); color: var(--text-main); border-radius: 14px;">
      <div class="modal-header border-bottom" style="border-color: var(--border-subtle) !important;">
        <h5 class="modal-title d-flex align-items-center gap-2" id="modalAssignTicketLabel">
          <span class="badge" style="background: var(--gt-dispatch-violet, #7c3aed); color: #fff;">
            <i class="fas fa-users-gear"></i>
          </span>
          <span>Assign Ticket: <strong id="assignTicketNumber" class="text-primary">-</strong></span>
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <form id="assignTicketForm" onsubmit="submitTicketAssignment(event)">
        <input type="hidden" id="assignTicketId" name="ticket_id" value="">
        <div class="modal-body p-4">
          <!-- Client & Concern Summary Banner -->
          <div class="p-3 mb-3 rounded-3" style="background: rgba(124, 58, 237, 0.08); border-left: 4px solid var(--gt-dispatch-violet, #7c3aed);">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <strong id="assignClientName" class="fs-6">-</strong>
              <span id="assignTicketTypeBadge" class="badge bg-secondary">-</span>
            </div>
            <div id="assignClientAddress" class="text-muted small mb-1">-</div>
            <div id="assignClientConcern" class="small text-truncate" style="max-height: 40px;">-</div>
          </div>

          <!-- Assignment Options: Team vs Individual -->
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-bold small text-uppercase">1. Assign by Team</label>
              <select id="assignTeamSelect" name="team_id" class="form-select" onchange="onTeamSelectChanged(this)">
                <option value="">-- Select Team (Auto-assigns on-duty techs) --</option>
                {% for team in teams %}
                  <option value="{{ team.id }}">{{ team.name }} ({{ team.members.count }} techs)</option>
                {% endfor %}
              </select>
              <div class="form-text small">Selecting a team automatically schedules all active on-duty members.</div>
            </div>

            <div class="col-md-3">
              <label class="form-label fw-bold small text-uppercase">Schedule Date</label>
              <input type="date" id="assignSchedDate" name="scheduled_date" class="form-select" value="{% now 'Y-m-d' %}">
            </div>

            <div class="col-md-3">
              <label class="form-label fw-bold small text-uppercase">Schedule Time</label>
              <select id="assignSchedTime" name="scheduled_time" class="form-select">
                <option value="Morning (8:00 AM - 12:00 PM)">Morning (8AM - 12PM)</option>
                <option value="Afternoon (1:00 PM - 5:00 PM)">Afternoon (1PM - 5PM)</option>
                <option value="Immediate / ASAP">Immediate / ASAP</option>
              </select>
            </div>
          </div>

          <!-- Individual On-Duty Technicians Picker -->
          <div class="mb-3">
            <label class="form-label fw-bold small text-uppercase d-flex justify-content-between align-items-center">
              <span>2. Individual Technicians (On-Duty Only)</span>
              <span class="badge bg-success-subtle text-success border border-success-subtle" style="font-size: 0.72rem;">
                {{ on_duty_technicians|length }} On Duty
              </span>
            </label>
            <div class="p-3 border rounded-3" style="background: var(--surface-bg, rgba(0,0,0,0.02)); border-color: var(--border-subtle) !important; max-height: 180px; overflow-y: auto;">
              {% if on_duty_technicians %}
                <div class="row g-2">
                  {% for tech in on_duty_technicians %}
                    <div class="col-sm-6 col-md-4">
                      <div class="form-check form-check-inline p-2 border rounded-2 w-100 m-0" style="border-color: var(--border-subtle) !important; background: var(--surface-card);">
                        <input class="form-check-input tech-checkbox" type="checkbox" name="technician_ids" value="{{ tech.id }}" id="techCheck{{ tech.id }}" data-team="{{ tech.team_id|default:'' }}">
                        <label class="form-check-label small ms-1 d-flex flex-column" for="techCheck{{ tech.id }}">
                          <strong class="text-truncate">{{ tech.name }}</strong>
                          <span class="text-muted" style="font-size:0.7rem;">{{ tech.team.name|default:"No Team" }}</span>
                        </label>
                      </div>
                    </div>
                  {% endfor %}
                </div>
              {% else %}
                <div class="text-center py-3 text-muted small">
                  <i class="fas fa-user-slash text-warning me-1"></i> No technicians currently on duty. Toggle on-duty status below to assign.
                </div>
              {% endif %}
            </div>
          </div>

          <!-- Remarks / Special Instructions -->
          <div class="mb-2">
            <label class="form-label fw-bold small text-uppercase">Dispatch Remarks / Instructions</label>
            <textarea id="assignRemarks" name="remarks" class="form-control" rows="2" placeholder="e.g. Bring extra drop cable; client prefers afternoon install"></textarea>
          </div>
        </div>

        <div class="modal-footer border-top" style="border-color: var(--border-subtle) !important;">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" id="btnSubmitAssign" class="btn text-white fw-bold px-4" style="background: var(--gt-dispatch-violet, #7c3aed); border-color: var(--gt-dispatch-violet, #7c3aed);">
            <i class="fas fa-paper-plane me-1"></i> Confirm Dispatch
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
