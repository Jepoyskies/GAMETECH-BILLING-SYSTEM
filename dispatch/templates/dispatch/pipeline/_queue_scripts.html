<script>
function openAssignModal(ticketId, ticketNumber, clientName, address, concern, ticketType) {
  document.getElementById('assignTicketId').value = ticketId;
  document.getElementById('assignTicketNumber').innerText = ticketNumber;
  document.getElementById('assignClientName').innerText = clientName;
  document.getElementById('assignClientAddress').innerText = address;
  document.getElementById('assignClientConcern').innerText = concern || 'Standard Installation / Service';
  document.getElementById('assignTicketTypeBadge').innerText = ticketType;

  // Reset fields
  document.getElementById('assignTeamSelect').value = '';
  document.querySelectorAll('.tech-checkbox').forEach(cb => cb.checked = false);
  document.querySelectorAll('.tech-item').forEach(el => el.classList.remove('tech-item--picked', 'tech-item--borrowed'));
  const st = document.getElementById('assignTechSearch');
  if (st) st.value = '';
  filterTechList('');
  updateAssignSummary();

  const modal = new bootstrap.Modal(document.getElementById('modalAssignTicket'));
  modal.show();
}

function selectedTechCheckboxes() {
  return Array.from(document.querySelectorAll('.tech-checkbox:checked'));
}

/* Tick/untick every technician of one team. exclusive=true means untick
   everyone else first (default); otherwise just toggle that group additively.
   Team key '' / 'none' / '0' all mean "technicians with no team". */
function toggleTeamTechs(teamId, exclusive) {
  const norm = t => (!t || t === 'none' ? '' : t);
  const key = norm(teamId);
  const boxes = Array.from(document.querySelectorAll('.tech-checkbox'));
  const target = boxes.filter(cb => norm(cb.getAttribute('data-team')) === key);
  if (!target.length) return;
  const makeChecked = target.some(cb => !cb.checked);
  if (exclusive) boxes.forEach(cb => cb.checked = false);
  target.forEach(cb => cb.checked = makeChecked);
  paintTechStates();
  updateAssignSummary();
}

function tickAllTechs() {
  document.querySelectorAll('.tech-checkbox').forEach(cb => cb.checked = true);
  paintTechStates();
  updateAssignSummary();
}

function clearTechSelection() {
  document.querySelectorAll('.tech-checkbox').forEach(cb => cb.checked = false);
  paintTechStates();
  updateAssignSummary();
}

function filterTechList(term) {
  const q = (term || '').trim().toLowerCase();
  document.querySelectorAll('#assignTechList .tech-cell').forEach(cell => {
    const name = cell.getAttribute('data-tech-name') || '';
    cell.style.display = (!q || name.includes(q)) ? '' : 'none';
  });
  document.querySelectorAll('#assignTechList .tech-group').forEach(group => {
    const anyVisible = Array.from(group.querySelectorAll('.tech-cell')).some(c => c.style.display !== 'none');
    group.style.display = anyVisible ? '' : 'none';
  });
}

/* Colour-code each picker card: solid = own team, dashed = borrowed from another team. */
function paintTechStates() {
  const teamId = document.getElementById('assignTeamSelect').value;
  document.querySelectorAll('.tech-item').forEach(el => {
    const cb = el.querySelector('.tech-checkbox');
    el.classList.toggle('tech-item--picked', cb.checked && (!teamId || cb.getAttribute('data-team') === teamId));
    el.classList.toggle('tech-item--borrowed', cb.checked && teamId && cb.getAttribute('data-team') !== teamId);
  });
}

function updateAssignSummary() {
  const el = document.getElementById('assignSummary');
  if (!el) return;
  const teamId = document.getElementById('assignTeamSelect').value;
  const picked = selectedTechCheckboxes();

  if (!picked.length) {
    el.innerHTML = '<i class="fas fa-circle-info me-1"></i> No technicians ticked yet.';
    el.className = 'mt-2 small text-muted';
    return;
  }

  const borrowed = picked.filter(cb => teamId && cb.getAttribute('data-team') !== teamId);
  const names = picked.map(cb => (cb.closest('.tech-item') || {}).querySelector('label strong').textContent.trim());
  let html = '<i class="fas fa-user-check text-success me-1"></i> Assigning ' + names.length +
             ' technician' + (names.length === 1 ? '' : 's') + ': <strong>' + names.join(', ') + '</strong>';
  if (borrowed.length) {
    html += ' <span class="text-warning ms-1">(' + borrowed.length + ' borrowed from another team)</span>';
  }
  el.innerHTML = html;
  el.className = 'mt-2 small text-success';
}

function onTeamSelectChanged(selectElem) {
  // Additive: only (re)tick the chosen team's members. Anything already
  // ticked from other teams is left alone so a missing member can be backfilled.
  if (selectElem.value) toggleTeamTechs(selectElem.value, true);
  paintTechStates();
  updateAssignSummary();
}

function submitTicketAssignment(event) {
  event.preventDefault();
  const ticketId = document.getElementById('assignTicketId').value;
  const teamId = document.getElementById('assignTeamSelect').value;
  const schedDate = document.getElementById('assignSchedDate').value;
  const schedTime = document.getElementById('assignSchedTime').value;
  const remarks = document.getElementById('assignRemarks').value;

  const techIds = selectedTechCheckboxes().map(cb => cb.value);

  if (!teamId && techIds.length === 0) {
    alert('Select a team or tick at least one technician before confirming.');
    return;
  }

  const btn = document.getElementById('btnSubmitAssign');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Assigning...';

  fetch(`/dispatch/api/tickets/${ticketId}/assign/`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-CSRFToken': getCookie('csrftoken'),
    },
    body: JSON.stringify({
      team_id: teamId || null,
      technician_ids: techIds,
      scheduled_date: schedDate,
      scheduled_time: schedTime,
      remarks: remarks,
    })
  })
  .then(res => res.json())
  .then(data => {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-paper-plane me-1"></i> Confirm Dispatch';
    if (data.success) {
      window.location.reload();
    } else {
      alert(data.error || 'Failed to assign ticket.');
    }
  })
  .catch(err => {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-paper-plane me-1"></i> Confirm Dispatch';
    alert('Network error while assigning ticket.');
  });
}

function toggleTechDuty(techId) {
  const btn = document.getElementById('techDutyBtn' + techId);
  if (btn) btn.classList.add('opacity-50');

  fetch(`/dispatch/api/technicians/${techId}/toggle-duty/`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-CSRFToken': getCookie('csrftoken'),
    }
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      window.location.reload();
    } else {
      alert(data.error || 'Failed to toggle technician duty.');
    }
  })
  .catch(err => alert('Network error toggling duty.'));
}

function openTimerModal(ticketId, ticketNumber, arrivedAt, finishedAt) {
  document.getElementById('timerTicketId').value = ticketId;
  document.getElementById('timerTicketNumber').innerText = ticketNumber;
  document.getElementById('timerArrivedAt').value = arrivedAt ? arrivedAt.slice(0, 16) : '';
  document.getElementById('timerFinishedAt').value = finishedAt ? finishedAt.slice(0, 16) : '';
  document.getElementById('timerReason').value = '';

  const modal = new bootstrap.Modal(document.getElementById('modalCorrectTimer'));
  modal.show();
}

function submitTimerCorrection(event) {
  event.preventDefault();
  const ticketId = document.getElementById('timerTicketId').value;
  const arrivedAt = document.getElementById('timerArrivedAt').value;
  const finishedAt = document.getElementById('timerFinishedAt').value;
  const reason = document.getElementById('timerReason').value;

  const btn = document.getElementById('btnSubmitTimer');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Saving...';

  fetch(`/dispatch/api/tickets/${ticketId}/correct-timer/`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-CSRFToken': getCookie('csrftoken'),
    },
    body: JSON.stringify({
      arrived_at: arrivedAt || null,
      finished_at: finishedAt || null,
      reason: reason,
    })
  })
  .then(res => res.json())
  .then(data => {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-save me-1"></i> Save Timer Correction';
    if (data.success) {
      window.location.reload();
    } else {
      alert(data.error || 'Failed to correct timer.');
    }
  })
  .catch(err => {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-save me-1"></i> Save Timer Correction';
    alert('Network error saving timer.');
  });
}

function undispatchTicket(ticketId) {
  if (!confirm('Are you sure you want to return this job to the Unassigned queue?')) return;
  fetch(`/dispatch/api/tickets/${ticketId}/undispatch/`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-CSRFToken': getCookie('csrftoken'),
    }
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      window.location.reload();
    } else {
      alert(data.error || 'Failed to undispatch ticket.');
    }
  })
  .catch(err => alert('Network error.'));
}

function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let i = 0; i < cookies.length; i++) {
      const cookie = cookies[i].trim();
      if (cookie.substring(0, name.length + 1) === (name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}
</script>
