<!-- KPI Hero Cards — Premium Stats Row -->
<div class="row g-3 mb-4">
    <!-- Pending Installs -->
    <div class="col-6 col-lg-3">
        <div class="metric-hero-card cyan">
            <div class="d-flex align-items-center gap-3 mb-3">
                <div class="metric-hero-icon cyan">
                    <i class="fas fa-hourglass-half"></i>
                </div>
                <div style="min-width: 0;">
                    <div style="font-size: 0.67rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; color: #22d3ee; font-family: 'Inter', sans-serif;">Pending Installs</div>
                    <div style="font-size: 0.7rem; color: #334155; font-family: 'Inter', sans-serif; margin-top: 1px;">Awaiting assignment</div>
                </div>
            </div>
            <div class="metric-hero-val" style="color: #22d3ee;">{{ pending_count }}</div>
            <div style="height: 3px; background: rgba(6,182,212,0.08); border-radius: 999px; margin-top: 0.75rem; overflow: hidden;">
                <div style="height: 100%; width: {% if pending_count > 0 %}60{% else %}0{% endif %}%; background: linear-gradient(90deg,#22d3ee,#0891b2); border-radius: 999px;"></div>
            </div>
        </div>
    </div>

    <!-- Dispatched -->
    <div class="col-6 col-lg-3">
        <div class="metric-hero-card amber">
            <div class="d-flex align-items-center gap-3 mb-3">
                <div class="metric-hero-icon amber">
                    <i class="fas fa-truck"></i>
                </div>
                <div style="min-width: 0;">
                    <div style="font-size: 0.67rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; color: #fbbf24; font-family: 'Inter', sans-serif;">Dispatched</div>
                    <div style="font-size: 0.7rem; color: #334155; font-family: 'Inter', sans-serif; margin-top: 1px;">Assigned to teams</div>
                </div>
            </div>
            <div class="metric-hero-val" style="color: #fbbf24;">{{ assigned_count }}</div>
            <div style="height: 3px; background: rgba(245,158,11,0.08); border-radius: 999px; margin-top: 0.75rem; overflow: hidden;">
                <div style="height: 100%; width: {% if assigned_count > 0 %}70{% else %}0{% endif %}%; background: linear-gradient(90deg,#fbbf24,#d97706); border-radius: 999px;"></div>
            </div>
        </div>
    </div>

    <!-- In Progress -->
    <div class="col-6 col-lg-3">
        <div class="metric-hero-card purple">
            <div class="d-flex align-items-center gap-3 mb-3">
                <div class="metric-hero-icon purple">
                    <i class="fas fa-hard-hat"></i>
                </div>
                <div style="min-width: 0;">
                    <div style="font-size: 0.67rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; color: #a78bfa; font-family: 'Inter', sans-serif;">In Progress</div>
                    <div style="font-size: 0.7rem; color: #334155; font-family: 'Inter', sans-serif; margin-top: 1px;">Active field operations</div>
                </div>
            </div>
            <div class="metric-hero-val" style="color: #a78bfa;">{{ in_progress_count }}</div>
            <div style="height: 3px; background: rgba(139,92,246,0.08); border-radius: 999px; margin-top: 0.75rem; overflow: hidden;">
                <div style="height: 100%; width: {% if in_progress_count > 0 %}50{% else %}0{% endif %}%; background: linear-gradient(90deg,#a78bfa,#7c3aed); border-radius: 999px;"></div>
            </div>
        </div>
    </div>

    <!-- Completed Today -->
    <div class="col-6 col-lg-3">
        <div class="metric-hero-card green">
            <div class="d-flex align-items-center gap-3 mb-3">
                <div class="metric-hero-icon green">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div style="min-width: 0;">
                    <div style="font-size: 0.67rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; color: #34d399; font-family: 'Inter', sans-serif;">Completed Today</div>
                    <div style="font-size: 0.7rem; color: #334155; font-family: 'Inter', sans-serif; margin-top: 1px;">{{ total_techs_count }} units registered</div>
                </div>
            </div>
            <div class="metric-hero-val" style="color: #34d399;">{{ completed_today_count }}</div>
            <div style="height: 3px; background: rgba(16,185,129,0.08); border-radius: 999px; margin-top: 0.75rem; overflow: hidden;">
                <div style="height: 100%; width: {% if completed_today_count > 0 %}85{% else %}0{% endif %}%; background: linear-gradient(90deg,#34d399,#059669); border-radius: 999px;"></div>
            </div>
        </div>
    </div>
</div>
