<!-- 7. Collapsible ERP Pipeline Stepper & Provisioning Console -->
<div class="dash-section animate-fade-in animate-delay-3 mb-4">
  <div class="erp-pipeline-toggle" data-bs-toggle="collapse" data-bs-target="#erpStepperCollapse" aria-expanded="false" role="button">
    <span>
      <i class="fas fa-stream me-2" style="color: var(--gt-gold, #F9B233);"></i> ERP 5-Stage Pipeline &amp; Provisioning Console
    </span>
    <i class="fas fa-chevron-down toggle-icon transition-transform"></i>
  </div>
  <div class="collapse" id="erpStepperCollapse">
    <div class="p-3 border rounded-3 shadow-sm mb-3 mt-2" style="background: var(--surface-card); border-color: var(--border-subtle) !important;">
      <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center">
        <a href="{% url 'dispatch_queue' %}" class="gt-btn-primary" style="font-size:0.82rem;">
          <i class="fas fa-list-check me-1"></i> Dispatch Queue ({{ awaiting_assignment_count|default:"0" }} unassigned)
        </a>
        <a href="{% url 'technician_mobile_ui' %}" class="gt-btn-secondary" style="font-size:0.82rem;">
          <i class="fas fa-mobile-screen me-1"></i> Mobile Field Tech ({{ active_in_field_count|default:"0" }} active)
        </a>
        <a href="{% url 'dispatch_qa' %}" class="gt-btn-secondary" style="font-size:0.82rem;">
          <i class="fas fa-clipboard-check me-1"></i> QA Review ({{ pending_qa_approval_count|default:"0" }} pending)
        </a>
        <a href="{% url 'dispatch_approval' %}" class="gt-btn-secondary" style="font-size:0.82rem;">
          <i class="fas fa-stamp me-1"></i> Final Approval
        </a>
      </div>
    </div>
  </div>
</div>
