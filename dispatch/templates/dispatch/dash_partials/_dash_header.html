<!-- Dispatch Dashboard Header & Filter Pills -->
<div class="gt-page-header gt-page-header--hero d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4 animate-fade-in">
  <div class="d-flex align-items-center gap-3">
    <div class="gt-header-icon" style="background: linear-gradient(135deg, rgba(249, 178, 51, 0.2), rgba(59, 130, 246, 0.15)); color: var(--gt-gold, #F9B233); border: 1px solid rgba(249, 178, 51, 0.3);">
      <i class="fas fa-chart-pie"></i>
    </div>
    <div>
      <div class="d-flex align-items-center gap-2 mb-1">
        <span class="gt-header-eyebrow" style="background: rgba(249, 178, 51, 0.12); color: #fbae1a; border: 1px solid rgba(249, 178, 51, 0.25);">
          <i class="fas fa-truck-fast me-1"></i> Dispatch Operations
        </span>
      </div>
      <h1 class="gt-header-title">Dispatch Dashboard</h1>
      <div class="gt-header-sub" id="dashLiveClock">
        {{ now_str }} &middot; Realtime Operational Overview
      </div>
    </div>
  </div>
  <div class="d-flex align-items-center gap-2 flex-wrap">
    <div class="gt-filter-pills-row mb-0">
      <a href="?period=today" class="gt-filter-pill {% if period == 'today' %}active{% endif %}">Today</a>
      <a href="?period=week" class="gt-filter-pill {% if period == 'week' %}active{% endif %}">This Week</a>
      <a href="?period=month" class="gt-filter-pill {% if period == 'month' %}active{% endif %}">This Month</a>
      <a href="?period=year" class="gt-filter-pill {% if period == 'year' %}active{% endif %}">This Year</a>
      <a href="?period=all" class="gt-filter-pill {% if period == 'all' %}active{% endif %}">All Time</a>
    </div>
    <a href="{% url 'dispatch_queue' %}" class="gt-btn-primary" style="font-size:0.82rem;">
      <i class="fas fa-list-check me-1"></i> Open Queue
    </a>
    <button onclick="location.reload()" class="gt-icon-btn" title="Refresh Dashboard">
      <i class="fas fa-sync-alt"></i>
    </button>
  </div>
</div>
