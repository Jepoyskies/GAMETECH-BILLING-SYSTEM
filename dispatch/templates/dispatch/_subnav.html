{% comment %}
Shared Dispatch Subnavigation Bar
Provides consistent 1-click navigation across all Dispatch modules.
Usage: {% include "dispatch/_subnav.html" with active_tab="dashboard" %}
{% endcomment %}
<style>
.gt-dispatch-subnav {
    display: flex;
    align-items: center;
    background: var(--surface-card, #ffffff);
    border: 1px solid var(--border-subtle, rgba(148, 163, 184, 0.2));
    border-radius: 16px;
    padding: 0.35rem 0.5rem;
    margin-bottom: 1.5rem;
    box-shadow: var(--shadow-card, 0 2px 10px rgba(0, 0, 0, 0.04));
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
}
.gt-dispatch-subnav::-webkit-scrollbar { display: none; }
.gt-dispatch-subnav-scroll {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    width: 100%;
}
.gt-dispatch-subnav-item {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.52rem 0.95rem;
    border-radius: 12px;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text-muted, #64748b);
    text-decoration: none;
    white-space: nowrap;
    transition: all 0.15s ease;
    border: 1px solid transparent;
}
.gt-dispatch-subnav-item:hover {
    color: var(--text-primary, #0f172a);
    background: var(--surface-hover, rgba(148, 163, 184, 0.1));
}
.gt-dispatch-subnav-item.is-active {
    background: var(--color-primary-bg, #1136c2);
    color: var(--color-primary-ink, #ffffff) !important;
    font-weight: 700;
    box-shadow: 0 4px 14px rgba(17, 54, 194, 0.25);
    border-color: var(--color-primary-bg, #1136c2);
}
.gt-dispatch-subnav-item.is-active i {
    color: var(--gt-gold, #F9B233);
}
</style>

<nav class="gt-dispatch-subnav animate-fade-in" aria-label="Dispatch Module Navigation">
    <div class="gt-dispatch-subnav-scroll">
        <a href="{% url 'dispatch_dashboard' %}" class="gt-dispatch-subnav-item {% if active_tab == 'dashboard' %}is-active{% endif %}">
            <i class="fas fa-chart-pie"></i>
            <span>Dashboard</span>
        </a>
        <a href="{% url 'dispatch_queue' %}" class="gt-dispatch-subnav-item {% if active_tab == 'queue' %}is-active{% endif %}">
            <i class="fas fa-truck-fast"></i>
            <span>Queue</span>
        </a>
        <a href="{% url 'dispatch_monitoring' %}" class="gt-dispatch-subnav-item {% if active_tab == 'monitoring' %}is-active{% endif %}">
            <i class="fas fa-clipboard-list"></i>
            <span>Master Log</span>
        </a>
        <a href="{% url 'internet_install' %}" class="gt-dispatch-subnav-item {% if active_tab == 'internet_install' %}is-active{% endif %}">
            <i class="fas fa-wifi"></i>
            <span>Internet Install</span>
        </a>
        <a href="{% url 'client_concerns' %}" class="gt-dispatch-subnav-item {% if active_tab == 'client_concerns' %}is-active{% endif %}">
            <i class="fas fa-headset"></i>
            <span>Client Concerns</span>
        </a>
        <a href="{% url 'cignal_install' %}" class="gt-dispatch-subnav-item {% if active_tab == 'cignal_install' %}is-active{% endif %}">
            <i class="fas fa-tv"></i>
            <span>Cignal Play</span>
        </a>
        <a href="{% url 'dispatch_management' %}" class="gt-dispatch-subnav-item {% if active_tab == 'management' %}is-active{% endif %}">
            <i class="fas fa-sliders-h"></i>
            <span>Management</span>
        </a>
        <a href="{% url 'audit_log' %}" class="gt-dispatch-subnav-item {% if active_tab == 'audit_log' %}is-active{% endif %}">
            <i class="fas fa-scroll"></i>
            <span>Audit Log</span>
        </a>
    </div>
</nav>
