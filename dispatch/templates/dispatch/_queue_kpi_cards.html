<!-- Operational Overview KPI Cards (Directly from Dispatch Manual PDF Page 4) -->
<div class="row g-3 mb-4">
  <!-- 1. For Dispatch (Pending) -->
  <div class="col-6 col-lg-3">
    <div class="metric-hero-card amber">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <div class="d-flex align-items-center gap-2">
          <div class="metric-hero-icon amber" style="width: 40px; height: 40px; font-size: 1rem;">
            <i class="fas fa-hourglass-half"></i>
          </div>
          <div>
            <div style="font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: #fbbf24; font-family: 'Inter', sans-serif;">For Dispatch</div>
            <div style="font-size: 0.7rem; color: #64748b; font-family: 'Inter', sans-serif;">Awaiting Field Team</div>
          </div>
        </div>
      </div>
      <div class="d-flex align-items-baseline justify-content-between mt-1">
        <div class="metric-hero-val" style="color: #fbbf24; font-size: 2rem; line-height: 1;">{{ pending_count|default:0 }}</div>
        <span class="badge" style="background: rgba(245,158,11,0.12); color: #fbbf24; border: 1px solid rgba(245,158,11,0.25); font-size: 0.68rem;">Pending</span>
      </div>
      <div style="height: 3px; background: rgba(245,158,11,0.1); border-radius: 999px; margin-top: 0.75rem; overflow: hidden;">
        <div style="height: 100%; width: {% if pending_count > 0 %}65{% else %}0{% endif %}%; background: linear-gradient(90deg,#fbbf24,#d97706); border-radius: 999px;"></div>
      </div>
    </div>
  </div>

  <!-- 2. Ongoing (In Field) -->
  <div class="col-6 col-lg-3">
    <div class="metric-hero-card cyan">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <div class="d-flex align-items-center gap-2">
          <div class="metric-hero-icon cyan" style="width: 40px; height: 40px; font-size: 1rem;">
            <i class="fas fa-truck-fast"></i>
          </div>
          <div>
            <div style="font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: #22d3ee; font-family: 'Inter', sans-serif;">Ongoing</div>
            <div style="font-size: 0.7rem; color: #64748b; font-family: 'Inter', sans-serif;">Active On-Site</div>
          </div>
        </div>
      </div>
      <div class="d-flex align-items-baseline justify-content-between mt-1">
        <div class="metric-hero-val" style="color: #22d3ee; font-size: 2rem; line-height: 1;">{{ ongoing_count|default:0 }}</div>
        <span class="badge" style="background: rgba(6,182,212,0.12); color: #22d3ee; border: 1px solid rgba(6,182,212,0.25); font-size: 0.68rem;">In Progress</span>
      </div>
      <div style="height: 3px; background: rgba(6,182,212,0.1); border-radius: 999px; margin-top: 0.75rem; overflow: hidden;">
        <div style="height: 100%; width: {% if ongoing_count > 0 %}75{% else %}0{% endif %}%; background: linear-gradient(90deg,#22d3ee,#0891b2); border-radius: 999px;"></div>
      </div>
    </div>
  </div>

  <!-- 3. Total Closed -->
  <div class="col-6 col-lg-3">
    <div class="metric-hero-card green">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <div class="d-flex align-items-center gap-2">
          <div class="metric-hero-icon green" style="width: 40px; height: 40px; font-size: 1rem;">
            <i class="fas fa-check-circle"></i>
          </div>
          <div>
            <div style="font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: #34d399; font-family: 'Inter', sans-serif;">Total Closed</div>
            <div style="font-size: 0.7rem; color: #64748b; font-family: 'Inter', sans-serif;">Marked as Done</div>
          </div>
        </div>
      </div>
      <div class="d-flex align-items-baseline justify-content-between mt-1">
        <div class="metric-hero-val" style="color: #34d399; font-size: 2rem; line-height: 1;">{{ completed_count|default:0 }}</div>
        <span class="badge" style="background: rgba(16,185,129,0.12); color: #34d399; border: 1px solid rgba(16,185,129,0.25); font-size: 0.68rem;">Done</span>
      </div>
      <div style="height: 3px; background: rgba(16,185,129,0.1); border-radius: 999px; margin-top: 0.75rem; overflow: hidden;">
        <div style="height: 100%; width: {% if completed_count > 0 %}100{% else %}0{% endif %}%; background: linear-gradient(90deg,#34d399,#059669); border-radius: 999px;"></div>
      </div>
    </div>
  </div>

  <!-- 4. Total Cancelled -->
  <div class="col-6 col-lg-3">
    <div class="metric-hero-card" style="background: var(--d-bg-card); border: 1px solid rgba(244,63,94,0.25);">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <div class="d-flex align-items-center gap-2">
          <div class="metric-hero-icon" style="width: 40px; height: 40px; font-size: 1rem; background: rgba(244,63,94,0.12); color: #f43f5e; border: 1px solid rgba(244,63,94,0.25);">
            <i class="fas fa-ban"></i>
          </div>
          <div>
            <div style="font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: #fb7185; font-family: 'Inter', sans-serif;">Total Cancelled</div>
            <div style="font-size: 0.7rem; color: #64748b; font-family: 'Inter', sans-serif;">Customer / Tech Dropped</div>
          </div>
        </div>
      </div>
      <div class="d-flex align-items-baseline justify-content-between mt-1">
        <div class="metric-hero-val" style="color: #fb7185; font-size: 2rem; line-height: 1;">{{ cancelled_count|default:0 }}</div>
        <span class="badge" style="background: rgba(244,63,94,0.12); color: #fb7185; border: 1px solid rgba(244,63,94,0.25); font-size: 0.68rem;">Cancelled</span>
      </div>
      <div style="height: 3px; background: rgba(244,63,94,0.1); border-radius: 999px; margin-top: 0.75rem; overflow: hidden;">
        <div style="height: 100%; width: {% if cancelled_count > 0 %}40{% else %}0{% endif %}%; background: linear-gradient(90deg,#fb7185,#e11d48); border-radius: 999px;"></div>
      </div>
    </div>
  </div>
</div>
