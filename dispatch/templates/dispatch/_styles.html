<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
    /* ═══════════════════════════════════════════════════════════
       GAMETECH DISPATCH — Premium Design System v3.0
       Font: Inter | Theme: Dark Glassmorphism | 2026
    ═══════════════════════════════════════════════════════════ */

    /* Scope Inter font to all dispatch pages */
    .content, .dispatch-header, .dispatch-card, .dispatch-stepper,
    .dispatch-table, .gt-cl-card, .dispatch-tab-btn, .ds-step {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    :root {
        --d-bg:       rgba(15, 23, 42, 0.75);
        --d-bg-card:  rgba(17, 24, 39, 0.55);
        --d-border:   rgba(255, 255, 255, 0.07);
        --d-border-h: rgba(59, 130, 246, 0.3);
        --d-cyan:     #06b6d4;
        --d-amber:    #f59e0b;
        --d-green:    #10b981;
        --d-purple:   #8b5cf6;
        --d-rose:     #f43f5e;
        --d-blue:     #3b82f6;
        --d-slate:    #64748b;
        --d-text:     #e2e8f0;
        --d-muted:    #64748b;
    }

    /* ─── Page Header ─────────────────────────────── */
    .dispatch-header {
        background: linear-gradient(135deg, rgba(30,41,59,0.65) 0%, rgba(15,23,42,0.88) 100%);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--d-border);
        border-radius: 18px;
        padding: 1.5rem 1.75rem;
        margin-bottom: 1.5rem;
        position: relative;
        overflow: hidden;
    }
    .dispatch-header::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(59,130,246,0.4), transparent);
    }

    /* ─── Glass Card ──────────────────────────────── */
    .dispatch-card {
        background: var(--d-bg-card);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--d-border);
        border-radius: 16px;
        transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
    }
    .dispatch-card:hover {
        border-color: var(--d-border-h);
        box-shadow: 0 8px 28px rgba(0,0,0,0.3), 0 0 0 1px rgba(59,130,246,0.05);
        transform: translateY(-1px);
    }

    /* ─── KPI Hero Cards ──────────────────────────── */
    .metric-hero-card {
        background: var(--d-bg-card);
        backdrop-filter: blur(8px);
        border: 1px solid var(--d-border);
        border-radius: 16px;
        padding: 1.25rem 1.5rem;
        position: relative;
        overflow: hidden;
        transition: all 0.25s ease;
    }
    .metric-hero-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0;
        width: 4px; height: 100%;
        border-radius: 0 2px 2px 0;
    }
    .metric-hero-card.cyan::before   { background: linear-gradient(180deg, #22d3ee, #0891b2); }
    .metric-hero-card.amber::before  { background: linear-gradient(180deg, #fbbf24, #d97706); }
    .metric-hero-card.green::before  { background: linear-gradient(180deg, #34d399, #059669); }
    .metric-hero-card.purple::before { background: linear-gradient(180deg, #a78bfa, #7c3aed); }

    .metric-hero-val {
        font-size: 2.4rem;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.04em;
        color: #f8fafc;
    }

    /* ─── Status Badges ───────────────────────────── */
    .status-badge {
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 0.3rem 0.7rem;
        border-radius: 9999px;
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        white-space: nowrap;
    }
    .status-badge::before {
        content: '';
        width: 5px; height: 5px;
        border-radius: 50%;
        background: currentColor;
        flex-shrink: 0;
    }
    .status-badge.status-pending    { background: rgba(6,182,212,0.12);  color: #22d3ee; border: 1px solid rgba(6,182,212,0.25); }
    .status-badge.status-assigned   { background: rgba(245,158,11,0.12); color: #fbbf24; border: 1px solid rgba(245,158,11,0.25); }
    .status-badge.status-in_progress{ background: rgba(59,130,246,0.15); color: #60a5fa; border: 1px solid rgba(59,130,246,0.3); animation: pulse-glow 2s infinite; }
    .status-badge.status-completed  { background: rgba(16,185,129,0.12); color: #34d399; border: 1px solid rgba(16,185,129,0.25); }
    .status-badge.status-cancelled  { background: rgba(100,116,139,0.12);color: #94a3b8; border: 1px solid rgba(100,116,139,0.2); }

    /* ─── Priority Pills ──────────────────────────── */
    .priority-pill {
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 0.18rem 0.55rem;
        border-radius: 5px;
    }
    .priority-pill.urgent { background: rgba(244,63,94,0.15);  color: #fb7185; border: 1px solid rgba(244,63,94,0.2); }
    .priority-pill.high   { background: rgba(245,158,11,0.15); color: #fcd34d; border: 1px solid rgba(245,158,11,0.2); }
    .priority-pill.normal { background: rgba(59,130,246,0.12); color: #93c5fd; border: 1px solid rgba(59,130,246,0.18); }
    .priority-pill.low    { background: rgba(100,116,139,0.12);color: #cbd5e1; border: 1px solid rgba(100,116,139,0.18); }

    /* ─── Map ─────────────────────────────────────── */
    #dispatch-map {
        height: 620px; width: 100%;
        border-radius: 16px;
        border: 1px solid var(--d-border);
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        z-index: 1;
    }
    .map-tiles-dark { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }

    /* ─── DataTables Dark Theme ───────────────────── */
    .dataTables_wrapper .dataTables_length,
    .dataTables_wrapper .dataTables_filter,
    .dataTables_wrapper .dataTables_info,
    .dataTables_wrapper .dataTables_processing,
    .dataTables_wrapper .dataTables_paginate { color: #94a3b8 !important; margin-bottom: 1rem; }
    .dataTables_wrapper .dataTables_filter input,
    .dataTables_wrapper .dataTables_length select {
        background-color: rgba(15,23,42,0.5) !important;
        border: 1px solid rgba(255,255,255,0.1) !important;
        color: white !important;
        border-radius: 8px !important;
    }
    .page-item.disabled .page-link { background-color: rgba(255,255,255,0.03) !important; border-color: rgba(255,255,255,0.05) !important; color: #475569 !important; }
    .page-item .page-link           { background-color: rgba(30,41,59,0.5) !important; border-color: rgba(255,255,255,0.1) !important; color: #e2e8f0 !important; border-radius: 6px !important; }
    .page-item.active .page-link    { background-color: #2563eb !important; border-color: #2563eb !important; }

    /* ─── Leaflet Popups ──────────────────────────── */
    .leaflet-popup-content-wrapper {
        background: rgba(15,23,42,0.96) !important;
        backdrop-filter: blur(10px);
        color: #f8fafc !important;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 12px !important;
    }
    .leaflet-popup-tip { background: rgba(15,23,42,0.96) !important; }

    /* ═══════════════════════════════════════════════
       PIPELINE STAGE STEPPER
    ═══════════════════════════════════════════════ */
    .dispatch-stepper {
        display: flex;
        align-items: center;
        padding: 0.875rem 1.25rem;
        background: rgba(15,23,42,0.6);
        backdrop-filter: blur(12px);
        border: 1px solid var(--d-border);
        border-radius: 14px;
        margin-bottom: 1.5rem;
        overflow-x: auto;
        scrollbar-width: none;
        gap: 0;
    }
    .dispatch-stepper::-webkit-scrollbar { display: none; }

    .ds-step {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        text-decoration: none;
        padding: 0.45rem 0.8rem;
        border-radius: 10px;
        transition: background 0.2s ease;
        flex-shrink: 0;
    }
    .ds-step:hover:not(.ds-step--active):not(.ds-step--disabled) {
        background: rgba(255,255,255,0.04);
    }
    .ds-step__num {
        width: 28px; height: 28px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.72rem;
        font-weight: 800;
        flex-shrink: 0;
        transition: all 0.25s ease;
    }
    .ds-step__label { display: flex; flex-direction: column; line-height: 1.25; }
    .ds-step__title { font-size: 0.78rem; font-weight: 700; white-space: nowrap; }
    .ds-step__sub   { font-size: 0.63rem; white-space: nowrap; }

    /* Stepper states */
    .ds-step--done   .ds-step__num { background: rgba(16,185,129,0.15); color: #34d399; border: 1.5px solid rgba(16,185,129,0.35); }
    .ds-step--done   .ds-step__title { color: #64748b; }
    .ds-step--done   .ds-step__sub   { color: #475569; }

    .ds-step--active .ds-step__num  { background: linear-gradient(135deg, #2563eb, #4f46e5); color: #fff; box-shadow: 0 0 0 3px rgba(37,99,235,0.22); }
    .ds-step--active .ds-step__title { color: #f1f5f9; }
    .ds-step--active .ds-step__sub   { color: #94a3b8; }
    .ds-step--active { background: rgba(37,99,235,0.08); border: 1px solid rgba(37,99,235,0.2); }

    .ds-step--alert  .ds-step__num  { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1.5px solid rgba(245,158,11,0.35); animation: stepper-pulse 1.8s infinite; }
    .ds-step--alert  .ds-step__title { color: #fbbf24; }
    .ds-step--alert  .ds-step__sub   { color: #92400e; }

    .ds-step--disabled .ds-step__num { background: rgba(100,116,139,0.1); color: #334155; border: 1px solid rgba(100,116,139,0.15); }
    .ds-step--disabled .ds-step__title { color: #334155; }
    .ds-step--disabled { cursor: default; }

    .ds-connector {
        width: 20px; height: 1px;
        background: rgba(255,255,255,0.08);
        flex-shrink: 0;
        position: relative;
    }
    .ds-connector::after {
        content: '';
        position: absolute;
        right: -3px; top: -3px;
        width: 6px; height: 6px;
        border-right: 1.5px solid rgba(255,255,255,0.12);
        border-top:   1.5px solid rgba(255,255,255,0.12);
        transform: rotate(45deg);
    }

    .ds-live-pill {
        margin-left: auto;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #34d399;
        background: rgba(16,185,129,0.08);
        border: 1px solid rgba(16,185,129,0.2);
        border-radius: 999px;
        padding: 0.25rem 0.7rem;
    }
    .ds-live-dot {
        width: 6px; height: 6px;
        background: #34d399;
        border-radius: 50%;
        animation: live-dot-pulse 1.4s ease infinite;
    }

    /* ═══════════════════════════════════════════════
       DISPATCH TABLE — unified
    ═══════════════════════════════════════════════ */
    .dispatch-table { width: 100%; border-collapse: separate; border-spacing: 0; }
    .dispatch-table thead tr th {
        background: rgba(15,23,42,0.55);
        color: #475569;
        font-size: 0.67rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        padding: 0.8rem 1rem;
        border-bottom: 1px solid var(--d-border);
        white-space: nowrap;
    }
    .dispatch-table tbody tr td {
        padding: 0.9rem 1rem;
        border-bottom: 1px solid rgba(255,255,255,0.035);
        vertical-align: middle;
        font-size: 0.84rem;
        color: #cbd5e1;
        transition: background 0.12s ease;
    }
    .dispatch-table tbody tr:hover td { background: rgba(59,130,246,0.04); }
    .dispatch-table tbody tr:hover td:first-child { box-shadow: inset 3px 0 0 rgba(59,130,246,0.45); }
    .dispatch-table tbody tr:last-child td { border-bottom: none; }

    /* ─── Section Headers ─────────────────────────── */
    .dispatch-section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; padding: 0 0.25rem; }
    .dispatch-section-title  { font-size: 0.95rem; font-weight: 700; color: #f1f5f9; display: flex; align-items: center; gap: 0.5rem; }
    .dispatch-section-subtitle { font-size: 0.72rem; color: #475569; margin-top: 0.15rem; }

    /* ─── Progress Meter ──────────────────────────── */
    .dp-meter { height: 4px; background: rgba(255,255,255,0.05); border-radius: 999px; overflow: hidden; margin-top: 0.5rem; }
    .dp-meter-fill { height: 100%; border-radius: 999px; transition: width 0.6s cubic-bezier(0.4,0,0.2,1); }

    /* ─── Rank Medals ─────────────────────────────── */
    .rank-medal { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 800; flex-shrink: 0; }
    .rank-medal.gold   { background: rgba(251,191,36,0.18); color: #fbbf24; border: 1.5px solid rgba(251,191,36,0.45); }
    .rank-medal.silver { background: rgba(148,163,184,0.18); color: #cbd5e1; border: 1.5px solid rgba(148,163,184,0.35); }
    .rank-medal.bronze { background: rgba(180,83,9,0.18);   color: #fb923c; border: 1.5px solid rgba(180,83,9,0.35); }
    .rank-medal.plain  { background: rgba(100,116,139,0.08); color: #475569; border: 1px solid rgba(100,116,139,0.18); }

    /* ─── Filter Controls ─────────────────────────── */
    .dispatch-filter-select {
        background: rgba(15,23,42,0.7) !important;
        border: 1px solid rgba(255,255,255,0.09) !important;
        color: #e2e8f0 !important;
        border-radius: 9px !important;
        font-size: 0.8rem !important;
        padding: 0.42rem 0.75rem !important;
        transition: border-color 0.2s ease, box-shadow 0.2s ease !important;
        font-family: 'Inter', sans-serif !important;
    }
    .dispatch-filter-select:focus {
        border-color: rgba(59,130,246,0.5) !important;
        box-shadow: 0 0 0 3px rgba(59,130,246,0.1) !important;
        outline: none !important;
    }
    .dispatch-filter-select option { background: #0f172a; color: #e2e8f0; }

    .dispatch-search-input {
        background: rgba(15,23,42,0.7) !important;
        border: 1px solid rgba(255,255,255,0.09) !important;
        color: #e2e8f0 !important;
        border-radius: 0 9px 9px 0 !important;
        font-size: 0.82rem !important;
        font-family: 'Inter', sans-serif !important;
    }
    .dispatch-search-input::placeholder { color: #334155 !important; }
    .dispatch-search-input:focus {
        border-color: rgba(59,130,246,0.5) !important;
        box-shadow: 0 0 0 3px rgba(59,130,246,0.1) !important;
        outline: none !important;
    }
    .dispatch-search-addon {
        background: rgba(15,23,42,0.7) !important;
        border: 1px solid rgba(255,255,255,0.09) !important;
        border-right: none !important;
        color: #334155 !important;
        border-radius: 9px 0 0 9px !important;
    }

    /* ─── Empty State ─────────────────────────────── */
    .dispatch-empty-state { text-align: center; padding: 3.5rem 2rem; }
    .dispatch-empty-icon {
        width: 72px; height: 72px;
        border-radius: 20px;
        background: rgba(100,116,139,0.08);
        border: 1px solid rgba(100,116,139,0.15);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 1.75rem;
        color: #334155;
        margin-bottom: 1.25rem;
    }
    .dispatch-empty-state h6  { color: #64748b; font-weight: 600; margin-bottom: 0.35rem; font-size: 0.9rem; }
    .dispatch-empty-state p   { color: #334155; font-size: 0.79rem; margin: 0; }

    /* ─── Management Tabs ─────────────────────────── */
    .dispatch-tab-bar {
        display: flex;
        gap: 0.2rem;
        background: rgba(15,23,42,0.5);
        border: 1px solid var(--d-border);
        border-radius: 12px 12px 0 0;
        padding: 0.35rem 0.35rem 0;
        margin-bottom: 0;
        overflow-x: auto;
        scrollbar-width: none;
    }
    .dispatch-tab-bar::-webkit-scrollbar { display: none; }
    .dispatch-tab-btn {
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.55rem 1.1rem;
        border-radius: 8px 8px 0 0;
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        border: none;
        background: transparent;
        cursor: pointer;
        transition: all 0.2s ease;
        white-space: nowrap;
        font-family: 'Inter', sans-serif;
        border-bottom: 2px solid transparent;
    }
    .dispatch-tab-btn:hover { color: #94a3b8; background: rgba(255,255,255,0.03); }
    .dispatch-tab-btn.active {
        color: #93c5fd;
        background: rgba(37,99,235,0.1);
        border-bottom-color: #3b82f6;
    }
    .dispatch-tab-body {
        background: rgba(15,23,42,0.45);
        border: 1px solid var(--d-border);
        border-top: none;
        border-radius: 0 0 14px 14px;
    }

    /* ─── Inline Real-time Chip ───────────────────── */
    .d-realtime-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.67rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #34d399;
        background: rgba(16,185,129,0.08);
        border: 1px solid rgba(16,185,129,0.2);
        border-radius: 999px;
        padding: 0.2rem 0.6rem;
    }
    .d-realtime-chip::before {
        content: '';
        width: 5px; height: 5px;
        border-radius: 50%;
        background: #34d399;
        animation: live-dot-pulse 1.4s ease infinite;
    }

    /* ─── Nav Tabs (dispatch pill style) ─────────── */
    .dispatch-nav-tabs .nav-link {
        color: #64748b;
        border: none;
        padding: 0.65rem 1.1rem;
        border-radius: 9px;
        font-size: 0.82rem;
        font-weight: 600;
        transition: all 0.22s ease;
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        font-family: 'Inter', sans-serif;
    }
    .dispatch-nav-tabs .nav-link:hover { color: #e2e8f0; background: rgba(255,255,255,0.04); }
    .dispatch-nav-tabs .nav-link.active {
        color: #ffffff;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        box-shadow: 0 4px 14px rgba(37,99,235,0.3);
    }

    /* ─── Animations ──────────────────────────────── */
    @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 0 0 rgba(59,130,246,0.35); }
        50%       { box-shadow: 0 0 0 5px rgba(59,130,246,0); }
    }
    @keyframes stepper-pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(245,158,11,0.35); }
        50%       { box-shadow: 0 0 0 4px rgba(245,158,11,0); }
    }
    @keyframes live-dot-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%       { opacity: 0.45; transform: scale(0.75); }
    }
    @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in-up { animation: fade-in-up 0.35s ease forwards; }

    /* ─── Responsive ──────────────────────────────── */
    @media (max-width: 768px) {
        #dispatch-map { height: 420px; }
        .metric-hero-val { font-size: 1.8rem; }
        .dispatch-header { padding: 1rem 1.25rem; }
        .dispatch-stepper { padding: 0.6rem 0.75rem; }
        .ds-step { padding: 0.4rem 0.6rem; }
        .ds-step__sub { display: none; }
        .ticket-action-btns { display: flex; flex-direction: column; width: 100%; gap: 0.5rem; }
    }
</style>
