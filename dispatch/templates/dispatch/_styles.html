<style>
    /* Gametech Premium Dispatch Design System */
    :root {
        --dispatch-bg: rgba(15, 23, 42, 0.75);
        --dispatch-border: rgba(255, 255, 255, 0.08);
        --dispatch-cyan: #06b6d4;
        --dispatch-amber: #f59e0b;
        --dispatch-green: #10b981;
        --dispatch-purple: #8b5cf6;
        --dispatch-rose: #f43f5e;
    }

    .dispatch-header {
        background: linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.85) 100%);
        backdrop-filter: blur(12px);
        border: 1px solid var(--dispatch-border);
        border-radius: 16px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
    }

    .dispatch-nav-tabs .nav-link {
        color: #94a3b8;
        border: none;
        padding: 0.75rem 1.25rem;
        border-radius: 10px;
        font-weight: 600;
        transition: all 0.25s ease;
        margin-right: 0.5rem;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
    }

    .dispatch-nav-tabs .nav-link:hover {
        color: #f8fafc;
        background: rgba(255, 255, 255, 0.05);
    }

    .dispatch-nav-tabs .nav-link.active {
        color: #ffffff;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }

    .dispatch-card {
        background: rgba(30, 41, 59, 0.65);
        backdrop-filter: blur(10px);
        border: 1px solid var(--dispatch-border);
        border-radius: 16px;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .dispatch-card:hover {
        border-color: rgba(59, 130, 246, 0.3);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .metric-hero-card {
        background: rgba(30, 41, 59, 0.5);
        backdrop-filter: blur(8px);
        border: 1px solid var(--dispatch-border);
        border-radius: 16px;
        padding: 1.25rem 1.5rem;
        position: relative;
        overflow: hidden;
        transition: all 0.25s ease;
    }

    .metric-hero-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 4px;
        height: 100%;
    }

    .metric-hero-card.cyan::before { background: var(--dispatch-cyan); }
    .metric-hero-card.amber::before { background: var(--dispatch-amber); }
    .metric-hero-card.green::before { background: var(--dispatch-green); }
    .metric-hero-card.purple::before { background: var(--dispatch-purple); }

    .metric-hero-val {
        font-size: 2.2rem;
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: -0.03em;
        color: #f8fafc;
    }

    /* Ticket Badges & Status */
    .status-badge {
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 0.35rem 0.75rem;
        border-radius: 9999px;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
    }

    .status-badge.status-pending {
        background: rgba(6, 182, 212, 0.15);
        color: #22d3ee;
        border: 1px solid rgba(6, 182, 212, 0.3);
    }

    .status-badge.status-assigned {
        background: rgba(245, 158, 11, 0.15);
        color: #fbbf24;
        border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .status-badge.status-in_progress {
        background: rgba(59, 130, 246, 0.18);
        color: #60a5fa;
        border: 1px solid rgba(59, 130, 246, 0.35);
        animation: pulse-glow 2s infinite;
    }

    .status-badge.status-completed {
        background: rgba(16, 185, 129, 0.15);
        color: #34d399;
        border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-badge.status-cancelled {
        background: rgba(148, 163, 184, 0.15);
        color: #94a3b8;
        border: 1px solid rgba(148, 163, 184, 0.3);
    }

    .priority-pill {
        font-size: 0.7rem;
        font-weight: 700;
        padding: 0.2rem 0.6rem;
        border-radius: 6px;
    }

    .priority-pill.urgent { background: rgba(244, 63, 94, 0.2); color: #fb7185; }
    .priority-pill.high { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }
    .priority-pill.normal { background: rgba(59, 130, 246, 0.15); color: #93c5fd; }
    .priority-pill.low { background: rgba(100, 116, 139, 0.2); color: #cbd5e1; }

    #dispatch-map {
        height: 620px;
        width: 100%;
        border-radius: 16px;
        border: 1px solid var(--dispatch-border);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        z-index: 1;
    }

    /* Converts light OSM tiles to an elegant dark theme */
    .map-tiles-dark {
        filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
    }

    /* Dark Mode Overrides for DataTables */
    .dataTables_wrapper .dataTables_length, 
    .dataTables_wrapper .dataTables_filter, 
    .dataTables_wrapper .dataTables_info, 
    .dataTables_wrapper .dataTables_processing,

        margin-bottom: 1rem;
    }
    .dataTables_wrapper .dataTables_filter input {
        background-color: rgba(15, 23, 42, 0.5) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        color: white !important;
    }
    .dataTables_wrapper .dataTables_length select {
        background-color: rgba(15, 23, 42, 0.5) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        color: white !important;
    }
    .page-item.disabled .page-link {
        background-color: rgba(255, 255, 255, 0.05) !important;
        border-color: rgba(255, 255, 255, 0.05) !important;
        color: #64748b !important;
    }
    .page-item .page-link {
        background-color: rgba(30, 41, 59, 0.5) !important;
        border-color: rgba(255, 255, 255, 0.1) !important;
        color: #f8fafc !important;
    }
    .page-item.active .page-link {
        background-color: #0d6efd !important;
        border-color: #0d6efd !important;
    }

    .leaflet-popup-content-wrapper {
        background: rgba(15, 23, 42, 0.95) !important;
        backdrop-filter: blur(10px);
        color: #f8fafc !important;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px !important;
    }

    .leaflet-popup-tip {
        background: rgba(15, 23, 42, 0.95) !important;
    }

    /* Mobile First for Field Technicians */
    @media (max-width: 768px) {
        #dispatch-map { height: 420px; }
        .metric-hero-val { font-size: 1.75rem; }
        .dispatch-header { padding: 1rem; }
        .ticket-action-btns {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 0.5rem;
        }
    }

    @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
        50% { box-shadow: 0 0 0 6px rgba(59, 130, 246, 0); }
    }
</style>
