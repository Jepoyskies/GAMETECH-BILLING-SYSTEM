<div class="dispatch-card p-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <div class="d-flex align-items-center gap-3">
            <h5 class="fw-bold text-white mb-0"><i class="fas fa-map-marked-alt text-primary me-2"></i> Field Operations Map</h5>
            <span class="badge bg-dark border border-secondary text-info" id="map-pin-count">0 pins rendered</span>
        </div>
        <div class="d-flex align-items-center gap-2">
            <!-- Map Legend -->
            <div class="d-none d-md-flex align-items-center gap-2 me-3 text-xs">
                <span class="d-inline-block rounded-circle" style="width: 10px; height: 10px; background: #06b6d4;"></span> <span class="text-muted">Pending</span>
                <span class="d-inline-block rounded-circle" style="width: 10px; height: 10px; background: #f59e0b;"></span> <span class="text-muted">Assigned</span>
                <span class="d-inline-block rounded-circle" style="width: 10px; height: 10px; background: #3b82f6;"></span> <span class="text-muted">In Progress</span>
                <span class="d-inline-block rounded-circle" style="width: 10px; height: 10px; background: #10b981;"></span> <span class="text-muted">Completed</span>
            </div>
            <button class="btn btn-sm btn-outline-secondary" id="btn-recenter-map">
                <i class="fas fa-crosshairs me-1"></i> Recenter
            </button>
            <button class="btn btn-sm btn-outline-primary" id="btn-refresh-map-data">
                <i class="fas fa-sync-alt me-1"></i> Refresh Pins
            </button>
        </div>
    </div>

    <!-- Leaflet Map Container -->
    <div class="position-relative">
        <div id="dispatch-map"></div>
    </div>
</div>
