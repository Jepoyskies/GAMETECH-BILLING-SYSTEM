<!-- Dispatch Queue Tabs Suite (Directly from Dispatch Manual PDF Page 10) -->
<div class="dispatch-card fade-in-up mb-4" style="overflow: hidden;">
  
  <!-- Tab Navigation Bar -->
  <div class="dispatch-card-header d-flex flex-wrap justify-content-between align-items-center gap-3" style="padding: 0.75rem 1.25rem; background: rgba(0,0,0,0.25);">
    <ul class="nav nav-pills queue-pills gap-2" id="queueTab" role="tablist" style="margin: 0;">
      <!-- Pending Tab (Default) -->
      <li class="nav-item" role="presentation">
        <button class="nav-link active queue-tab-btn" id="pending-tab" data-bs-toggle="pill" data-bs-target="#tab-pending" type="button" role="tab" aria-selected="true">
          <i class="fas fa-hourglass-half me-1" style="color: #fbbf24;"></i>
          Pending
          <span class="queue-badge queue-badge-amber ms-1">{{ pending_count|default:0 }}</span>
        </button>
      </li>
      <!-- Ongoing Tab -->
      <li class="nav-item" role="presentation">
        <button class="nav-link queue-tab-btn" id="ongoing-tab" data-bs-toggle="pill" data-bs-target="#tab-ongoing" type="button" role="tab" aria-selected="false">
          <i class="fas fa-truck-fast me-1" style="color: #22d3ee;"></i>
          Ongoing
          <span class="queue-badge queue-badge-cyan ms-1">{{ ongoing_count|default:0 }}</span>
        </button>
      </li>
      <!-- Completed Tab -->
      <li class="nav-item" role="presentation">
        <button class="nav-link queue-tab-btn" id="completed-tab" data-bs-toggle="pill" data-bs-target="#tab-completed" type="button" role="tab" aria-selected="false">
          <i class="fas fa-check-circle me-1" style="color: #34d399;"></i>
          Completed
          <span class="queue-badge queue-badge-green ms-1">{{ completed_count|default:0 }}</span>
        </button>
      </li>
      <!-- All Records Tab -->
      <li class="nav-item" role="presentation">
        <button class="nav-link queue-tab-btn" id="all-tab" data-bs-toggle="pill" data-bs-target="#tab-all" type="button" role="tab" aria-selected="false">
          <i class="fas fa-database me-1" style="color: #94a3b8;"></i>
          All Records
          <span class="queue-badge queue-badge-slate ms-1">{{ total_count|default:0 }}</span>
        </button>
      </li>
    </ul>

    <!-- Quick Action / Real-time Status -->
    <div class="d-flex align-items-center gap-2">
      <span class="d-realtime-chip">Live Synced</span>
    </div>
  </div>

  <!-- Tab Contents (Modularized Sub-partials) -->
  <div class="tab-content" id="queueTabContent">
    {% include "dispatch/tabs/_tab_pending.html" %}
    {% include "dispatch/tabs/_tab_ongoing.html" %}
    {% include "dispatch/tabs/_tab_completed.html" %}
    {% include "dispatch/tabs/_tab_all.html" %}
  </div>
</div>

<!-- Toast notification helper for Clipboard copy -->
<div id="dispatch-copy-toast" style="position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: none; background: rgba(15,23,42,0.95); border: 1px solid rgba(59,130,246,0.4); color: #fff; padding: 12px 20px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(12px); font-size: 0.85rem; font-weight: 600; animation: fade-in-up 0.25s ease;">
  <i class="fas fa-check-circle text-success me-2"></i>
  <span id="dispatch-copy-toast-msg">Copied to clipboard!</span>
</div>
