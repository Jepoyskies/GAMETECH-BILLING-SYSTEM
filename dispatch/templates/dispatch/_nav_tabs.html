{% load static %}
<div class="dispatch-navbar-container mb-3">
  <div class="dispatch-navbar">
    <div class="dispatch-nav-brand">
      <div class="dispatch-logo-pill">
        <i class="fas fa-satellite-dish"></i>
      </div>
      <div class="dispatch-brand-meta">
        <span class="dispatch-brand-title">Gametech Dispatch</span>
        <span class="dispatch-brand-sub">Field & Queue Operations</span>
      </div>
    </div>
    
    <div class="dispatch-nav-items">
      <a href="{% url 'dispatch_dashboard' %}" class="dispatch-nav-link {% if request.resolver_match.url_name == 'dispatch_dashboard' %}active{% endif %}">
        <i class="fas fa-chart-pie"></i>
        <span>Dashboard</span>
      </a>
      <a href="{% url 'dispatch_dispatches' %}" class="dispatch-nav-link {% if request.resolver_match.url_name == 'dispatch_dispatches' or request.resolver_match.url_name == 'dispatch_monitoring' %}active{% endif %}">
        <i class="fas fa-clipboard-list"></i>
        <span>Dispatch Log</span>
      </a>
      <div class="dispatch-nav-divider"></div>
      <a href="{% url 'internet_install' %}" class="dispatch-nav-link {% if request.resolver_match.url_name == 'internet_install' %}active{% endif %}">
        <i class="fas fa-wifi"></i>
        <span>Internet Install</span>
      </a>
      <a href="{% url 'cignal_install' %}" class="dispatch-nav-link {% if request.resolver_match.url_name == 'cignal_install' %}active{% endif %}">
        <i class="fas fa-tv"></i>
        <span>Cignal Play</span>
      </a>
      <a href="{% url 'client_concerns' %}" class="dispatch-nav-link {% if request.resolver_match.url_name == 'client_concerns' %}active{% endif %}">
        <i class="fas fa-headset"></i>
        <span>Client Concerns</span>
      </a>
      <a href="{% url 'dispatch_customers' %}" class="dispatch-nav-link {% if request.resolver_match.url_name == 'dispatch_customers' %}active{% endif %}">
        <i class="fas fa-address-book"></i>
        <span>Customer</span>
      </a>
      <div class="dispatch-nav-divider"></div>
      <a href="{% url 'dispatch_management' %}" class="dispatch-nav-link {% if request.resolver_match.url_name == 'dispatch_management' or request.resolver_match.url_name == 'dispatch_staff' %}active{% endif %}">
        <i class="fas fa-cog"></i>
        <span>Management</span>
      </a>
      <a href="{% url 'audit_log' %}" class="dispatch-nav-link {% if request.resolver_match.url_name == 'audit_log' %}active{% endif %}">
        <i class="fas fa-scroll"></i>
        <span>Audit Log</span>
      </a>
    </div>

    <div class="dispatch-nav-tail ms-auto d-none d-md-flex align-items-center gap-2">
      <a href="{% url 'dashboard' %}" class="btn-return-billing" title="Return to Billing Dashboard">
        <i class="fas fa-arrow-left me-1"></i> Billing CRM
      </a>
    </div>
  </div>
</div>
