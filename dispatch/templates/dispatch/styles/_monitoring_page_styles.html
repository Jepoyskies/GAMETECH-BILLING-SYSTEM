{% include "dispatch/styles/_theme.html" %}
<style>
/* ═══════════════════════════════════════════════════════
   DISPATCH — Shared Monitoring Page Styles
   (internet_install, cignal_install, client_concerns,
    dispatch_monitoring — all pages share these classes)
═══════════════════════════════════════════════════════ */

/* Page wrapper */
.mon-page   { padding: 1.5rem 1.75rem; font-family: 'Inter', sans-serif; }

/* ── Page header ── */
.mon-header {
  display: flex; align-items: center;
  justify-content: space-between;
  margin-bottom: 1.25rem;
  flex-wrap: wrap; gap: 0.75rem;
}
.mon-header-left  { display: flex; align-items: center; gap: 0.7rem; }
.mon-icon {
  width: 42px; height: 42px; border-radius: 11px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem;
  background: var(--mon-accent-bg, rgba(6,182,212,0.12));
  color: var(--mon-accent, #06b6d4);
}
.mon-header-left h1 {
  font-size: 1.3rem; font-weight: 800; margin: 0; letter-spacing: -0.02em;
  color: var(--d-text-heading);
}
.mon-header-left p {
  font-size: 0.78rem; color: var(--d-muted); margin: 0; font-weight: 500;
}

/* ── Primary action button ── */
.btn-mon-primary {
  background: var(--mon-accent, #06b6d4);
  color: #fff; border: none; border-radius: 8px;
  padding: 0.48rem 1.1rem; font-size: 0.84rem; font-weight: 600;
  cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem;
  transition: filter 0.15s; white-space: nowrap; text-decoration: none;
}
.btn-mon-primary:hover { filter: brightness(0.9); color: #fff; }

/* ── Filter bar ── */
.mon-filter-bar {
  display: flex; align-items: center; gap: 0.55rem;
  flex-wrap: wrap; margin-bottom: 1rem;
}
.mon-filter-bar select,
.mon-filter-bar input[type=text],
.mon-filter-bar input[type=search] {
  background: var(--d-input-bg);
  border: 1px solid var(--d-input-border);
  color: var(--d-input-text);
  border-radius: 8px; padding: 0.42rem 0.78rem;
  font-size: 0.82rem; font-family: 'Inter', sans-serif;
  cursor: pointer; min-width: 120px; transition: border-color 0.15s;
}
.mon-filter-bar select:focus,
.mon-filter-bar input:focus {
  outline: none; border-color: var(--mon-accent, #06b6d4);
}
.btn-mon-reset {
  background: var(--d-pill-bg); border: 1px solid var(--d-pill-border);
  color: var(--d-muted); border-radius: 8px; padding: 0.42rem 0.85rem;
  font-size: 0.81rem; font-weight: 500; cursor: pointer;
  display: inline-flex; align-items: center; gap: 0.35rem; transition: all 0.15s;
  text-decoration: none;
}
.btn-mon-reset:hover { border-color: var(--d-border-h); color: var(--d-text-heading); }

/* ── Tabs ── */
.mon-tabs {
  display: flex;
  border-bottom: 2px solid var(--d-border);
  background: var(--d-bg-card);
  border-radius: 12px 12px 0 0;
  padding: 0 0.5rem;
}
.mon-tab-btn {
  padding: 0.7rem 1.3rem; border: none; background: none;
  font-size: 0.85rem; font-weight: 600;
  color: var(--d-muted); cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -2px;
  display: inline-flex; align-items: center; gap: 0.5rem;
  font-family: 'Inter', sans-serif; transition: color 0.15s;
}
.mon-tab-btn.active {
  color: var(--mon-accent, #06b6d4);
  border-bottom-color: var(--mon-accent, #06b6d4);
}
.mon-tab-count {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 20px; height: 18px; border-radius: 9px;
  font-size: 0.7rem; font-weight: 700; padding: 0 4px;
}
.mon-tab-count.amber  { background: rgba(245,158,11,0.15); color: #d97706; }
.mon-tab-count.accent { background: rgba(6,182,212,0.15); color: var(--mon-accent,#06b6d4); }

/* ── Table card ── */
.mon-card {
  background: var(--d-bg-card);
  border: 1px solid var(--d-border);
  border-radius: 12px; overflow: hidden;
  box-shadow: var(--d-card-shadow);
  margin-bottom: 1.5rem;
}
.mon-card-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.85rem 1rem;
  border-bottom: 1px solid var(--d-border);
  font-size: 0.85rem; font-weight: 700; color: var(--d-text-heading);
  gap: 0.5rem; flex-wrap: wrap;
}
.mon-table { width: 100%; border-collapse: collapse; white-space: nowrap; }
.mon-th {
  padding: 0.58rem 0.8rem; text-align: left; font-size: 0.72rem;
  font-weight: 700; color: var(--d-table-head-text); text-transform: uppercase;
  letter-spacing: 0.04em; background: var(--d-table-head-bg);
}
.mon-td {
  padding: 0.62rem 0.8rem; vertical-align: middle;
  color: var(--d-text); border-bottom: 1px solid var(--d-border-subtle);
  font-size: 0.84rem;
}
.mon-row { transition: background 0.12s; }
.mon-row:last-child td { border-bottom: none; }
.mon-row:hover td { background: var(--d-table-row-hover); }

/* ── Status badges ── */
.mon-badge {
  display: inline-flex; align-items: center; gap: 0.25rem;
  padding: 0.2rem 0.62rem; border-radius: 20px;
  font-size: 0.72rem; font-weight: 600; white-space: nowrap;
  border: 1px solid transparent;
}
.mon-badge-pending    { background: rgba(245,158,11,0.12); color: #b45309; border-color: rgba(245,158,11,0.3); }
.mon-badge-resched    { background: rgba(59,130,246,0.1);  color: #2563eb; border-color: rgba(59,130,246,0.25); }
.mon-badge-ongoing    { background: rgba(16,185,129,0.1);  color: #047857; border-color: rgba(16,185,129,0.25); }
.mon-badge-closed     { background: rgba(100,116,139,0.1); color: #64748b; border-color: rgba(100,116,139,0.22); }
.mon-badge-follow-up  { background: rgba(236,72,153,0.1);  color: #be185d; border-color: rgba(236,72,153,0.25); }
.mon-badge-transition { background: rgba(139,92,246,0.1);  color: #6d28d9; border-color: rgba(139,92,246,0.25); }
.mon-badge-cancelled  { background: rgba(239,68,68,0.1);   color: #b91c1c; border-color: rgba(239,68,68,0.22); }

html.dark-mode .mon-badge-pending    { color: #fbbf24; }
html.dark-mode .mon-badge-resched    { color: #60a5fa; }
html.dark-mode .mon-badge-ongoing    { color: #34d399; }
html.dark-mode .mon-badge-closed     { color: #94a3b8; }
html.dark-mode .mon-badge-follow-up  { color: #f472b6; }
html.dark-mode .mon-badge-transition { color: #a78bfa; }
html.dark-mode .mon-badge-cancelled  { color: #f87171; }

/* ── Row action buttons ── */
.btn-mon-action {
  border: none; border-radius: 6px; padding: 0.28rem 0.65rem;
  font-size: 0.76rem; font-weight: 600; cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 0.3rem; transition: filter 0.13s;
}
.btn-mon-action:hover { filter: brightness(0.9); }
.btn-mon-dispatch   { background: var(--mon-accent,#06b6d4); color: #fff; }
.btn-mon-undispatch { background: #f59e0b; color: #fff; }
.btn-mon-done       { background: #16a34a; color: #fff; }
.btn-mon-edit       {
  background: var(--d-pill-bg); border: 1px solid var(--d-pill-border);
  color: var(--d-muted); padding: 0.28rem 0.6rem;
}
.btn-mon-edit:hover { color: var(--d-text-heading); border-color: var(--d-border-h); filter: none; }

/* ── Empty state ── */
.mon-empty {
  text-align: center; padding: 3rem 0;
  color: var(--d-muted); font-size: 0.88rem;
}
.mon-empty i { font-size: 2.2rem; opacity: 0.3; display: block; margin-bottom: 0.75rem; }

/* ── Cell helpers ── */
.mon-cell-muted { font-size: 0.77rem; color: var(--d-muted); margin-top: 2px; }
.mon-cell-name  { font-weight: 700; color: var(--d-text-heading); font-size: 0.86rem; }

/* ── Pagination ── */
.mon-pagination { padding: 0.75rem 1rem; border-top: 1px solid var(--d-border); }
</style>
