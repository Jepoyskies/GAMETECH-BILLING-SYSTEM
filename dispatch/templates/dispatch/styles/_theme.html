<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
    /* ═══════════════════════════════════════════════════════════
       GAMETECH DISPATCH — Theme Tokens (Light & Dark)
    ═══════════════════════════════════════════════════════════ */

    .content, .dispatch-header, .dispatch-card, .dispatch-stepper,
    .dispatch-table, .gt-cl-card, .dispatch-tab-btn, .ds-step {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    :root {
        /* Section Accent for Dispatch */
        --section-accent:    #8b5cf6;
        --color-primary:     #3533cd;

        /* LIGHT MODE (Default) - Crisp, Clean, High Contrast */
        --d-bg-page:         var(--surface-page, #f1f5f9);
        --d-bg-card:         var(--surface-card, #ffffff);
        --d-bg-card-sub:     var(--surface-subtle, #f8fafc);
        --d-border:          rgba(0, 0, 0, 0.08);
        --d-border-subtle:   rgba(0, 0, 0, 0.05);
        --d-border-h:        var(--section-accent);
        --d-text:            var(--text-secondary, #334155);
        --d-text-heading:    var(--text-primary, #0f172a);
        --d-muted:           var(--text-muted, #64748b);
        --d-card-shadow:     var(--shadow-card, 0 4px 16px -2px rgba(0, 0, 0, 0.06));
        --d-card-hover:      0 10px 25px -5px rgba(0, 0, 0, 0.08);
        --d-header-bg:       var(--surface-card, #ffffff);
        --d-header-border:   rgba(0, 0, 0, 0.08);
        --d-stepper-bg:      var(--surface-card, #ffffff);
        --d-pill-bg:         var(--surface-subtle, #f8fafc);
        --d-pill-border:     rgba(0, 0, 0, 0.08);
        --d-pill-text:       var(--text-muted, #64748b);
        --d-input-bg:        var(--gt-input-bg, #ffffff);
        --d-input-border:    var(--gt-input-border, rgba(0, 0, 0, 0.15));
        --d-input-text:      var(--text-primary, #0f172a);
        --d-table-head-bg:   var(--surface-subtle, #f8fafc);
        --d-table-head-text: var(--text-muted, #64748b);
        --d-table-row-hover: var(--surface-hover, rgba(0, 0, 0, 0.035));
        --d-cyan:            #06b6d4;
        --d-amber:           #f59e0b;
        --d-green:           #10b981;
        --d-purple:          #8b5cf6;
        --d-rose:            #ef4444;
        --d-blue:            #3b82f6;
        --d-slate:           #64748b;
    }

    html.dark-mode, body.dark-mode {
        /* DARK MODE - Matching Customers & Cignal Play */
        --section-accent:    #8b5cf6;
        --d-bg-page:         var(--surface-page, #0a0f1e);
        --d-bg-card:         var(--surface-card, #1e293b);
        --d-bg-card-sub:     var(--surface-subtle, #0f172a);
        --d-border:          rgba(255, 255, 255, 0.08);
        --d-border-subtle:   rgba(255, 255, 255, 0.05);
        --d-border-h:        rgba(139, 92, 246, 0.4);
        --d-text:            var(--text-secondary, #cbd5e1);
        --d-text-heading:    var(--text-primary, #f8fafc);
        --d-muted:           var(--text-muted, #94a3b8);
        --d-card-shadow:     var(--shadow-card, 0 6px 24px -2px rgba(0, 0, 0, 0.45));
        --d-card-hover:      0 12px 32px rgba(0, 0, 0, 0.5);
        --d-header-bg:       var(--surface-card, #1e293b);
        --d-header-border:   rgba(255, 255, 255, 0.08);
        --d-stepper-bg:      var(--surface-card, #1e293b);
        --d-pill-bg:         rgba(255, 255, 255, 0.06);
        --d-pill-border:     rgba(255, 255, 255, 0.1);
        --d-pill-text:       #94a3b8;
        --d-input-bg:        var(--gt-input-bg, #0f172a);
        --d-input-border:    var(--gt-input-border, rgba(255, 255, 255, 0.15));
        --d-input-text:      var(--text-primary, #f8fafc);
        --d-table-head-bg:   var(--surface-subtle, #0f172a);
        --d-table-head-text: var(--text-muted, #94a3b8);
        --d-table-row-hover: rgba(255, 255, 255, 0.04);
    }

    /* ─── Universal Light Mode Overrides for Dispatch Elements ─── */
    html:not(.dark-mode) .dispatch-header h1,
    html:not(.dark-mode) .content .gt-cl-card h1,
    html:not(.dark-mode) .content .gt-cl-card h2,
    html:not(.dark-mode) .content .gt-cl-card h3,
    html:not(.dark-mode) .content .gt-cl-card h4,
    html:not(.dark-mode) .content .gt-cl-card h5,
    html:not(.dark-mode) .content .gt-cl-card h6,
    html:not(.dark-mode) .content .dispatch-card h1,
    html:not(.dark-mode) .content .dispatch-card h2,
    html:not(.dark-mode) .content .dispatch-card h3,
    html:not(.dark-mode) .content .dispatch-card h4,
    html:not(.dark-mode) .content .dispatch-card h5,
    html:not(.dark-mode) .content .dispatch-card h6,
    html:not(.dark-mode) .content .dispatch-header .text-white,
    html:not(.dark-mode) .content .gt-cl-card .text-white,
    html:not(.dark-mode) .content .dispatch-card .text-white,
    html:not(.dark-mode) .content .metric-hero-card .text-white,
    html:not(.dark-mode) #chartCenterCount {
        color: #0f172a !important;
    }

    html:not(.dark-mode) .content .dispatch-table tbody tr td [style*="color: #e2e8f0"],
    html:not(.dark-mode) .content .dispatch-table tbody tr td [style*="color: #cbd5e1"] {
        color: #0f172a !important;
    }

    html:not(.dark-mode) .content .gt-cl-card .bg-dark,
    html:not(.dark-mode) .content .dispatch-card .bg-dark,
    html:not(.dark-mode) .content .chart-category-group.bg-dark {
        background-color: #f1f5f9 !important;
        border-color: #e2e8f0 !important;
        color: #475569 !important;
    }

    /* ─── Standard Subtle Badges & Cards ─── */
    .badge-subtle-amber {
        background: #fffbeb;
        color: #b45309;
        border: 1px solid #fde68a;
    }
    html.dark-mode .badge-subtle-amber {
        background: rgba(245, 158, 11, 0.15);
        color: #fbbf24;
        border-color: rgba(245, 158, 11, 0.3);
    }

    .badge-subtle-blue {
        background: #eff6ff;
        color: #1d4ed8;
        border: 1px solid #bfdbfe;
    }
    html.dark-mode .badge-subtle-blue {
        background: rgba(59, 130, 246, 0.15);
        color: #60a5fa;
        border-color: rgba(59, 130, 246, 0.3);
    }

    .badge-subtle-green {
        background: #ecfdf5;
        color: #047857;
        border: 1px solid #a7f3d0;
    }
    html.dark-mode .badge-subtle-green {
        background: rgba(16, 185, 129, 0.15);
        color: #34d399;
        border-color: rgba(16, 185, 129, 0.3);
    }

    .badge-subtle-red {
        background: #fef2f2;
        color: #b91c1c;
        border: 1px solid #fecaca;
    }
    html.dark-mode .badge-subtle-red {
        background: rgba(239, 68, 68, 0.15);
        color: #f87171;
        border-color: rgba(239, 68, 68, 0.3);
    }

    .clickable-pill {
        cursor: pointer;
        padding: 3px 8px;
        border-radius: 6px;
        background: var(--d-pill-bg);
        border: 1px solid var(--d-pill-border);
        color: var(--d-muted);
        transition: all 0.18s ease;
    }
    .clickable-pill:hover {
        border-color: var(--d-border-h);
        transform: translateY(-1px);
    }
    .clickable-pill strong {
        color: var(--d-text-heading);
    }

    .legend-item-pill {
        background: var(--d-bg-card-sub);
        border: 1px solid var(--d-border);
        border-radius: 8px;
        color: var(--d-text);
        padding: 0.5rem 0.75rem;
    }
    .legend-item-pill .legend-count {
        color: var(--d-text-heading);
    }

    .summary-stat-box {
        background: var(--d-bg-card-sub);
        border: 1px solid var(--d-border);
        border-radius: 8px;
        padding: 0.5rem 0.4rem;
    }

    .target-month-card {
        background: var(--d-bg-card-sub);
        border: 1px solid var(--d-border);
        border-radius: 8px;
        padding: 0.5rem 0.4rem;
    }
</style>
