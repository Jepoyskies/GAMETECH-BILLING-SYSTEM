<style>
    /* ═══════════════════════════════════════════════════════════
       GAMETECH DISPATCH — Components & Stepper
    ═══════════════════════════════════════════════════════════ */

    /* ─── Page Header ─────────────────────────────── */
    .dispatch-header {
        background: var(--d-header-bg);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--d-header-border);
        border-radius: 18px;
        padding: 1.5rem 1.75rem;
        margin-bottom: 1.5rem;
        position: relative;
        overflow: hidden;
        box-shadow: var(--d-card-shadow);
    }
    .dispatch-header::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--gt-gold-glow), transparent);
    }

    /* ─── Header Action Buttons & Date Filter ──────── */
    .dispatch-date-filter-group {
        background: var(--d-pill-bg);
        border: 1px solid var(--d-pill-border);
        border-radius: 10px;
        padding: 3px;
        display: inline-flex;
        align-items: center;
    }
    .dispatch-date-filter-btn {
        font-size: 0.78rem;
        border-radius: 7px;
        border: none;
        padding: 0.3rem 0.8rem;
        color: var(--d-muted);
        background: transparent;
        text-decoration: none;
        transition: all 0.18s ease;
    }
    .dispatch-date-filter-btn:hover {
        color: var(--d-text-heading);
    }
    .dispatch-date-filter-btn.active {
        background: var(--color-primary) !important;
        color: var(--color-primary-ink) !important;
        font-weight: 700;
        box-shadow: var(--color-primary-shadow);
    }

    .dispatch-header-action-btn {
        background: var(--d-pill-bg);
        border: 1px solid var(--d-pill-border);
        color: var(--d-pill-text);
        border-radius: 10px;
        font-size: 0.82rem;
        padding: 0.42rem 0.85rem;
        display: inline-flex;
        align-items: center;
        text-decoration: none !important;
        transition: all 0.2s ease;
        font-weight: 500;
    }
    .dispatch-header-action-btn:hover {
        background: var(--d-bg-card);
        color: var(--d-text-heading);
        border-color: var(--d-border-h);
        transform: translateY(-1px);
    }

    /* ─── Cards ───────────────────────────────────── */
    .dispatch-card {
        background: var(--d-bg-card);
        border: 1px solid var(--d-border);
        border-radius: 16px;
        box-shadow: var(--d-card-shadow);
        transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
    }
    .dispatch-card:hover {
        border-color: var(--d-border-h);
        box-shadow: var(--d-card-hover);
        transform: translateY(-1px);
    }

    /* The shared .gt-cl-card in static/css/gt/legacy.css is the system card
       and is what the topbar changelog dropdown already uses. Dispatch used
       to redeclare it here, which restyled the changelog cards on every
       Dispatch page only. Deleted — use .gt-cl-card or .gt-table-card. */

    /* ─── Pipeline Stage Stepper ──────────────────── */
    /* DEPRECATED — the product has ONE stepper: .gt-stepper in
       static/css/gt/components.css (used by the Operations Lifecycle
       tracker on the customer profile and by the Dispatch Queue).
       These .dispatch-stepper / .ds-step rules are token-only now and
       disappear entirely once the last page is converted. */
    .dispatch-stepper {
        display: flex;
        align-items: center;
        padding: 0.875rem 1.25rem;
        background: var(--d-stepper-bg);
        border: 1px solid var(--d-border);
        border-radius: 14px;
        margin-bottom: 1.5rem;
        overflow-x: auto;
        scrollbar-width: none;
        gap: 0;
        box-shadow: var(--d-card-shadow);
    }
    .dispatch-stepper::-webkit-scrollbar { display: none; }

    .ds-step {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        text-decoration: none;
        padding: 0.45rem 0.8rem;
        border-radius: 10px;
        transition: background 0.2s ease;
        flex-shrink: 0;
    }
    .ds-step:hover:not(.ds-step--active):not(.ds-step--disabled) {
        background: var(--d-pill-bg);
    }
    .ds-step__num {
        width: 28px; height: 28px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.72rem;
        font-weight: 800;
        flex-shrink: 0;
        transition: all 0.25s ease;
    }
    .ds-step__label { display: flex; flex-direction: column; line-height: 1.25; }
    .ds-step__title { font-size: 0.78rem; font-weight: 700; white-space: nowrap; color: var(--d-text-heading); }
    .ds-step__sub   { font-size: 0.63rem; white-space: nowrap; color: var(--d-muted); }

    .ds-step--done   .ds-step__num { background: var(--badge-success-bg); color: var(--badge-success-text); border: 1.5px solid color-mix(in srgb, var(--badge-success-text) 30%, transparent); }
    .ds-step--done   .ds-step__title { color: var(--d-muted); }
    .ds-step--done   .ds-step__sub   { color: var(--d-muted); opacity: 0.8; }

    .ds-step--active .ds-step__num  { background: var(--gt-gold-gradient); color: var(--color-primary-ink); box-shadow: 0 0 0 3px var(--gt-gold-soft); }
    .ds-step--active .ds-step__title { color: var(--d-text-heading); }
    .ds-step--active .ds-step__sub   { color: var(--d-muted); }
    .ds-step--active { background: var(--gt-gold-soft); border: 1px solid var(--gt-gold-border); }

    .ds-step--alert  .ds-step__num  { background: var(--badge-danger-bg); color: var(--badge-danger-text); border: 1.5px solid color-mix(in srgb, var(--badge-danger-text) 35%, transparent); animation: stepper-pulse 1.8s infinite; }
    .ds-step--alert  .ds-step__title { color: var(--badge-danger-text); }
    .ds-step--alert  .ds-step__sub   { color: var(--badge-danger-text); }

    .ds-step--disabled .ds-step__num { background: var(--surface-subtle); color: var(--d-muted); border: 1px solid var(--d-border); }
    .ds-step--disabled .ds-step__title { color: var(--d-muted); }
    .ds-step--disabled { cursor: default; }

    .ds-connector {
        width: 20px; height: 1px;
        background: var(--d-border);
        flex-shrink: 0;
        position: relative;
    }
    .ds-connector::after {
        content: '';
        position: absolute;
        right: -3px; top: -3px;
        width: 6px; height: 6px;
        border-right: 1.5px solid var(--d-border);
        border-top:   1.5px solid var(--d-border);
        transform: rotate(45deg);
    }

    .ds-live-pill {
        margin-left: auto;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--badge-success-text);
        background: var(--badge-success-bg);
        border: 1px solid color-mix(in srgb, var(--badge-success-text) 25%, transparent);
        border-radius: 999px;
        padding: 0.25rem 0.7rem;
    }
    .ds-live-dot {
        width: 6px; height: 6px;
        background: var(--badge-success-text);
        border-radius: 50%;
        animation: live-dot-pulse 1.4s ease infinite;
    }

    /* ─── Filter Controls ─────────────────────────── */
    .dispatch-filter-select {
        background-color: var(--d-input-bg) !important;
        border: 1px solid var(--d-input-border) !important;
        color: var(--d-input-text) !important;
        border-radius: 9px !important;
        font-size: 0.8rem !important;
        padding: 0.42rem 0.75rem !important;
        transition: border-color 0.2s ease, box-shadow 0.2s ease !important;
        font-family: 'Inter', sans-serif !important;
    }
    .dispatch-filter-select:focus {
        border-color: var(--section-accent) !important;
        box-shadow: 0 0 0 3px var(--section-accent-subtle) !important;
        outline: none !important;
    }
    .dispatch-filter-select option {
        background-color: var(--d-input-bg);
        color: var(--d-input-text);
    }

    .dispatch-search-input {
        background-color: var(--d-input-bg) !important;
        border: 1px solid var(--d-input-border) !important;
        color: var(--d-input-text) !important;
        border-radius: 0 9px 9px 0 !important;
        font-size: 0.82rem !important;
        font-family: 'Inter', sans-serif !important;
    }
    .dispatch-search-input::placeholder { color: var(--d-muted) !important; opacity: 0.7; }
    .dispatch-search-input:focus {
        border-color: var(--section-accent) !important;
        box-shadow: 0 0 0 3px var(--section-accent-subtle) !important;
        outline: none !important;
    }
    .dispatch-search-addon {
        background-color: var(--d-input-bg) !important;
        border: 1px solid var(--d-input-border) !important;
        border-right: none !important;
        color: var(--d-muted) !important;
        border-radius: 9px 0 0 9px !important;
    }

    /* ─── Status Badges & Pills ───────────────────── */
    /* The .status-badge base (size, radius, font, colours) comes from the
       shared system in static/css/gt/components.css. The old Dispatch
       override forced uppercase + a ::before dot, which is why badges here
       looked smaller and lower-contrast than the Customers page. The five
       Dispatch state modifiers below now map onto the shared badge tokens
       instead of hardcoded light-mode rgba. */
    .status-badge.status-pending     { background-color: var(--badge-warning-bg)  !important; color: var(--badge-warning-text)  !important; border-color: color-mix(in srgb, var(--badge-warning-text) 25%, transparent) !important; }
    .status-badge.status-assigned    { background-color: var(--badge-info-bg)     !important; color: var(--badge-info-text)     !important; border-color: color-mix(in srgb, var(--badge-info-text) 25%, transparent)    !important; }
    .status-badge.status-in_progress { background-color: var(--badge-info-bg)     !important; color: var(--badge-info-text)     !important; border-color: color-mix(in srgb, var(--badge-info-text) 25%, transparent)    !important; }
    .status-badge.status-completed   { background-color: var(--badge-success-bg)  !important; color: var(--badge-success-text)  !important; border-color: color-mix(in srgb, var(--badge-success-text) 25%, transparent) !important; }
    .status-badge.status-cancelled   { background-color: var(--badge-danger-bg)   !important; color: var(--badge-danger-text)   !important; border-color: color-mix(in srgb, var(--badge-danger-text) 25%, transparent)  !important; }

    .priority-pill {
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 0.18rem 0.55rem;
        border-radius: 5px;
    }
    .priority-pill.urgent { background: var(--badge-danger-bg);  color: var(--badge-danger-text);  border: 1px solid color-mix(in srgb, var(--badge-danger-text) 25%, transparent); }
    .priority-pill.high   { background: var(--badge-warning-bg); color: var(--badge-warning-text); border: 1px solid color-mix(in srgb, var(--badge-warning-text) 25%, transparent); }
    .priority-pill.normal { background: var(--badge-info-bg);    color: var(--badge-info-text);    border: 1px solid color-mix(in srgb, var(--badge-info-text) 25%, transparent); }
    .priority-pill.low    { background: var(--badge-neutral-bg); color: var(--badge-neutral-text); border: 1px solid color-mix(in srgb, var(--badge-neutral-text) 25%, transparent); }

    .d-realtime-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.67rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--badge-success-text);
        background: var(--badge-success-bg);
        border: 1px solid color-mix(in srgb, var(--badge-success-text) 25%, transparent);
        border-radius: 999px;
        padding: 0.2rem 0.6rem;
    }
    .d-realtime-chip::before {
        content: '';
        width: 5px; height: 5px;
        border-radius: 50%;
        background: var(--badge-success-text);
        animation: live-dot-pulse 1.4s ease infinite;
    }
</style>
